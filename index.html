<script>
const DATA = {"stages":[{"t":"先用起来","ids":[1,2,3],"d":"做成第一件事、把话说清、发之前查一遍"},{"t":"用得更顺","ids":[4,5],"d":"图片和声音、把你的资料递给它"},{"t":"交出去干","ids":[6,7,8],"d":"把重复的活交出去、做个小工具、出错了怎么查"},{"t":"附录 · 想知道原理再看","ids":[9,10],"d":"AI 怎样走到今天、它怎样接话"}],"lessons":[{"id":1,"title":"先用起来：AI 能帮你干啥","intro":"","pages":[{"n":2,"t":"写通知的三个环节","f":[],"b":["资料给事实，AI写句子，人核对后再发。"],"fig":{"nodes":[["doc","资料",""],["ai","AI",""],["ok","人","","me"]]},"from":1},{"n":3,"t":"一个任务有不同部分","f":["写草稿、查事实、做决定，是三件事。"],"b":["把AI当成一个耐心无限、但每次新对话都会忘事的新同事（打比方，帮助理解）。起草交给它，谁来接货你来定。","举个例子：语气交给AI改，到货时间人对着资料核。"],"from":1},{"n":4,"t":"生成式AI的用途","f":["它能写出好几个版本，但不保证写对。"],"b":["举个例子：“早上9点到货”不能变，语气随便换。"],"from":1},{"n":5,"t":"信息整理","f":["把乱资料理成清单，好检查。"],"b":["资料里没有的，让它留白，别让它编。","举个例子：谁来接货没说，就写“待确认”。"],"from":1},{"n":6,"t":"方案比较","f":["它能列优缺点，选哪个得你说。"],"b":["举个例子：发群消息还是挨个打电话，它能列利弊，选哪个你定。"],"from":1},{"n":7,"t":"资料决定具体程度","f":["时间、对象、限制，AI不知道，得你说。"],"b":["举个例子：把“周三早来”写成“周三早上9点到货”。"],"from":1},{"n":8,"t":"检查负担也算成本","f":["省下的时间，要减去核对和改错的时间。"],"b":["举个例子：写稿省5分钟，改错多花10分钟，等于白忙（数字是教学假设）。"],"from":1},{"n":9,"t":"适合先试的任务","f":["从熟悉、错了好改的小事开始。"],"b":["你最熟的活，最容易看出AI错在哪。"],"from":1},{"n":10,"t":"人工判断的位置","f":["两处必须人把关：动笔前对事实，发出前再确认。"],"b":["草稿改十遍都行，发出去就改不了。"],"from":1},{"n":11,"t":"任务适配的两个尺度","f":["两个问题：错了好发现吗？后果大吗？"],"b":["举个例子：店员群消息好核对，可以先试；陌生合同错了难发现，要谨慎。"],"from":1},{"n":12,"t":"能力与责任","f":["AI会写，不等于它有权发。"],"b":["谁给事实、谁确认、谁发送，提前分清。"],"from":1},{"n":13,"t":"选应用时先看任务","f":["先列你的活需要什么，再拿同一个任务试几个应用。"],"b":["三步选法：①我的活需要它收什么、给什么？②拿同一份资料试它 ③质量、等待时间、修改成本一起算。","你也可以试试：要把长通知改成短消息，列必要条件和两种会搞砸的情况。\n留意：简单文字活，别追求花哨功能。"],"from":6},{"n":14,"t":"从任务到应用选择","f":["先写清必要条件，再用同样的资料试用。"],"b":["条件清单写好了，比较才有依据。空谈\"谁好用\"没有意义。","图中是简化示意，实际用时还是要自己查资料、看结果。"],"from":6},{"n":15,"t":"模型与应用","f":["模型是发动机，应用是整辆车。"],"b":["同一个模型，装进不同应用，功能差很多：有的能传文件，有的能存记忆，有的能搜网。按钮能干的事，不全是模型自己的本事。","举个例子：同一台发动机，配不同车，跑起来不一样。"],"from":6},{"n":16,"t":"先明确输入输出","f":["先把任务说具体，再看产品接得住吗。"],"b":["任务写具体：照片挑日期＝收图片、出清单；写通知＝留住事实、写清楚。条件列出来，挨个对。","举个例子：照片挑日期，先看能不能传图。"],"from":6},{"n":17,"t":"质量有不同维度","f":["对不对、好不好读、打不打开得开，分开查。"],"b":["通知写得美但改了日期＝不合格；表格能打开但漏了事项＝也要返工。把\"事实、表达、格式、功能\"四样分开打分，问题看得清。","举个例子：语气好但日期错了，照样不能用。"],"from":6},{"n":18,"t":"用自己的任务比较","f":["同一份资料、同一套标准，比出来才算数。"],"b":["拿三种资料试：正常的、缺信息的、互相矛盾的。固定问法和设置，记录你改了多少处。试得少，结论就只对这几个例子负责。","举个例子：同一份资料分别试三种情况。"],"from":6},{"n":19,"t":"计算与等待成本","f":["总账＝钱＋等待时间＋你改错花的时间。"],"b":["单价便宜但改十遍，总成本可能更高。价格变动快，别背价目表，记自己的账。","举个例子：便宜但要反复纠错，总花费未必低。"],"from":6},{"n":20,"t":"Token像计量单位","f":["用得多不等于干得好。"],"b":["Token像电表读数：转得快不代表家里更亮堂。（借电表比喻）评价看核对后的成果，不看消耗数字。","举个例子：烧了更多Token，不证明通知更可用。"],"from":6},{"n":21,"t":"条件与可迁移性","f":["保留原资料和提示词，换个工具还能重跑。"],"b":["活都攒在一个平台里出不来，换工具就很被动。原资料、提示词、检查标准自己留一份，随时能搬家。","举个例子：留好资料和提示，换工具重试一遍就行。"],"from":6},{"n":22,"t":"选择是阶段性决定","f":["够用就用，变了再比。"],"b":["先选一个够用的开始干活。模型升级了、收费变了、功能变了，再拿老任务重新比一轮。","举个例子：模型升级后，把原来的小测试重跑一遍。"],"from":6},{"n":23,"t":"模型成绩与产品效果","f":["榜上第一，不等于你手上这个应用第一。"],"b":["同一个模型，配的工具和设置不同，表现就不同。你的测试结果，只对你测的那套环境负责。"],"from":6},{"n":24,"t":"成本的分母","f":["算\"每条能用的成本\"，别只算\"每条的成本\"。"],"b":["教学假设：花10元生成10条，只有2条能用——每条可用的成本是5元，还没算你改错的时间。（数字是编的，算法是真的。）"],"from":6},{"t":"参考资料与延伸阅读","f":[],"b":["核查日期：2026-10-04 核对，Mollick 一文 2026-10-12 又看过。","Ethan Mollick：Getting started with AI: Good enough prompting，2024","https://www.oneusefulthing.org/p/getting-started-with-ai-good-enough","本课取材于文中的比方：把AI当成\"耐心无限、每次新对话都会忘事的新同事\"。他特意说，\"实习生\"这个比方会让人把AI用得太窄。","Language Models are Few-Shot Learners，2020","https://arxiv.org/abs/2005.14165","GPT-4技术报告，2023\nhttps://arxiv.org/abs/2303.08774","OpenAI推理模型提示建议\nhttps://developers.openai.com/api/docs/guides/reasoning-best-practices","一见AI：AI消耗与业绩，作者配文\nhttps://www.douyin.com/video/7691167895279242496\n本课取材于作者配文与页面标题。"],"n":25}],"ex":{"intro":[],"sections":[]},"notes":[]},{"id":2,"title":"怎样把需求说清楚","intro":"","pages":[{"n":2,"t":"把模糊想法变成要求","f":["先说用途，再给资料，最后说要求。"],"b":["\"帮我写个通知\"＝没说。\"给顾客写营业通知，日期时间用这条资料，70字内，别编联系人\"＝说清了。","你也可以试试：写一条活动口播稿，说清给谁听、多长、事实有什么、什么语气。\n留意：语气可以换，日期和范围不能换。"],"from":7},{"n":3,"t":"说明需求与改进结果","f":["说得清楚＋反馈具体，结果就能一轮轮改好。"],"b":["第一轮说清要求，改的时候指出具体问题，几轮下来就能用。","图中是简化示意，实际用时还是要自己查资料、看结果。"],"from":7},{"n":4,"t":"目标决定回答形态","f":["告诉它给谁用、拿来干什么。"],"b":["\"帮我写好一点\"＝白说。给顾客的营业通知和给员工的排班说明，写法完全不同。先说用途，它才知道往哪个方向使劲。","举个例子：\"做得好看\"还得说清：用在哪、给谁看。"],"from":7},{"n":5,"t":"材料提供事实","f":["事实放资料区，和语气要求分开写。"],"b":["日期、时间、范围——把资料原样贴给它，别让它凭感觉写。资料互相矛盾的，标出来；缺的，注明\"缺\"。","举个例子：原资料贴进来，未知人数明确留空。"],"from":7},{"n":6,"t":"约束说明取舍","f":["字数、语气、禁止事项，都是给它划的线。"],"b":["70字内是硬要求，写的时候告诉它：日期必须保留，超字数宁可挤掉修饰词。要求和事实打架时，让它指出来，别自作主张取舍。","举个例子：\"不超过70字\"就是一条可检查的要求。"],"from":7},{"n":7,"t":"例子帮助对齐","f":["给它看好例子和坏例子，各说清为什么。"],"b":["给一份合格通知，指明\"日期这样放就对了\"；给一份坏的，指明\"联系人没依据\"。例子里的地址日期要注明是示例，免得它照抄进正式稿。","举个例子：给一份合格通知，说明要保留哪种写法。"],"from":7},{"n":8,"t":"补问减少猜测","f":["缺关键事实就让它问，但只问必须问的。"],"b":["好的AI像好的服务员：菜卖完了会告诉你，而不是端一盘别的上来。（打比方，帮助理解）你把\"不许编\"说清楚，它能瞎猜的地方就少了。","举个例子：没给营业时间，就先问这一个必要事实。"],"from":7},{"n":9,"t":"反馈要指向问题","f":["改稿时说清错在哪，别说\"再好一点\"。"],"b":["\"太差了\"它没法改。\"日期别动，把营销句子删了，时间放最前面\"——一句就能改到位。先修事实，再调语气。","举个例子：说\"日期变了\"，比说\"再好一点\"管用。"],"from":7},{"n":10,"t":"分步是组织方法","f":["复杂的活拆成几步，简单的活直接说。"],"b":["先挑事实再写通知，方便核对；一句话能说清的活，别折腾流程。拆步是为了你好检查，不是为了仪式感。","举个例子：先提日期范围，再写通知。"],"from":7},{"n":11,"t":"可检查的完成标准","f":["提前说清\"怎样算写好了\"。"],"b":["要反复做的活，写成一页说明：给谁用、用什么资料、什么限制、要什么结果、怎么检查。一次性的活，说清要求就行。","举个例子：日期没错、适合发群里，才算完成。"],"from":7},{"n":12,"t":"提示为何影响结果","f":["你给的话就是它这次的\"考题\"，考题换了答案就换。"],"b":["但它不会因为你夸它\"你是资深专家\"就真懂行——专业的事实还是得你给。缺资料时，补资料比换着花样夸它管用。"],"from":7},{"n":13,"t":"少样本与固定模板","f":["例子有用，但别把例子当模板硬套。"],"b":["老模板（比如\"必须先写长计划\"）适不适合，要试了才知道。短通知可以直接写，复杂的活再拆步。"],"from":7},{"t":"参考资料与延伸阅读","f":[],"b":["Language Models are Few-Shot Learners，2020\nhttps://arxiv.org/abs/2005.14165","OpenAI推理模型提示建议\nhttps://developers.openai.com/api/docs/guides/reasoning-best-practices","Ethan Mollick普通人AI入门，2024\nhttps://www.oneusefulthing.org/p/getting-started-with-ai-good-enough","宝玉：学习AI与Skill迭代\nhttps://s.baoyu.io/files/baoyu-ai-skills-talk/ai-skills-talk.html"],"n":14}],"ex":{"intro":[],"sections":[]},"notes":[]},{"id":3,"title":"发之前怎么查","intro":"","pages":[{"n":2,"t":"推理能力与事实可靠性","f":["会解题不等于知道事实。缺的资料，想多久也想不出来。"],"b":["推理能帮它解复杂的题，但缺的资料不会凭空想出来。算得越久，答案越像真的——但\"像\"不等于\"是\"。","你也可以试试：一份摘要里补出了没给过的预算数。你打算怎么核对？\n留意：查原始记录，别拿AI自己的话证明AI。"],"from":4},{"n":3,"t":"推理之后怎样检查","f":["推理帮它解题，结果还得你对着资料查。"],"b":["它想得再周密，最后一关还是：回原资料，逐条对。","图中是简化示意，实际用时还是要自己查资料、看结果。"],"from":4},{"n":4,"t":"训练与推理","f":["训练是它\"上课\"，使用是它\"做题\"。"],"b":["训练改的是它脑子里的参数（上课），使用是拿参数做你这道题（做题）。这只是个帮助理解的比法，它不是真的人。","举个例子：这里说的推理是\"做题\"，不是\"上课\"。"],"from":4},{"n":5,"t":"指令训练","f":["额外训练让它更听话，但听话不等于说真话。"],"b":["后面还有一轮训练：人给它示范和反馈，让它更会照吩咐办事。但它可能把吩咐完成得漂漂亮亮，同时补一个假联系人。","举个例子：学会了听话，照样可能编联系人。"],"from":4},{"n":6,"t":"推理计算","f":["有的模型答题前会多算一会儿。多算能解难题，变不出缺的资料。"],"b":["复杂题多算一会儿有帮助；缺的营业时间，算到天荒地老也没有——得查表。简单问题也用不着它长篇大论。","举个例子：难题多算些，最后还是要核对结果。"],"from":4},{"n":7,"t":"奖励与可检验任务","f":["能对答案的题（数学、代码），练得快；开放题没有标准答案。"],"b":["数学题能对答案，代码能跑一遍验证，所以这类能力进步快。通知写得对不对，没有现成答案——还得你对资料。","举个例子：算术题核答案就行，通知要核真实资料。"],"from":4},{"n":8,"t":"幻觉怎样出现","f":["它的本职是接顺句子，不是查对事实。缺资料时，它倾向于\"编一个像真的\"。"],"b":["模型的本职是把句子接顺，不是把事实查对。碰到不知道的事，它的第一反应不是闭嘴，而是\"填一个像真的上去\"——幻觉就是这么来的。（打比方，帮助理解）","而且它编的时候语气特别肯定，这就是最骗人的地方。","举个例子：不知道营业时段，却补出10:00—18:00。"],"from":4},{"n":9,"t":"能力并不均匀","f":["大题做得好，小细节照样错。"],"b":["它会写分析报告，也可能把日期写错。别因为一次好用就全信——拿你自己的活、包括刁钻的情况，试过再说。","举个例子：报告逻辑通顺，某个日期照样写错。"],"from":4},{"n":10,"t":"自检的局限","f":["让它自己检查自己，可能错得前后一致。"],"b":["你让它\"再检查一遍\"，它可能顺着原来的错误接着圆。更可靠的做法：对着原资料的具体字段查，用计算器等工具独立算。","举个例子：它说\"确认无误\"，你还得回资料看。"],"from":4},{"n":11,"t":"未知需要被保留","f":["缺事实就问，或者写\"待确认\"。用不上的信息，不用补。"],"b":["没有时间、没有联系人？要么问，要么留空。通知根本不需要联系人，就更不用补了。","举个例子：联系人用不上，就不必为了\"看起来完整\"编一个。"],"from":4},{"n":12,"t":"为什么正确率不等于可靠性","f":["十次对九次，错的那次可能正砸在要害上。"],"b":["教学假设：10份通知对9份，错的那份偏偏改了营业日期——这个\"90%正确\"对你没用。关键字段要单独盯。"],"from":4},{"n":13,"t":"推理过程与解释","f":["它展示的\"思考过程\"不等于它真在想什么。"],"b":["它写得头头是道，不代表内部真是这么算的。别被\"思考\"的样子唬住，答案还是要对资料。"],"from":4},{"n":14,"t":"检查一条通知是否可用","f":["对照原资料查：日期、时段、范围，漏没漏、多没多。"],"b":["能不能用，不看读着顺不顺，看和资料对不对得上。顺，只说明它文笔好。","你也可以试试：优惠只限周一，文案写成了整周——标出错处并改掉。\n留意：发现范围扩大，整篇都要重新查。"],"from":8},{"n":15,"t":"对照资料检查答案","f":["日期、范围、遗漏，都能对着资料查出来。"],"b":["一边摆资料，一边摆AI的稿，一行一行对。","图中是简化示意，实际用时还是要自己查资料、看结果。"],"from":8},{"n":16,"t":"流畅与正确","f":["好读只是加分项，对才是及格线。"],"b":["读的时候给内容分三类：事实（回资料查）、判断（看理由站不站得住）、建议（看适不适合你）。","举个例子：语气自然的通知，也可能把一天写成一周。"],"from":8},{"n":17,"t":"原资料对照","f":["笨办法最管用：左边资料、右边结果，一行行对。"],"b":["王阿姨有个土办法：原资料贴屏幕左边，AI的结果放右边，手指头点着一行行对——时间、地点、联系人。土办法，但每次都拦得住错。她当了一辈子语文老师，改作文改出了习惯：任何东西发出去之前，都要\"先对一遍再发\"。","举个例子：原活动表写10月18日，结果也必须是10月18日。"],"from":8},{"n":18,"t":"来源能否支持结论","f":["给了链接，不等于链接里真这么说。"],"b":["它列了篇论文？点开看。查不到、标题像但内容对不上、只有搜索摘要——都算证据不足。","举个例子：来源正文必须支持结论，标题像不算数。"],"from":8},{"n":19,"t":"遗漏也会影响使用","f":["没写错，不等于写全了。"],"b":["通知日期对但没写时段，照样不能用。该有的项列个清单，一个一个打勾。","举个例子：群通知漏了报名截止日，写得再美也白搭。"],"from":8},{"n":20,"t":"数字和功能怎样检查","f":["数字重算一遍，文件重新打开一遍。"],"b":["总数拿计算器再加一次；说\"已导出\"，就下载下来打开看看。按钮在，不等于功能好使。","举个例子：数字用计算器核，保存后的文件要重新打开。"],"from":8},{"n":21,"t":"演示与实际效果","f":["看示范好用，不等于你的活也能用。"],"b":["演示是演示。拿你自己的资料再试一遍，缺信息的、有冲突的也试试，记下哪些试过、哪些没试。","举个例子：演示里能查数据，不代表你的任务也能查到。"],"from":8},{"n":22,"t":"别沿用上一次的结果","f":["资料换了，旧结果就得重新查。"],"b":["上次的通知可能写得没错，但对应的是上次的资料。工具出错后，旧结果先清掉或标明\"这是旧的\"。","举个例子：工具超时后，别再显示上一次的\"有货\"。"],"from":8},{"n":23,"t":"改完之后再看一遍","f":["修好一处，全文再看一遍。"],"b":["改日期时，可能顺手把\"次日恢复\"删了。改完回到整份资料，重新对一遍日期、时段、范围。","举个例子：改了一处日期，全文要重新过。"],"from":8},{"n":24,"t":"样本评价的局限","f":["一次通过，只证明这一次、这几项。"],"b":["说结论时把依据带上：\"日期对——对的是原活动表第二行。\"没写出来的字段也要核，检查不止挑错字，还有漏项、扩大范围、无据补充。"],"from":8},{"n":25,"t":"检查标准与人的用途","f":["有的检查能自动化（数字、字段），有的必须人来（合不合适）。"],"b":["AI自检、对资料、用计算器——各查各的错，谁也不能包办。一次通过不代表下次也过。"],"from":8},{"t":"参考资料与延伸阅读","f":[],"b":["InstructGPT人类反馈论文，2022\nhttps://arxiv.org/abs/2203.02155","o1原始发布，2024\nhttps://openai.com/index/introducing-openai-o1-preview/","DeepSeek-R1原论文，2025\nhttps://arxiv.org/abs/2501.12948","OpenAI推理模型提示建议\nhttps://developers.openai.com/api/docs/guides/reasoning-best-practices","Karpathy年度回顾，2025\nhttps://karpathy.bearblog.dev/year-in-review-2025/","GPT-4技术报告，2023\nhttps://arxiv.org/abs/2303.08774","Anthropic构建有效Agent，2024\nhttps://www.anthropic.com/engineering/building-effective-agents"],"n":26}],"ex":{"intro":[],"sections":[]},"notes":[]},{"id":4,"title":"文字、图片和声音怎样生成","intro":"","pages":[{"n":2,"t":"识别、生成和编辑","f":["认图、画图、改图是三件不同的事，要检查的东西也不同。"],"b":["读照片叫识别，做海报叫生成，改日期叫编辑。三件事，三种错法，三套检查。","你也可以试试：读活动表照片→做海报→写广播稿，列出每一步要核对什么。\n留意：原图、海报文字、广播读音，要分开核。"],"from":5},{"n":3,"t":"资料变成不同形式","f":["同一份资料变几种形式，每一步都要查。"],"b":["每换一种形式，就多一次出错机会。别偷懒，一步一步核。","图中是简化示意，实际用时还是要自己查资料、看结果。"],"from":5},{"n":4,"t":"先看输入与输出","f":["先弄清你要给它什么、要它给回什么。"],"b":["从照片里抠文字＝识别；照着文字做海报＝生成；在旧海报上改日期＝编辑。很多应用只会其中一两样，用之前先问清楚。","举个例子：读海报是识别，写海报是生成，改日期是编辑。"],"from":5},{"n":5,"t":"文字的顺序生成","f":["AI写字是一个词一个词接着蹦的，蹦得顺不等于对。"],"b":["它按顺序往外蹦词。句子再通顺，日期照样可能错——别因为读着顺就省了核对。","举个例子：句子流畅，日期仍要对资料。"],"from":5},{"n":6,"t":"扩散的直觉","f":["生图模型像从一团噪点里一步步\"对焦\"出图。"],"b":["生图模型干活像从毛玻璃慢慢对焦：一开始是一团模糊的色块，一步一步变清楚，最后才是那张图。（打比方，帮助理解）注意：不是\"揭开一张藏起来的照片\"，是逐步算出来的新图。","举个例子：去噪是计算过程，不是揭秘旧照片。"],"from":5},{"n":7,"t":"图像也有不同路线","f":["生图产品不止一种算法，别拿一种原理解释所有产品。"],"b":["扩散只是其中一种代表做法。各家的产品细节未必公开，用的时候还是看结果：图里的字对不对。","举个例子：光看成品，猜不出内部用了什么算法。"],"from":5},{"n":8,"t":"语音识别","f":["声音转文字，姓名和数字最容易被转错。"],"b":["背景吵、口音重，都可能转错。\"十点\"转成\"四点\"，后面的总结写得再好也是错的。原录音要留着，随时回听。","举个例子：录音里的\"十点\"可能被转成\"四点\"。"],"from":5},{"n":9,"t":"语音生成","f":["文字能变成人声，但读音和停顿要回听。"],"b":["播广播前，回听三处：日期读法、时间读法、停顿位置。另外：AI合成的声音，不等于真人说过这些话。","举个例子：18:00读成\"下午六点\"对不对？回听确认。"],"from":5},{"n":10,"t":"多模态协作","f":["一个应用里可能是好几个模型在接力干活。"],"b":["读表、写稿、改图，可能是不同组件干的。选应用时看三样：能收什么、能给什么、结果怎么查。","举个例子：先核原表，再核海报，最后核广播读音。"],"from":5},{"n":11,"t":"重要文字保留可编辑层","f":["日期、金额、地址，别烧死在图片里。"],"b":["AI画的图，字经常错，改起来还牵一发动全身。办法：重要文字放在可单独编辑的层里，核对后再导出。生成图可以配着玩，但不能顶替真实资料。","举个例子：活动日期放可编辑层，错了改一个字就行。"],"from":5},{"n":12,"t":"扩散的训练与采样","f":["它学的是\"怎么从噪点变清晰\"，噪点里没藏着哪张真照片。"],"b":["所以生成的\"活动现场图\"不能标成真实现场——那张图在按下生成键之前不存在。"],"from":5},{"n":13,"t":"多模态的能力边界","f":["一个应用会读图会写字，不代表每样都准。"],"b":["读小字和写长文，可能是两个部件，错法也不同。出了错，回到最早出偏差的那一步查，别只改最后的结果。"],"from":5},{"t":"参考资料与延伸阅读","f":[],"b":["去噪扩散模型原论文，2020\nhttps://arxiv.org/abs/2006.11239","Whisper语音识别论文，2022\nhttps://arxiv.org/abs/2212.04356","GPT-4技术报告，2023\nhttps://arxiv.org/abs/2303.08774"],"n":14}],"ex":{"intro":[],"sections":[]},"notes":[]},{"id":5,"title":"把你的资料递给它","intro":"","pages":[{"n":2,"t":"这次回答用到了哪些资料","f":["先弄清AI这次能看到什么，再谈补什么。"],"b":["它只看得见这次递给它的东西。递错资料，答案就错。","你也可以试试：旧会议纪要和新通知的时间打架，该递哪份？\n留意：先确认哪份有效，再回答。"],"from":9},{"n":3,"t":"给本次回答补充资料","f":["挑出相关且有效的资料，递给它，再让它回答。"],"b":["不是一股脑全给：挑相关的、核对过有效期的，递过去。","图中是简化示意，实际用时还是要自己查资料、看结果。"],"from":9},{"n":4,"t":"模型当前能看到什么","f":["文件在你电脑里，不等于AI已经读过。"],"b":["它只看得见这次对话里真正传进去的内容。可能只传了片段，也可能压缩了旧对话。先确认资料真进去了，再谈别的。","举个例子：你没传的资料，它不会\"自动知道\"。"],"from":9},{"n":5,"t":"上下文容量","f":["能装得多，不等于每页都被好好读。"],"b":["塞一大堆，重点反而被淹。挑相关的几段，带上日期和出处，比整包文件管用。","举个例子：相关三行资料，胜过一整包旧文件。"],"from":9},{"n":6,"t":"产品记忆","f":["应用的\"记住你\"，是另外存的笔记，不是它变聪明了。"],"b":["\"记住：通知不要营销话\"——这是存在外面的备忘，用的时候再取。具体怎么存怎么删，各家不同，别全信。","举个例子：记住你的偏好，不等于记住最新营业时间。"],"from":9},{"n":7,"t":"知识库","f":["放进知识库的资料，要标日期、标出处、标哪份有效。"],"b":["一大堆文件没标日期，一查查出去年的旧安排。先理清楚，再往里堆量。","举个例子：知识库里的商品档案，未必是今天的库存。"],"from":9},{"n":8,"t":"检索增强生成","f":["RAG像开卷考试：它带着本事进场，你把相关那几页递到它眼前。"],"b":["RAG像开卷考试：模型带着学过的本事进场，你把相关那几页资料递到它眼前。递错了页，答案照样错——所以找对资料，比模型聪不聪明更要紧。（打比方，帮助理解）","递漏了、递错了版本、它没看，都会错。它标了出处只是起点，出处本身也要查。","举个例子：先找对活动表，再交给它回答。"],"from":9},{"n":9,"t":"补资料与微调","f":["补资料像考前递小抄（快），微调像重新上学（慢）。店里的事，递小抄就够。"],"b":["补资料像考前递小抄：快，考完就还。微调像让孩子重新读书：改的是脑子本身，又贵又慢，换门课还未必划算。门店的大多数事，递小抄就够了。（打比方，帮助理解）","今天的营业时间，更新资料就行，犯不着训练模型。","举个例子：微调改行为，不适合补今天的库存。"],"from":9},{"n":10,"t":"冲突与更新","f":["两份资料打架，看范围、看日期、看谁权威。"],"b":["临时安排覆盖当天常规，不冲突。同一天两份安排不一样还没审批信息？别猜，问人。文件名最新，不等于生效时间最新。","举个例子：旧文件和新通知打架，先确认哪份有效。"],"from":9},{"n":11,"t":"给下次使用留下记录","f":["明天还要接着干的活，今天记下：干了啥、资料在哪、还缺啥。"],"b":["记录要短、要能查回原资料。堆一地的聊天记录，不如一页交接清单。","举个例子：交接写清日期、待确认项和已完成的结果。"],"from":9},{"n":12,"t":"检索的两个错误方向","f":["要么没找到资料，要么找到一份长得像但不对的。"],"b":["检索会漏、会错、会找到旧版本。所以\"接了知识库\"不等于\"回答一定准\"，检索结果和最终回答要分开查。"],"from":9},{"n":13,"t":"资料更新、微调与记忆","f":["常变的事实放资料里，要改\"性格\"才考虑训练。"],"b":["今天的库存一小时一变——查询，不是训练。产品记忆也可能过时，关键事实还是要看更新时间。"],"from":9},{"n":14,"t":"查询的是谁，返回的是什么","f":["查谁、查回来什么、失败算哪种，都要说清。"],"b":["\"查到了\"和\"查到的是对的那个\"，中间隔着好几个坑：编号对不上、门店漏了、返回的0到底是没货还是没查到。","你也可以试试：查商品001，分别写\"余额0\"和\"连接超时\"两种回应。\n留意：0是查到的结果，超时是还不知道。"],"from":12},{"n":15,"t":"一次查询怎样完成","f":["先提一个明确的查询，再解释拿回来的结果。"],"b":["问得清楚→答得明白。问得含糊→返回什么都说不清。","图中是简化示意，实际用时还是要自己查资料、看结果。"],"from":12},{"n":16,"t":"API像约定的窗口","f":["API像传菜窗口：递进去的单子有格式，递出来的菜也有样子，不能探头进厨房。"],"b":["API像餐厅的传菜窗口：你递进去的单子有规定的格式，递出来的菜也有规定的样子。你不能自己探头进厨房——这是约定，也是保护。（打比方，帮助理解）","请求什么、返回什么、出错什么样，都是事先约好的。","举个例子：API就是双方约好的\"怎么问、怎么答\"。"],"from":12},{"n":17,"t":"字段要对应","f":["名字像，不一定是同一个东西。"],"b":["\"商品档案\"和\"库存\"是两类数据：查到档案，不代表门店有货。编号\"001\"别随手写成\"1\"——前面的零可能有含义。","举个例子：查门店A，门店标识不能漏。"],"from":12},{"n":18,"t":"请求与响应","f":["问什么、答什么、答不上来是什么意思，都要有约定。"],"b":["查营业安排：输入日期，返回时段和生效范围。返回一个空列表？得知道这是\"没匹配\"还是\"你没权限\"。含义没约好，后面全靠猜。","举个例子：\"001\"按文字传还是按数字传，两边要一致。"],"from":12},{"n":19,"t":"认证与权限","f":["知道地址，不等于有钥匙。"],"b":["读取、保存、发布，可能是三把不同的钥匙。只是查营业时间？那只要读的权限就够了。（练习用虚构资料；真连接时，密钥千万别公开。）","举个例子：能查资料的钥匙，不一定能改资料。"],"from":12},{"n":20,"t":"MCP统一部分接法","f":["MCP像统一插口：插座标准了，电器怎么用还得看说明书。"],"b":["MCP可以理解为统一插口，真实结构仍有客户端、服务端和具体能力。统一协议不会让工具自动懂业务规则，也不意味着任何服务可信。是否支持和版本条件要核官方资料。","举个例子：插口统一了，\"哪家门店\"这种业务问题还得自己配。"],"from":12},{"n":21,"t":"模型提出调用","f":["模型\"说要查\"，应用去查，结果交回来——模型不亲手查。"],"b":["模型提出\"我要查商品001的库存\"，实际去查的是应用调用的工具。它说\"准备查询\"不算数，查回来的结果才算数。","举个例子：模型请求查余额，真结果是工具干出来的。"],"from":12},{"n":22,"t":"失败的不同含义","f":["失败分三种：要的东西不存在／参数给错了／没权限。三种三种处理法。"],"b":["传菜窗口说\"没成功\"，可能是三种事：菜卖完了（要的东西不存在）、没听清单号（参数给错了）、你根本没有点单资格（权限不够）。三种失败三种处理法，混在一起就只会干等。（打比方，帮助理解）","\"超时\"不能解释成\"今天没营业安排\"。把错误类型和关键参数记下来，按类型处理。","举个例子：余额0和查询超时，必须显示成两种结果。"],"from":12},{"n":23,"t":"怎样确认查到了资料","f":["看真的返回了什么，再决定能不能下结论。"],"b":["查商品001门店A的库存，要收到门店A的余额，才能答\"有货没货\"。教学图只是演示，真连接要看真返回。","举个例子：模拟响应能演示流程，实际运行要看真实返回记录。"],"from":12},{"n":24,"t":"协议与业务语义","f":["接口统一了，\"什么算有货\"这种业务定义还得你自己定。"],"b":["\"库存可用\"可能要求：商品存在＋这个门店有余额＋允许出售。接口管不了这么多，定义要自己写清。"],"from":12},{"n":25,"t":"重复执行的后果","f":["查询重复无妨，下单、发布重复就出事了。"],"b":["查询超时重试，无所谓。但\"下单\"\"群发\"超时后盲目重试，可能发两遍。这类动作要有防重复的机制。"],"from":12},{"t":"参考资料与延伸阅读","f":[],"b":["读法提示：RAG原论文先看摘要和图1，重点看\"检索结果怎样拼进输入\"。","检索增强生成原论文，2020\nhttps://arxiv.org/abs/2005.11401","Anthropic上下文工程，2025\nhttps://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","Language Models are Few-Shot Learners，2020\nhttps://arxiv.org/abs/2005.14165","MCP官方介绍，核查2026-10-04\nhttps://modelcontextprotocol.io/docs/getting-started/intro","Anthropic构建有效Agent，2024\nhttps://www.anthropic.com/engineering/building-effective-agents","ReAct原论文，2022\nhttps://arxiv.org/abs/2210.03629"],"n":26}],"ex":{"intro":[],"sections":[]},"notes":[]},{"id":6,"title":"把重复的活交出去","intro":"","pages":[{"n":2,"t":"怎样才算完成，何时停下","f":["每干一步看一步的结果；到该停的地方就停。"],"b":["Agent每做一步都会得到新信息，再决定下一步。目标、可用工具和停止条件共同限定它能做什么。","你也可以试试：资料缺两页、工具又连着失败——写写它该何时停、怎么交接。\n留意：交接要写清\"完成了啥、没完成啥\"，不能写\"全部完成\"。"],"from":14},{"n":3,"t":"Agent的一轮工作","f":["干一步→看结果→决定下一步。循环往复。"],"b":["就这么转：干活、看结果、调整、再干。转得再欢，方向是你定的。","图中是简化示意，实际用时还是要自己查资料、看结果。"],"from":14},{"n":4,"t":"目标与完成条件","f":["交代清楚\"怎样算干完了\"。"],"b":["\"处理营业通知\"太虚。\"生成并保存一份核对过的草稿，发布另等确认\"——实。完成要看文件和状态，不是它嘴上说\"完成了\"。","举个例子：\"整理完资料\"要有具体的成果清单。"],"from":14},{"n":5,"t":"计划可以调整","f":["发现缺料，改道去补，别硬着头皮按原计划走。"],"b":["原计划是先提日期再写稿；发现日期没有？先去问。计划是假设，证据变了计划就变。","举个例子：缺资料时，从\"提取日期\"改成\"补问\"。"],"from":14},{"n":6,"t":"执行与观察","f":["每次动作的结果，决定下一步干什么。"],"b":["工具返回的是数据还是报错？报错了就得改道或交人。别把报错当没看见。","举个例子：工具报错，要么换动作，要么转人工。"],"from":14},{"n":7,"t":"状态保存","f":["干到哪、用了哪版资料、还差什么，随手记。"],"b":["恢复时先查：资料过期没？要发的真发出去没？别重复干活。","举个例子：状态里写清\"已提取的字段\"和\"没做完的步骤\"。"],"from":14},{"n":8,"t":"可用工具范围","f":["只给它干活需要的钥匙，一把都不多给。"],"b":["读营业表的Agent，不需要你全部账户的权限。页面上的\"立即发送\"按钮是文字，不是你的授权。","举个例子：只给了读取工具，它就不能声称\"已发布\"。"],"from":14},{"n":9,"t":"重试与停止","f":["同一道菜连错三次，像样的经理会停下来打电话——Agent也一样。"],"b":["同一道菜连错三次，像样的值班经理不会让厨房一直重做——他会停下来打电话。Agent的重试次数和停止条件，就是这条\"打电话的规矩\"。（打比方，帮助理解）","超时可重试几次；格式错改参数；业务冲突就停下问。任务完成、预算到顶、补不到资料、需要人拍板——四种情况退出循环。","举个例子：重试上限是教学设定，实际要自己配。"],"from":14},{"n":10,"t":"分工与交接","f":["多个环节接力，用同一份资料和标准。"],"b":["一个环节提事实、一个写稿，交接要带上日期、时段、出处。模型传给模型，也可能把同一个错误传一路。","举个例子：外发前停下，把草稿和待确认项交给人。"],"from":14},{"n":11,"t":"自主程度逐步增加","f":["先让它干可回退的小活，再逐步放手。"],"b":["存草稿搞砸了能重来；群发搞砸了收不回。先小后大，人工检查点一直留着。","举个例子：先干成一件小事，再扩大范围。"],"from":14},{"n":12,"t":"Agent的控制循环","f":["它的每一圈＝接任务→看状态→选动作→看结果。"],"b":["图是机制示意，真实系统还有调度、固定规则和人工节点。转得快不等于干得对。"],"from":14},{"n":13,"t":"评价完整任务","f":["评它，要看最终成果，也要看路上闯没闯祸。"],"b":["文案对不对是一回事；漏没漏文件、重复没重复动作、超没超次数、谎没谎报完成——也是一回事。成功和失败的记录都留着。"],"from":14},{"n":14,"t":"同一任务的几种做法","f":["几件工具怎么搭，看活需要，不看谁高级。"],"b":["一次性的活，聊天里就办了。天天重复的活，才值得搭流程。","你也可以试试：给一天营业通知，比较直接聊天、搭流程、用Agent各要花多少维护功夫。\n留意：能办成同一件事时，说清为什么选简单的。"],"from":10},{"n":15,"t":"模型、方法与工具配合","f":["用一家餐厅记住五个角色：模型是厨师，工具是厨具，工作流是出餐单，Skill是秘籍本，Agent是值班经理。"],"b":["这一课整体可以用一家餐厅来讲（打比方，帮助理解）：模型是厨师，管做、管尝、管判断；工具是厨具和传菜口，管执行，自己不会琢磨；工作流是出餐流程单，先冷菜后热菜，哪步卡住了找谁；Skill是秘籍本，老师傅的手艺写下来，新人照着做；Agent是值班经理，全程盯着，小问题按规矩处理，大事打电话问你。","图中是简化示意，实际用时还是要自己查资料、看结果。"],"from":10},{"n":16,"t":"模型负责生成和判断","f":["模型动嘴（写、判断），动手得靠工具。"],"b":["它可以\"建议\"去查时段，但它自己查不了——查要有工具和权限。建议了不等于做了。","举个例子：模型写通知，营业时间仍来自资料。"],"from":10},{"n":17,"t":"工具执行具体动作","f":["读文件、算数、保存，都靠工具，工具还各有边界。"],"b":["能读营业表，不等于能发通知——两样是不同工具、不同权限。工具的结果也要看版本和范围。","举个例子：查余额要用工具，模型自己不知道余额。"],"from":10},{"n":18,"t":"工作流安排步骤","f":["固定的几步排好顺序，每步写清交什么、接什么。"],"b":["读资料→核字段→写通知→人确认，排成固定流程。缺时间就补问，资料打架就暂停。每步的进出都写清，才接得上。","举个例子：步骤固定的活，适合搭工作流。"],"from":10},{"n":19,"t":"Skill保存方法","f":["Skill是方法包：把\"这类活怎么干\"写成说明，下次照着做。"],"b":["Skill提供字段要求、好坏例子、检查清单，让方法能重复用。它不是工具，也不会自己执行。","举个例子：反复用的检查清单，可以存成Skill。"],"from":10},{"n":20,"t":"Agent按反馈推进","f":["Agent看结果定下一步：缺什么补什么，干到哪算完有标准。"],"b":["工具返回\"缺日期\"，Agent可以去补问或再查。它需要循环、状态和停止条件。叫Agent的未必都能无限自主。","举个例子：Agent根据结果定下一步，还得有停止条件。"],"from":10},{"n":21,"t":"同一任务可多种实现","f":["简单的活别堆装备。"],"b":["一份资料已经确认过？聊天写完人核一遍，足够。天天做、量大，才加方法包和流程；资料散在多处、要靠工具反馈，Agent才显价值。","举个例子：简单通知直接聊，不用上装备。"],"from":10},{"n":22,"t":"人的确认是流程节点","f":["确认要写进流程里：谁核、谁批，白纸黑字。"],"b":["值班经理可以拍板\"这桌菜重做\"，但不能拍板\"今天全场打折\"——打折得打电话问老板。人的确认画在哪条线上，写章程的时候就要写死。陈姐的规矩：凡是影响大家安排的事，一律先对一遍再发。","举个例子：草稿核完后，负责人决定发不发。"],"from":10},{"n":23,"t":"职责图帮助定位问题","f":["出错先问：错在哪个角色？别一律怪\"AI不聪明\"。"],"b":["日期错可能是资料错，文件存不上可能是工具问题，通知又臭又长可能是方法问题，循环停不下来是Agent停止条件没设好。","举个例子：查不到库存，先看工具响应，别急着改文案。"],"from":10},{"n":24,"t":"工作流与Agent的边界","f":["固定流程和随机应变可以混着用，别纠结名词。"],"b":["重要的是写清：谁决定走哪条路、能用哪些工具、什么时候停。比贴\"Agent\"标签有用。"],"from":10},{"n":25,"t":"组件数量与收益","f":["每加一个组件，就多一个可能出故障的地方。"],"b":["教学假设：本来一次生成就能完事，加三次搜索两次转换，出错的机会多了五处。组件要为真需求服务。"],"from":10},{"n":26,"t":"每一步怎样接下去","f":["像接力赛：交棒那一下没弄清，后面全乱。"],"b":["工作流像接力赛：每个选手只跑自己那段，可交接棒那一瞬间决定全队快慢。上一步的输出就是下一步的输入，交接没写清楚，后面全乱。（打比方，帮助理解）","你也可以试试：把会议录音整理成待办：转写→核对→挑重点→人确认。\n留意：录音里的名字没核实，就不能往下传\"确定的姓名\"。"],"from":11},{"n":27,"t":"步骤之间怎样衔接","f":["上一步给的东西，下一步要接得住。"],"b":["交出\"查询成功\"四个字没用，得交出具体内容和出处。","图中是简化示意，实际用时还是要自己查资料、看结果。"],"from":11},{"n":28,"t":"从结果倒推","f":["先想清楚最后要什么，再倒着排步骤。"],"b":["用老周的事走一遍：老周要的是\"周五晚上，排班表发到群里\"。倒着推——发群之前得有初稿，初稿之前得有工时记录，工时记录之前得有本周出勤。把\"发\"字倒着走一遍，流程自己就长出来了。","举个例子：\"完成通知\"要具体到草稿、已知事实和待确认项。"],"from":11},{"n":29,"t":"每步有输入","f":["每步收到的必须是具体内容和出处，不能是\"成功了\"三个字。"],"b":["写通知这步要收到：日期、时段、范围、出处版本。收到的资料不带版本号，出了错都不知道用的是不是旧的。","举个例子：挑字段这步要收原表，不能只收旧摘要。"],"from":11},{"n":30,"t":"每步有输出","f":["每步交出的，要够下一步接着干活。"],"b":["挑字段交出\"已知＋还缺什么\"；写通知交出草稿；核对交出\"问题清单＋能不能往下走\"。","举个例子：挑字段的交字段表，写通知的才有得用。"],"from":11},{"n":31,"t":"分支处理缺口","f":["三种情况三条路：齐全→往下走；缺→补问；打架→停。"],"b":["错误不能流进下一步——尤其不能用上一次的旧结果顶替这次的输出。","举个例子：缺日期就停在补资料那步，别让猜测溜过去。"],"from":11},{"n":32,"t":"人工检查放在哪里","f":["检查点放在\"后果变重\"的地方，不用步步打断人。"],"b":["草稿可以随便改，发出去就影响顾客了。所以人查两处：动笔前对事实，发布前拍板。","举个例子：草稿核过了，才轮到人确认发布。"],"from":11},{"n":33,"t":"重试有条件","f":["失败分三种，处理法不同，重试要设上限。"],"b":["断网了可以再试；格式错了改格式；资料真缺了，重试一百次也没有——去补问。重试次数设上限，记录每次结果。","举个例子：工具超时可有限重试，发布失败先查状态。"],"from":11},{"n":34,"t":"恢复从检查点开始","f":["把干到哪、资料是哪版存下来，中断了能接着干。"],"b":["恢复时先核对：资料还是这版吗？之前的动作真的执行了吗？别盲目跳过检查。","举个例子：存好已核字段，重启后不用重猜。"],"from":11},{"n":35,"t":"换一种情况再试","f":["顺路走通不算完，缺资料、断线、恢复也要各试一遍。"],"b":["全须全尾的资料能走通，不代表流程没毛病。把几种意外情况各跑一次，修过的错再复测。","举个例子：换一份活动资料，看流程是不是通用。"],"from":11},{"n":36,"t":"状态比箭头更具体","f":["流程图上每步，对应一个能记录的状态。"],"b":["同一份通知有四个状态：等资料→等写稿→等核对→已存档。写稿完了但保存失败，总任务就没完成。状态说清了，恢复时才知道从哪接着干。"],"from":11},{"n":37,"t":"最小流程的价值","f":["先把顺路走通，再加分支。"],"b":["一条能跑通的路，胜过一张全是箭头的图。每个分支都要有触发条件和产出，说不出用处的步骤先删。"],"from":11},{"n":38,"t":"方法什么时候需要调整","f":["好方法留低，过时的改掉，判断标准是任务。"],"b":["写下来的方法不是圣旨。任务变了、模型变了，拿旧任务测一测，该改就改。","你也可以试试：旧方法要求所有文案写五段。拿一条短群消息测测，决定怎么改。\n留意：事实检查永远保留；结构按任务重新定。"],"from":13},{"n":39,"t":"旧方法怎样重新比较","f":["固定资料和标准，新旧方法各跑一遍比。"],"b":["比较要公平：同一份资料、同一个标准，只换方法。","图中是简化示意，实际用时还是要自己查资料、看结果。"],"from":13},{"n":40,"t":"Skill保存可复用经验","f":["Skill是秘籍本：写清\"怎么做、什么时候适用、什么时候不能用\"。"],"b":["Skill就是老师傅的秘籍本：不是把每道菜都做一遍给人看，而是把\"什么火候、什么顺序、什么时候必须停\"写下来。写不清\"什么时候不适用\"的秘籍，是会害人的。（打比方，帮助理解）","它是一份说明文件，不改变模型本身。写清适用和不适用，比堆一堆提示词管用。","举个例子：把反复用的方法写下来，先从一个任务开始。"],"from":13},{"n":41,"t":"适用范围先写清","f":["第一句就写：管什么、不管什么。"],"b":["\"负责所有文案\"太宽，容易乱套。\"根据已确认营业资料写顾客通知\"——清楚。范围说明本身就是检查标准。","举个例子：写通知的方法，别硬套到分析报告上。"],"from":13},{"n":42,"t":"必要资料有入口","f":["方法里写清：资料去哪拿、缺了怎么办。"],"b":["Skill存通用做法；最新营业时间每次从资料里读。别把旧日期写死在方法里，下次必出错。","举个例子：入口写清资料在哪、缺了怎么补问。"],"from":13},{"n":43,"t":"方法包含判断条件","f":["把\"总要写五段\"改成\"按用途定结构\"。"],"b":["营业通知先写日期时间；介绍稿才需要背景价值。质量要求保留（事实必须对），结构按用途灵活定。","举个例子：已知时间必须保留，未知联系人不能编。"],"from":13},{"n":44,"t":"例子展示边界","f":["给好例子，也给坏例子，各自说明违反了哪条。"],"b":["讲一个新手都犯过的错：第一次写教程的人，十个有九个栽在同一个坑里——只写\"怎么做\"，不写\"我这是在什么条件下才跑通的\"。别人一照着做就报错，还以为是自己的问题。写Skill同理，适用范围写在最前面，是给三个月后的自己省一夜排查。","好例子：时间完整；坏例子：一天写成一周——并注明坏在哪条。例子不是唯一答案，换个说法只要事实对就行。","举个例子：一份正常资料加一份缺失资料，展示方法边界。"],"from":13},{"n":45,"t":"模型升级后复测","f":["升级后做三组比较：只给目标／加旧方法／加新方法。"],"b":["三组用同一资料同一标准，看漏项、格式和修改量的变化。只改这一个变量，结果才说得清。","举个例子：升级前后同题重测，不只看一次成功。"],"from":13},{"n":46,"t":"迭代可以做减法","f":["改方法先做减法：删掉没用的死规定，保留底线。"],"b":["底线不删：时间要核对、未知不编、发布要确认。死规定看着删：\"每段重复三遍\"\"必须用某工具\"——删完要观察：原来防住的错回来了没有？","举个例子：固定五段把短通知撑长了，就删。"],"from":13},{"n":47,"t":"版本使经验可追踪","f":["留版本：改了什么、为什么改、用什么证明。"],"b":["V1、V2都留着，附上同一测试的输入和结果。资料、模型、规则别一次全换——换了就说不清哪步起了作用。","举个例子：记下修订理由，下次变化能追溯。"],"from":13},{"n":48,"t":"按需读取","f":["说明写在前头，细节要用再翻。"],"b":["方法页开头几句决定AI会不会正确调用它。资料和脚本可以附在后面，按需读取。"],"from":13},{"n":49,"t":"方法与能力一起变化","f":["模型越听话，老方法里的死规定执行得越死。"],"b":["升级后三组对比：只给目标／加旧方法／加新方法。旧方法强制五段导致通知太长？删结构限制，保留日期核对。结论只对你测的模型和任务负责。"],"from":13},{"t":"参考资料与延伸阅读","f":[],"b":["Anthropic构建有效Agent，2024\nhttps://www.anthropic.com/engineering/building-effective-agents","ReAct原论文，2022\nhttps://arxiv.org/abs/2210.03629","Anthropic上下文工程，2025\nhttps://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","Anthropic Agent Skills介绍，2025\nhttps://www.anthropic.com/engineering/equipping-agents-for-the-real-world-with-agent-skills","MCP官方介绍，核查2026-10-04\nhttps://modelcontextprotocol.io/docs/getting-started/intro","OpenAI推理模型提示建议\nhttps://developers.openai.com/api/docs/guides/reasoning-best-practices","Simon Willison的Skill实测，2025\nhttps://simonwillison.net/2025/Oct/16/claude-skills/","宝玉：学习AI与Skill迭代\nhttps://s.baoyu.io/files/baoyu-ai-skills-talk/ai-skills-talk.html"],"n":50}],"ex":{"intro":[],"sections":[]},"notes":[]},{"id":7,"title":"做一个自己的小工具","intro":"","pages":[{"n":2,"t":"从填写到保存","f":["填表→生成→保存→改错→恢复，五个动作走一遍。"],"b":["这一课就是把这条链从头到尾跑通。","你也可以试试：用两场活动练保存与恢复，再故意填一个错时段。\n留意：有效结果能恢复；错了输入要清掉旧结果。"],"from":15},{"n":3,"t":"通知工具怎样工作","f":["工具按死规则整理，你按资料核对——分工明确。"],"b":["规则管格式（日期对不对、先后顺不顺），事实管真假（活动是真是假）——后者只能靠你。","图中是简化示意，实际用时还是要自己查资料、看结果。"],"from":15},{"n":4,"t":"小工具从一件事开始","f":["第一个工具别奔着\"平台\"去，就是一张表加一条规则。"],"b":["第一个工具别奔着\"平台\"去，就该是一张表单加一条规则。先把一件最小的事从头到尾跑通，比规划一个完整系统有用得多。","这份练习工具按固定规则检查字段，再组合成通知草稿，资料保存在本机。想换语气时，再把已核对的资料交给AI。","举个例子：先做\"填活动资料→出通知草稿\"这个闭环。"],"from":15},{"n":5,"t":"输入表单","f":["表单把每个字段摆明，减少漏填。"],"b":["日期、时段、地点、事项，各有各的格子。人数未知就留\"待确认\"。注意：格式对，不等于活动是真的。","举个例子：表单让日期、时段、地点各有固定位置。"],"from":15},{"n":6,"t":"规则处理","f":["死规则管格式，AI管语气，两者搭配。"],"b":["结束时间早于开始时间？规则一查就报错。语气想柔和点？交给AI。各干各的擅长。","举个例子：结束早于开始，规则提示错误。"],"from":15},{"n":7,"t":"输出与来源","f":["草稿里的每个信息，都要能追回你填的内容。"],"b":["保存时输入和结果一起存。以后查\"这个日期哪来的\"，一翻就知道。","举个例子：每个时间地点都来自本次输入。"],"from":15},{"n":8,"t":"错误即时反馈","f":["填错了马上说，旧草稿马上清。"],"b":["讲一个新手最常见的坑：第一次做工具的人，往往只设计了\"一切顺利\"那条路。用户把日期填错了怎么办？保存到一半断网了怎么办？工具做得成不成熟，不看功能多不多，看它对\"不顺利\"有没有准备。","填错时，工具指出错误并清掉旧草稿——防止你把上一场的通知当成这一场的。","举个例子：改了输入，旧草稿失效，不许沿用。"],"from":15},{"n":9,"t":"保存与恢复","f":["存下来，再恢复一次，才算验证过。"],"b":["下载资料文件→刷新页面→重新载入→工具重新检查→草稿再生成。恢复后自己再核一遍日期地点。","举个例子：下载、恢复走一遍，才算真的存住了。"],"from":15},{"n":10,"t":"可选AI写作","f":["想让AI改语气？把核对过的资料给它，改完粘回来再核。"],"b":["重点核三样：日期、时间、地点有没有被改？有没有多出没依据的词？","举个例子：AI管语气，事实检查不省。"],"from":15},{"n":11,"t":"接入AI之后还要检查什么","f":["确认AI真的返回了，再查内容和失败情况。"],"b":["固定规则版已经能用。要接AI，就得管它的等待、失败、账户和费用——本课先不接，把表单练熟。","举个例子：AI连接没真跑过，就先列在\"待完成\"。"],"from":15},{"n":12,"t":"格式正确，事实还要确认","f":["格式合法，不等于事情是真的。"],"b":["规则能查日期存在、先后合理、字段没空，但不知道负责人批没批。真不真、能不能发，靠资料和确认。"],"from":15},{"n":13,"t":"小工具怎样逐步改进","f":["先跑顺主路，再加功能；每加一个连接，多管一堆事。"],"b":["AI改写、外部数据源……每加一样，就多了网络、账户、费用、失败要处理。别急。"],"from":15},{"t":"参考资料与延伸阅读","f":[],"b":["Anthropic构建有效Agent，2024\nhttps://www.anthropic.com/engineering/building-effective-agents","MCP官方介绍，核查2026-10-04\nhttps://modelcontextprotocol.io/docs/getting-started/intro","OpenAI推理模型提示建议\nhttps://developers.openai.com/api/docs/guides/reasoning-best-practices"],"n":14}],"ex":{"intro":[],"sections":[]},"notes":[]},{"id":8,"title":"出错了从哪查起","intro":"","pages":[{"n":2,"t":"找到最早出错的地方","f":["像整理错题本：找到最早开始错的那一步，才是根子。"],"b":["调试像整理错题本：重点不是把错题抄一遍，是找到最早开始错的那一步。第8题错了，根子可能在第3题的概念没通。（打比方，帮助理解）","你也可以试试：改了海报日期，日期、地址、广播稿都要重新核一遍。\n留意：原问题修好，还要看有没有带坏别处。"],"from":16},{"n":3,"t":"问题怎样一步步改好","f":["留住出错现场→找原因→改→再验证。"],"b":["四拍子：复现、定位、修改、复测。少一拍都说不清。","图中是简化示意，实际用时还是要自己查资料、看结果。"],"from":16},{"n":4,"t":"问题描述可以复现","f":["\"这次不好用\"没法查；记录输入、结果、预期，别人才能重跑。"],"b":["存下错误输出、用的哪个模型、方法哪一版。敏感信息先打码，够定位就行。","举个例子：先记输入和错误结果，别人才能重跑一遍。"],"from":16},{"n":5,"t":"分层定位","f":["一层层查：资料→模型→方法→工具→流程，别一起全换。"],"b":["通知日期错了先看输入；文件打不开再查导出工具。每步留了输出，最早出偏差的地方一眼可见。","举个例子：看第一个出偏差的环节，别急着加规则。"],"from":16},{"n":6,"t":"一次改一个原因","f":["一次只改一处，效果才归得了因。"],"b":["同时换了模型、资料、模板，就算变好了，也不知道是谁的功劳。下次坏了，也不知道该怪谁。","举个例子：只改和错误有关的那部分。"],"from":16},{"n":7,"t":"把出过错的例子留下来","f":["AI挖的每个坑都值得记：问了什么、答了什么、错在哪、怎么改的。"],"b":["AI给你挖的每一个坑，都值得记下来：当时问了什么、它答了什么、错在哪、后来怎么改的。三个月后再翻这份记录，你会觉得它比任何教程都好用。","修好后，把当时出错的输入再跑一遍；顺便试试隔壁情况（次日恢复、联系人未知）。","举个例子：原错误重跑通过后，再试相邻情况。"],"from":16},{"n":8,"t":"版本与回退","f":["改动记三样：什么引发的、改了哪里、怎么验证的。留后路。"],"b":["改坏了能退回上一版。退回后注意：老方法稳定，但老资料可能过期。","举个例子：上一版方法和资料留着，必要时能退。"],"from":16},{"n":9,"t":"维护随条件变化","f":["三种情况触发复测：模型升级、资料变更、反复出错。"],"b":["模型升级试旧任务；营业安排变了更新资料；同一个错犯两次，就该改方法了。","举个例子：升级、变更、重复出错，都要复测。"],"from":16},{"n":10,"t":"效果看可用成果","f":["别数\"用了多少次\"，数\"最后能用几条、花了多久\"。"],"b":["写稿、核对、返工各花多久，最后几条能用——记这个账。调用次数和Token数只是消耗，不是成果。","举个例子：把核对和返工时间算进来，再判断值不值。"],"from":16},{"n":11,"t":"完成自己的课程练习","f":["把第01课存的那次记录翻出来——这份前后对比，就是你16课的成绩单。"],"b":["还记得第01课让你存下来的那次\"现场跑一次\"吗？把它翻出来。同一个任务，现在的你会怎么问、怎么查、怎么留档？把前后两份放在一起——这份对比，就是你16课的成绩单。","展示一份成果，说清：用了哪些资料、为什么这样做、哪里出过错、怎么改好的、哪些还没做。","举个例子：交出结果、方法和未完成项，接手的人才能重做。"],"from":16},{"n":12,"t":"评价方法升级","f":["比较新旧方法：同样的输入和标准，只换方法。"],"b":["固定输入和完成标准，记录版本、时间、修改量。样本小只能发现具体问题，不能证明\"对所有人都更好\"。"],"from":16},{"n":13,"t":"从个人使用到团队复用","f":["给接手的人留：资料在哪、适用条件、方法版本、还没解决的疑问。"],"b":["只有成功截图，别人学不会。留够上下文，别人才能重跑、才能接着改。"],"from":16},{"t":"参考资料与延伸阅读","f":[],"b":["Anthropic构建有效Agent，2024\nhttps://www.anthropic.com/engineering/building-effective-agents","Anthropic上下文工程，2025\nhttps://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","Anthropic Agent Skills介绍，2025\nhttps://www.anthropic.com/engineering/equipping-agents-for-the-real-world-with-agent-skills","一见AI：AI消耗与业绩，作者配文\nhttps://www.douyin.com/video/7691167895279242496\n本课取材于作者配文与页面标题。"],"n":14}],"ex":{"intro":[],"sections":[]},"notes":[]},{"id":9,"title":"附录：AI 怎样走到今天","intro":"","pages":[{"n":2,"t":"能力变化，使用方法也会变","f":["技术变了，老办法值得拿出来重新试试。"],"b":["以前靠人定死规则，现在可以直接跟AI说。老办法不一定作废——有些活老办法反而稳。","你也可以试试：报名截止日，用手写规则检查和让AI自由写通知，各适合哪部分。\n留意：别把历史讲成\"旧方法全作废\"。"],"from":2},{"n":3,"t":"技术变化怎样影响用法","f":["新能力带来新用法，好不好用要拿自己的活试。"],"b":["新功能出来，先别急着叫好，拿自己手头的任务试一试再说。","图中是简化示意，实际用时还是要自己查资料、看结果。"],"from":2},{"n":4,"t":"AI早于聊天应用","f":["1955年写了份提案，说1956年研究\"智能\"——这个\"夏天\"到今天整整七十年了。"],"b":["讲个没讲完的夏天：1955年一群科学家写提案，打算1956年用一个夏天研究清楚\"智能\"。结果这个夏天到今天还没结束。（提案是真的，乐观也是真的。）","举个例子：报名截止日这种明确条件，用老式规则程序也能查。"],"from":2},{"n":5,"t":"规则系统","f":["人把规则写死，机器照着办。"],"b":["规则系统像自动售货机：按哪个键出哪罐，全是事先定好的。（打比方，帮助理解）条件明确时它最可靠；例外一多，人就得不停补规则。","举个例子：通知模板——人定好字段，机器只填日期和时段。"],"from":2},{"n":6,"t":"机器学习","f":["不写规则了，给机器看大量例子，让它自己找规律。"],"b":["机器学习像老店员认熟客：没人教过规则，上千张脸看下来自己就会了。（打比方，帮助理解）例子（垃圾邮件和正常邮件）给它看多了，它就学会分辨。但碰到没见过的新情况，就可能看走眼。","举个例子：拿大量标注过的邮件训练，模型学会分垃圾邮件。"],"from":2},{"n":7,"t":"深度学习","f":["很多层叠起来学，一层学一点。"],"b":["深度学习像厨师学徒：先练刀工，再练火候，一层一层往上，每层学的不一样。（打比方，帮助理解）层数多了，能认出更复杂的东西，但也更费数据和算力。","举个例子：认图片时，一层认线条，再一层认形状，一层层拼出完整图案。"],"from":2},{"n":8,"t":"2017与2020","f":["2017年的Transformer论文、2020年的GPT-3论文，让\"读文字就能学任务\"成为主流。"],"b":["2017年的一篇论文提出了新架构（Transformer），2020年的GPT-3证明：给它看几个例子，它就能照着做新任务。注意：论文发表不等于大家都用上了。","举个例子：GPT-3不用逐条写规则，给几个例子就行。"],"from":2},{"n":9,"t":"2022与2023","f":["2022年ChatGPT让人能一直追问改稿，2023年GPT-4能看图了。"],"b":["ChatGPT最大的变化：你可以接着问、接着改，不用一次到位。GPT-4：除了字，还能看图。发布时间要和实际开放时间分开看。","举个例子：改稿从\"重写一遍\"变成\"接着聊\"。"],"from":2},{"n":10,"t":"推理与工具循环","f":["有的模型会\"多想一会儿\"，有的系统能一边查一边干。"],"b":["新一代模型解题前会先多算一会儿。Agent则更进一步：查到结果、根据结果决定下一步。不管多能干，最后的结果还是要人检查。","举个例子：发现资料缺时间，Agent会先查工具，查不到再来问你。"],"from":2},{"n":11,"t":"方法随能力迭代","f":["模型升级了，老任务值得重跑一遍。"],"b":["模型换了，以前的老做法不一定还最优。固定资料和标准，把新旧做法各跑一遍比一比。","举个例子：以前通知固定写五段，新模型下可能短版更好——测了才知道。"],"from":2},{"n":12,"t":"不同路线并存","f":["规则和模型可以拼在同一个系统里。"],"b":["截止日期对不对，规则一查就知道；通知写得好不好，交给模型。能用规则的地方，不必为了\"更像AI\"硬换掉。"],"from":2},{"n":13,"t":"变化的证据","f":["论文、发布会和你自己的体验，证明的不是一个范围。"],"b":["论文说的是实验里的成绩，发布会说的是产品开了什么功能，你自己的体验只算你自己这一例。别人的成功案例，不等于你也能成。"],"from":2},{"t":"参考资料与延伸阅读","f":[],"b":["达特茅斯提案，1955\nhttps://www-formal.stanford.edu/jmc/history/dartmouth/dartmouth.html","Attention Is All You Need，2017\nhttps://arxiv.org/abs/1706.03762","Language Models are Few-Shot Learners，2020\nhttps://arxiv.org/abs/2005.14165","ChatGPT原始发布，2022\nhttps://openai.com/index/chatgpt/","GPT-4技术报告，2023\nhttps://arxiv.org/abs/2303.08774","o1原始发布，2024\nhttps://openai.com/index/introducing-openai-o1-preview/","DeepSeek-R1原论文，2025\nhttps://arxiv.org/abs/2501.12948","Karpathy年度回顾，2025\nhttps://karpathy.bearblog.dev/year-in-review-2025/"],"n":14}],"ex":{"intro":[],"sections":[]},"notes":[]},{"id":10,"title":"附录：大模型怎样接话","intro":"","pages":[{"n":2,"t":"模型怎样接着写下去","f":["看懂文字经过哪几步，变成接下来的回答。"],"b":["三步：先把字切成小块，再算每个小块的意思，最后算出下一个最顺的词。","你也可以试试：\"欢迎参加\"后面能接好多话。接得顺，能证明活动日期是哪天吗？不能。\n留意：接得顺是语言能力，不是事实。"],"from":3},{"n":3,"t":"文字怎样变成回答","f":["文字先编码，再计算，得到下一个词的概率。"],"b":["你输入的字 → 切块 → 变成数 → 计算 → 输出下一个词。就这么循环。","图中是简化示意，实际系统更复杂，用时还是要查资料、看结果。"],"from":3},{"n":4,"t":"文字先变成Token","f":["Token是AI处理文字的小块，不一定正好是一个字。"],"b":["Token像积木块：一句话被拆成一块一块，一块不一定正好是一个字。（打比方，帮助理解）不同AI切法还不一样。","举个例子：\"明天／营业／时间\"只是切法示意，实际未必这么切。"],"from":3},{"n":5,"t":"Token变成向量","f":["每个小块变成一组数字，意思近的数字也近。"],"b":["向量像给积木记坐标：意思相近的词，坐标也挨得近。（打比方，帮助理解）AI看不懂字，只懂数——先翻译成数，才能算。","举个例子：第42号只是编号示意，真实的是一长串数字。"],"from":3},{"n":6,"t":"预测下一个单位","f":["AI不是知道答案，是算出哪个词接在这里最顺。"],"b":["接龙的本质：它给每个候选词算一个\"有多顺\"的分。（打比方，帮助理解）分高只说明顺，不代表这家店真是10点开门——开门时间得查资料。","举个例子：\"营业时间为\"后面可以接不同内容，它挑最顺的。"],"from":3},{"n":7,"t":"训练用误差调整参数","f":["训练就是：做大量接龙练习，错了就调。"],"b":["训练像刷题：预测错一点，就调一点内部的\"旋钮\"（参数），海量题目刷下来，接龙越来越顺。你平时聊天，不会触发重新训练。","举个例子：训练才调参数，平时聊天不调。"],"from":3},{"n":8,"t":"使用时产生答案","f":["平时聊天用的是训练好的模型，不是边聊边学。"],"b":["它在对话里记得你刚说的名字，不代表它\"学会了\"——那只是这次对话的临时记忆。","举个例子：本次对话用已有参数计算，不等于又训练了一遍。"],"from":3},{"n":9,"t":"注意力联系上下文","f":["AI读句子时，会自动多看相关的词。"],"b":["注意力像在嘈杂的聚餐里挑声音：一桌人同时说话，你总能听见喊你名字的那个人。（打比方，帮助理解）它也会\"偏心\"：写到\"周二恢复\"时，会多看前面\"周一调整\"那段。","举个例子：\"10月13日恢复\"要联系前面的调整日期才说得通。"],"from":3},{"n":10,"t":"层与上下文一起作用","f":["很多层一起算，词的顺序也很重要。"],"b":["AI不是查一张词表，是一层层加工。语序颠倒，意思就变：\"甲在乙前\"和\"乙在甲前\"不一样。","举个例子：每层都在加工，不是一步到位。"],"from":3},{"n":11,"t":"语言模式与事实","f":["话说得顺，事实还得另外核。"],"b":["它学到的是\"通知一般怎么写\"，不是\"你家店几点开门\"。格式它熟，日期它可能编。所以原资料永远要自己留着。","举个例子：最像通知的时间，也可能不是这家店真实的时间。"],"from":3},{"n":12,"t":"注意力的计算直觉","f":["它给每个词打\"相关度\"，相关度高的多看两眼。"],"b":["写\"恢复\"时，它给前文每个词算一个相关分，分高的多参考。但打分可能打错——它没长眼睛，分高不代表真找对了。"],"from":3},{"n":13,"t":"参数、上下文与记忆","f":["参数是训练来的本事，上下文是这次对话给的资料。"],"b":["本事（参数）训练完就固定了；这次对话说了什么，是临时给的资料。产品的\"记住我\"功能另有存储，别全当成它变聪明了。"],"from":3},{"t":"参考资料与延伸阅读","f":[],"b":["读法提示：原论文不用逐行啃——先看摘要和图1，再翻回本课第05—07页对照着看。","Attention Is All You Need，2017\nhttps://arxiv.org/abs/1706.03762","Language Models are Few-Shot Learners，2020\nhttps://arxiv.org/abs/2005.14165","InstructGPT人类反馈论文，2022\nhttps://arxiv.org/abs/2203.02155"],"n":14}],"ex":{"intro":[],"sections":[]},"notes":[]}],"story":[{"id":1,"who":"laozhou","q":"AI 到底能帮我干点啥？","sub":"不讲概念，先找一件你今天就要做的小事","scene":[["n","晚上十点，老周的面馆刚收摊。手机“叮”一声，供货商发来消息："],["o","周老板，周三的货提前到早上9点，麻烦安排人接一下。"],["n","老周得通知三个店员。他一根手指在屏幕上戳，打了删、删了打，十分钟过去，才憋出一句“周三早来”。"],["n","第二天，有个店员八点半就到了，有个十点才来——“早来”到底是几点？谁也说不清。"],["q","你有没有过这种时候：事情不难，就是**写清楚**太费劲？这一课就从这儿开始。"]],"big":"AI 最擅长的，是帮你**起草、整理、列选项**；它不擅长的，是知道**你家的事**。所以分工很简单：它出稿，你签字。","analogy":{"title":"把 AI 想成一个耐心无限、但每次都会忘事的新同事","text":"它读得多、写得快，让它改十遍也不烦。可它不认识你店里任何一个人，也不知道货几点到；换个新对话，你上回交代的它就忘了。起草交给它，几点开门、发不发，还得你说了算。","icon":"🧑‍💼"},"steps":[{"life":"先固定一个软件","text":"手机上装一个就够：豆包、DeepSeek、腾讯元宝都行，免费版就能起步。先把一个用熟，别今天换这个、明天换那个。想在电脑上让它整理文件、做表格，可以试试 WorkBuddy 这类 AI 办公软件。"},{"life":"让它先写个初稿","text":"你说清要写什么，它就能给你好几个版本挑。这类能“写出新东西”的 AI，叫[[生成式AI|能按你的要求写出文字、图片等新内容的 AI，比如聊天助手]]。"},{"life":"把乱七八糟理成清单","text":"进货单、聊天记录、手写便条，丢给它，它能理成一条条清单——清单一摆出来，哪里漏了你一眼就看见。"},{"life":"帮你把选项摆出来","text":"两个方案拿不定主意？它能帮你列优缺点。但“选哪个”是你的事，它不知道你最在乎什么。"},{"life":"别问哪个最强，问哪个够用","text":"排行榜考的是它的题，不是你的活。拿你自己的一件活，同样的话发给两个软件，答案并排放，比出来才算数。"},{"life":"算算真省了多少时间","text":"省下的打字时间，要减掉你核对、改错花的时间。问自己两句：**错了容易发现吗？错了后果大吗？** 两句都是“还好”，就放心让它先上。"}],"demos":[{"type":"sort","title":"动手分一分：这些活，该怎么交给 AI？","hint":"每一条点一个你觉得对的选项，马上能看到解释。","buckets":["放心让它起草","它起草，我必须核对","我自己拍板"],"items":[["给店员群消息写三个版本，我挑一个",0,"写法错了也不要紧，你挑的时候就看出来了。"],["把供货商发来的一长串消息理成“周三要做的事”清单",1,"清单里的时间、数量必须对着原消息核一遍——它可能理丢一条。"],["决定周日让谁加班",2,"这关系到人，AI 不知道谁家里有事。可以让它帮你措辞，决定得你来。"],["告诉顾客下周起面涨一块钱",2,"涨不涨、涨多少是你的决定；定了以后，可以让它帮你把话说得客气点。"],["把手写的进货单拍照，转成表格",1,"识别数字最容易出错，每个数字都要对一遍。"]]},{"type":"compare","title":"同一件事，前后对比","a":{"label":"老周自己憋的","text":"周三早来"},"b":{"label":"让 AI 起草、老周核过的","text":"各位：本周三早上 9:00 供货商送货。到店接货的人：待确认，定好我再发一条。收到回个“1”。"},"why":"差别不在文采，在**具体**：几点、谁、做什么、怎么确认。AI 很会把这些位置摆出来——空着的地方，正好提醒你去补。"}],"myths":[["AI 什么都知道","它知道的是“一般情况”。你家货几点到、店员叫什么，它一概不知，得你告诉它。"],["排行榜第一就是最好的","排行榜考的是它的题，不是你的活。你的活，要你自己拿来考。"],["用 AI 就是偷懒","省的是打字和排版的力气，判断和核对一点没少。用得好的人，反而更认真地看每个数字。"],["得先学会编程才能用","会说话就能用。这门课从头到尾，一行代码都不用你写。"]],"tryit":{"text":"打开你手机里任意一个 AI 应用，用自己的话说一件今天要做的小事。不会开口？照这个填空：","prompt":"我要给____写一条____，内容是____。请保留____，不要编造____。","foot":"把你的提问和它的回答都存下来，最后一课要用。"},"take":"AI 管起草，你管签字。"},{"id":2,"who":"xiaolin","q":"为什么别人用 AI 像请了个助理，我用像隔空喊话？","sub":"差别多半不在 AI，在你有没有说清四件事","scene":[["n","小林投了二十份简历，石沉大海。他对 AI 说："],["o","帮我改简历。"],["n","AI 回了一大段：“建议突出你的核心竞争力，量化你的成果，使用有力的动词……”"],["p","xiaolin","道理我都懂，可我的简历一个字都没变啊。"],["q","AI 不是不想帮，是它根本不知道：给谁看、改哪里、手头有什么、什么不能碰。"]],"big":"跟 AI 说话，就像给一个刚来的同事交代活：**给谁用、干什么、有什么材料、不许干什么**——四件事说清，它就不用瞎猜。你说得越清楚，它猜得越少。","analogy":{"title":"点外卖的备注","text":"只写“好吃点”，店家只能凭感觉；写“少辣、不要香菜、多加一份米饭”，送来的就是你要的。给 AI 的话，就是那张备注。","icon":"🥡"},"steps":[{"life":"给谁用、拿去干什么","text":"“给校招 HR 看的”和“给导师看的”，写法完全不一样。先说用途，它才知道往哪使劲。这段话就是你的[[提示词|你发给 AI 的那段话，包括要求、资料和限制]]。"},{"life":"材料单独摆出来","text":"原简历、营业时间这类事实，单独贴一段，跟“语气要活泼”这类要求分开写，它就不容易把两者搅在一起。"},{"life":"划好线：不许干什么","text":"字数、语气、**不许编经历**、不许加联系人……这些都是给它划的线。好的 AI 像好的服务员：菜卖完了会告诉你，而不是端一盘别的上来。"},{"life":"给个例子，说清为什么","text":"给它看一个你喜欢的例子、一个你不喜欢的例子，各说一句为什么。比说“写得高级点”管用十倍。"},{"life":"反馈要指到具体的地方","text":"改稿时别说“再好一点”，说“第二段太长，压到两句；‘负责’换成具体做了什么”。"}],"demos":[{"type":"builder","title":"动手拼一段“说清楚”的话","hint":"每一格填一句，下面会自动拼成可以直接复制的提示词。","fields":[["给谁用、干什么","给应届校招的 HR 看，帮我改简历里的实习经历那一段"],["我手头的材料","（贴上原来那段实习经历）"],["要求","每条经历一句话，先写做了什么，再写结果；总共不超过 120 字"],["不许干什么","不许编造我没做过的经历和数字；没把握的地方列出来问我"]]},{"type":"compare","title":"前后对比：同一个 AI，两种问法","a":{"label":"随口一句","text":"问：帮我写个通知。\n\n答：尊敬的各位顾客，为了给您提供更优质的服务，我们将对营业时间进行调整，具体安排敬请关注……"},"b":{"label":"四件事说清","text":"问：给顾客写一条群消息。资料：10月12日营业时间10:00—18:00，仅当天调整，10月13日恢复。70字以内，不要编联系人。\n\n答：【营业时间调整】10月12日本店营业10:00—18:00，仅当天调整，10月13日起恢复原营业时间。给您带来不便，敬请谅解！"},"why":"第一种它只能写“通知的样子”；第二种它知道日期、范围、字数和禁区，写出来的东西差不多可以直接核对后用了。"}],"myths":[["提示词越长越好","不是越长越好，是**四件事齐**。简单的活一句话说清就行，复杂的活再分步。"],["要背一堆“咒语”模板","模板可以参考，但别硬套。说清你自己的情况，比任何万能咒语都管用。"],["它答得不好，就是它笨","先看看自己说没说清。很多时候补一句用途、贴一段资料，结果就完全不一样。"]],"tryit":{"text":"现场比一比：先只输入“帮我写个通知”，存好结果；再把上面拼好的那种“四件事齐全”的话发一遍。两份摆在一起：哪份更接近能用？差距出在哪几个字上？","prompt":"给____写一条____。用途：____。资料：____。要求：____字以内，语气____。不许：编造资料里没有的信息。缺了什么先问我。","foot":""},"take":"你说得越清楚，它猜得越少。"},{"id":3,"who":"xiaolin","q":"AI 写得挺像样，能直接发吗？","sub":"它会把没影的事说得跟真的一样。按下发送前，给自己 30 秒","scene":[["n","社团招新前一晚，小林让 AI 写招新文案。写得真漂亮，还有一句特别有分量："],["o","本社团连续三年获评校级优秀社团！"],["p","xiaolin","它说的应该没问题吧？"],["n","第二天社长看了一眼：“我们哪拿过这个奖？”——小林去查了，根本没有这回事。"],["q","AI 没有骗人的心眼，它只是**不会说“我不知道”**。这一课讲两件事：它为什么会编，发之前怎么在 30 秒里查出来。"]],"big":"大模型的本职是**把话接顺**，不是**把事查对**。碰到不知道的事，它常常“填一个像真的”上去——这就是[[幻觉|AI 生成了看起来很像真的、但其实没有依据或是错的内容]]。所以能不能发，就一个笨办法：**原资料放左边，结果放右边，一行行对。**","analogy":{"title":"考场上不会也要写满的同学","text":"数学大题步步清楚，可遇到没复习的题，他也不会空着——硬编一段，写得还挺像样。AI 有时候就是这位同学。","icon":"📝"},"steps":[{"life":"大题对，小处照样错","text":"它的本事很不均匀：难题做对了，不代表日期、人名、数字也对。十次对九次，错的那次可能正好砸在要害上。"},{"life":"让它自己查自己，不算数","text":"你问“你确定吗？”，它可能道歉改口，也可能更肯定。两种都不是证据——证据在原资料里。"},{"life":"王阿姨的土办法","text":"王阿姨有个土办法：原资料贴屏幕左边，AI 的结果放右边，手指头点着一行行对——时间、地点、联系人。土办法，但每次都拦得住错。"},{"life":"给了链接，不等于链接里真这么说","text":"AI 附了一个[[来源|支撑某个说法的原始资料，比如官方通知、原文网页]]，要点开看看：里面真有这句话吗？说的是同一件事吗？"},{"life":"没写错，不等于写全了","text":"漏掉“认领请到 3 栋 201”，每一句都没错，可失主第二天还会白跑一趟物业。[[遗漏|该写的关键信息没写进去]]和编造一样要紧。"},{"life":"改完一处，全文再看一遍","text":"修好一个日期，可能顺手带坏了另一句。改完以后，四样事实从头再对一遍。"}],"demos":[{"type":"spot","title":"找茬：小林手里只有这三条资料","src":"社团名：青藤摄影社 ｜ 招新时间：10月16日 14:00 ｜ 地点：二教门口","hint":"点一下你觉得“没依据”的句子，看看猜得对不对。","segs":[["青藤摄影社招新啦！",0,"有依据：社团名在资料里。"],["10月16日14:00，二教门口见。",0,"有依据：时间和地点都对得上。"],["本社团成立于2015年，",1,"编的：资料里没有成立年份。"],["连续三年获评校级优秀社团，",1,"编的：这就是小林踩的坑。"],["现有成员200余人。",1,"编的：人数资料里没给。"],["欢迎带上手机或相机来玩！",2,"这是一句邀请，不是事实陈述。可以留，但要社长点头。"]]},{"type":"check","title":"发送前 30 秒检查","items":["日期、时间跟原资料一字不差","数字（价格、人数、门牌）都对过","没有多出资料里没有的人名、电话、地点","该写的没有漏（比如“去哪儿认领”）","改过的地方，全文又看了一遍"]}],"myths":[["AI 说得这么肯定，肯定是查过的","语气肯定不代表有依据。越是具体的年份、数字、奖项，越要单独核。"],["它能解奥数题，查个日期还能错？","能。解题靠推理，日期靠资料——没给资料，推理再强也只能猜。"],["让 AI 自己检查一遍就行","它可能“错得前后一致”。检查要拿原资料对，不能拿它自己的话对。"]],"tryit":{"text":"亲手踩一次坑，比听十遍都管用。去问 AI 一件你**自己编的**“历史事件”，看它是老实说不知道，还是流畅地编一段。然后再试试这个“防编造”的问法：","prompt":"请帮我写社团招新文案。只使用我给的资料：社团名、时间、地点。资料里没有的信息不要补；如果你觉得缺了什么，列在最后让我确认。写完后，把文中每一句标成「有资料依据」或「我加的」。","foot":""},"take":"它张口就来，出了错可是你的事。"},{"id":4,"who":"wangayi","q":"AI 做的海报那么好看，为什么还不能直接用？","sub":"文字、图片、声音，三种生成各有各的坑","scene":[["n","广场舞队要停练一天，王阿姨想做张漂亮的图发到群里。她让 AI 画了一张：花团锦簇，颜色喜庆。"],["n","发出去五分钟，有人在群里问："],["o","王老师，图上写的是21号，不是12号吗？"],["p","wangayi","哎哟，我光顾着看好不好看了！"],["q","图越好看，越容易让人忘了看字。这一课教你：AI 是怎么“变”出文字、图片和声音的，每一种该盯住什么。"]],"big":"AI 生成文字、图片、声音，用的是不同的路子，但有一条是一样的：**生成的东西只是“像”，不保证“对”**。日期、金额、地址、人名这些要紧的字，要留在你能改、能核的地方。","analogy":{"title":"从毛玻璃后面慢慢对焦","text":"很多生图模型干活，像隔着一块毛玻璃慢慢对焦：一开始只是一团模糊的色块，一步一步变清楚，最后才成了一张图。它是在“对焦出一张像样的图”，不是在“抄一张真照片”。","icon":"🔍"},"steps":[{"life":"先分清：认图、画图、改图","text":"让 AI 读一张照片里的字，是“认图”；凭一句话画一张新图，是“画图”；在原图上换个颜色、去个人，是“改图”。三件事，要检查的东西不一样。"},{"life":"画图：从噪点里“对焦”","text":"很多生图模型用的是[[扩散模型|先学会把一张图逐步加满噪点，再反过来学会从噪点一步步还原出清晰图像的生成方法]]。它画字常常不稳，所以要紧的字别交给它画。"},{"life":"听写：姓名和数字最容易错","text":"[[语音识别|把说话的声音转成文字]]碰到人名、数字、方言，最容易听岔。“十二号”和“十七号”，听起来可没差多少。"},{"life":"朗读：要回头听一遍","text":"[[语音合成|把文字读成人声]]有时会读错多音字、停错地方。“18:00”读成“十八点”还是“下午六点”，你得听一遍才知道。"},{"life":"要紧的字，留在能改的那层","text":"海报上的日期、时间别让 AI 直接画进图里，而是用普通文字叠在图上——错了一改就好，不用重画整张。"}],"demos":[{"type":"denoise","title":"拖动滑块，看一张图怎样从噪点里“对焦”出来","note":"这是**示意动画**：用一张小像素画模拟“逐步去噪”的感觉，不是真实模型的运算过程。"},{"type":"spot","title":"找茬：王阿姨的停练通知","src":"原定资料：10月12日停练一次，10月19日照常 ｜ 联系人：王老师","hint":"点出跟资料对不上的地方。","segs":[["广场舞队通知：",0,"没问题。"],["10月21日停练一次，",1,"日期错了：资料是 10 月 12 日。图片里画出来的字最容易出这种错。"],["10月19日照常。",0,"对得上。"],["雨天另行通知。",1,"资料里没有这句，是 AI 加的。可能是好意，但得王阿姨自己决定加不加。"],["有事找王老师。",0,"对得上。"]]}],"myths":[["AI 画的图是从网上某张照片改出来的","它是从噪点里一步步“对焦”出一张新图，噪点里并没有藏着哪张真照片。也正因为是“生成”的，它不能当现场照片用。"],["会读图的 AI，读出来的字一定准","读图也会认错，特别是手写、反光、模糊的地方。读完要对着原图再看一遍。"],["一个应用啥都会，说明每样都一样准","一个应用背后可能是好几个模型在接力，每一棒的准确度都不一样。"]],"tryit":{"text":"有条件的：用任意 AI 绘图应用，把下面这句原样输进去生成一张图，然后数一数图里的日期、时间、“仅当天”三个信息错了几个。没条件的：找一张真实海报，把所有“必须一字不差”的字圈出来。","prompt":"做一张门店海报：10月12日营业时间10:00—18:00，仅当天调整。","foot":"做完你就明白，为什么要紧的文字要留在能编辑的那一层。"},"take":"图好看不算完，图里的字才是大事。"},{"id":5,"who":"amay","q":"AI 怎么老是答不对我们公司的事？","sub":"不是它笨，是它压根没读过你们的制度","scene":[["n","陈姐问 AI：“我们公司今年年假怎么算？”"],["o","按国家规定，职工累计工作已满 1 年不满 10 年的，年休假 5 天；具体以单位制度为准。"],["p","amay","我问的是我们公司！我们的制度今年刚改过，员工手册里写着呢。"],["n","AI 说的不算错——它说的是“一般情况”。它脑子里装的是训练时读过的海量文字，**你们公司那本员工手册，它从来没见过。**"],["q","这一课讲：怎么把“你的资料”递到它眼前，以及它到底“记得”什么。"]],"big":"AI 回答时只能用两样东西：**训练时学来的一般本事**，和**这次你递给它的资料**。你们公司自己的事，只能靠后者。所以关键不是它聪不聪明，而是你有没有把对的资料递过去。","analogy":{"title":"开卷考试","text":"模型带着学过的本事进考场，你把相关的那几页资料翻开递到它眼前。递对了页，它答得又快又准；递错了页（比如去年的旧制度），答案照样错。","icon":"📖"},"steps":[{"life":"它这次能看到什么","text":"你贴进对话里的文字、上传的文件，叫[[上下文|这次对话里 AI 能看到的全部内容：你说的话、你贴的资料、它前面的回答]]。文件在你电脑里、没上传，它就看不到。"},{"life":"能装得多 ≠ 每页都细读","text":"现在的 AI 一次能装很长的资料，但资料越长，中间某一页越可能被它略过。要紧的那几条，最好单独贴出来。"},{"life":"应用的“记住你”","text":"有的应用会帮你记住偏好，这是[[记忆|应用另外存下来的笔记，下次对话时再拿给模型看]]——不是模型自己变聪明了。记了什么、能不能删，看应用的设置。"},{"life":"给它一个资料柜","text":"把常用资料整理好放在一处，叫[[知识库|你整理好、供 AI 查找的一批资料]]。放进去的每份资料，都要标上日期、来源、是否有效。"},{"life":"先找资料，再回答","text":"AI 先从知识库里找出相关几段，再照着回答，这套做法叫 [[RAG|“检索增强生成”：先查找相关资料，再根据资料生成回答]]。找错了资料，答案也会错。"},{"life":"递小抄 vs 重新上学","text":"补资料像考前递小抄：快，随时换；[[微调|用一批新例子再训练模型，改变它本身的习惯]]像让孩子重新上学：慢、贵。制度、通知这种常变的事，递小抄就够了。"},{"life":"它说“查到了”，先看查到的是什么","text":"让 AI 去别的系统里查，比如会议室预订，它拿回来的可能只是会议室档案：证明这间屋子存在，不说明明天有没有人订。要它说清三件事：查的是谁、拿回来的是什么、能下什么结论。系统没回话，结论只能是“还不知道”。"}],"demos":[{"type":"sort","title":"判断一下：这次对话里，AI 能看到吗？","hint":"假设你在用一个普通的聊天 AI，没有开任何特殊功能。","buckets":["能看到","看不到","要看应用设置"],"items":[["你刚刚贴进对话框的年假制度",0,"贴进来了，就在上下文里。"],["你电脑桌面上那份员工手册（没上传）",1,"文件在你电脑里，不等于 AI 读过。"],["你上周在**另一个对话**里说过“我们部门周五下午开例会”",2,"有的应用有记忆功能会带过来，有的没有。别默认它记得。"],["老板昨天在微信群里说的临时调整",1,"它看不到你的微信群，除非你复制进来。"],["这次对话里它自己前面说过的话",0,"前面的回答也在上下文里——所以它说错的话，后面还可能接着错。"]]}],"myths":[["上传了文件，它就每一页都认真读了","能装下，不等于每页都被好好读。要紧的信息单独贴出来，或者直接问它“第几页怎么说”。"],["“查询成功”就是查到了我要的答案","成功只说明拿回了东西。拿回的是档案还是预订、是哪一天的，要看清楚。"],["想让它懂我们公司，就得训练一个专属模型","大多数公司里的事，递资料（小抄）就够了。常变的事实放资料里，要改它的“脾气”才考虑训练。"]],"tryit":{"text":"把一份你自己的资料（比如请假或报销规定）传进或贴进一个 AI 应用，问它三个问题。记下来：哪几个回答用上了你的资料，哪几个是它凭空发挥的。可以这样要求它：","prompt":"只根据我下面贴的资料回答。每个回答后面注明依据的是资料里哪一句；资料里找不到的，直接说“资料里没有”，不要用常识补。","foot":""},"take":"它没读过你们的制度，资料得你递过去。"},{"id":6,"who":"amay","q":"让 AI 自己去干活，靠谱吗？","sub":"重复的活交出去之前：拆好步骤，写好方法，拴好缰绳","scene":[["n","陈姐试着让一个 Agent 帮她发会议通知：读会议安排表、写通知、发到全员群。"],["n","安排表里，那场会的时间正好空着。Agent 没停——它猜了一个常见的“下午 3 点”，直接群发，然后汇报："],["o","任务已完成 ✅"],["p","amay","谁让你发的？时间还没定呢！"],["q","这次时间碰巧猜对了，可下次呢？这一课讲怎么把重复的活交给 AI：拆步骤、写方法、定规矩。"]],"big":"重复的活交给 AI 之前，先做三件事：**拆成几步，写清每步收什么、交什么；把做法写成一页说明；说清它能动什么、什么时候必须停下来问你。**这几件事说清了，交出去才放心。","analogy":{"title":"一家餐厅的五个岗位","text":"**模型**是厨师：管想、管尝、管判断。**工具**是厨具和传菜口：管动手执行，自己不琢磨。**工作流**是出餐流程单：先冷菜后热菜，每步交什么。**Skill** 是秘籍本：老师傅的手艺写下来，新人照着做。**Agent** 是值班经理：全程盯着，小事按规矩处理，大事打电话问老板。","icon":"🍳"},"steps":[{"life":"从终点倒着推","text":"老周要的是“周五晚上，排班表发到群里”。倒着推：发群之前要有核过的表 → 核之前要有初稿 → 初稿之前要有工时和请假 → ……流程自己就长出来了。"},{"life":"每一步写清收什么、交什么","text":"每一步开始前要拿到的东西叫[[输入|这一步开始前必须拿到的东西]]，做完要交给下一步的叫[[输出|这一步做完要交给下一步的东西]]。要具体：不是“资料准备好了”，而是“本周请假名单（来自微信，周四截止）”。一步一步接起来，就是一条[[工作流|把一件事固定拆成几步，每步写清交什么、接什么]]。"},{"life":"检查点放在后果变重的地方","text":"不用每步都打断你。只在“发到群里”之前、“改了规则”之后这种后果变重的地方，设一个[[检查点|流程里专门停下来核对或等人确认的位置]]。"},{"life":"把做法写成一页说明","text":"反复做的活，把做法写下来给 AI 照着用，这就是[[Skill|一份写好的“这类活怎么干”的说明，AI 下次可以照着做]]。第一句写清管什么、不管什么，再放一个好例子、一个坏例子。写不清“什么时候不管用”的方法会害人。"},{"life":"钥匙只给需要的那几把","text":"能自己看结果、决定下一步、调用工具的 AI，叫[[Agent|能自己看结果、决定下一步、调用工具推进任务的 AI 系统]]。派活时只给它这件活需要的[[权限|允许它使用哪些工具、做哪些动作]]：要写草稿就给“存草稿”，不给“群发”。"},{"life":"汇报点就是缰绳","text":"约好它每干完一步汇报什么：读了什么资料、还缺什么、草稿在哪、在等谁确认。再定好停下来的条件：缺资料、资料打架、准备对外发送、同一步失败 3 次。"}],"demos":[{"type":"order","title":"排一排：老周的每周排班，正确顺序是？","hint":"按顺序依次点击，点错会提示。","steps":["收齐本周请假和工时（截止周四晚）","检查资料齐不齐：缺了就去问，打架就停","让 AI 按规则排出初稿","老周核对：有没有人连上太多天","老周确认周日谁加班","发到店员群里"]},{"type":"sort","title":"你是陈姐：Agent 遇到这些情况，该继续还是停下来问你？","hint":"选完看看解释。","buckets":["让它继续","停下来问我"],"items":[["安排表读到了，四项资料都齐",0,"资料齐了，可以往下写草稿。"],["安排表里这场会的时间是空的",1,"缺关键事实要补问，绝不能猜。"],["草稿写好了，准备发到全员群",1,"发布是后果最重的一步，必须等人确认（何况你只授权了存草稿）。"],["保存草稿时网络断了，这是第 1 次失败",0,"可以有限次重试，并记下原因和次数。"],["同一步已经失败 3 次",1,"到上限就停，汇报原因，别无限重做。"],["两份资料写的会议时间不一样",1,"资料打架要停下来问人以哪份为准。"]]}],"myths":[["Agent 汇报“已完成”，就是完成了","看它的状态记录：读了什么、写了什么、发没发、谁确认的。“已完成”三个字不算证据。"],["用 Agent 一定比不用高级","一次性的简单活，模型＋人就够了。每加一个组件，就多一个可能出故障的地方。"],["写好的方法可以一直用","资料变了、模型升级了、反复出同样的错——这三种情况都该拿出来复测。"]],"tryit":{"text":"给你想交给 AI 的一件多步骤的事，写一段“派活章程”：","prompt":"目标：____（做到什么程度算完成：____）\n你可以用的工具：____；不可以做的事：____\n每做完一步，告诉我：做了什么、结果是什么、下一步打算做什么\n遇到这些情况立刻停下来问我：缺资料、资料打架、准备对外发送、同一步失败 3 次","foot":"先从能撤回的小活开始试。"},"take":"汇报点就是缰绳。"},{"id":7,"who":"wangayi","q":"我不会编程，也能做个自己的小工具吗？","sub":"一张表单 + 几条规则 + 能保存，就是一个工具","scene":[["n","王阿姨每个月要发好几次社区活动通知。每次都从头打：日期、时间、地点、报名截止……上个月还把截止日写在了活动之后。"],["p","wangayi","要是有个东西，我填几个空，它就帮我排好，还能提醒我填错了，那多好。"],["n","这个“东西”，就是一个小工具。它不需要多复杂——**下面这个，你现在就能用。**"]],"big":"第一个工具别奔着“平台”去。一张表单把要填的东西摆明，几条死规则管格式和防错，能保存、能恢复——一件最小的事从头跑通，比规划一个大系统有用得多。","analogy":{"title":"填空式的通知模板","text":"就像学校发的请假条：哪里填名字、哪里填日期都印好了，不会漏；填错了老师一眼就看出来。小工具就是会自己检查的请假条。","icon":"🧰"},"steps":[{"life":"表单：把要填的摆明","text":"每个必填项一个格子，漏填一眼就看得见。"},{"life":"规则：死规矩管格式","text":"“结束时间必须晚于开始时间”“报名截止要早于活动日”——这种死规矩交给程序，一个都不会漏。"},{"life":"AI：只管润色语气","text":"想让语气更亲切？把**核对过的**内容交给 AI 改写，改完粘回来再核一遍。事实以表单为准。"},{"life":"错了马上说","text":"填错了立刻提示，并**清掉旧草稿**——免得上一场活动的草稿被当成这一次的结果。"},{"life":"存下来，再恢复一次","text":"保存之后，真的恢复一次看看对不对，才算验证过。"},{"life":"先想“不顺利”的那条路","text":"新手做工具，往往只设计“一切顺利”。工具成不成熟，不看功能多不多，看它对填错、断网、半路退出有没有准备。"}],"demos":[{"type":"tool","title":"试一试：王阿姨的活动通知小工具","hint":"随便改改，再故意把结束时间填得比开始早、或者把截止日填到活动之后，看它怎么提醒你。保存只存在你这台电脑的浏览器里。"}],"myths":[["做工具一定要会编程","很多 AI 应用能帮你写出这种小工具的代码，你负责说清“要填什么、有什么规则、怎样算对”。"],["功能越多越像样","先跑顺主路，再加功能。每多一个连接，就多管一堆事。"],["格式对了，内容就对了","工具只能保证格式合法；活动是不是真在那天，还得你核。"]],"tryit":{"text":"想做一个属于你的小工具？先别急着找软件，用 AI 把需求理清楚：","prompt":"我想做一个小工具：输入____，输出____。请帮我列出：1. 要填哪些格子；2. 有哪些“填错了要提醒”的规则；3. 最后输出长什么样。先不要写代码，列完问我有没有遗漏。","foot":"需求理清楚了，再请 AI 写一个单文件网页版，在自己电脑上打开试用。"},"take":"先跑通一件小事，再谈自动化。"},{"id":8,"who":"amay","q":"AI 又出错了，从哪查起？","sub":"找到最早出错的那一步，把坑记下来","scene":[["n","陈姐的通知方法用了一个月，一直挺好。直到某天，同事问：“通知没写哪天恢复上班啊？”"],["n","她一看，“10月19日（周一）恢复正常上班”那句没了。资料没换，模型也没换。"],["p","amay","那就把模型、资料、模板全换一遍，总能好吧？"],["n","全换了，确实好了——可到底是哪里坏的，再也说不清了。下次再坏，还得从头猜。"],["q","这一课是结课：教你像整理错题本一样调试，把每个坑都变成以后的路标。"]],"big":"调试就四步：**留住出错现场 → 找到最早出错的那一步 → 一次只改一处 → 改完按原标准再查一遍**。最后，把这个坑记下来。","analogy":{"title":"整理错题本","text":"重点不是把错题抄一遍，而是找到最早开始错的那一步：第 8 题错了，根子可能在第 3 题的概念没通。","icon":"📕"},"steps":[{"life":"先能“重演”出来","text":"“这次不好用”没法查。记下输入、实际结果、本来想要的结果，别人能照着重跑一遍，这叫[[复现|用同样的条件，让同样的问题再出现一次]]。"},{"life":"一层一层往下查","text":"按顺序查：资料 → 模型 → 方法（提示词、Skill）→ 工具 → 流程。找到**第一个**跟预期不一样的地方。"},{"life":"一次只改一处","text":"一下改三处，好了也不知道是哪处起的作用。一次改一处，效果才说得清。"},{"life":"留后路","text":"每次改动记三样：什么引发的、改了哪里、怎么验证的。改坏了能[[回退|退回到上一个能用的版本]]。"},{"life":"什么时候该复测","text":"三种情况一定要拿老任务重跑：模型升级、资料变更、同样的错反复出现。"},{"life":"效果看“能用的成果”","text":"别数“用了多少次 AI”，数“最后能用的有几条、花了多久”。"}],"demos":[{"type":"order","title":"排一排：陈姐该怎么查“恢复那句没了”？","hint":"按顺序依次点击。","steps":["用同一份资料重跑，确认问题能重现","对照检查：资料里有“19日恢复”吗？（有）","再查方法：上次改的方法里，是不是删掉了“必留恢复安排”这条？","只改这一处：把“必留恢复安排”加回去","按四项重新检查：日期、时间、范围、恢复安排","把这个坑记进错题本：现象、原因、改法、以后怎么防"]}],"myths":[["换了模型就好了，说明原来的模型太弱","你同时换了模型、资料、模板，根本分不清是哪个起了作用。"],["修好就完了","修好之后要按原标准再查一遍，还要把这个坑记下来，下次才不会再掉进去。"],["出错说明 AI 不能用","出错是常态。会调试的人，每踩一个坑，方法就更结实一点。"]],"tryit":{"text":"还记得第 1 课让你存下的那次提问吗？把它翻出来。同一个任务，现在的你会怎么问、怎么查、怎么留档？把前后两份放在一起——**这份对比，就是你这门课的成绩单。**","prompt":"【错题本】\n日期：____\n我问了什么：____\nAI 答了什么：____\n错在哪（最早出错的一步）：____\n我改了什么（只改一处）：____\n改完怎么验证的：____\n以后怎么防：____","foot":"AI 给你挖的每个坑都值得记下来。三个月后翻这本错题本，它会比任何教程都好用。"},"take":"踩过的坑别扔，留着当教材。"},{"id":9,"who":"wangayi","q":"AI 怎么突然就会聊天了？","sub":"七十年的故事，讲成三个你见过的东西","scene":[["p","wangayi","我们以前单位那台电脑，干什么都得按菜单，按错一步就从头来。现在这个 AI，怎么跟人一样能聊天了？"],["n","王阿姨问得特别好。很多人以为 AI 是这两年才冒出来的，其实从 1956 年那个夏天算起，它已经整整七十年了。它只是换了好几次“学本事”的方法。"],["q","弄明白它是怎么一步步变过来的，你就知道：为什么老办法不灵了，新办法该怎么用。"]],"big":"AI 的变化，说到底是**学本事的方法**变了：从“人把规矩写死”，到“看例子自己找规律”，再到“读海量文字学会接话”。方法一变，用法就得跟着变。","analogy":{"title":"三个你都见过的东西","text":"**自动售货机**：按哪个键出哪罐，全是人事先定好的——这是规则系统。**认熟客的老店员**：没人教他规则，上千张脸看下来自己就会了——这是机器学习。**厨师学徒**：先练刀工、再练火候，一层一层往上学——这是深度学习。","icon":"🏪"},"steps":[{"life":"自动售货机时代","text":"[[规则系统|人把“遇到什么就怎么办”一条条写死，机器照着执行]]：可靠、好查，但规则没写到的情况，它就傻眼。王阿姨单位那台按菜单的电脑，就是这个路子。"},{"life":"老店员时代","text":"[[机器学习|不写规则，给机器看大量例子，让它自己总结规律]]：比如看过几万封垃圾邮件，它就会自己认垃圾邮件了。"},{"life":"厨师学徒时代","text":"[[深度学习|一种机器学习方法，把很多层计算叠起来，一层学一点，越往上学得越抽象]]：认图、听声音的本事，就是这么一层层练出来的。"},{"life":"会接话的时代","text":"2017 年一篇论文提出了一种新结构叫 Transformer，后来的聊天 AI 大多建在它上面；2022 年底 ChatGPT 上线，普通人第一次能一句一句追着改稿。这些就是你今天用的[[大模型|读过海量文字、能接着你的话往下写的大型 AI 模型]]。（原论文见本篇末尾「想深挖再看」）"}],"demos":[],"myths":[["AI 是这两年才发明的","“人工智能”这个说法 1956 年就有了。这两年变的是：普通人能直接跟它聊天了。"],["新版本一出，旧经验全作废","不会全作废，但值得**拿老任务重新试一遍**：以前要绕三道弯的事，现在可能一句话就行。"],["发布会上演示能做到，我就一定能做到","发布会证明的是“在那个场景下能做到”。你的活能不能做，得拿你自己的活试。"]],"tryit":{"text":"找一件你一年前用 AI 试过、但效果不好的事，今天原样再问一遍，看看有什么变化。没试过的，可以照这句问：","prompt":"请用三个生活里的比方，给一位退休老师讲讲：以前的电脑程序和现在的聊天 AI，最大的区别是什么？最后提醒一句，哪些地方还得人来把关。","foot":""},"take":"工具换了，用法就得跟着换一遍。"},{"id":10,"who":"xiaolin","q":"AI 是怎么“想”出一句话的？","sub":"其实它在玩一个你从小就会的游戏：接龙","scene":[["n","先玩个游戏。我说——"],["o","今天天气真____"],["n","你脑子里是不是已经蹦出“好”了？刚才那一瞬间你干的事，就是大模型一整天在干的事：**猜下一个词**。"],["p","xiaolin","那它跟我说得头头是道，是因为它“懂”吗？"],["n","小林问到点子上了。答案有点反直觉：它不是在“回答”你，它是在**接你的话**——接得特别顺而已。"]],"big":"大模型写字，就是一遍遍地问自己：“接在这后面，哪个词最顺？”挑一个接上，再问下一个。**接得顺，不等于说得对。**","analogy":{"title":"一个读过无数书的接龙高手","text":"你给它半句话，它凭读过的海量文字，猜出最顺的下一个词。它读过很多通知，所以很会写通知的“样子”；可你家几点开门，书里没写过。","icon":"🔗"},"steps":[{"life":"先把字切成小积木","text":"它不是一个字一个字读的，而是把句子切成一块块[[Token|AI 处理文字时切出来的小块，一块可能是一个字、半个词或一个词]]。就像拼积木，一块不一定正好是一个字。"},{"life":"给每块积木记个坐标","text":"每块积木会变成一串数字，叫[[向量|用一串数字表示一个词的意思，意思相近的词数字也相近]]。“开门”和“营业”的坐标挨得近，“开门”和“香蕉”离得远。"},{"life":"算出下一块接什么","text":"它给每个候选词打一个“顺不顺”的分，挑分高的接上。这一步叫[[预测下一个词|根据前面的内容，算出接下来哪个词最可能出现]]。"},{"life":"边读边“偏心”","text":"一桌人同时说话，你总能听见喊你名字的那个人。它读句子也会把注意力多分给相关的词，这叫[[注意力机制|模型读句子时，自动多看和当前位置更相关的词]]。"},{"life":"本事是“刷题”刷出来的","text":"它的本事来自[[训练|让模型做海量接龙练习，猜错一点就调一点内部数值的过程]]——练完就定型了。你平时跟它聊天，它并没有因此变聪明。"}],"demos":[{"type":"nextword","title":"亲手当一回大模型：给这句话接下一个词","note":"下面的候选词和分数都是**教学示意**，不是任何真实模型算出来的。","stages":[{"ctx":"营业时间为","cands":[["10:00",34],["每天",26],["上午",18],["周一至周日",12],["待定",10]]},{"ctx":"（补了一句资料：本店10月12日营业时间为10:00—18:00）营业时间为","cands":[["10:00",82],["上午",9],["每天",5],["待定",4]]}],"lesson":"没给资料时，“10:00”只是**最顺**，不代表是真的；补上资料后，最顺的那个才恰好也是对的。**资料决定它能不能接对。**"}],"myths":[["AI 在一个大数据库里查答案","它不是在查，而是在“接”：根据读过的文字，算出最顺的下一句。所以它能写出数据库里根本没有的话——包括编的。"],["一个 Token 就是一个汉字","不一定。一块可能是一个字，也可能是半个词、一个词；不同的 AI 切法还不一样。"],["我跟它聊得越多，它就学得越聪明","平时聊天不会改它的本事。它记得你刚说的名字，只是这次对话里的“临时便条”。"]],"tryit":{"text":"打开任意 AI 应用，输入下面这半句，让它接三次，看三次一样吗？再补一句资料重问，看看变化：","prompt":"营业时间为","foot":"第二次加上：“本店10月12日营业时间为10:00—18:00。”"},"take":"AI 不是在回答你，是在接你的话茬。"}],"cast":{"wangayi":{"name":"王阿姨","av":"👩‍🏫","tag":"63岁 · 退休语文老师","desc":"社区活动的主力，手机玩得挺熟，就是一看见看不懂的界面就缩手。群里发通知前总要问一句：“这样写行吗？”"},"laozhou":{"name":"老周","av":"👨‍🍳","tag":"48岁 · 面馆老板","desc":"面馆开了十二年，算账飞快，打字用一根手指。嘴上说“搞那些花里胡哨的干嘛”，外卖平台倒学得比谁都快。标准只有一条：能省事就行。"},"xiaolin":{"name":"小林","av":"👨‍🎓","tag":"22岁 · 大四学生","desc":"简历投了一堆没回音。AI 用得比谁都多，却从不多看一眼结果，口头禅是“它说的应该没问题吧”。"},"amay":{"name":"陈姐","av":"👩‍💼","tag":"41岁 · 公司行政主管","desc":"公司要求“人人会 AI”，可没人教怎么用。管通知、制度、新人入职和报销，最怕出了错说不清责任，发任何东西之前都要“先对一遍再发”。"}}};

function ic(n){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+IC[n]+'</svg>'}

function fmt(text){
  let h=esc(text);
  h=h.replace(/（打比方，帮助理解）/g,'<span class="analogy">打比方 · 帮助理解</span>');
  h=h.replace(/(https?:\/\/[^\s，。)）]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return h;
}
/* 段落分类 */
function classify(blocks){
  return blocks.map(t=>{
    const s=t.trim();
    if(s.startsWith('【现场跑一次｜选做】'))return{type:'demo',text:s.replace('【现场跑一次｜选做】','').trim()};
    if(s.startsWith('演示结果因模型'))return{type:'demof',text:s};
    if(s.startsWith('一句话记住：'))return{type:'quote',text:s.slice(6)};
    if(s.startsWith('举个例子：'))return{type:'ex',label:'举个例子',text:s.replace('举个例子：','')};
    if(s.startsWith('你也可以试试：'))return{type:'try',label:'你也可以试试',text:s.replace('你也可以试试：','')};
    if(s.startsWith('多练一次：'))return{type:'try',label:'多练一次',text:s.replace('多练一次：','')};
    if(s.startsWith('留意：'))return{type:'warn',label:'留意',text:s.replace('留意：','')};
    return{type:'plain',text:s};
  });
}
function miniCard(cls,label,icon,text){
  return '<div class="mini '+cls+'"><div class="mi">'+ic(icon)+'</div><div><div class="mt">'+label+'</div><div class="mb">'+fmt(text).replace(/\n/g,'<br>')+'</div></div></div>';
}
/* 流式渲染节点：plain第一个为lead，其余进折叠 */
function renderNodes(nodes){
  let h='',more=[],leadDone=false,penDemo=null;
  const flushDemo=()=>{if(penDemo){h+=demoCard(penDemo.text,penDemo.foot);penDemo=null}};
  for(const n of nodes){
    if(n.type==='demof'){penDemo={text:penDemo?penDemo.text:'',foot:n.text};continue}
    if(n.type==='demo'){flushDemo();penDemo={text:n.text,foot:''};continue}
    flushDemo();
    if(n.type==='quote'){h+='<div class="quote"><span class="lab">一句话记住</span><div class="q">'+esc(n.text)+'</div></div>';continue}
    if(n.type==='ex'){h+=miniCard('ex',n.label,'bulb',n.text);continue}
    if(n.type==='try'){h+=miniCard('try',n.label,'tryi',n.text);continue}
    if(n.type==='warn'){h+=miniCard('warn',n.label,'alert',n.text);continue}
    if(!leadDone){h+='<div class="lead">'+fmt(n.text).replace(/\n/g,'<br>')+'</div>';leadDone=true}
    else more.push(n.text);
  }
  flushDemo();
  if(more.length){
    h+='<details class="more"><summary>展开细讲</summary><div class="morebd">'
      +more.map(t=>'<div class="para">'+fmt(t).replace(/\n/g,'<br>')+'</div>').join('')+'</div></details>';
  }
  return h;
}
function demoCard(text,foot){
  return '<div class="demo"><span class="dtag">'+ic('play')+'现场跑一次 · 选做</span><div class="lead" style="margin:0;font-size:15.5px">'+fmt(text)+'</div>'+(foot?'<div class="foot">'+esc(foot)+'</div>':'')+'</div>';
}
function origDetails(nodes){
  if(!nodes.length)return'';
  return '<details class="more" style="margin-top:14px"><summary>本页原文</summary><div class="morebd">'
    +nodes.map(n=>{
      if(n.type==='quote')return'<div class="para"><b>一句话记住：</b>'+esc(n.text)+'</div>';
      return'<div class="para">'+fmt(n.text).replace(/\n/g,'<br>')+'</div>';
    }).join('')+'</div></details>';
}
function coverArt(c,seed){
  let nodes='';
  for(let i=0;i<6;i++){
    const a=i*60*Math.PI/180,r=82;
    nodes+='<circle cx="'+(100+r*Math.cos(a)).toFixed(1)+'" cy="'+(100+r*Math.sin(a)).toFixed(1)+'" r="4.5" fill="'+c+'" opacity="'+(0.35+i*0.1)+'"/>';
    nodes+='<line x1="100" y1="100" x2="'+(100+r*Math.cos(a)).toFixed(1)+'" y2="'+(100+r*Math.sin(a)).toFixed(1)+'" stroke="'+c+'" stroke-width="0.6" opacity="0.16"/>';
  }
  return '<svg width="210" height="210" viewBox="0 0 200 200">'
    +'<defs><radialGradient id="g'+seed+'"><stop offset="0%" stop-color="'+c+'" stop-opacity="0.5"/><stop offset="100%" stop-color="'+c+'" stop-opacity="0"/></radialGradient></defs>'
    +'<circle cx="100" cy="100" r="86" fill="none" stroke="'+c+'" stroke-width="1" opacity="0.3"/>'
    +'<circle cx="100" cy="100" r="62" fill="none" stroke="'+c+'" stroke-width="0.8" opacity="0.2" stroke-dasharray="3 5"/>'
    +'<circle cx="100" cy="100" r="46" fill="url(#g'+seed+')"/>'
    +'<circle cx="100" cy="100" r="20" fill="none" stroke="'+c+'" stroke-width="1.4" opacity="0.8"/>'
    +'<circle cx="100" cy="100" r="7" fill="'+c+'"/>'
    +nodes+'</svg>';
}

function pageHtml(les,pg,c){
  const nodes=classify(pg.b);
  const sid=stageOf(les.id), stg=DATA.stages[sid];
  /* 封面页 */
  if(pg.n===1){
    const hook=nodes.find(n=>n.type==='plain');
    return '<div class="cover" style="--sc:'+c+';position:relative">'
      +'<div class="cl">'
      +'<div class="goal">'+esc(pg.f[0]||'')+'</div>'
      +(hook?'<div class="hook">'+fmt(hook.text)+'</div>':'')
      +'</div>'
      +'<div class="cr">'+coverArt(c,les.id)+'</div></div>'
      +renderNodes(nodes.filter(n=>n!==hook));
  }
  /* 验收四点 */
  if(pg.t==='完成后检查这四点'){
    const score=nodes.find(n=>n.type==='plain'&&n.text.includes('每项0—2分'));
    let h='<div class="grid2">'+pg.f.map((f,i)=>'<div class="gcard"><span class="gn">0'+(i+1)+'</span><span class="gb">'+esc(f)+'</span></div>').join('')+'</div>';
    if(score)h+='<div class="pill">'+ic('flag')+'<b>评分</b>'+esc(score.text)+'</div>';
    h+=origDetails(nodes.filter(n=>n!==score));
    return h;
  }
  /* 记住这两件事 */
  if(pg.t==='记住这两件事'){
    let h='<div class="grid2">'+pg.f.map((f,i)=>'<div class="gcard"><span class="gn">0'+(i+1)+'</span><span class="gb">'+esc(f)+'</span></div>').join('')+'</div>';
    h+=renderNodes(nodes);
    return h;
  }
  /* 术语 */
  if(pg.t==='几个容易混淆的词'){
    let h='',terms=[],rest=[];
    const first=nodes.find(n=>n.type==='plain');
    if(first){
      first.text.split('\n').forEach(l=>{const m=l.match(/^(.+?)：(.+)$/);if(m)terms.push([m[1],m[2]])});
      nodes.forEach(n=>{if(n!==first)rest.push(n)});
      if(!terms.length)rest.push(first);
    } else rest=nodes;
    if(terms.length)h+='<div class="term2">'+terms.map(t=>'<div class="tcard"><b>'+esc(t[0])+'</b><span>'+esc(t[1])+'</span></div>').join('')+'</div>';
    h+=renderNodes(rest);
    h+=origDetails(first&&!terms.length?[]:[first]);
    return h;
  }
  /* 参考资料 */
  if(pg.t.includes('参考资料')){
    let h='',cards=[],pend=null;
    nodes.forEach(n=>{
      if(n.type!=='plain')return;
      const t=n.text;
      if(/^https?:\/\//.test(t)){if(pend){pend.url=t;cards.push(pend);pend=null}return}
      if(t.startsWith('本课取材于')){if(cards.length)cards[cards.length-1].note=t;return}
      if(t.includes('核查日期')){h+='<div class="pill">'+ic('pin')+'<b>核查日期</b> '+esc(t.replace('原论文和官方资料用于解释技术，个人分享提供实践思路。','').replace(/^\s*核查日期[：:]?\s*/,''))+'</div>';return}
      if(t.startsWith('原论文和官方资料')){h+='<div class="lead" style="font-size:15px;color:var(--muted)">'+fmt(t)+'</div>';return}
      if(t.startsWith('读法提示')){h+=miniCard('ex','读法提示','bulb',t.replace('读法提示：',''));return}
      pend={title:t,url:'',note:''};
    });
    if(pend)cards.push(pend);
    h+=cards.map(cd=>'<div class="src"><div class="si">'+ic('book')+'</div><div><div class="st">'+esc(cd.title)+'</div>'
      +(cd.url?'<div class="su"><a href="'+cd.url+'" target="_blank" rel="noopener">'+esc(cd.url)+'</a></div>':'')
      +(cd.note?'<div class="sn">'+esc(cd.note)+'</div>':'')+'</div></div>').join('');
    return h;
  }
  /* 普通页 */
  let h='';
  if(pg.f.length)h+='<div class="focus"><div class="fi">'+ic('pin')+'</div><div class="fl">'+pg.f.map(esc).join('<br>')+'</div></div>';
  h+=renderNodes(nodes);
  return h;
}

const DN_ART=["................","..........YY....",".........YYYY...",".........YYYY...","..........YY....","......RR........",".....RRRR.......","....RRRRRR......","...RRRRRRRR.....","....WWWWWW......","....WBWWDW......","....WWWWDW......","....WWWWDW......","GGGGGGGGGGGGGGGG","GGGGGGGGGGGGGGGG","GGGGGGGGGGGGGGGG"];
const DN_COL={'.':[150,200,240],'Y':[250,200,60],'R':[205,70,60],'W':[245,235,215],'B':[90,150,220],'D':[130,85,50],'G':[90,170,90]};
function dnRand(seed){let x=Math.sin(seed)*10000;return x-Math.floor(x)}
function dnDraw(k,step){
  const c=document.getElementById('w'+k+'c'); if(!c)return;
  const g=c.getContext('2d'), img=g.createImageData(16,16), a=step/10;
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const t=DN_COL[DN_ART[y][x]], o=(y*16+x)*4;
    for(let ch=0;ch<3;ch++){const n=dnRand(y*97+x*13+ch*7)*255;img.data[o+ch]=Math.round(n*(1-a)+t[ch]*a)}
    img.data[o+3]=255;

function calcRun(k){

  const A=one('a'),B=one('b'), o=document.getElementById('w'+k+'o'); if(!o)return;
  const better=A.cost<=B.cost?'A':'B';
  o.innerHTML='<div>应用 A：每条能用的结果约 <b>'+A.cost.toFixed(2)+'</b> 元<br><span style="color:var(--faint)">其中你要花 '+A.mins.toFixed(0)+' 分钟</span></div>'

function copyRaw(t,btn){

function glossOf(s){

function avatar(key,size){
  if(CG_AV[key]){AVN++;const s=size||48;return '<img class="avt avt-cg" style="--bd:-'+((AVN*0.73)%5).toFixed(2)+'s;border-radius:50%;object-fit:cover;flex:none" width="'+s+'" height="'+s+'" src="'+CG_AV[key]+'" alt="" aria-hidden="true">';}

function scribble(){return '<svg class="scrib" viewBox="0 0 300 16" preserveAspectRatio="none" aria-hidden="true"><path d="M3 11C60 3 120 4 170 8s90 3 127-4" stroke="var(--sc)" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M40 14c50-5 120-6 200-3" stroke="var(--sc)" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/></svg>'}

/* ================= v6：杂志式故事页 ================= */
const STAGE_EN=['GET STARTED','USE IT WELL','HAND IT OFF','APPENDIX'];
const pad2=n=>String(n).padStart(2,'0');
function hq(q){
  let m=q.match(/^(.*?)(“[^”]+”)(.*)$/);
  if(m)return esc(m[1])+'<span class="hl6">'+esc(m[2])+'</span>'+esc(m[3]);
  const i=q.lastIndexOf('，');
  if(i>0)return esc(q.slice(0,i+1))+'<br><span class="hl6">'+esc(q.slice(i+1))+'</span>';
  const t=q.replace(/[？?]$/,''), k=Math.max(0,t.length-5);
  return esc(t.slice(0,k))+'<span class="hl6">'+esc(t.slice(k))+'</span>'+esc(q.slice(t.length));
}
function secH(n,label,en){return '<div class="sh6"><span class="sn">'+pad2(n)+'</span><span class="sl">'+label+'</span>'+(en?'<span class="se">'+en+'</span>':'')+'</div>'}
function flowDiagram(steps){
  return '<div class="flow6" style="--n:'+steps.length+'">'+steps.map((x,i)=>'<div class="fn"><span class="fc">'+(i+1)+'</span><span class="ft">'+sfmt(x.life)+'</span></div>').join('')+'</div>';
}
function goStory(id,keep){
  const s=S(id), les=L(id), sid=stageOf(id), who=CAST[s.who], st=DATA.stages[sid];
  cur={v:'story',l:id}; story[id]=1; saveS(); W={}; wid=0;
  document.body.dataset.stage=sid;
  $('#bar i').style.width=((id-1)/NL*100+100/NL*0.3)+'%';
  let h=tabs(id,'s');
  h+='<header class="hero6"><div class="hl"><div class="tagrow"><span class="stk">'+(id>NMAIN?'APPENDIX':'LESSON '+pad2(id))+'</span><span class="stg6">'+esc(st.t)+'</span><span class="lt">'+esc(les.title)+'</span></div>'
    +'<h2 class="hq">'+hq(s.q)+'</h2><div class="hsub"><span>'+sfmt(s.sub)+'</span>'+scribble()+'</div>'
    +'<div class="who6">'+avatar(s.who,54)+'<div><b>这节课的主角：'+esc(who.name)+'</b></div></div></div>'
    +'<div class="hr"><div class="bignum6">'+pad2(id)+'</div>'+illus(id)+'</div></header>';
  /* 01 场景 */
  let sc='<div class="scene6"><div class="sside">'+avatar(s.who,84)+'<span class="tape">场景</span><b>'+esc(who.name)+'</b><small>'+esc(who.tag)+'</small></div><div class="smain">';
  s.scene.forEach(l=>{
    if(l[0]==='n')sc+='<p class="sn6">'+sfmt(l[1])+'</p>';
    else if(l[0]==='o')sc+='<div class="msg6"><span class="mi">💬</span><span class="mb">'+sfmt(l[1])+'</span></div>';
    else if(l[0]==='p'){const p=CAST[l[1]];sc+='<div class="say6">'+avatar(l[1],40)+'<div class="sb"><i>'+esc(p.name)+'</i>'+sfmt(l[2])+'</div></div>'}
    else if(l[0]==='q')sc+='<div class="ask6"><span class="qmk">?</span><div>'+sfmt(l[1])+'</div></div>';
  });
  sc+='</div></div>';
  h+='<section class="blk">'+secH(1,'你可能也遇到过','THE SCENE')+sc+'</section>';
  /* 02 一句话说透 */
  h+='<section class="blk">'+secH(2,'一句话说透','THE BIG IDEA')+'<blockquote class="pq6"><span class="qo">“</span><div class="pqt">'+sfmt(s.big)+'</div><span class="qc">”</span></blockquote></section>';
  /* 03 打比方 */
  h+='<section class="blk">'+secH(3,'打个比方','ANALOGY')+'<div class="an6"><div class="ani"><span class="blob">'+s.analogy.icon+'</span><span class="stick">打个比方</span></div><div class="ant"><h4>'+sfmt(s.analogy.title)+'</h4><p>'+sfmt(s.analogy.text)+'</p></div></div></section>';
  /* 04 拆开看看 */
  h+='<section class="blk">'+secH(4,'拆开看看','STEP BY STEP')+'<div class="dgl">一图看懂</div>'+flowDiagram(s.steps)
    +'<div class="steps6">'+s.steps.map((x,i)=>'<div class="st6 '+(i%3===0?'v1':i%3===1?'v2':'v3')+'"><span class="dg">'+pad2(i+1)+'</span><div><h4>'+sfmt(x.life)+'</h4><p>'+sfmt(x.text)+'</p></div></div>').join('')+'</div>'
    +'<div class="tip6">带<span class="term" style="pointer-events:none"><b>下划虚线</b></span>的是新名词，后面紧跟一句大白话解释；点一下可以收起。</div></section>';
  /* 05 互动 */
  if(s.demos.length)h+='<section class="blk">'+secH(5,'亲手点一点','HANDS ON')+s.demos.map(widget).join('')+'</section>';
  /* 06 误会 */
  h+='<section class="blk">'+secH(6,'常见误会','MYTH vs FACT')+mythHtml(s.myths)+'</section>';
  /* 07 试一次 */
  const pk=nid({prompt:s.tryit.prompt});
  h+='<section class="blk">'+secH(7,'现在就试一次','TRY IT NOW')+'<div class="tk6"><div class="stub"><span>动手</span><span>TRY</span></div><div class="tkb"><div class="tkt">'+sfmt(s.tryit.text)+'</div><div class="pbox"><button class="btn cp" onclick="copyText(this,'+pk+')">复制</button>'+esc(s.tryit.prompt)+'</div>'+(s.tryit.foot?'<div class="note">'+sfmt(s.tryit.foot)+'</div>':'')+'</div></div></section>';
  /* 08 小测 */
  const gl=glossOf(s);
  if(gl.length)h+='<section class="blk">'+secH(9,'本课名词小抄','GLOSSARY')+'<dl class="gl6">'+gl.map(g=>'<div><dt>'+esc(g[0])+'</dt><dd>'+esc(g[1])+'</dd></div>').join('')+'</dl></section>';
  h+='<div class="take6"><div class="tkl">带走一句话 · TAKEAWAY</div><div class="tkq"><span class="qo">“</span>'+esc(s.take)+'<span class="qc">”</span></div>'+scribble()

function parts9(){
  const all=[...document.querySelectorAll('#content .hero6, #content section.blk, #content .take6')];
  return all.filter(e=>!all.some(o=>o!==e&&o.contains(e)));
}
function step9(d){
  if(!cur||cur.v!=='story') return;
  const ps=parts9(); if(!ps.length) return;
  const H=innerHeight, Y=scrollY, top=e=>e.getBoundingClientRect().top+Y-(e.classList.contains('hero6')?0:70);
  let i=0; ps.forEach((e,k)=>{if(e.getBoundingClientRect().top<=90)i=k});
  const r=ps[i].getBoundingClientRect();
  let y;
  if(d>0){
    if(H+Y>=document.documentElement.scrollHeight-4){ if(cur.l<NL) goStory(cur.l+1); return; }
    const nx=ps[i+1];
    y=r.bottom>H+8?Math.min(Y+H*.8,nx?top(nx):Infinity):(nx?top(nx):Y+H*.8);
  }else{
    if(Y<4){ if(cur.l>1) goStory(cur.l-1); return; }
    y=r.top<62?Math.max(Y-H*.8,top(ps[i])):(i>0?Math.max(top(ps[i-1]),Y-H*.8):0);
  }
  y=Math.max(0,Math.min(y,document.documentElement.scrollHeight-H));
  if(Math.abs(y-Y)<4){ if(d>0&&cur.l<NL) goStory(cur.l+1); else if(d<0&&cur.l>1) goStory(cur.l-1); return; }
  window.scrollTo({top:y,behavior:'instant'});
}
