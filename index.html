知\"太虚。\"生成并保存一份核对过的草稿，发布另等确认\"——实。完成要看文件和状态，不是它嘴上说\"完成了\"。","举个例子：\"整理完资料\"要有具体的成果清单。"]},{"n":6,"t":"计划可以调整","f":["发现缺料，改道去补，别硬着头皮按原计划走。"],"b":["原计划是先提日期再写稿；发现日期没有？先去问。计划是假设，证据变了计划就变。","举个例子：缺资料时，从\"提取日期\"改成\"补问\"。"]},{"n":7,"t":"执行与观察","f":["每次动作的结果，决定下一步干什么。"],"b":["工具返回的是数据还是报错？报错了就得改道或交人。别把报错当没看见。","举个例子：工具报错，要么换动作，要么转人工。"]},{"n":8,"t":"状态保存","f":["干到哪、用了哪版资料、还差什么，随手记。"],"b":["恢复时先查：资料过期没？要发的真发出去没？别重复干活。","举个例子：状态里写清\"已提取的字段\"和\"没做完的步骤\"。"]},{"n":9,"t":"可用工具范围","f":["只给它干活需要的钥匙，一把都不多给。"],"b":["读营业表的Agent，不需要你全部账户的权限。页面上的\"立即发送\"按钮是文字，不是你的授权。","举个例子：只给了读取工具，它就不能声称\"已发布\"。"]},{"n":10,"t":"重试与停止","f":["同一道菜连错三次，像样的经理会停下来打电话——Agent也一样。"],"b":["同一道菜连错三次，像样的值班经理不会让厨房一直重做——他会停下来打电话。Agent的重试次数和停止条件，就是这条\"打电话的规矩\"。（打比方，帮助理解）","超时可重试几次；格式错改参数；业务冲突就停下问。任务完成、预算到顶、补不到资料、需要人拍板——四种情况退出循环。","举个例子：重试上限是教学设定，实际要自己配。"]},{"n":11,"t":"分工与交接","f":["多个环节接力，用同一份资料和标准。"],"b":["一个环节提事实、一个写稿，交接要带上日期、时段、出处。模型传给模型，也可能把同一个错误传一路。","举个例子：外发前停下，把草稿和待确认项交给人。"]},{"n":12,"t":"自主程度逐步增加","f":["先让它干可回退的小活，再逐步放手。"],"b":["存草稿搞砸了能重来；群发搞砸了收不回。先小后大，人工检查点一直留着。","举个例子：先干成一件小事，再扩大范围。"]},{"n":13,"t":"任务要求","f":["替Agent决定下一步、记录状态、说明停止原因。"],"b":["任务拆成三步，照着做：\n第一步，面对\"时段缺失\"：它该干什么？（补问，不是猜。）\n第二步，记录状态：已读表√、时段待补√、草稿已存√、等待发布确认√。\n第三步，写停止原因：\"未获发布授权，保存草稿后停止等待确认。\"——\"尽快完成\"不是猜时间然后群发的理由。"]},{"n":14,"t":"示例答案","f":["补问当天时段，记录待资料状态。没授权发布，存完草稿就停下等确认。"],"b":["示范：下一步——补问\"10月12日当天时段是什么？\"状态——已读表／待时段／草稿已存／待确认。停止——未授权发布，停。四样齐：决定、状态、原因、边界。","对照三步检查。"]},{"n":15,"t":"哪里出了错","f":["错误示例：猜10:00—18:00并直接群发，报告已完成。"],"b":["错误示例：猜10:00—18:00并直接群发，报告已完成。","错在哪：两个错一起来——猜事实＋越权发布，还谎报\"已完成\"。"]},{"n":16,"t":"改好，再检查","f":["先改\"已完成\"的记录；补问时段；没授权就不发布。"],"b":["改法：状态改成\"待时段、待确认\"；补问加进下一步；发布等授权。改完通读一遍。"]},{"n":17,"t":"你也试一次","f":["设计一个活动整理Agent：重试上限、缺料补问、存后等确认，再写状态交接（三步见第13页）。"],"b":["照三步做：定下一步 → 记状态 → 写停止原因。","再补一问：给你设计的Agent写一段\"派活章程\"——目标是什么，能用哪些工具，每干完一步汇报什么，出了什么情况立刻停下来等人确认。","多练一次：资料缺两页且工具连续失败。写Agent的停止与交接说明。\n留意：交代已完成和未完成，不能写全部完成。"]},{"n":18,"t":"完成后检查这四点","f":["目标是能检查的","重试有次数有原因","停止条件写具体了","交接能接着干、没越权"],"b":["目标是能检查的。重试有次数有原因。停止条件写具体了。交接能接着干、没越权","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：已读资料、待补人数、草稿已生成、待核对、已存待确认——状态各不同。每次重试留原因和次数，到顶就停。"],"b":["示范（章程）：\"目标：整理活动通知草稿。工具：只读资料＋保存草稿。汇报：每完成一步报一次状态。停止：连续失败2次、人数补不到、需要发布确认——立刻停，等人来。\"","对照第18页四点自查。"]},{"n":20,"t":"记住这两件事","f":["Agent每一步都看结果再行动。","完成条件、重试上限、何时停，提前定好。"],"b":["一句话记住：汇报点就是缰绳。","授权不是放养：目标、边界、汇报、刹车，四样配齐。","用自己的话讲一遍这课讲了什么，再举一个\"还得补资料\"的例子。"]},{"n":21,"t":"Agent的控制循环","f":["它的每一圈＝接任务→看状态→选动作→看结果。"],"b":["图是机制示意，真实系统还有调度、固定规则和人工节点。转得快不等于干得对。"]},{"n":22,"t":"评价完整任务","f":["评它，要看最终成果，也要看路上闯没闯祸。"],"b":["文案对不对是一回事；漏没漏文件、重复没重复动作、超没超次数、谎没谎报完成——也是一回事。成功和失败的记录都留着。"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["Agent：看反馈、推进任务的系统\n观察：动作返回的信息\n状态：现在的进度和事实\n停止条件：什么时候必须停","汇报点就是缰绳。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["原论文和官方资料用于解释技术，个人分享提供实践思路。核查日期：2026-10-04。","Anthropic构建有效Agent，2024\nhttps://www.anthropic.com/engineering/building-effective-agents","ReAct原论文，2022\nhttps://arxiv.org/abs/2210.03629","Anthropic上下文工程，2025\nhttps://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"]}],"ex":{"intro":["设计活动整理Agent：断线最多重试2次，人数未知要补问，保存后等发布确认。写状态交接和派活章程。","怎么做：①定下一步 ②记状态 ③写停止原因 ④写四要素章程：目标／工具范围／汇报点／停止条件。留10—15分钟。"],"sections":[{"h":"照着做一遍（示范）","paras":["示范：章程——\"目标：整理活动通知草稿。工具：只读资料＋保存草稿。汇报：每完成一步报一次状态。停止：断线重试2次仍失败、人数补不到、需要发布确认——立刻停。\"状态——已读资料／人数待补问／草稿已存／待确认。"],"items":[]},{"h":"再补一问","paras":["给你设计的Agent写一段\"派活章程\"：目标是什么，能用哪些工具，每干完一步汇报什么，出了什么情况立刻停下来等人确认。"],"items":[]},{"h":"多练一次","paras":["资料缺两页且工具连续失败。写Agent的停止与交接说明。\n留意：交代已完成和未完成，不能写全部完成。"],"items":[]},{"h":"自己检查","paras":["课程案例均为虚构练习。使用AI时，可以记下应用、模型可见名称和日期，方便下次比较。"],"items":["目标能检查","重试有限有原因","停止条件具体","交接能恢复不越权"]}]},"notes":["验收四点措辞简化，判定口径与原版一致。","章程四要素齐全算「目标能检查」满分；汇报点或停止条件空泛（如\"有问题就停\"）按对应条扣分。"]},{"id":15,"title":"做一个自己的小工具","intro":"可以边看图文边读，或用这份讲解复习。前置知识：第12—14课。最后四页为深入阅读。","pages":[{"n":1,"t":"做一个自己的小工具","f":["一张表单＋一条规则＋保存恢复，就是你第一个能用的工具"],"b":["一个小工具只要能接收资料、处理并保存结果，就已经有用途。本课先用固定规则整理通知，再试着让AI改写。","想一件自己的小事，带着它往下读。"]},{"n":2,"t":"先看这份资料","f":["虚构活动：10月18日，14:00—16:00，社区活动室，主题旧物交流，报名截止10月16日。"],"b":["虚构活动：10月18日，14:00—16:00，社区活动室，主题为旧物交流，报名截止10月16日。","五条信息。本课的任务就是把它们变成一条能检查的通知。"]},{"n":3,"t":"从填写到保存","f":["填表→生成→保存→改错→恢复，五个动作走一遍。"],"b":["这一课就是把这条链从头到尾跑通。","你也可以试试：用两场活动练保存与恢复，再故意填一个错时段。\n留意：有效结果能恢复；错了输入要清掉旧结果。"]},{"n":4,"t":"通知工具怎样工作","f":["工具按死规则整理，你按资料核对——分工明确。"],"b":["规则管格式（日期对不对、先后顺不顺），事实管真假（活动是真是假）——后者只能靠你。","图中是简化示意，实际用时还是要自己查资料、看结果。"]},{"n":5,"t":"小工具从一件事开始","f":["第一个工具别奔着\"平台\"去，就是一张表加一条规则。"],"b":["第一个工具别奔着\"平台\"去，就该是一张表单加一条规则。先把一件最小的事从头到尾跑通，比规划一个完整系统有用得多。","这份练习工具按固定规则检查字段，再组合成通知草稿，资料保存在本机。想换语气时，再把已核对的资料交给AI。","举个例子：先做\"填活动资料→出通知草稿\"这个闭环。"]},{"n":6,"t":"输入表单","f":["表单把每个字段摆明，减少漏填。"],"b":["日期、时段、地点、事项，各有各的格子。人数未知就留\"待确认\"。注意：格式对，不等于活动是真的。","举个例子：表单让日期、时段、地点各有固定位置。"]},{"n":7,"t":"规则处理","f":["死规则管格式，AI管语气，两者搭配。"],"b":["结束时间早于开始时间？规则一查就报错。语气想柔和点？交给AI。各干各的擅长。","举个例子：结束早于开始，规则提示错误。"]},{"n":8,"t":"输出与来源","f":["草稿里的每个信息，都要能追回你填的内容。"],"b":["保存时输入和结果一起存。以后查\"这个日期哪来的\"，一翻就知道。","举个例子：每个时间地点都来自本次输入。"]},{"n":9,"t":"错误即时反馈","f":["填错了马上说，旧草稿马上清。"],"b":["讲一个新手最常见的坑：第一次做工具的人，往往只设计了\"一切顺利\"那条路。用户把日期填错了怎么办？保存到一半断网了怎么办？工具做得成不成熟，不看功能多不多，看它对\"不顺利\"有没有准备。","填错时，工具指出错误并清掉旧草稿——防止你把上一场的通知当成这一场的。","举个例子：改了输入，旧草稿失效，不许沿用。"]},{"n":10,"t":"保存与恢复","f":["存下来，再恢复一次，才算验证过。"],"b":["下载资料文件→刷新页面→重新载入→工具重新检查→草稿再生成。恢复后自己再核一遍日期地点。","举个例子：下载、恢复走一遍，才算真的存住了。"]},{"n":11,"t":"可选AI写作","f":["想让AI改语气？把核对过的资料给它，改完粘回来再核。"],"b":["重点核三样：日期、时间、地点有没有被改？有没有多出没依据的词？","举个例子：AI管语气，事实检查不省。"]},{"n":12,"t":"接入AI之后还要检查什么","f":["确认AI真的返回了，再查内容和失败情况。"],"b":["固定规则版已经能用。要接AI，就得管它的等待、失败、账户和费用——本课先不接，把表单练熟。","举个例子：AI连接没真跑过，就先列在\"待完成\"。"]},{"n":13,"t":"任务要求","f":["填表→生成→保存→故意填错→恢复，五步走一遍。"],"b":["任务拆成三步，照着做：\n第一步，填入活动资料（10月18日，14:00—16:00，社区活动室，旧物交流，截止10月16日），生成草稿并保存。\n第二步，把结束时间改成13:00（早于开始），看工具报什么错、旧草稿清了没。\n第三步，重新打开保存的文件恢复，核对草稿和原资料一致。"]},{"n":14,"t":"示例答案","f":["通知保留日期、时段、地点、主题和截止日。结束早于开始时，工具报错并清旧草稿。"],"b":["示范：草稿——\"旧物交流活动：10月18日14:00—16:00，社区活动室，报名截止10月16日。\"填错——结束13:00早于开始14:00，工具提示错误，旧草稿清除。恢复——文件载入后草稿重新生成，与原资料一致。","对照三步检查。"]},{"n":15,"t":"哪里出了错","f":["错误示例：上一场活动的草稿还留在页面上，被当成了这次的结果。"],"b":["错误示例：上一场活动的草稿还留在页面上，使用者误以为它是这次新资料的结果。","错在哪：输入变了，页面还挂着旧的。旧结果不清场，迟早拿错。"]},{"n":16,"t":"改好，再检查","f":["资料一变就清旧草稿；改好错误再生成；恢复文件后重新检查。"],"b":["改法：清旧稿→改错→重生成→恢复后复核。改完通读一遍。"]},{"n":17,"t":"你也试一次","f":["用另一场虚构活动走完全流程＋故意填错＋恢复核对（三步见第13页）。"],"b":["照三步做：填新资料保存 → 结束时间改到开始之前看报错 → 恢复文件核对。","再帮老周画一个：给老周做个\"进货日期提醒\"——输入品名和保质期，输出\"今天该检查哪些\"。画出输入、规则、输出三格，再写出一种填错的情况和对应的提示语。","多练一次：用两场活动练习保存与恢复，再输入一个错误时段。\n留意：有效结果可恢复，错误输入清除旧结果。"]},{"n":18,"t":"完成后检查这四点","f":["草稿和这次填的资料对得上","填错后没沿用旧草稿","保存的能恢复、恢复后重查过","说得出规则和AI各干了什么"],"b":["草稿和这次填的资料对得上。填错后没沿用旧草稿。保存的能恢复、恢复后重查过。说得出规则和AI各干了什么","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：第二场活动（10月25日09:00—11:00，阅览室，读书交流，截止10月23日）走通全流程；非法时段被拒绝；恢复后重验通过。"],"b":["示范：保存→改错→报错→恢复→一致。老周进货提醒：输入品名＋保质期；规则——保质期减去今天≤3天就提醒；输出——\"牛奶还剩2天，今天查\"；填错——\"保质期格式不对，请填：年-月-日\"。","对照第18页四点自查。"]},{"n":20,"t":"记住这两件事","f":["先跑通填写、整理、保存、恢复。","工具管格式，事实还得你确认。"],"b":["一句话记住：先跑通一件小事，再谈自动化。","表单＋规则＋存取，就是你的第一个工具。","用自己的话讲一遍这课讲了什么，再举一个\"还得补资料\"的例子。"]},{"n":21,"t":"格式正确，事实还要确认","f":["格式合法，不等于事情是真的。"],"b":["规则能查日期存在、先后合理、字段没空，但不知道负责人批没批。真不真、能不能发，靠资料和确认。"]},{"n":22,"t":"小工具怎样逐步改进","f":["先跑顺主路，再加功能；每加一个连接，多管一堆事。"],"b":["AI改写、外部数据源……每加一样，就多了网络、账户、费用、失败要处理。别急。"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["输入：你填给工具的资料\n规则检查：按写死的条件核对字段\n输出：工具给的结果\n恢复：把存档读回来重新处理","先跑通一件小事，再谈自动化。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["原论文和官方资料用于解释技术，个人分享提供实践思路。核查日期：2026-10-04。","Anthropic构建有效Agent，2024\nhttps://www.anthropic.com/engineering/building-effective-agents","MCP官方介绍，核查2026-10-04\nhttps://modelcontextprotocol.io/docs/getting-started/intro","OpenAI推理模型提示建议\nhttps://developers.openai.com/api/docs/guides/reasoning-best-practices"]}],"ex":{"intro":["用另一场虚构活动填表→保存→故意填错结束时间→恢复文件→核对草稿。","怎么做：①换一场活动走全流程 ②填一个非法时段看报错 ③恢复文件核对一致性。留10—15分钟。"],"sections":[{"h":"照着做一遍（示范）","paras":["示范：填10月25日09:00—11:00，阅览室，读书交流，截止10月23日→保存。把结束改成08:00→工具报\"结束早于开始\"，旧草稿清除。恢复文件→草稿重新生成，与原资料一致。"],"items":[]},{"h":"再帮老周画一个","paras":["\"进货日期提醒\"小工具：输入品名和保质期，输出\"今天该检查哪些\"。画出输入、规则、输出三格，写出一种填错情况和对应提示语。"],"items":[]},{"h":"多练一次","paras":["用两场活动练习保存与恢复，再输入一个错误时段。\n留意：有效结果可恢复，错误输入清除旧结果。"],"items":[]},{"h":"自己检查","paras":["课程案例均为虚构练习。使用AI时，可以记下应用、模型可见名称和日期，方便下次比较。"],"items":["草稿对得上这次填的","填错后没沿用旧稿","保存能恢复并重查","说得出规则和AI的分工"]}]},"notes":["验收四点措辞简化，判定口径与原版一致。","老周进货提醒判据：三格齐全且至少一个错误分支有具体提示语（如\"保质期格式不对，请填：年-月-日\"）。"]},{"id":16,"title":"怎样调试和持续改进","intro":"可以边看图文边读，或用这份讲解复习。前置知识：第15课。最后四页为深入阅读。","pages":[{"n":1,"t":"怎样调试和持续改进","f":["找到最早出错的地方；改好后再查一遍；把坑记下来当下次的路标"],"b":["找到最早出错的地方，再改动相关部分。保留输入和修改记录，下次遇到相似问题就有依据。","想一件自己的小事，带着它往下读。"]},{"n":2,"t":"先看这份资料","f":["虚构问题：改了方法之后，10月12日通知里\"10月13日恢复\"那句没了。输入和模型都没换。"],"b":["虚构问题：更新方法后，10月12日通知中的\"10月13日恢复\"被删掉。输入和模型保持不变。","资料没变、模型没变、变的是方法——嫌疑先从方法查起。"]},{"n":3,"t":"找到最早出错的地方","f":["像整理错题本：找到最早开始错的那一步，才是根子。"],"b":["调试像整理错题本：重点不是把错题抄一遍，是找到最早开始错的那一步。第8题错了，根子可能在第3题的概念没通。（打比方，帮助理解）","你也可以试试：改了海报日期，日期、地址、广播稿都要重新核一遍。\n留意：原问题修好，还要看有没有带坏别处。"]},{"n":4,"t":"问题怎样一步步改好","f":["留住出错现场→找原因→改→再验证。"],"b":["四拍子：复现、定位、修改、复测。少一拍都说不清。","图中是简化示意，实际用时还是要自己查资料、看结果。"]},{"n":5,"t":"问题描述可以复现","f":["\"这次不好用\"没法查；记录输入、结果、预期，别人才能重跑。"],"b":["存下错误输出、用的哪个模型、方法哪一版。敏感信息先打码，够定位就行。","举个例子：先记输入和错误结果，别人才能重跑一遍。"]},{"n":6,"t":"分层定位","f":["一层层查：资料→模型→方法→工具→流程，别一起全换。"],"b":["通知日期错了先看输入；文件打不开再查导出工具。每步留了输出，最早出偏差的地方一眼可见。","举个例子：看第一个出偏差的环节，别急着加规则。"]},{"n":7,"t":"一次改一个原因","f":["一次只改一处，效果才归得了因。"],"b":["同时换了模型、资料、模板，就算变好了，也不知道是谁的功劳。下次坏了，也不知道该怪谁。","举个例子：只改和错误有关的那部分。"]},{"n":8,"t":"把出过错的例子留下来","f":["AI挖的每个坑都值得记：问了什么、答了什么、错在哪、怎么改的。"],"b":["AI给你挖的每一个坑，都值得记下来：当时问了什么、它答了什么、错在哪、后来怎么改的。三个月后再翻这份记录，你会觉得它比任何教程都好用。","修好后，把当时出错的输入再跑一遍；顺便试试隔壁情况（次日恢复、联系人未知）。","举个例子：原错误重跑通过后，再试相邻情况。"]},{"n":9,"t":"版本与回退","f":["改动记三样：什么引发的、改了哪里、怎么验证的。留后路。"],"b":["改坏了能退回上一版。退回后注意：老方法稳定，但老资料可能过期。","举个例子：上一版方法和资料留着，必要时能退。"]},{"n":10,"t":"维护随条件变化","f":["三种情况触发复测：模型升级、资料变更、反复出错。"],"b":["模型升级试旧任务；营业安排变了更新资料；同一个错犯两次，就该改方法了。","举个例子：升级、变更、重复出错，都要复测。"]},{"n":11,"t":"效果看可用成果","f":["别数\"用了多少次\"，数\"最后能用几条、花了多久\"。"],"b":["写稿、核对、返工各花多久，最后几条能用——记这个账。调用次数和Token数只是消耗，不是成果。","举个例子：把核对和返工时间算进来，再判断值不值。"]},{"n":12,"t":"完成自己的课程练习","f":["把第01课存的那次记录翻出来——这份前后对比，就是你16课的成绩单。"],"b":["还记得第01课让你存下来的那次\"现场跑一次\"吗？把它翻出来。同一个任务，现在的你会怎么问、怎么查、怎么留档？把前后两份放在一起——这份对比，就是你16课的成绩单。","展示一份成果，说清：用了哪些资料、为什么这样做、哪里出过错、怎么改好的、哪些还没做。","举个例子：交出结果、方法和未完成项，接手的人才能重做。"]},{"n":13,"t":"任务要求","f":["修复\"次日恢复被删\"，再按四项重测。"],"b":["任务拆成三步，照着做：\n第一步，保存问题现场：出错的通知、用的方法版本。\n第二步，定位：方法改了什么导致那句被删？只改这一处。\n第三步，复测：日期、时段、仅当天、次日恢复——四项全过；再把当时出错的那份输入重跑一遍。"]},{"n":14,"t":"示例答案","f":["补回\"次日恢复\"的检查要求，再核日期、时段、单日范围和恢复安排。保存这次的资料与修改理由。"],"b":["示范：定位——新方法漏了\"次日恢复\"检查项。修改——把它加回检查清单，只改这一处。复测——四项全过；原出错输入重跑通过。留档——问题、原因、修法、验证结果各一行。","对照三步检查。"]},{"n":15,"t":"哪里出了错","f":["错误示例：换模型、换资料、换模板后输出好了，所以原问题一定是模型太弱。"],"b":["错误示例：换模型、换资料、换模板后输出好了，所以原问题一定是模型太弱。","错在哪：三样一起换，功劳归不了任何人。结论\"模型太弱\"没有证据。"]},{"n":16,"t":"改好，再检查","f":["同一输入复现→逐层找最早偏差→最小修改→重新检查。"],"b":["改法：回到出错那份输入，一层层查，只改方法那一处，四项复测。改完通读一遍。"]},{"n":17,"t":"你也试一次","f":["交一份完整方案：原资料、方法、结果、一次错误与修复、以后要复测什么（三步见第13页）。"],"b":["照三步做：存现场 → 定位＋最小修改 → 四项复测＋旧错重跑。","再用阿May的工具练一遍：阿May的通知工具用了一个月，出过一次\"日期改了、海报没跟着改\"。写一份最简的调试记录——怎么复现、最早错在哪、改了什么、怎么验收、以后怎么防。","多练一次：修改海报日期后，重新核对日期、地址和广播稿。\n留意：原问题修好，还要检查联动影响。"]},{"n":18,"t":"完成后检查这四点","f":["问题的经过别人能重跑","改动的理由说得清","以前出错的情形也重测了","说清了哪些做过、哪些还没做"],"b":["问题的经过别人能重跑。改动的理由说得清。以前出错的情形也重测了。说清了哪些做过、哪些还没做","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：用课程里的虚构活动资料，记一次错误输入与修正，说明规则和AI各做了什么；试过的和没试的分开写。"],"b":["示范：错误——结束时间填反，工具报错并清旧稿。修正——改正后重生成。规则做了什么——查格式；AI做了什么——改语气（没动事实）。试过——保存、报错、恢复；没试过——断网时保存，列在待办。","对照第18页四点自查。"]},{"n":20,"t":"记住这两件事","f":["问题现场连资料一起存。","改好之后，以前出错的情形再跑一遍。"],"b":["一句话记住：踩过的坑别扔，留着当教材。","四拍子：复现、定位、修改、复测。坑记下来，就是路标。","用自己的话讲一遍这课讲了什么，再举一个\"还得补资料\"的例子。"]},{"n":21,"t":"评价方法升级","f":["比较新旧方法：同样的输入和标准，只换方法。"],"b":["固定输入和完成标准，记录版本、时间、修改量。样本小只能发现具体问题，不能证明\"对所有人都更好\"。"]},{"n":22,"t":"从个人使用到团队复用","f":["给接手的人留：资料在哪、适用条件、方法版本、还没解决的疑问。"],"b":["只有成功截图，别人学不会。留够上下文，别人才能重跑、才能接着改。"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["复现：同样条件下再出一次\n复查：旧要求再核一遍\n回退：退回存过的版本\n维护：跟着变化持续修","踩过的坑别扔，留着当教材。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["原论文和官方资料用于解释技术，个人分享提供实践思路。核查日期：2026-10-04。","Anthropic构建有效Agent，2024\nhttps://www.anthropic.com/engineering/building-effective-agents","Anthropic上下文工程，2025\nhttps://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","Anthropic Agent Skills介绍，2025\nhttps://www.anthropic.com/engineering/equipping-agents-for-the-real-world-with-agent-skills","一见AI：AI消耗与业绩，作者配文\nhttps://www.douyin.com/video/7691167895279242496\n本课取材于作者配文与页面标题。"]}],"ex":{"intro":["交一份完整方案：原资料、常用方法、最终结果，讲清一次错误与修复，写明资料或模型变化后要重测什么。","怎么做：①存问题现场 ②定位＋最小修改 ③复测（含旧错重跑）④写清\"试过的／没试过的\"。留10—15分钟。"],"sections":[{"h":"照着做一遍（示范）","paras":["示范：错误——结束时间填反，工具报错清旧稿；修正——改正重生成，只动这一处；复测——保存、报错、恢复全通过，旧错误输入重跑通过；待试——断网时保存，列入待办。留档：问题／原因／修法／验证，各一行。"],"items":[]},{"h":"结课对比（记得第01课吗）","paras":["翻出第01课「现场跑一次」保存的记录：同一个任务，现在的你会怎么问、怎么查、怎么留档？把前后两份放在一起——这份对比，就是你16课的成绩单。"],"items":[]},{"h":"再用阿May的工具练一遍","paras":["阿May的通知工具出过一次\"日期改了、海报没跟着改\"。写一份最简调试记录：怎么复现、最早错在哪、改了什么、怎么验收、以后怎么防。"],"items":[]},{"h":"多练一次","paras":["修改海报日期后，重新核对日期、地址和广播稿。\n留意：原问题修好，还要检查联动影响。"],"items":[]},{"h":"自己检查","paras":["课程案例均为虚构练习。使用AI时，可以记下应用、模型可见名称和日期，方便下次比较。"],"items":["问题经过能重跑","改动理由说得清","旧错情形重测了","试过和没试的写清了"]}]},"notes":["验收四点措辞简化，判定口径与原版一致。","结课对比为推荐形式：前后记录齐备且能说出至少一处具体变化即可；未做第01课选做演示的学员按原任务口径完成。"]}],"story":[{"id":1,"who":"laozhou","q":"AI 到底能帮我干点啥？","sub":"不讲概念，先找一件你今天就要做的小事","scene":[["n","晚上十点，老周的面馆刚收摊。手机“叮”一声，供货商发来消息："],["o","周老板，周三的货提前到早上9点，麻烦安排人接一下。"],["n","老周得通知三个店员。他一根手指在屏幕上戳，打了删、删了打，十分钟过去，才憋出一句“周三早来”。"],["n","第二天，有个店员八点半就到了，有个十点才来——“早来”到底是几点？谁也说不清。"],["q","你有没有过这种时候：事情不难，就是**写清楚**太费劲？这一课就从这儿开始。"]],"big":"AI 最擅长的，是帮你**起草、整理、列选项**；它不擅长的，是知道**你家的事**。所以分工很简单：它出稿，你签字。","analogy":{"title":"把 AI 想成一个手很快的新实习生","text":"书读得多、打字飞快，让他起草通知、理清单，几秒钟就交卷。可他刚来，不认识你店里任何一个人，也不知道货几点到。〔打比方〕起草交给他，几点开门、发不发，还得你说了算。","icon":"🧑‍💼"},"steps":[{"life":"让它先写个初稿","text":"你说清要写什么，它就能给你好几个版本挑。这类能“写出新东西”的 AI，叫[[生成式AI|能按你的要求写出文字、图片等新内容的 AI，比如聊天助手]]。"},{"life":"把乱七八糟理成清单","text":"进货单、聊天记录、手写便条，丢给它，它能理成一条条清单——清单一摆出来，哪里漏了你一眼就看见。"},{"life":"帮你把选项摆出来","text":"两个方案拿不定主意？它能帮你列优缺点。但“选哪个”是你的事，它不知道你最在乎什么。"},{"life":"算算真省了多少时间","text":"省下的打字时间，要减掉你核对、改错花的时间。问自己两句：**错了容易发现吗？错了后果大吗？** 两句都是“还好”，就放心让它先上。"}],"demos":[{"type":"sort","title":"动手分一分：这些活，该怎么交给 AI？","hint":"每一条点一个你觉得对的选项，马上能看到解释。","buckets":["放心让它起草","它起草，我必须核对","我自己拍板"],"items":[["给店员群消息写三个版本，我挑一个",0,"写法错了也不要紧，你挑的时候就看出来了。"],["把供货商发来的一长串消息理成“周三要做的事”清单",1,"清单里的时间、数量必须对着原消息核一遍——它可能理丢一条。"],["决定周日让谁加班",2,"这关系到人，AI 不知道谁家里有事。可以让它帮你措辞，决定得你来。"],["告诉顾客下周起面涨一块钱",2,"涨不涨、涨多少是你的决定；定了以后，可以让它帮你把话说得客气点。"],["把手写的进货单拍照，转成表格",1,"识别数字最容易出错，每个数字都要对一遍。"]]},{"type":"compare","title":"同一件事，前后对比","note":"两段都是示意文字，用来说明差别，不是某个 AI 的真实输出。","a":{"label":"老周自己憋的","text":"周三早来"},"b":{"label":"让 AI 起草、老周核过的","text":"各位：周三（本周）供货商早上 9:00 送货，请小王、小李 8:50 前到店帮忙卸货。小张按原时间上班。收到回个“1”。"},"why":"差别不在文采，在**具体**：几点、谁、做什么、怎么确认。AI 很会把这些位置摆出来——空着的地方，正好提醒你去补。"}],"myths":[["AI 什么都知道","它知道的是“一般情况”。你家货几点到、店员叫什么，它一概不知，得你告诉它。"],["用 AI 就是偷懒","省的是打字和排版的力气，判断和核对一点没少。用得好的人，反而更认真地看每个数字。"],["得先学会编程才能用","会说话就能用。这门课前 8 课，一行代码都不用写。"]],"tryit":{"text":"打开你手机里任意一个 AI 应用，用自己的话说一件今天要做的小事。不会开口？照这个填空：","prompt":"我要给____写一条____，内容是____。请保留____，不要编造____。","foot":"把你的提问和它的回答都存下来——第 16 课要用。结果因模型和版本而异，以你自己的核对为准。"},"quiz":[{"q":"老周让 AI 写通知，AI 写了“如有疑问请联系王经理”。可店里根本没有王经理。怎么办？","opts":["反正顾客不会打，留着吧","删掉，原资料里没有的人和电话一律不写","让 AI 再检查一遍，它说没问题就发"],"a":1,"why":"原资料里没有的信息，就是 AI 编的。让它自己再查一遍不算证据——要对着原资料查。"},{"q":"下面哪件事最适合**第一次**拿来练手？","opts":["给全市客户发的涨价公告","给自己写的明天待办清单","跟房东谈续租的合同条款"],"a":1,"why":"从熟悉、错了也容易改的小事开始。后果越重的事，越要等你用熟了再说。"}],"take":"AI 管起草，你管签字。"},{"id":2,"who":"wangayi","q":"AI 怎么突然就会聊天了？","sub":"七十年的故事，讲成三个你见过的东西","scene":[["p","wangayi","我们以前单位那台电脑，干什么都得按菜单，按错一步就从头来。现在这个 AI，怎么跟人一样能聊天了？"],["n","王阿姨问得特别好。很多人以为 AI 是这两年才冒出来的，其实这个名字快七十岁了。它只是换了好几次“学本事”的方法。"],["q","弄明白它是怎么一步步变过来的，你就知道：为什么老办法不灵了，新办法该怎么用。"]],"big":"AI 的变化，说到底是**学本事的方法**变了：从“人把规矩写死”，到“看例子自己找规律”，再到“读海量文字学会接话”。方法一变，用法就得跟着变。","analogy":{"title":"三个你都见过的东西","text":"**自动售货机**：按哪个键出哪罐，全是人事先定好的——这是规则系统。**认熟客的老店员**：没人教他规则，上千张脸看下来自己就会了——这是机器学习。**厨师学徒**：先练刀工、再练火候，一层一层往上学——这是深度学习。〔打比方〕","icon":"🏪"},"steps":[{"life":"自动售货机时代","text":"[[规则系统|人把“遇到什么就怎么办”一条条写死，机器照着执行]]：可靠、好查，但规则没写到的情况，它就傻眼。王阿姨单位那台按菜单的电脑，就是这个路子。"},{"life":"老店员时代","text":"[[机器学习|不写规则，给机器看大量例子，让它自己总结规律]]：比如看过几万封垃圾邮件，它就会自己认垃圾邮件了。"},{"life":"厨师学徒时代","text":"[[深度学习|一种机器学习方法，把很多层计算叠起来，一层学一点，越往上学得越抽象]]：认图、听声音的本事，就是这么一层层练出来的。"},{"life":"会接话的时代","text":"2017 年一篇论文提出了一种新结构叫 Transformer，后来的聊天 AI 大多建在它上面；2022 年底 ChatGPT 上线，普通人第一次能一句一句追着改稿。这些就是你今天用的[[大模型|读过海量文字、能接着你的话往下写的大型 AI 模型]]。（年份见本课完整讲义第 24 页的原论文）"}],"demos":[{"type":"timeline","title":"点一点：每个节点多了什么本事、还要人把关什么","nodes":[["1956","“人工智能”这个名字诞生","1955 年一份提案说，想用 1956 年一个夏天把“智能”研究清楚。这个夏天到今天还没结束。","提醒：提案里的乐观，不等于做到了。"],["规则时代","人写规则，机器照办","能做：按固定菜单办事、查表。","还要人：规则以外的情况，全得人兜底。"],["机器学习","看例子找规律","能做：认垃圾邮件、推荐商品。","还要人：例子偏了，它学到的也偏。"],["2017","Transformer 论文","能做：更好地联系上下文，为后来的大模型打底。","提醒：论文是研究，离你手机里的产品还有好几年。"],["2022","ChatGPT 上线","能做：一句一句追问、改稿。","还要人：话说得顺，事实照样要核。"],["2023 以后","能看图、会多想一会儿、能边查边干","能做：读图、解题、多步骤办事。","还要人：具体哪个产品有哪个本事，以你自己试过的为准，别说“所有 AI 都能……”。"]]}],"myths":[["AI 是这两年才发明的","“人工智能”这个说法 1956 年就有了。这两年变的是：普通人能直接跟它聊天了。"],["新版本一出，旧经验全作废","不会全作废，但值得**拿老任务重新试一遍**：以前要绕三道弯的事，现在可能一句话就行。"],["发布会上演示能做到，我就一定能做到","发布会证明的是“在那个场景下能做到”。你的活能不能做，得拿你自己的活试。"]],"tryit":{"text":"找一件你一年前用 AI 试过、但效果不好的事，今天原样再问一遍，看看有什么变化。没试过的，可以照这句问：","prompt":"请用三个生活里的比方，给一位退休老师讲讲：以前的电脑程序和现在的聊天 AI，最大的区别是什么？最后提醒一句，哪些地方还得人来把关。","foot":"结果因模型和版本而异，以你自己的核对为准。"},"quiz":[{"q":"“2023 年以后所有 AI 都会看图”——这句话哪里有问题？","opts":["没问题","“所有”太绝对：要说清是哪个产品、哪个入口、做什么任务","年份写错了"],"a":1,"why":"论文、发布会、你自己的体验，证明的范围都不一样。说话越具体，越不容易误导人。"},{"q":"王阿姨单位那台“按菜单办事”的电脑，最像哪一种？","opts":["自动售货机（规则系统）","认熟客的老店员（机器学习）","厨师学徒（深度学习）"],"a":0,"why":"所有反应都是人事先写死的——这就是规则系统。"}],"take":"工具换了，用法就得跟着换一遍。"},{"id":3,"who":"xiaolin","q":"AI 是怎么“想”出一句话的？","sub":"其实它在玩一个你从小就会的游戏：接龙","scene":[["n","先玩个游戏。我说——"],["o","今天天气真____"],["n","你脑子里是不是已经蹦出“好”了？刚才那一瞬间你干的事，就是大模型一整天在干的事：**猜下一个词**。"],["p","xiaolin","那它跟我说得头头是道，是因为它“懂”吗？"],["n","小林问到点子上了。答案有点反直觉：它不是在“回答”你，它是在**接你的话**——接得特别顺而已。"]],"big":"大模型写字，就是一遍遍地问自己：“接在这后面，哪个词最顺？”挑一个接上，再问下一个。**接得顺，不等于说得对。**","analogy":{"title":"一个读过无数书的接龙高手","text":"你给它半句话，它凭读过的海量文字，猜出最顺的下一个词。它读过很多通知，所以很会写通知的“样子”；可你家几点开门，书里没写过。〔打比方〕","icon":"🔗"},"steps":[{"life":"先把字切成小积木","text":"它不是一个字一个字读的，而是把句子切成一块块[[Token|AI 处理文字时切出来的小块，一块可能是一个字、半个词或一个词]]。〔打比方〕就像拼积木，一块不一定正好是一个字。"},{"life":"给每块积木记个坐标","text":"每块积木会变成一串数字，叫[[向量|用一串数字表示一个词的意思，意思相近的词数字也相近]]。“开门”和“营业”的坐标挨得近，“开门”和“香蕉”离得远。"},{"life":"算出下一块接什么","text":"它给每个候选词打一个“顺不顺”的分，挑分高的接上。这一步叫[[预测下一个词|根据前面的内容，算出接下来哪个词最可能出现]]。"},{"life":"边读边“偏心”","text":"一桌人同时说话，你总能听见喊你名字的那个人。它读句子也会把注意力多分给相关的词，这叫[[注意力机制|模型读句子时，自动多看和当前位置更相关的词]]。"},{"life":"本事是“刷题”刷出来的","text":"它的本事来自[[训练|让模型做海量接龙练习，猜错一点就调一点内部数值的过程]]——练完就定型了。你平时跟它聊天，它并没有因此变聪明。"}],"demos":[{"type":"nextword","title":"亲手当一回大模型：给这句话接下一个词","note":"下面的候选词和分数都是**教学示意**，不是任何真实模型算出来的。","stages":[{"ctx":"营业时间为","cands":[["10:00",34],["每天",26],["上午",18],["周一至周日",12],["待定",10]]},{"ctx":"（补了一句资料：本店10月12日营业时间为10:00—18:00）营业时间为","cands":[["10:00",82],["上午",9],["每天",5],["待定",4]]}],"lesson":"没给资料时，“10:00”只是**最顺**，不代表是真的；补上资料后，最顺的那个才恰好也是对的。**资料决定它能不能接对。**"}],"myths":[["AI 在一个大数据库里查答案","它不是在查，而是在“接”：根据读过的文字，算出最顺的下一句。所以它能写出数据库里根本没有的话——包括编的。"],["一个 Token 就是一个汉字","不一定。一块可能是一个字，也可能是半个词、一个词；不同的 AI 切法还不一样。"],["我跟它聊得越多，它就学得越聪明","平时聊天不会改它的本事。它记得你刚说的名字，只是这次对话里的“临时便条”。"]],"tryit":{"text":"打开任意 AI 应用，输入下面这半句，让它接三次，看三次一样吗？再补一句资料重问，看看变化：","prompt":"营业时间为","foot":"第二次加上：“本店10月12日营业时间为10:00—18:00。”——结果因模型和版本而异，以你自己的观察为准。"},"quiz":[{"q":"AI 接出了“营业时间为 10:00”，而且说得很肯定。这说明？","opts":["这家店一定 10 点开门","“10:00”在这里接得最顺，真不真得看原资料","AI 查过这家店的资料"],"a":1,"why":"分高只说明“顺”。真实时间只认原资料。"},{"q":"小林说：“我昨天告诉过它我叫小林，它今天就忘了，是不是坏了？”","opts":["是，它坏了","不是。平时聊天不改模型本身；能不能“记住”，看那个应用有没有单独的记忆功能","是，它在故意装傻"],"a":1,"why":"本事（训练出来的）和这次对话的资料（临时的）是两回事。第 9 课会细讲“记忆”。"}],"take":"AI 不是在回答你，是在接你的话茬。"},{"id":4,"who":"xiaolin","q":"AI 为什么会一本正经地胡说八道？","sub":"它会解难题，也会把没影的事说得跟真的一样","scene":[["n","社团招新前一晚，小林让 AI 写招新文案。写得真漂亮，还有一句特别有分量："],["o","本社团连续三年获评校级优秀社团！"],["p","xiaolin","它说的应该没问题吧？"],["n","第二天社长看了一眼：“我们哪拿过这个奖？”——小林去查了，根本没有这回事。"],["q","AI 没有骗人的心眼，它只是**不会说“我不知道”**。这一课讲清楚：它为什么能解题，又为什么会编。"]],"big":"大模型的本职是**把话接顺**，不是**把事查对**。碰到不知道的事，它的第一反应往往不是停下，而是“填一个像真的”上去——这就是[[幻觉|AI 生成了看起来很像真的、但其实没有依据或是错的内容]]。","analogy":{"title":"考场上不会也要写满的同学","text":"数学大题步步清楚，可遇到没复习的题，他也不会空着——硬编一段，写得还挺像样。AI 有时候就是这位同学。〔打比方〕","icon":"📝"},"steps":[{"life":"会“多想几步”了","text":"有的模型答题前会先在后台多算一会儿，这叫[[推理|模型一步步推算、拆解问题后再给答案的能力]]。数学题、逻辑题因此做得更好了。"},{"life":"但想不出缺的资料","text":"想得再久，也想不出你没告诉它的事。活动日期你没说，它推理一百步也推不出来——只能猜。"},{"life":"大题对，小处照样错","text":"它的本事很不均匀：难题做对了，不代表日期、人名、数字也对。十次对九次，错的那次可能正好砸在要害上。"},{"life":"让它自己查自己，不算数","text":"你问“你确定吗？”，它可能道歉改口，也可能更肯定。两种都不是证据——证据在原资料里。"}],"demos":[{"type":"spot","title":"找茬：小林手里只有这三条资料","src":"社团名：青藤摄影社 ｜ 招新时间：10月16日 14:00 ｜ 地点：二教门口","hint":"点一下你觉得“没依据”的句子，看看猜得对不对。","segs":[["青藤摄影社招新啦！",0,"有依据：社团名在资料里。"],["10月16日14:00，二教门口见。",0,"有依据：时间和地点都对得上。"],["本社团成立于2015年，",1,"编的：资料里没有成立年份。"],["连续三年获评校级优秀社团，",1,"编的：这就是小林踩的坑。"],["现有成员200余人。",1,"编的：人数资料里没给。"],["欢迎带上手机或相机来玩！",2,"这是一句邀请，不是事实陈述。可以留，但要社长点头。"]]}],"myths":[["AI 说得这么肯定，肯定是查过的","语气肯定不代表有依据。越是具体的年份、数字、奖项，越要单独核。"],["它能解奥数题，查个日期还能错？","能。解题靠推理，日期靠资料——没给资料，推理再强也只能猜。"],["它展示的“思考过程”就是它真实的想法","那段过程只能当参考，不等于它内部真的这么算。结论还是要对着资料查。"]],"tryit":{"text":"亲手踩一次坑，比听十遍都管用。去问 AI 一件你**自己编的**“历史事件”，看它是老实说不知道，还是流畅地编一段。然后再试试这个“防编造”的问法：","prompt":"请帮我写社团招新文案。只使用我给的资料：社团名、时间、地点。资料里没有的信息不要补；如果你觉得缺了什么，列在最后让我确认。写完后，把文中每一句标成「有资料依据」或「我加的」。","foot":"结果因模型和版本而异；本演示不构成对任何产品的评价。"},"quiz":[{"q":"要核对“连续三年获评校级优秀”是不是真的，最靠谱的办法是？","opts":["问 AI：“你确定吗？”","换一个 AI 再问一遍","去查学校公布的评优名单，或者问社长"],"a":2,"why":"核对要找**独立的来源**。AI 自己再说一遍、或者另一个 AI 说一遍，都可能一起错。"},{"q":"资料只写了“周一调整营业时间”，写通知前最该做什么？","opts":["让 AI 猜一个常见的时间","先问清：哪天、几点到几点、是不是只改这一天","随便写个时间，后面再改"],"a":1,"why":"缺的事实要问，不要猜。用不上的信息（比如联系人）就不用补。"}],"take":"它张口就来，出了错可是你的事。"},{"id":5,"who":"wangayi","q":"AI 做的海报那么好看，为什么还不能直接用？","sub":"文字、图片、声音，三种生成各有各的坑","scene":[["n","广场舞队要停练一天，王阿姨想做张漂亮的图发到群里。她让 AI 画了一张：花团锦簇，颜色喜庆。"],["n","发出去五分钟，有人在群里问："],["o","王老师，图上写的是21号，不是12号吗？"],["p","wangayi","哎哟，我光顾着看好不好看了！"],["q","图越好看，越容易让人忘了看字。这一课教你：AI 是怎么“变”出文字、图片和声音的，每一种该盯住什么。"]],"big":"AI 生成文字、图片、声音，用的是不同的路子，但有一条是一样的：**生成的东西只是“像”，不保证“对”**。日期、金额、地址、人名这些要紧的字，要留在你能改、能核的地方。","analogy":{"title":"从毛玻璃后面慢慢对焦","text":"很多生图模型干活，像隔着一块毛玻璃慢慢对焦：一开始只是一团模糊的色块，一步一步变清楚，最后才成了一张图。〔打比方〕它是在“对焦出一张像样的图”，不是在“抄一张真照片”。","icon":"🔍"},"steps":[{"life":"先分清：认图、画图、改图","text":"让 AI 读一张照片里的字，是“认图”；凭一句话画一张新图，是“画图”；在原图上换个颜色、去个人，是“改图”。三件事，要检查的东西不一样。"},{"life":"画图：从噪点里“对焦”","text":"很多生图模型用的是[[扩散模型|先学会把一张图逐步加满噪点，再反过来学会从噪点一步步还原出清晰图像的生成方法]]。它画字常常不稳，所以要紧的字别交给它画。"},{"life":"听写：姓名和数字最容易错","text":"[[语音识别|把说话的声音转成文字]]碰到人名、数字、方言，最容易听岔。“十二号”和“十七号”，听起来可没差多少。"},{"life":"朗读：要回头听一遍","text":"[[语音合成|把文字读成人声]]有时会读错多音字、停错地方。“18:00”读成“十八点”还是“下午六点”，你得听一遍才知道。"},{"life":"要紧的字，留在能改的那层","text":"海报上的日期、时间别让 AI 直接画进图里，而是用普通文字叠在图上——错了一改就好，不用重画整张。"}],"demos":[{"type":"denoise","title":"拖动滑块，看一张图怎样从噪点里“对焦”出来","note":"这是**示意动画**：用一张小像素画模拟“逐步去噪”的感觉，不是真实模型的运算过程。"},{"type":"spot","title":"找茬：王阿姨的停练通知","src":"原定资料：10月12日停练一次，10月19日照常 ｜ 联系人：王老师","hint":"点出跟资料对不上的地方。","segs":[["广场舞队通知：",0,"没问题。"],["10月21日停练一次，",1,"日期错了：资料是 10 月 12 日。图片里画出来的字最容易出这种错。"],["10月19日照常。",0,"对得上。"],["雨天另行通知。",1,"资料里没有这句，是 AI 加的。可能是好意，但得王阿姨自己决定加不加。"],["有事找王老师。",0,"对得上。"]]}],"myths":[["AI 画的图是从网上某张照片改出来的","它是从噪点里一步步“对焦”出一张新图，噪点里并没有藏着哪张真照片。也正因为是“生成”的，它不能当现场照片用。"],["会读图的 AI，读出来的字一定准","读图也会认错，特别是手写、反光、模糊的地方。读完要对着原图再看一遍。"],["一个应用啥都会，说明每样都一样准","一个应用背后可能是好几个模型在接力，每一棒的准确度都不一样。"]],"tryit":{"text":"有条件的：用任意 AI 绘图应用，把下面这句原样输进去生成一张图，然后数一数图里的日期、时间、“仅当天”三个信息错了几个。没条件的：找一张真实海报，把所有“必须一字不差”的字圈出来。","prompt":"做一张门店海报：10月12日营业时间10:00—18:00，仅当天调整。","foot":"做完你就明白，为什么要紧的文字要留在能编辑的那一层。结果因模型和版本而异。"},"quiz":[{"q":"王阿姨要做一张有日期的通知图，最稳的做法是？","opts":["让 AI 把日期直接画进图里","让 AI 画背景，日期用普通文字叠上去，发前再核一遍","画完不用看，AI 很少出错"],"a":1,"why":"要紧的字留在可编辑层：错了好改，也好核。"},{"q":"用语音转文字记会议，最该重点回看哪部分？","opts":["语气词","人名和数字","标点符号"],"a":1,"why":"人名、数字最容易听岔，而且错了后果最大。"}],"take":"图好看不算完，图里的字才是大事。"},{"id":6,"who":"laozhou","q":"那么多 AI，到底用哪个？","sub":"别问哪个最强，问哪个够用","scene":[["n","老周的侄子来面馆吃饭，听说叔叔想用 AI 排班，立刻掏出手机："],["p","laozhou","你别给我整一堆，就说哪个最厉害。"],["n","侄子翻出一张排行榜，说第一名最强。老周用了三天——排班表倒是能写，可没法直接导成表格，他还得一格一格抄。"],["q","排行榜第一，未必会做你明天要交的那件活。这一课教你：用自己的活，挑自己的工具。"]],"big":"选 AI 先看**你的活需要什么**：要能收什么（文字？照片？表格？），要能交出什么（文本？能打开的表格？），你愿意花多少时间检查。然后拿同一份资料去试，比出来才算数。","analogy":{"title":"发动机和整辆车","text":"[[模型|AI 真正“动脑子”的核心部分，像汽车的发动机]]是发动机，[[应用|你实际打开、点按的那个 AI 产品，像一整辆车]]是整辆车。同一台发动机，装在不同的车上，能不能拉货、有没有后备箱，差别大了。〔打比方〕选车不看最高时速，看你每天拉什么。","icon":"🚗"},"steps":[{"life":"先写清“这活要什么”","text":"老周的活：要能看懂排班规则（文字），要能交出一张表格（能用 Excel 打开）。写下这两条，一半的应用就可以先不看了。"},{"life":"用同一份资料去比","text":"同一份资料、同一个问题，发给两个应用，答案并排放。各看四样：事实对不对、好不好读、格式对不对、功能够不够。"},{"life":"算总账，不只算价钱","text":"总账 = 花的钱 + 等的时间 + 你改错花的时间。便宜但每次都要改半天的，未必划算。"},{"life":"Token 像电表的“度”","text":"很多 AI 按[[用量|AI 处理的文字量，常用 Token 数来计，类似电表的“度”]]计费。用得多不等于干得好，要看最后**能用的有几条**。"},{"life":"选择不是一辈子的事","text":"够用就用。资料、提问方式都存好，换工具时原样重跑一遍，就知道新的到底好在哪。"}],"demos":[{"type":"calc","title":"算一算：每一条“能用的”结果，到底花了多少？","note":"下面的默认数字是**随手填的示意**，请换成你自己试出来的数。"}],"myths":[["排行榜第一就是最好的","排行榜考的是它的题，不是你的活。你的活，要你自己拿来考。"],["功能越多越好","功能多，要检查的地方也多。用不上的功能，只是多出来的出错点。"],["越贵的越准","价格和你这件活的效果没有必然关系。用自己的资料试一次，比看价格靠谱。"]],"tryit":{"text":"挑两个你能用的 AI 应用，把同一份资料、同一个要求分别发过去，答案并排放好，按四方面各打 0—2 分——你的第一张测评表就有了。","prompt":"这是我们面馆下周的排班规则：（贴上规则）。请排出周一到周日的班，输出成表格，列是日期、早班、晚班。规则里没写清的地方，不要猜，列出来问我。","foot":"四方面：事实对不对 / 好不好读 / 格式对不对 / 功能够不够。结果因模型和版本而异。"},"quiz":[{"q":"老周要从一张“拍照的营业表”里挑出日期，A 应用只收文字，B 应用能收图片。下一步？","opts":["直接选 B，所有活都用 B","先排除 A；B 能不能识别准、导出行不行，还得拿真照片试","两个都不用"],"a":1,"why":"先对“必要条件”排除；剩下的，用你的真实资料试过才算数。"},{"q":"“每条能用的成本”比“每条的成本”多考虑了什么？","opts":["广告费","不能用、要返工的那些条","电费"],"a":1,"why":"十条里只有五条能用，真实成本就翻倍了——还要加上你改错的时间。"}],"take":"别问哪个最强，问哪个够用。"},{"id":7,"who":"xiaolin","q":"为什么别人用 AI 像请了个助理，我用像隔空喊话？","sub":"差别多半不在 AI，在你有没有说清四件事","scene":[["n","小林投了二十份简历，石沉大海。她对 AI 说："],["o","帮我改简历。"],["n","AI 回了一大段：“建议突出你的核心竞争力，量化你的成果，使用有力的动词……”"],["p","xiaolin","道理我都懂，可我的简历一个字都没变啊。"],["q","AI 不是不想帮，是它根本不知道：给谁看、改哪里、手头有什么、什么不能碰。"]],"big":"跟 AI 说话，就像给一个刚来的同事交代活：**给谁用、干什么、有什么材料、不许干什么**——四件事说清，它就不用瞎猜。你说得越清楚，它猜得越少。","analogy":{"title":"点外卖的备注","text":"只写“好吃点”，店家只能凭感觉；写“少辣、不要香菜、多加一份米饭”，送来的就是你要的。〔打比方〕给 AI 的话，就是那张备注。","icon":"🥡"},"steps":[{"life":"给谁用、拿去干什么","text":"“给校招 HR 看的”和“给导师看的”，写法完全不一样。先说用途，它才知道往哪使劲。这段话就是你的[[提示词|你发给 AI 的那段话，包括要求、资料和限制]]。"},{"life":"材料单独摆出来","text":"原简历、营业时间这类事实，单独贴一段，跟“语气要活泼”这类要求分开写，它就不容易把两者搅在一起。"},{"life":"划好线：不许干什么","text":"字数、语气、**不许编经历**、不许加联系人……这些都是给它划的线。好的 AI 像好的服务员：菜卖完了会告诉你，而不是端一盘别的上来。〔打比方〕"},{"life":"给个例子，说清为什么","text":"给它看一个你喜欢的例子、一个你不喜欢的例子，各说一句为什么。比说“写得高级点”管用十倍。"},{"life":"反馈要指到具体的地方","text":"改稿时别说“再好一点”，说“第二段太长，压到两句；‘负责’换成具体做了什么”。"}],"demos":[{"type":"builder","title":"动手拼一段“说清楚”的话","hint":"每一格填一句，下面会自动拼成可以直接复制的提示词。","fields":[["给谁用、干什么","给应届校招的 HR 看，帮我改简历里的实习经历那一段"],["我手头的材料","（贴上原来那段实习经历）"],["要求","每条经历一句话，先写做了什么，再写结果；总共不超过 120 字"],["不许干什么","不许编造我没做过的经历和数字；没把握的地方列出来问我"]]},{"type":"compare","title":"前后对比：同一个 AI，两种问法","note":"下面的回答是**示意**，用来展示差别，不是某个 AI 的真实输出。","a":{"label":"随口一句","text":"问：帮我写个通知。\n\n答：尊敬的各位顾客，为了给您提供更优质的服务，我们将对营业时间进行调整，具体安排敬请关注……"},"b":{"label":"四件事说清","text":"问：给顾客写一条群消息。资料：10月12日营业时间10:00—18:00，仅当天调整，10月13日恢复。70字以内，不要编联系人。\n\n答：【营业时间调整】10月12日本店营业10:00—18:00，仅当天调整，10月13日起恢复原营业时间。给您带来不便，敬请谅解！"},"why":"第一种它只能写“通知的样子”；第二种它知道日期、范围、字数和禁区，写出来的东西差不多可以直接核对后用了。"}],"myths":[["提示词越长越好","不是越长越好，是**四件事齐**。简单的活一句话说清就行，复杂的活再分步。"],["要背一堆“咒语”模板","模板可以参考，但别硬套。说清你自己的情况，比任何万能咒语都管用。"],["它答得不好，就是它笨","先看看自己说没说清。很多时候补一句用途、贴一段资料，结果就完全不一样。"]],"tryit":{"text":"现场比一比：先只输入“帮我写个通知”，存好结果；再把上面拼好的那种“四件事齐全”的话发一遍。两份摆在一起：哪份更接近能用？差距出在哪几个字上？","prompt":"给____写一条____。用途：____。资料：____。要求：____字以内，语气____。不许：编造资料里没有的信息。缺了什么先问我。","foot":"结果因模型和版本而异，以你自己的核对为准。"},"quiz":[{"q":"AI 交回的稿子“太官腔”，下面哪句反馈最有用？","opts":["再好一点","换个风格","第一句删掉“为了给您提供更优质的服务”，直接说哪天几点营业"],"a":2,"why":"反馈要指到具体的位置、说清怎么改。"},{"q":"缺了“报名人数上限”这个信息，AI 应该怎么做最好？","opts":["自己定一个 50 人","写成“待确认”，并提醒你去问","不提这件事"],"a":1,"why":"缺关键事实就问或标“待确认”。你可以在提示词里提前要求它这么做。"}],"take":"你说得越清楚，它猜得越少。"},{"id":8,"who":"wangayi","q":"AI 写得挺像样，能直接发吗？","sub":"按下发送前，给自己 30 秒","scene":[["n","社区捡到一串钥匙，王阿姨让 AI 写失物招领。AI 写得周周到到，最后一句是："],["o","物品现存放于物业办公室，请联系张师傅认领。"],["p","wangayi","写得真好……等等，钥匙明明在我家，哪来的张师傅？"],["n","王阿姨是老师出身，改作文的习惯救了她。很多人就没这么幸运了：**看着通顺，就发了。**"],["q","这一课只教一件事：怎么在 30 秒里判断，AI 给的东西能不能用。"]],"big":"**好读只是加分项，对才是及格线。**判断能不能用，就一个笨办法：原资料放左边，AI 的结果放右边，一行行对——对日期、对数字、找多出来的、找漏掉的。","analogy":{"title":"老师改作文","text":"老师改作文不会因为字写得漂亮就给满分，而是拿着题目一句句看：跑题没有？有没有编的？该写的写了没？〔打比方〕看 AI 的结果，就用改作文的眼光。","icon":"✍️"},"steps":[{"life":"通顺 ≠ 正确","text":"AI 的句子几乎总是通顺的，所以“读着顺”帮不了你判断。要看的是：每个事实能不能在原资料里找到。"},{"life":"阿May 的土办法","text":"店长阿May 的办法很土：原资料贴屏幕左边，AI 的结果放右边，手指头点着一行行对——日期、时段、范围。土办法，但每次都拦得住错。"},{"life":"给了链接，不等于链接里真这么说","text":"AI 附了一个[[来源|支撑某个说法的原始资料，比如官方通知、原文网页]]，要点开看看：里面真有这句话吗？说的是同一件事吗？"},{"life":"没写错，不等于写全了","text":"漏掉“10月13日恢复”，每一句都没错，可顾客第二天还会白跑一趟。[[遗漏|该写的关键信息没写进去]]和编造一样要紧。"},{"life":"改完一处，全文再看一遍","text":"修好一个日期，可能顺手带坏了另一句。改完以后，四样事实从头再对一遍。"}],"demos":[{"type":"spot","title":"找茬：王阿姨的失物招领","src":"原资料：10月9日在3号楼门口捡到钥匙一串（带红色挂绳）｜ 认领请到 3 栋 201 找王老师","hint":"点出“没依据”或“对不上”的地方。","segs":[["【失物招领】10月9日在3号楼门口捡到钥匙一串，",0,"对得上。"],["带蓝色挂绳。",1,"颜色错了：资料是红色。"],["物品现存放于物业办公室，",1,"编的：钥匙在王老师家（3 栋 201）。"],["请联系张师傅认领。",1,"编的：资料里没有张师傅。"],["认领时请说明钥匙特征，谢谢配合！",2,"资料里没有，但这是个合理的好提醒——留不留，王阿姨定。"]]},{"type":"check","title":"发送前 30 秒检查","items":["日期、时间跟原资料一字不差","数字（价格、人数、门牌）都对过","没有多出资料里没有的人名、电话、地点","该写的没有漏（比如“哪天恢复”）","改过的地方，全文又看了一遍"]}],"myths":[["排版整齐，说明可以发了","排版只说明它会排版。能不能发，看的是事实对不对，还有负责人点没点头。"],["上次这个提示词好用，这次也不用查","资料一换，旧结果就得重新查。一次通过，只证明那一次、那几项。"],["让 AI 自己检查一遍就行","它可能“错得前后一致”。检查要拿原资料对，不能拿它自己的话对。"]],"tryit":{"text":"找一条你最近让 AI 写过的东西，用“左资料、右结果”的办法对一遍。也可以让 AI 先帮你列出要核的点：","prompt":"下面左边是原资料，右边是你写的稿子。请逐句标出：哪些有资料依据、哪些是资料里没有的、资料里有但稿子漏掉了什么。只列出来，不要改稿。","foot":"它列的清单也要你过一眼——最后拍板的是你。"},"quiz":[{"q":"活动稿里写着“限 50 人”，可原资料没给人数。怎么处理？","opts":["留着，50 人听着挺合理","删掉，或标成“待确认”去问主办方","改成 100 人"],"a":1,"why":"听着合理不等于有依据。资料没给的，不能自己设。"},{"q":"下面哪种情况，你**还不能**说“这条通知可以发了”？","opts":["四项事实对过了，负责人也点头了","事实都对过了，但负责人还没确认","改完又通读了一遍，负责人确认了"],"a":1,"why":"核对是你的事，“发不发”是负责人的事。两步都过才能发。"}],"take":"它张口就来，错字你得认。"},{"id":9,"who":"amay","q":"AI 怎么老是答不对我店里的事？","sub":"不是它笨，是它压根没读过你的店","scene":[["n","阿May 问 AI：“我们店 10 月 12 日几点关门？”"],["o","一般商场门店的营业时间为 10:00—22:00，具体请以门店公告为准。"],["p","amay","我问的是我们店！我们平时九点到八点，那天还临时改了。"],["n","AI 说的不算错——它说的是“一般情况”。它脑子里装的是训练时读过的海量文字，**你店里的那张排班表，它从来没见过。**"],["q","这一课讲：怎么把“你的资料”递到它眼前，以及它到底“记得”什么。"]],"big":"AI 回答时只能用两样东西：**训练时学来的一般本事**，和**这次你递给它的资料**。你店里的事，只能靠后者。所以关键不是它聪不聪明，而是你有没有把对的资料递过去。","analogy":{"title":"开卷考试","text":"模型带着学过的本事进考场，你把相关的那几页资料翻开递到它眼前。递对了页，它答得又快又准；递错了页（比如去年的旧表），答案照样错。〔打比方〕","icon":"📖"},"steps":[{"life":"它这次能看到什么","text":"你贴进对话里的文字、上传的文件，叫[[上下文|这次对话里 AI 能看到的全部内容：你说的话、你贴的资料、它前面的回答]]。文件在你电脑里、没上传，它就看不到。"},{"life":"能装得多 ≠ 每页都细读","text":"现在的 AI 一次能装很长的资料，但资料越长，中间某一页越可能被它略过。要紧的那几条，最好单独贴出来。"},{"life":"应用的“记住你”","text":"有的应用会帮你记住偏好，这是[[记忆|应用另外存下来的笔记，下次对话时再拿给模型看]]——不是模型自己变聪明了。记了什么、能不能删，看应用的设置。"},{"life":"给它一个资料柜","text":"把常用资料整理好放在一处，叫[[知识库|你整理好、供 AI 查找的一批资料]]。放进去的每份资料，都要标上日期、来源、是否有效。"},{"life":"先找资料，再回答","text":"AI 先从知识库里找出相关几段，再照着回答，这套做法叫 [[RAG|“检索增强生成”：先查找相关资料，再根据资料生成回答]]。找错了资料，答案也会错。"},{"life":"递小抄 vs 重新上学","text":"补资料像考前递小抄：快，随时换；[[微调|用一批新例子再训练模型，改变它本身的习惯]]像让孩子重新上学：慢、贵。〔打比方〕店里营业时间这种常变的事，递小抄就够了。"}],"demos":[{"type":"sort","title":"判断一下：这次对话里，AI 能看到吗？","hint":"假设你在用一个普通的聊天 AI，没有开任何特殊功能。","buckets":["能看到","看不到","要看应用设置"],"items":[["你刚刚贴进对话框的营业时间表",0,"贴进来了，就在上下文里。"],["你电脑桌面上那份排班表（没上传）",1,"文件在你电脑里，不等于 AI 读过。"],["你上周在**另一个对话**里说过“我们周一休息”",2,"有的应用有记忆功能会带过来，有的没有。别默认它记得。"],["老板昨天在微信群里说的临时调整",1,"它看不到你的微信群，除非你复制进来。"],["这次对话里它自己前面说过的话",0,"前面的回答也在上下文里——所以它说错的话，后面还可能接着错。"]]}],"myths":[["上传了文件，它就每一页都认真读了","能装下，不等于每页都被好好读。要紧的信息单独贴出来，或者直接问它“第几页怎么说”。"],["它记得我，说明它越来越懂我了","那是应用另外存的“笔记”。模型本身并没有因为你变聪明。"],["想让它懂我们店，就得训练一个专属模型","大多数店里的事，递资料（小抄）就够了。常变的事实放资料里，要改它的“脾气”才考虑训练。"]],"tryit":{"text":"把一份你自己的资料（比如排班规则）传进或贴进一个 AI 应用，问它三个问题。记下来：哪几个回答用上了你的资料，哪几个是它凭空发挥的。可以这样要求它：","prompt":"只根据我下面贴的资料回答。每个回答后面注明依据的是资料里哪一句；资料里找不到的，直接说“资料里没有”，不要用常识补。","foot":"结果因模型和版本而异，以你自己的核对为准。"},"quiz":[{"q":"资料库里有两份：常规表写 09:00—20:00，临时通知写“10月12日改为 10:00—18:00”。问 10 月 12 日几点营业，答？","opts":["09:00—20:00，常规表篇幅更长","10:00—18:00，当天的临时安排优先，并注明依据","两个都写上让顾客自己选"],"a":1,"why":"资料打架时，看范围、看日期、看谁说了算。当天有效的那份优先。"},{"q":"明天还要接着干的活，今天最好留下什么？","opts":["什么也不用留，AI 会记得","干到哪了、资料在哪、还缺什么","只留最后的结果"],"a":1,"why":"别指望它记得。交接三件事写清，明天（或换个人）都能接上。"}],"take":"它不认识你的店，资料得你递过去。"},{"id":10,"who":"amay","q":"Agent、Skill、工作流……这些词到底啥关系？","sub":"用一家餐厅，一次记住五个角色","scene":[["n","总部开会，满屏都是新词：模型、工具、工作流、Skill、Agent。阿May 记了一页笔记，越记越糊涂。"],["p","amay","我就想知道：我那条营业通知，到底谁写、谁存、谁发、出了错找谁？"],["n","这个问题问得太对了。这些词听着玄，其实就是**分工**：一件事里，谁动脑、谁动手、谁排顺序、谁记方法、谁盯全程。"]],"big":"这几个词不是“越高级越好”，而是一件事里的**不同岗位**。先弄清每个岗位管什么，再决定这件活需要几个岗位——简单的活，别堆装备。","analogy":{"title":"一家餐厅的五个岗位","text":"**模型**是厨师：管想、管尝、管判断。**工具**是厨具和传菜口：管动手执行，自己不琢磨。**工作流**是出餐流程单：先冷菜后热菜，每步交什么。**Skill** 是秘籍本：老师傅的手艺写下来，新人照着做。**Agent** 是值班经理：全程盯着，小事按规矩处理，大事打电话问老板。〔打比方〕","icon":"🍳"},"steps":[{"life":"厨师：动脑不动手","text":"[[模型|负责理解、生成和判断的 AI 核心]]会写会判断，但它本身不会“去打开文件”“去点发送”。"},{"life":"厨具：动手不动脑","text":"[[工具|让 AI 能真正执行动作的功能，比如读文件、算数、保存、发消息]]负责执行。每件工具都有边界：能读不等于能改，能存草稿不等于能发布。"},{"life":"流程单：排好顺序","text":"[[工作流|把一件事固定拆成几步，每步写清交什么、接什么]]适合每次都差不多的活。"},{"life":"秘籍本：把方法存下来","text":"[[Skill|一份写好的“这类活怎么干”的说明，AI 下次可以照着做]]适合反复做的活。"},{"life":"值班经理：看情况推进","text":"[[Agent|能自己看结果、决定下一步、调用工具推进任务的 AI 系统]]适合步骤不固定、要随机应变的活。但它能拍板的范围，得事先写死。"},{"life":"老板：签字的那个人","text":"不管用了几个岗位，**发布前的确认**要写进流程：谁核、谁批，白纸黑字。"}],"demos":[{"type":"sort","title":"对号入座：阿May 的通知流程里，每件事归哪个岗位？","hint":"按餐厅的比方来想。","buckets":["模型（厨师）","工具（厨具）","工作流（流程单）","Skill（秘籍本）","人（老板）"],"items":[["把营业资料写成 70 字以内的通知",0,"写和判断，是模型的活。"],["打开营业表文件、把草稿存到文件夹",1,"读、存，是工具在动手。"],["规定“读表→写稿→核对→存草稿→等确认”的顺序",2,"固定的步骤顺序，就是工作流。"],["一份写好的《门店通知怎么写》说明，写清必留哪几项",3,"可复用的方法说明，就是 Skill。"],["决定这条通知发不发",4,"发布的决定，永远留给人。"]]}],"myths":[["装一个 Skill，AI 就能访问所有库存并自动发布","Skill 只是方法说明。能不能读库存看工具权限，能不能发布看你的授权——四样分开核。"],["用 Agent 一定比不用高级","一次性的简单活，模型＋人就够了。每加一个组件，就多一个可能出故障的地方。"],["出了错就是“AI 不聪明”","先问：错在哪个岗位？资料给错了、工具没权限、流程漏了一步，处理办法完全不同。"]],"tryit":{"text":"拿你手头一件常做的事，用餐厅的比方填一张分工表：","prompt":"这件事是：____。\n谁出主意（模型）：____\n谁动手（工具）：____\n先后顺序（工作流）：____\n手艺存在哪（Skill）：____\n出了什么事必须停下来问我（人）：____","foot":"填完看看：哪一格其实可以删掉？简单的活别堆装备。"},"quiz":[{"q":"一次性、只需要一份资料的通知，最少需要哪几个角色？","opts":["模型＋人","模型＋工具＋工作流＋Skill＋Agent","只要 Agent"],"a":0,"why":"资料你贴进去，模型写稿，人核对确认。要反复做再加方法包，步骤不确定才考虑 Agent。"},{"q":"通知存成了草稿，但没发出去。最可能是哪里的事？","opts":["模型太笨","工具只有“存草稿”权限，或者流程在等人确认","Skill 写错了字"],"a":1,"why":"先定位岗位：没发出去，多半是权限或确认节点在起作用——这往往正是设计好的。"}],"take":"先分好工，再叫 AI 进场。"},{"id":11,"who":"laozhou","q":"一件事总是做着做着就乱了，怎么办？","sub":"把它拆成一棒一棒的接力","scene":[["n","每周五晚上，老周都要排下周的班。工时记在本子上，谁请假在微信里，规则在他脑子里。"],["n","上周他让 AI 一口气“排个班”，结果小王连上七天，小李一天没排。"],["p","laozhou","它怎么连这都不知道？"],["n","因为它压根没拿到请假的消息。问题不在最后一步，而在**中间哪一棒没交到位**。"],["q","这一课教你：把一件事拆成几步，每步写清收什么、交什么，出了岔子怎么办。"]],"big":"复杂的事，拆成一步一步。每一步都写清三样：**收到什么、交出什么、怎样算做完**。上一步交出的东西，就是下一步要接的东西——交接写不清，后面全乱。","analogy":{"title":"接力赛","text":"每个选手只跑自己那一段，可交棒那一下决定全队快慢。棒没交稳，后面跑得再快也白搭。〔打比方〕","icon":"🏃"},"steps":[{"life":"从终点倒着推","text":"老周要的是“周五晚上，排班表发到群里”。倒着推：发群之前要有核过的表 → 核之前要有初稿 → 初稿之前要有工时和请假 → ……流程自己就长出来了。"},{"life":"每步写清收什么","text":"每一步的[[输入|这一步开始前必须拿到的东西]]要具体：不是“资料准备好了”，而是“本周请假名单（来自微信，周四截止）”。"},{"life":"每步写清交什么","text":"每一步的[[输出|这一步做完要交给下一步的东西]]要够下一步干活：不是“成功了”三个字，而是一张能直接用的表。"},{"life":"岔路口先想好","text":"资料齐了→往下走；缺了→去补问；两份资料打架→停下来问人。这叫[[分支|根据不同情况走不同路线的设计]]。"},{"life":"检查点放在后果变重的地方","text":"不用每步都打断你。只在“发到群里”之前、“改了规则”之后这种后果变重的地方，设一个[[检查点|流程里专门停下来核对或等人确认的位置]]。"},{"life":"失败了，从存档处接着来","text":"把“干到哪一步、用的哪版资料”记下来。中途断了，不用从头来。"}],"demos":[{"type":"order","title":"排一排：老周的每周排班，正确顺序是？","hint":"按顺序依次点击，点错会提示。","steps":["收齐本周请假和工时（截止周四晚）","检查资料齐不齐：缺了就去问，打架就停","让 AI 按规则排出初稿","老周核对：有没有人连上太多天","老周确认周日谁加班","发到店员群里"]}],"myths":[["流程越细越好，每步都让人确认","检查点太多，人会烦、会走过场。放在后果变重的地方就够了。"],["读到资料了，就可以显示“完成”","读到资料只是第一步。草稿、已核对、待确认、已发布，是四种不同的状态。"],["顺利跑通一次，流程就没问题了","还要故意试试：缺资料怎么办？断网怎么办？中途停了能不能接上？"]],"tryit":{"text":"挑一件你每周都做的事，画出最小的流程：每步一行，写清收什么、交什么、谁检查。再加三个岔路口：缺资料、出错、要人确认。可以请 AI 帮你起个草：","prompt":"我每周要做的事是：____。请帮我拆成不超过 6 步的流程，每步写：收到什么、交出什么、怎样算做完。再标出：哪一步缺资料要停下来问我，哪一步必须我亲自确认。","foot":"AI 拆出来的流程，你要按自己的实际情况改——它不知道你店里的规矩。"},"quiz":[{"q":"AI 读到了排班表，就在群里发了“排班完成”。问题出在哪？","opts":["没问题","把“读到资料”当成了“做完”，跳过了核对和确认","应该用更好的模型"],"a":1,"why":"只有真发出去、并且核过、确认过，才能标“已完成”。"},{"q":"两份请假记录对不上，流程该怎么走？","opts":["按篇幅长的那份","随便选一份接着排","停下来，问老周以哪份为准"],"a":2,"why":"资料打架时停下来问人，是流程里最重要的岔路口之一。"}],"take":"交接棒没交好，后面全乱。"},{"id":12,"who":"amay","q":"AI 说“查到了”，就是查对了吗？","sub":"AI 去别的系统拿数据时，要盯住三件事","scene":[["n","有位顾客问：“你们 A 店还有那款白色贴纸吗？”阿May 让 AI 去系统里查。"],["o","查询成功：已找到商品“白色贴纸”（编号 001）。"],["n","阿May 差点就回复“有货”了。可她多看了一眼：AI 查到的是**商品档案**——证明这个商品存在，不是 A 店的**库存**。一查库存表：A 店余额 0。"],["q","“查询成功”只说明拿回了东西。拿回的是谁的、是什么、能不能下结论——这一课讲清楚。"]],"big":"AI 连上别的系统拿数据时，要说清三件事：**查的是谁**（哪个商品、哪家店、哪天）、**拿回来的是什么**、**失败了属于哪一种**。拿到数先别用，先弄清它是谁的数。","analogy":{"title":"餐厅的传菜窗口","text":"[[API|一个系统对外开放的“窗口”，别的程序按约定格式递请求进去、拿结果出来]]就像传菜窗口：递进去的单子有规定的格式，递出来的菜也有规定的样子。你不能自己探头进厨房——这是约定，也是保护。〔打比方〕","icon":"🪟"},"steps":[{"life":"名字像，不一定是一个东西","text":"“商品档案”和“门店库存”名字都带“商品”，却是两张不同的表。查之前对准[[字段|数据表里的一栏，比如“编号”“门店”“余额”]]。"},{"life":"知道地址，不等于有钥匙","text":"能连上一个系统，还要有[[权限|系统允许你看什么、改什么的范围]]。没权限，它会拒绝——这是保护，不是故障。"},{"life":"统一插座","text":"[[MCP|一种让 AI 应用用同一套方式连接各种工具和资料的约定]]像统一的插座标准：插头统一了，电器怎么用还得看说明书。〔打比方〕"},{"life":"模型“说要查”，应用去查","text":"模型自己不会伸手进系统。它说“我要查 A 店的 001”，由应用去查，再把结果交回给它。"},{"life":"失败分三种","text":"窗口说“没成功”，可能是：菜卖完了（要的东西不存在）、没听清单号（参数给错了）、你没有点单资格（没权限）。还有一种是“厨房没回话”（超时）——那结论只能是“未知”。"}],"demos":[{"type":"sort","title":"分一分：这次“没查到”属于哪一种？","hint":"三种失败，处理办法完全不同。","buckets":["东西不存在","参数给错了","没有权限","状态未知"],"items":[["查“1号商品”没结果——系统里的编号其实是“001”",1,"参数给错了：把 001 写成了 1。改正参数再查，别急着说“没这个商品”。"],["系统回复：你无权查看 B 店库存",2,"先确认有没有读取许可，别反复重试。"],["查“紫色贴纸”，商品档案里确实没有这一款",0,"确实不存在。可以如实告诉顾客，或者检查问法后补资料。"],["等了一分钟，系统没有任何回复",3,"超时只能说“未知”，不能说“没货”。可以有限次重试。"]]}],"myths":[["“查询成功”就是查到了我要的答案","成功只说明拿回了东西。拿回的是档案还是库存、是哪家店的，要看清楚。"],["接口统一了，什么都不用操心了","插头统一了，“什么算有货”这种业务规矩还得你自己定。"],["失败了就多试几次","查询重试无妨；可如果是“下单”“发布”这种动作，重复执行就出事了。"]],"tryit":{"text":"下次让 AI 帮你查东西（查网页、查表格都算），要求它把三件事说清：","prompt":"请帮我查：____。回答时分三行写：1. 你查的是什么（对象、范围、日期）；2. 你实际拿到了什么（原文或数据）；3. 能下什么结论、不能下什么结论。没查到的话，说明是哪种情况。","foot":"结果因模型和版本而异，以你自己的核对为准。"},"quiz":[{"q":"AI 找到了“白色贴纸”的商品档案，能说 A 店有货吗？","opts":["能，档案都找到了","不能：档案只证明商品存在，要按“商品＋门店”查库存","能，而且所有店都有"],"a":1,"why":"查的对象要对：要回答“A 店有没有货”，就得查 A 店的库存。"},{"q":"查库存时系统超时没回话，该怎么回复顾客？","opts":["没货","有货","暂时查不到，稍后确认再回复您"],"a":2,"why":"超时的结论是“未知”，不能说成“没有”。"}],"take":"拿到数先别用，先弄清它是谁的数。"},{"id":13,"who":"amay","q":"好方法总在脑子里，怎么交给别人（和 AI）？","sub":"把经验写成一本能照着做的秘籍","scene":[["n","阿May 有一套“新人第一天”的带法：先看什么、先学什么、哪些事绝对不能让新人碰。三家店，只有她心里有数。"],["n","上个月她休了三天假，新来的店员把一张临时通知照着“标准模板”写成了五大段：背景、痛点、方案、价值、行动。"],["p","amay","我就要一句“周一提前关门”，他给我写了篇作文。"],["n","新人没做错——他照着旧规矩做的。错在那份旧规矩**没写清什么时候不适用**。"]],"big":"把经验写下来，叫做 Skill。一份好 Skill 写清四样：**管什么、不管什么；要先有什么资料；步骤和判断条件；怎样算做好**。写不清“什么时候不管用”的方法，会害人。","analogy":{"title":"老师傅的秘籍本","text":"秘籍本不是把每道菜做一遍给人看，而是写下“什么火候、什么顺序、什么时候必须停”。最要紧的一页，是“这招不适合什么菜”。〔打比方〕","icon":"📒"},"steps":[{"life":"第一句就写适用范围","text":"“本方法适用于：已确认的门店营业时间调整通知。不适用于：促销活动、投诉回复。”[[适用范围|这份方法管哪些情况、不管哪些情况]]写在最前面，是给三个月后的自己省一夜排查。"},{"life":"写清资料从哪来","text":"要什么资料、去哪拿、缺了怎么办（标“待确认”还是去问谁），都写进去。"},{"life":"把死规定改成判断条件","text":"“每篇都写五段”是死规定；“按用途定结构：群消息 70 字内一段，正式公告可以分段”是判断条件。"},{"life":"好例子、坏例子各一个","text":"各写一句：好在哪、坏在违反了哪条。比讲十条原则都直观。"},{"life":"模型升级了，旧方法要复测","text":"模型越来越听话，旧方法里的死规定就被执行得越死。升级后拿老任务跑三遍：只给目标 / 加旧方法 / 加新方法，比一比。改方法先做减法。"},{"life":"留版本","text":"每次改，记三样：改了什么、为什么改、拿什么证明改对了。这就是[[版本记录|每次修改的时间、内容和理由，方便以后回查或退回]]。"}],"demos":[{"type":"compare","title":"同一件事：照“死规定”写 vs 照“判断条件”写","note":"两段都是**示意**文字。","a":{"label":"旧规矩：每篇必须写五段","text":"背景：为提升顾客体验。\n痛点：顾客等待时间长。\n方案：10月12日营业时间调整。\n价值：服务全面升级。\n行动：敬请关注我们！"},"b":{"label":"新规矩：按用途定结构","text":"（用途：顾客群消息，70 字内）\n10月12日本店营业时间为10:00—18:00，仅当天调整，10月13日恢复原安排，请合理安排到店时间。"},"why":"旧规矩本身不坏，用在长篇方案上挺好；坏在没写“什么时候不适用”。新规矩保留了底线（事实、字数、未知项），去掉了死结构。"},{"type":"check","title":"检查你的 Skill 写全了没有","items":["第一句写了“管什么、不管什么”","写了要哪些资料、缺了怎么办","步骤里有判断条件，不只是死规定","有一个好例子、一个坏例子，各说了为什么","写了“怎样算做好”","记了版本：改了什么、为什么"]}],"myths":[["方法写得越详细越好","说明写在前头，细节要用再翻。太长的方法，新人和 AI 都抓不住重点。"],["写好的方法可以一直用","资料变了、模型升级了、反复出同样的错——这三种情况都该拿出来复测。"],["改进方法就是往上加规定","很多时候是做减法：删掉过时的死规定，只保留底线。"]],"tryit":{"text":"挑一件你最拿手、又总要教别人的事，写一页最小的 Skill。可以让 AI 先帮你起个架子：","prompt":"我想把“____”这件事的做法写成一页说明，给新同事和 AI 照着用。请按这个结构问我问题，一次问一个：1.适用和不适用的情况 2.需要的资料和缺了怎么办 3.步骤和判断条件 4.一个好例子一个坏例子 5.怎样算做好。","foot":"AI 只负责提问和整理，内容必须是你的经验。"},"quiz":[{"q":"一份 Skill 最该写在第一句的是？","opts":["作者是谁","管什么、不管什么","这个方法有多厉害"],"a":1,"why":"适用范围写在最前，别人（和 AI）才不会用错地方。"},{"q":"模型升级后，老方法跑出来的通知变得特别死板。先做什么？","opts":["往方法里再加几条规定","固定资料和标准，比较“不加方法 / 旧方法 / 新方法”三种结果","换回旧模型"],"a":1,"why":"先比较，再决定。改方法常常先做减法。"}],"take":"方法写下来是好事，但得写清什么时候不管用。"},{"id":14,"who":"amay","q":"让 AI 自己去干活，靠谱吗？","sub":"给 Agent 派活，跟给实习生派活是同一门手艺","scene":[["n","阿May 试着让一个 Agent 帮她发营业通知：读营业表、写通知、发到顾客群。"],["n","营业表里，那天的时段正好空着。Agent 没停——它猜了一个常见的“10:00—18:00”，直接群发，然后汇报："],["o","任务已完成 ✅"],["p","amay","谁让你发的？时间还没定呢！"],["q","这次时间碰巧猜对了，可下次呢？Agent 能干活，但**授权不是放养**。这一课教你怎么派活。"]],"big":"Agent 的工作方式是一圈一圈转：**接任务 → 看情况 → 选一个动作 → 看结果 → 决定下一步**。派活时说清四件事：目标和完成标准、能用哪些工具、什么时候汇报、什么情况必须停下来问你。","analogy":{"title":"给新来的实习生派活","text":"好的店长不会只说“把通知发了”，而会说：“先写个草稿给我看；时间不确定就来问我；我没点头之前不许发群。”〔打比方〕同一道菜连错三次，像样的值班经理会停下来打电话，而不是让厨房一直重做。","icon":"🧭"},"steps":[{"life":"说清怎样算干完","text":"“发个通知”不够；“生成一份 70 字内的草稿，四项事实与资料一致，存进草稿箱，等我确认”才是能检查的[[完成标准|事先说好的“做到什么程度算完成”，最好能逐条检查]]。"},{"life":"发现缺料，改道去补","text":"计划可以调整：发现时段缺着，就去补问，而不是硬着头皮按原计划猜一个。"},{"life":"钥匙只给需要的那几把","text":"只给它干这件活需要的[[权限|允许它使用哪些工具、做哪些动作]]：要写草稿就给“存草稿”，不给“群发”。"},{"life":"定好重试上限和停止条件","text":"同一步失败几次就停、什么情况立刻停——这就是“打电话的规矩”。"},{"life":"汇报点就是缰绳","text":"约好它每干完一步汇报什么：已读资料、还缺什么、草稿在哪、在等谁确认。状态写清，你随时能接手。"},{"life":"先放小权，再慢慢放手","text":"先让它干能撤回的小活（写草稿、整理表格），跑顺了再一点点多给。"}],"demos":[{"type":"sort","title":"你是店长：Agent 遇到这些情况，该继续还是停下来问你？","hint":"选完看看解释。","buckets":["让它继续","停下来问我"],"items":[["营业表读到了，四项资料都齐",0,"资料齐了，可以往下写草稿。"],["营业表里当天的时段是空的",1,"缺关键事实要补问，绝不能猜。"],["草稿写好了，准备发到顾客群",1,"发布是后果最重的一步，必须等人确认（何况你只授权了存草稿）。"],["保存草稿时网络断了，这是第 1 次失败",0,"可以有限次重试，并记下原因和次数。"],["同一步已经失败 3 次",1,"到上限就停，汇报原因，别无限重做。"],["两份资料写的营业时间不一样",1,"资料打架要停下来问人以哪份为准。"]]}],"myths":[["Agent 汇报“已完成”，就是完成了","看它的状态记录：读了什么、写了什么、发没发、谁确认的。“已完成”三个字不算证据。"],["给它的权限越多，干得越快","权限越多，闯祸的范围越大。只给需要的钥匙。"],["评价 Agent 只看最后结果","还要看路上有没有闯祸：有没有猜资料、有没有越权、有没有乱重试。"]],"tryit":{"text":"给你想交给 AI 的一件多步骤的事，写一段“派活章程”：","prompt":"目标：____（做到什么程度算完成：____）\n你可以用的工具：____；不可以做的事：____\n每做完一步，告诉我：做了什么、结果是什么、下一步打算做什么\n遇到这些情况立刻停下来问我：缺资料、资料打架、准备对外发送、同一步失败 3 次","foot":"先从能撤回的小活开始试。"},"quiz":[{"q":"Agent 缺当天时段，最好的做法是？","opts":["猜一个常见时间并发布","记下“待补资料”状态，补问时段，存草稿后停下等确认","放弃任务，什么也不说"],"a":1,"why":"缺料就补问、记状态；没有发布授权，就存完草稿停下。"},{"q":"“汇报点就是缰绳”是什么意思？","opts":["汇报越多越好","约好的汇报和停止点，让你随时知道它在干什么、能及时拉住它","汇报只是礼貌"],"a":1,"why":"放手的前提是看得见、拉得住。"}],"take":"汇报点就是缰绳。"},{"id":15,"who":"wangayi","q":"我不会编程，也能做个自己的小工具吗？","sub":"一张表单 + 几条规则 + 能保存，就是一个工具","scene":[["n","王阿姨每个月要发好几次社区活动通知。每次都从头打：日期、时间、地点、报名截止……上个月还把截止日写在了活动之后。"],["p","wangayi","要是有个东西，我填几个空，它就帮我排好，还能提醒我填错了，那多好。"],["n","这个“东西”，就是一个小工具。它不需要多复杂——**下面这个，你现在就能用。**"]],"big":"第一个工具别奔着“平台”去。一张表单把要填的东西摆明，几条死规则管格式和防错，能保存、能恢复——一件最小的事从头跑通，比规划一个大系统有用得多。","analogy":{"title":"填空式的通知模板","text":"就像学校发的请假条：哪里填名字、哪里填日期都印好了，不会漏；填错了老师一眼就看出来。〔打比方〕小工具就是会自己检查的请假条。","icon":"🧰"},"steps":[{"life":"表单：把要填的摆明","text":"每个必填项一个格子，漏填一眼就看得见。"},{"life":"规则：死规矩管格式","text":"“结束时间必须晚于开始时间”“报名截止要早于活动日”——这种死规矩交给程序，一个都不会漏。"},{"life":"AI：只管润色语气","text":"想让语气更亲切？把**核对过的**内容交给 AI 改写，改完粘回来再核一遍。事实以表单为准。"},{"life":"错了马上说","text":"填错了立刻提示，并**清掉旧草稿**——免得上一场活动的草稿被当成这一次的结果。"},{"life":"存下来，再恢复一次","text":"保存之后，真的恢复一次看看对不对，才算验证过。"},{"life":"先想“不顺利”的那条路","text":"新手做工具，往往只设计“一切顺利”。工具成不成熟，不看功能多不多，看它对填错、断网、半路退出有没有准备。"}],"demos":[{"type":"tool","title":"试一试：王阿姨的活动通知小工具","hint":"随便改改，再故意把结束时间填得比开始早、或者把截止日填到活动之后，看它怎么提醒你。保存只存在你这台电脑的浏览器里。"}],"myths":[["做工具一定要会编程","很多 AI 应用能帮你写出这种小工具的代码，你负责说清“要填什么、有什么规则、怎样算对”。"],["功能越多越像样","先跑顺主路，再加功能。每多一个连接，就多管一堆事。"],["格式对了，内容就对了","工具只能保证格式合法；活动是不是真在那天，还得你核。"]],"tryit":{"text":"想做一个属于你的小工具？先别急着找软件，用 AI 把需求理清楚：","prompt":"我想做一个小工具：输入____，输出____。请帮我列出：1. 要填哪些格子；2. 有哪些“填错了要提醒”的规则；3. 最后输出长什么样。先不要写代码，列完问我有没有遗漏。","foot":"需求理清楚了，再请 AI 写一个单文件网页版，在自己电脑上打开试用。"},"quiz":[{"q":"活动 14:00 开始，王阿姨把结束时间填成了 13:00。好工具应该？","opts":["照样生成通知","提示“结束时间要晚于开始时间”，并清掉旧草稿","自动改成 16:00"],"a":1,"why":"错了马上说，不替人瞎改，也不留旧草稿误导人。"},{"q":"工具里加了“让 AI 改语气”，最重要的一步是？","opts":["改完直接发","改完对照表单内容再核一遍事实","让 AI 顺便改一下日期格式"],"a":1,"why":"AI 改的是语气，事实以你填的为准，改完要核。"}],"take":"先跑通一件小事，再谈自动化。"},{"id":16,"who":"amay","q":"AI 又出错了，从哪查起？","sub":"找到最早出错的那一步，把坑记下来","scene":[["n","阿May 的通知方法用了一个月，一直挺好。直到某天，顾客说：“你们通知没写哪天恢复啊？”"],["n","她一看，“10月13日恢复原安排”那句没了。资料没换，模型也没换。"],["p","amay","那就把模型、资料、模板全换一遍，总能好吧？"],["n","全换了，确实好了——可到底是哪里坏的，再也说不清了。下次再坏，还得从头猜。"],["q","这一课是结课：教你像整理错题本一样调试，把每个坑都变成以后的路标。"]],"big":"调试就四步：**留住出错现场 → 找到最早出错的那一步 → 一次只改一处 → 改完按原标准再查一遍**。最后，把这个坑记下来。","analogy":{"title":"整理错题本","text":"重点不是把错题抄一遍，而是找到最早开始错的那一步：第 8 题错了，根子可能在第 3 题的概念没通。〔打比方〕","icon":"📕"},"steps":[{"life":"先能“重演”出来","text":"“这次不好用”没法查。记下输入、实际结果、本来想要的结果，别人能照着重跑一遍，这叫[[复现|用同样的条件，让同样的问题再出现一次]]。"},{"life":"一层一层往下查","text":"按顺序查：资料 → 模型 → 方法（提示词、Skill）→ 工具 → 流程。找到**第一个**跟预期不一样的地方。"},{"life":"一次只改一处","text":"一下改三处，好了也不知道是哪处起的作用。一次改一处，效果才说得清。"},{"life":"留后路","text":"每次改动记三样：什么引发的、改了哪里、怎么验证的。改坏了能[[回退|退回到上一个能用的版本]]。"},{"life":"什么时候该复测","text":"三种情况一定要拿老任务重跑：模型升级、资料变更、同样的错反复出现。"},{"life":"效果看“能用的成果”","text":"别数“用了多少次 AI”，数“最后能用的有几条、花了多久”。"}],"demos":[{"type":"order","title":"排一排：阿May 该怎么查“恢复那句没了”？","hint":"按顺序依次点击。","steps":["用同一份资料重跑，确认问题能重现","对照检查：资料里有“13日恢复”吗？（有）","再查方法：上次改的方法里，是不是删掉了“必留恢复安排”这条？","只改这一处：把“必留恢复安排”加回去","按四项重新检查：日期、时段、仅当天、恢复安排","把这个坑记进错题本：现象、原因、改法、以后怎么防"]}],"myths":[["换了模型就好了，说明原来的模型太弱","你同时换了模型、资料、模板，根本分不清是哪个起了作用。"],["修好就完了","修好之后要按原标准再查一遍，还要把这个坑记下来，下次才不会再掉进去。"],["出错说明 AI 不能用","出错是常态。会调试的人，每踩一个坑，方法就更结实一点。"]],"tryit":{"text":"还记得第 01 课让你存下的那次“现场跑一次”吗？把它翻出来。同一个任务，现在的你会怎么问、怎么查、怎么留档？把前后两份放在一起——**这份对比，就是你 16 课的成绩单。**","prompt":"【错题本】\n日期：____\n我问了什么：____\nAI 答了什么：____\n错在哪（最早出错的一步）：____\n我改了什么（只改一处）：____\n改完怎么验证的：____\n以后怎么防：____","foot":"AI 给你挖的每个坑都值得记下来。三个月后翻这本错题本，它会比任何教程都好用。"},"quiz":[{"q":"通知里少了一句，第一步应该做什么？","opts":["马上换一个模型","用同样的输入重跑一次，确认问题能重现","把提示词全部重写"],"a":1,"why":"先留住现场、能重现，后面每一步才有依据。"},{"q":"为什么“一次只改一处”？","opts":["省电","这样才知道到底是哪一处起了作用","规定就是这样"],"a":1,"why":"改动和效果能对上号，经验才攒得下来。"}],"take":"踩过的坑别扔，留着当教材。"}],"cast":{"wangayi":{"name":"王阿姨","av":"👩‍🏫","tag":"62岁 · 退休语文老师","desc":"社区活动的主力，手机玩得挺熟，就是一看见看不懂的界面就缩手。群里发通知前总要问一句：“这样写行吗？”"},"laozhou":{"name":"老周","av":"👨‍🍳","tag":"45岁 · 面馆老板","desc":"面馆开了十二年，算账飞快，打字用一根手指。嘴上说“搞那些花里胡哨的干嘛”，外卖平台倒学得比谁都快。标准只有一条：能省事就行。"},"xiaolin":{"name":"小林","av":"👩‍🎓","tag":"21岁 · 大三学生","desc":"简历投了一堆没回音。AI 用得比谁都多，却从不多看一眼结果，口头禅是“它说的应该没问题吧”。"},"amay":{"name":"阿May","av":"👩‍💼","tag":"33岁 · 连锁店店长","desc":"管着三家店，做事靠清单，最怕出了事说不清责任。发任何东西之前，都要“先对一遍再发”。"}}};

function ic(n){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+IC[n]+'</svg>'}

function fmt(text){
  let h=esc(text);
  h=h.replace(/（打比方，帮助理解）/g,'<span class="analogy">打比方 · 帮助理解</span>');
  h=h.replace(/(https?:\/\/[^\s，。)）]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return h;
}
/* 段落分类 */
function classify(blocks){
  return blocks.map(t=>{
    const s=t.trim();
    if(s.startsWith('【现场跑一次｜选做】'))return{type:'demo',text:s.replace('【现场跑一次｜选做】','').trim()};
    if(s.startsWith('演示结果因模型'))return{type:'demof',text:s};
    if(s.startsWith('一句话记住：'))return{type:'quote',text:s.slice(6)};
    if(s.startsWith('举个例子：'))return{type:'ex',label:'举个例子',text:s.replace('举个例子：','')};
    if(s.startsWith('你也可以试试：'))return{type:'try',label:'你也可以试试',text:s.replace('你也可以试试：','')};
    if(s.startsWith('多练一次：'))return{type:'try',label:'多练一次',text:s.replace('多练一次：','')};
    if(s.startsWith('留意：'))return{type:'warn',label:'留意',text:s.replace('留意：','')};
    return{type:'plain',text:s};
  });
}
function miniCard(cls,label,icon,text){
  return '<div class="mini '+cls+'"><div class="mi">'+ic(icon)+'</div><div><div class="mt">'+label+'</div><div class="mb">'+fmt(text).replace(/\n/g,'<br>')+'</div></div></div>';
}
/* 流式渲染节点：plain第一个为lead，其余进折叠 */
function renderNodes(nodes){
  let h='',more=[],leadDone=false,penDemo=null;
  const flushDemo=()=>{if(penDemo){h+=demoCard(penDemo.text,penDemo.foot);penDemo=null}};
  for(const n of nodes){
    if(n.type==='demof'){penDemo={text:penDemo?penDemo.text:'',foot:n.text};continue}
    if(n.type==='demo'){flushDemo();penDemo={text:n.text,foot:''};continue}
    flushDemo();
    if(n.type==='quote'){h+='<div class="quote"><span class="lab">一句话记住</span><div class="q">'+esc(n.text)+'</div></div>';continue}
    if(n.type==='ex'){h+=miniCard('ex',n.label,'bulb',n.text);continue}
    if(n.type==='try'){h+=miniCard('try',n.label,'tryi',n.text);continue}
    if(n.type==='warn'){h+=miniCard('warn',n.label,'alert',n.text);continue}
    if(!leadDone){h+='<div class="lead">'+fmt(n.text).replace(/\n/g,'<br>')+'</div>';leadDone=true}
    else more.push(n.text);
  }
  flushDemo();
  if(more.length){
    h+='<details class="more"><summary>展开细讲</summary><div class="morebd">'
      +more.map(t=>'<div class="para">'+fmt(t).replace(/\n/g,'<br>')+'</div>').join('')+'</div></details>';
  }
  return h;
}
function demoCard(text,foot){
  return '<div class="demo"><span class="dtag">'+ic('play')+'现场跑一次 · 选做</span><div class="lead" style="margin:0;font-size:15.5px">'+fmt(text)+'</div>'+(foot?'<div class="foot">'+esc(foot)+'</div>':'')+'</div>';
}
function origDetails(nodes){
  if(!nodes.length)return'';
  return '<details class="more" style="margin-top:14px"><summary>本页原文</summary><div class="morebd">'
    +nodes.map(n=>{
      if(n.type==='quote')return'<div class="para"><b>一句话记住：</b>'+esc(n.text)+'</div>';
      return'<div class="para">'+fmt(n.text).replace(/\n/g,'<br>')+'</div>';
    }).join('')+'</div></details>';
}
function coverArt(c,seed){
  let nodes='';
  for(let i=0;i<6;i++){
    const a=i*60*Math.PI/180,r=82;
    nodes+='<circle cx="'+(100+r*Math.cos(a)).toFixed(1)+'" cy="'+(100+r*Math.sin(a)).toFixed(1)+'" r="4.5" fill="'+c+'" opacity="'+(0.35+i*0.1)+'"/>';
    nodes+='<line x1="100" y1="100" x2="'+(100+r*Math.cos(a)).toFixed(1)+'" y2="'+(100+r*Math.sin(a)).toFixed(1)+'" stroke="'+c+'" stroke-width="0.6" opacity="0.16"/>';
  }
  return '<svg width="210" height="210" viewBox="0 0 200 200">'
    +'<defs><radialGradient id="g'+seed+'"><stop offset="0%" stop-color="'+c+'" stop-opacity="0.5"/><stop offset="100%" stop-color="'+c+'" stop-opacity="0"/></radialGradient></defs>'
    +'<circle cx="100" cy="100" r="86" fill="none" stroke="'+c+'" stroke-width="1" opacity="0.3"/>'
    +'<circle cx="100" cy="100" r="62" fill="none" stroke="'+c+'" stroke-width="0.8" opacity="0.2" stroke-dasharray="3 5"/>'
    +'<circle cx="100" cy="100" r="46" fill="url(#g'+seed+')"/>'
    +'<circle cx="100" cy="100" r="20" fill="none" stroke="'+c+'" stroke-width="1.4" opacity="0.8"/>'
    +'<circle cx="100" cy="100" r="7" fill="'+c+'"/>'
    +nodes+'</svg>';
}
/* 特殊页面渲染 */
function pageHtml(les,pg,c){
  const nodes=classify(pg.b);
  const sid=stageOf(les.id), stg=DATA.stages[sid];
  /* 封面页 */
  if(pg.n===1){
    const hook=nodes.find(n=>n.type==='plain');
    return '<div class="cover" style="--sc:'+c+';position:relative">'
      +'<div class="bignum">'+String(les.id).padStart(2,'0')+'</div>'
      +'<div class="cl"><span class="pchip">第 '+String(les.id).padStart(2,'0')+' 课 · '+esc(stg.t)+'</span>'
      +'<h2 class="pt">'+esc(pg.t)+'</h2>'
      +'<div class="goal">'+esc(pg.f[0]||'')+'</div>'
      +(hook?'<div class="hook">'+fmt(hook.text)+'</div>':'')
      +'<div class="meta"><span>24 页</span><span>'+(les.intro||'').replace('可以边看图文边读，或用这份讲解复习。','')+'</span></div></div>'
      +'<div class="cr">'+coverArt(c,les.id)+'</div></div>'
      +renderNodes(nodes.filter(n=>n!==hook));
  }
  /* 验收四点 */
  if(pg.t==='完成后检查这四点'){
    const score=nodes.find(n=>n.type==='plain'&&n.text.includes('每项0—2分'));
    let h='<div class="grid2">'+pg.f.map((f,i)=>'<div class="gcard"><span class="gn">0'+(i+1)+'</span><span class="gb">'+esc(f)+'</span></div>').join('')+'</div>';
    if(score)h+='<div class="pill">'+ic('flag')+'<b>评分</b>'+esc(score.text)+'</div>';
    h+=origDetails(nodes.filter(n=>n!==score));
    return h;
  }
  /* 记住这两件事 */
  if(pg.t==='记住这两件事'){
    let h='<div class="grid2">'+pg.f.map((f,i)=>'<div class="gcard"><span class="gn">0'+(i+1)+'</span><span class="gb">'+esc(f)+'</span></div>').join('')+'</div>';
    h+=renderNodes(nodes);
    return h;
  }
  /* 术语 */
  if(pg.t==='几个容易混淆的词'){
    let h='',terms=[],rest=[];
    const first=nodes.find(n=>n.type==='plain');
    if(first){
      first.text.split('\n').forEach(l=>{const m=l.match(/^(.+?)：(.+)$/);if(m)terms.push([m[1],m[2]])});
      nodes.forEach(n=>{if(n!==first)rest.push(n)});
      if(!terms.length)rest.push(first);
    } else rest=nodes;
    if(terms.length)h+='<div class="term2">'+terms.map(t=>'<div class="tcard"><b>'+esc(t[0])+'</b><span>'+esc(t[1])+'</span></div>').join('')+'</div>';
    h+=renderNodes(rest);
    h+=origDetails(first&&!terms.length?[]:[first]);
    return h;
  }
  /* 参考资料 */
  if(pg.t.includes('参考资料')){
    let h='',cards=[],pend=null;
    nodes.forEach(n=>{
      if(n.type!=='plain')return;
      const t=n.text;
      if(/^https?:\/\//.test(t)){if(pend){pend.url=t;cards.push(pend);pend=null}return}
      if(t.startsWith('本课取材于')){if(cards.length)cards[cards.length-1].note=t;return}
      if(t.includes('核查日期')){h+='<div class="pill">'+ic('pin')+'<b>核查日期</b> '+esc(t.replace('原论文和官方资料用于解释技术，个人分享提供实践思路。',''))+'</div>';return}
      if(t.startsWith('原论文和官方资料')){h+='<div class="lead" style="font-size:15px;color:var(--muted)">'+fmt(t)+'</div>';return}
      if(t.startsWith('读法提示')){h+=miniCard('ex','读法提示','bulb',t.replace('读法提示：',''));return}
      pend={title:t,url:'',note:''};
    });
    if(pend)cards.push(pend);
    h+=cards.map(cd=>'<div class="src"><div class="si">'+ic('book')+'</div><div><div class="st">'+esc(cd.title)+'</div>'
      +(cd.url?'<div class="su"><a href="'+cd.url+'" target="_blank" rel="noopener">'+esc(cd.url)+'</a></div>':'')
      +(cd.note?'<div class="sn">'+esc(cd.note)+'</div>':'')+'</div></div>').join('');
    return h;
  }
  /* 普通页 */
  let h='';
  if(pg.f.length)h+='<div class="focus"><div class="fi">'+ic('pin')+'</div><div class="fl">'+pg.f.map(esc).join('<br>')+'</div></div>';
  h+=renderNodes(nodes);
  return h;
}

  const next=DATA.lessons.find(l=>prog[l.id]!=='done');

function goLesson(id,p){
  document.body.dataset.stage=stageOf(id);
  if(p===undefined){const s=prog[id];p=(typeof s==='number')?s:0}
  cur={v:'lesson',l:id,p};
  prog[id]=p; save();
  const les=L(id), pg=les.pages[p], c=SC[stageOf(id)];
  $('#bar i').style.width=(((id-1)+(p+1)/24)/16*100)+'%';
  let h=tabs(id,'l')+'<div class="chead" style="--sc:'+c+'"><span class="pchip">第 '+String(id).padStart(2,'0')+' 课 · 第 '+pg.n+' / 24 页</span></div>';
  h+='<h2 class="pt">'+esc(pg.t)+'</h2>';
  h+='<div style="--sc:'+c+'">'+pageHtml(les,pg,c)+'</div>';
  setContent(h);
  renderBottom(les,p);
  renderNav();
  window.scrollTo(0,0);
}
function goExercise(id){
  cur={v:'ex',l:id,p:23};
  prog[id]='ex'; save();
  const les=L(id), ex=les.ex, c=SC[stageOf(id)];
  $('#bar i').style.width=((id-0.2)/16*100)+'%';
  let h=tabs(id,'e')+'<div class="chead" style="--sc:'+c+'"><span class="pchip">第 '+String(id).padStart(2,'0')+' 课 · 练习</span></div>';
  h+='<h2 class="pt">练习：'+esc(les.title)+'</h2>';
  h+='<div class="exbox" style="--sc:'+c+'"><div class="task"><div class="mi">'+ic('flag')+'</div><div><div class="tb">'+fmt(ex.intro[0]||'')+'</div>'+(ex.intro[1]?'<div class="tn">'+fmt(ex.intro[1])+'</div>':'')+'</div></div>';
  let ci=0;
  if(!checks[id]) checks[id]={};
  for(const sec of ex.sections){
    const isCheck=sec.h.includes('自己检查'), isDemo=sec.h.includes('现场跑一次');
    if(isCheck){
      const saved=checks[id];
      h+='<div class="sec"><div class="mini try" style="--mc:#22D3EE;--tint:rgba(34,211,238,.05);border-color:rgba(34,211,238,.26);margin-bottom:10px"><div class="mi">'+ic('grid')+'</div><div><div class="mt">做完自己检查</div><div class="mb">每项做到了才勾，四项全过再进下一课</div></div></div><div class="chk2">';
      for(const it of sec.items){
        const on=!!saved[ci];
        h+='<label class="'+(on?'on':'')+'"><input type="checkbox" '+(on?'checked':'')+' onchange="tick('+id+','+ci+',this)"><span>'+esc(it)+'</span></label>';
        ci++;
      }
      h+='</div></div>';
    } else if(isDemo){
      h+='<div class="sec">'+demoCard(sec.paras[0]||'',sec.paras.slice(1).join(' ')||'')+'</div>';
    } else {
      h+='<div class="sec">'+miniCard('ex',sec.h,'tryi',sec.paras.join('\n'))+'</div>';
    }
  }
  h+='</div>';
  if(les.notes.length){
    h+='<div class="notes" id="tNotes"><button onclick="document.getElementById(\'tNotes\').classList.toggle(\'open\')">答案与评分同步说明（教师参考）<span>▾</span></button><div class="bd"><ol>'+les.notes.map(n=>'<li>'+fmt(n)+'</li>').join('')+'</ol></div></div>';
  }
  h+='<div class="finish"><button class="pbtn primary" onclick="finish('+id+')">完成本课</button></div>';
  setContent(h);
  $('#bottom').innerHTML='<div class="pager"><button class="pbtn" onclick="goLesson('+id+',23)">‹ 回到末页</button><span class="pind">练习 · 做完自己检查</span><button class="pbtn primary" onclick="finish('+id+')">完成本课 ›</button></div>';
  renderNav();
  window.scrollTo(0,0);
}
function tick(id,i,el){
  checks[id]=checks[id]||{};checks[id][i]=el.checked;save();
  el.closest('label').classList.toggle('on',el.checked);
}
function finish(id){
  prog[id]='done';save();
  if(id<16) goStory(id+1); else renderHome();
}
function renderBottom(les,p){
  const dots=les.pages.map((pg,i)=>'<button class="dot'+(i<=p?' seen':'')+(i===p?' cur':'')+'" title="第'+pg.n+'页" onclick="goLesson('+les.id+','+i+')"></button>').join('');
  const right=p<23?'<button class="pbtn" onclick="nav(1)">下一页 ›</button>':'<button class="pbtn primary" onclick="goExercise('+les.id+')">做练习 ›</button>';
  $('#bottom').innerHTML='<div class="dots">'+dots+'</div><div class="kbd">← → 键翻页</div><div class="pager">'+(p===0?'<button class="pbtn" onclick="goStory('+les.id+')">‹ 回故事版</button>':'<button class="pbtn" onclick="nav(-1)">‹ 上一页</button>')+'<span class="pind">'+les.pages[p].n+' / 24 · '+esc(les.pages[p].t)+'</span>'+right+'</div>';
}
function nav(d){
  if(cur.v!=='lesson')return;
  const p=cur.p+d;
  if(p<0)return;
  if(p>23){goExercise(cur.l);return}
  goLesson(cur.l,p);
}
document.addEventListener('keydown',e=>{
  if(cur.v!=='lesson')return;
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight')nav(1);

function sfmt(t){
  let h=esc(String(t));
  h=h.replace(/\[\[(.+?)\|(.+?)\]\]/g,(m,a,b)=>'<span class="term open" tabindex="0" title="点一下收起/展开解释" onclick="this.classList.toggle(\'open\')"><b>'+a+'</b><span class="tdef">'+b+'</span></span>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/〔打比方〕/g,'<span class="analogy">打比方 · 帮助理解</span>');
  return h.replace(/\n/g,'<br>');
}

let W={}, wid=0;
function nid(d){wid++;W[wid]=d;return wid}

/* ---------- 小互动 ---------- */
function wSort(d){
  const k=nid({d,score:{}});
  let h='<div class="wd" id="w'+k+'"><h4>'+sfmt(d.title)+'</h4><div class="hint">'+sfmt(d.hint||'')+'</div>';
  d.items.forEach((it,i)=>{
    h+='<div class="srow"><div class="it">'+sfmt(it[0])+'</div><div class="bs">'
      +d.buckets.map((b,j)=>'<button class="btn" onclick="sortPick('+k+','+i+','+j+',this)">'+esc(b)+'</button>').join('')
      +'</div><div class="fb" id="w'+k+'f'+i+'"></div></div>';
  });
  return h+'<div class="res" id="w'+k+'r">答对 0 / '+d.items.length+'</div></div>';
}
function sortPick(k,i,j,el){
  const w=W[k], it=w.d.items[i], ok=(j===it[1]);
  el.parentNode.querySelectorAll('.btn').forEach(b=>b.classList.remove('ok','no'));
  el.classList.add(ok?'ok':'no');
  if(!ok)el.parentNode.children[it[1]].classList.add('ok');
  const f=document.getElementById('w'+k+'f'+i);
  f.className='fb show '+(ok?'g':'r');
  f.innerHTML=(ok?'✅ 对。':'🤔 更合适的是「'+esc(w.d.buckets[it[1]])+'」。')+sfmt(it[2]);
  if(!(i in w.score))w.score[i]=ok;
  const n=Object.values(w.score).filter(Boolean).length;

const STAGE_EN=['UNDERSTAND AI','USE IT WELL','COMPLEX TASKS','GO DEEPER'];
const pad2=n=>String(n).padStart(2,'0');
function hq(q){
  let m=q.match(/^(.*?)(“[^”]+”)(.*)$/);
  if(m)return esc(m[1])+'<span class="hl6">'+esc(m[2])+'</span>'+esc(m[3]);
  const i=q.lastIndexOf('，');
  if(i>0)return esc(q.slice(0,i+1))+'<br><span class="hl6">'+esc(q.slice(i+1))+'</span>';
  const t=q.replace(/[？?]$/,''), k=Math.max(0,t.length-5);

      +'<svg class="scring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" class="b"/><circle cx="60" cy="60" r="54" class="f" pathLength="100" id="scf"/></svg>'
      +'<ol class="scl">'+s.steps.map((x,i)=>'<li data-i="'+i+'">'+sfmt(x.life)+'</li>').join('')+'</ol><div class="scill">'+illus(id)+'</div></div></aside>';
    st.outerHTML='<div class="scr7" style="--n:'+s.steps.length+'">'+vis+'<div class="steps6 scs">'+st.innerHTML+'</div></div>';
  }
  const blks=c.querySelectorAll('section.blk');
  /* 第 1 课：AI 简史 */
  if(id===1&&blks[0])blks[0].insertAdjacentHTML('afterend',histHtml());
  /* 第 10 / 14 课：额外的动画演示 */
  const hands=[...c.querySelectorAll('section.blk')].find(b=>(b.querySelector('.sh6 .sl')||{}).textContent==='亲手点一点');
  if(hands&&id===10)hands.insertAdjacentHTML('beforeend',wRoles(s.demos[0]));
  if(hands&&id===14)hands.insertAdjacentHTML('beforeend',wLoop(s.demos[0]));
  if(id===1)histInit();
  scrollySetup();
  rdSetup(id);
};
function scrollySetup(){
  const scs=document.querySelectorAll('#content .scs > *'); if(!scs.length)return;
  const set=i=>{const r=$('#content .scr7');if(!r)return;r.style.setProperty('--a',i);
    r.querySelectorAll('.scl li').forEach((l,j)=>{l.classList.toggle('on',j===i);l.classList.toggle('past',j<i)});
    scs.forEach((e,j)=>e.classList.toggle('act',j===i));
    const f=$('#scf');if(f)f.style.strokeDashoffset=100-(i+1)/scs.length*100};
  set(0);
  if(!('IntersectionObserver' in window))return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)set(+e.target.dataset.i)}),{rootMargin:'-42% 0px -48% 0px'});
  scs.forEach(e=>io.observe(e)); STOP7.push(()=>io.disconnect());
}
/* 讲义 / 练习页：关掉阅读条 */
const _goLesson6=goLesson; goLesson=function(id,p){_goLesson6(id,p);const r=$('#rd7');if(r)r.classList.remove('on','show')};
const _goEx6=goExercise; goExercise=function(id){_goEx6(id);const r=$('#rd7');if(r)r.classList.remove('on','show')};

renderHome();
