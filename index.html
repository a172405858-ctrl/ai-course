<script>
const DATA = {"stages":[{"t":"认识 AI","ids":[1,2,3,4],"d":"AI能做什么、从哪来、怎么说话、为什么胡说"},{"t":"用好 AI","ids":[5,6,7,8],"d":"生成内容、选工具、说清需求、判断能不能用"},{"t":"处理复杂任务","ids":[9,10,11,12,13],"d":"补资料、分工、拆流程、连接、沉淀方法"},{"t":"深入与维护","ids":[14,15,16],"d":"派活给Agent、做小工具、调试与改进"}],"lessons":[{"id":1,"title":"AI能帮普通人做什么","intro":"可以边看图文边读，或用这份讲解复习。前置知识：无。最后四页为深入阅读。","pages":[{"n":1,"t":"AI能帮普通人做什么","f":["知道哪些活可以交给AI搭把手，哪些地方得自己把关"],"b":["先别管AI是什么。想想你今天有没有一件小事要写——一条通知、一段留言都行。这一课就教你怎么把它交给AI起草，然后自己检查一遍。","想一件自己的小事，带着它往下读。"]},{"n":2,"t":"先看这份资料","f":["一家虚构门店的资料：10月12日（周一）营业时间改为10:00—18:00，只改这一天，10月13日恢复原样。联系方式没给。"],"b":["虚构门店：10月12日周一营业时间改为10:00—18:00。只在当天生效，10月13日恢复原安排。联系方式未知。","就这四条信息。别的都没有——后面谁要是写出了资料里没有的东西，就是编的。"]},{"n":3,"t":"一条通知里，谁做什么","f":["AI负责写句子，日期和事实来自资料，发不发由人决定。"],"b":["一句话说清分工：AI管写，资料管对错，人管发不发。","举个例子：AI把通知写得顺顺的，但10点开门这件事，它得听资料的。"]},{"n":4,"t":"写通知的三个环节","f":["资料给事实，AI组织语句，人核对后确认。"],"b":["三步：你把资料递给它，它把句子写顺，你对着资料检查一遍再发。","图中是简化示意，实际用时还是要自己查资料、看结果。"]},{"n":5,"t":"一个任务有不同部分","f":["写草稿、查事实、做决定，是三件不同的事。"],"b":["把AI想成一个刚来的实习生：写得飞快，就是不认识你店里任何人。（打比方，帮助理解）让他起草行，几点关门，你自己定。","举个例子：通知的语气交给AI改，营业时间得人对着资料核。"]},{"n":6,"t":"生成式AI的用途","f":["AI能照着你的要求写出好几个版本。但写出来对不对，它不保证。"],"b":["同一件事，它可以写成群消息，也可以写成门口的告示。写得顺不等于写得对——事实那部分，永远要回到资料核对。","举个例子：时间地址不变，语气可以随便换。"]},{"n":7,"t":"信息整理","f":["把乱糟糟的资料理成清单，好检查。"],"b":["AI能帮你把日期、事项挑出来排好。但资料里没有的东西，它只会留白或者编——你要让它留白。","举个例子：联系人没给，清单里就写\"待确认\"，不能编个名字。"]},{"n":8,"t":"方案比较","f":["AI能帮你列优缺点，但哪个好，得你说。"],"b":["发群消息还是贴纸质告示？AI能把两边优缺点列清楚。但你得告诉它你在乎什么——是更多人看到，还是省钱。","举个例子：老人多的社区，纸质告示可能反而更管用。"]},{"n":9,"t":"资料决定具体程度","f":["你的时间、对象和限制，AI不知道，得你说。"],"b":["它知道通知一般长什么样，但不知道你这家店的具体安排。把日期、对象、限制给它，比写一大段\"你是一个资深专家\"管用。","举个例子：把\"明天\"写成具体日期，顾客不会看错。"]},{"n":10,"t":"检查负担也算成本","f":["省下的时间，要减去核对和改错花的时间。"],"b":["AI写稿省5分钟，你改错花了10分钟——那其实更慢了。教学假设，数字是编的。做几次就能感觉出来值不值。","举个例子：写稿省5分钟，纠错多10分钟，等于白忙。"]},{"n":11,"t":"适合先试的任务","f":["从你熟悉、错了也容易改的小事开始。"],"b":["你最熟的活，最容易看出AI哪里写错了。陌生又专业的活，错了你都看不出来。第一次练手，挑件小事就好。","举个例子：拿一份你最熟的活动资料先试一遍。"]},{"n":12,"t":"人工判断的位置","f":["两个地方必须人把关——动笔前对事实，发出前再确认。"],"b":["写之前确认营业时间对不对，发之前把整条通知再看一遍。草稿改十遍都没关系，发出去就改不了了。","举个例子：草稿随便改，发顾客前必须过人这关。"]},{"n":13,"t":"任务要求","f":["给一场社区活动写通知，并列出需要人来确认的事。"],"b":["任务拆成三步，照着做：\n第一步，抄下已知信息：10月18日14:00，社区活动室，报名截止10月16日。\n第二步，写通知：只写这三条，人数没给就写\"待确认\"。\n第三步，列出哪些事必须人来定（比如：人数上限多少？通知谁来发？）。"]},{"n":14,"t":"示例答案","f":["营业时间调整通知：10月12日（周一）营业时间为10:00—18:00，仅当天调整，10月13日恢复原安排。请合理安排到店时间。"],"b":["示范：营业时间调整通知：10月12日（周一）营业时间为10:00—18:00，仅当天调整，10月13日恢复原安排。请合理安排到店时间。","对照原资料逐条核对：日期对、时间对、只改一天说清了、没编联系人。你的措辞可以不一样，事实不能错。"]},{"n":15,"t":"哪里出了错","f":["错误示例：本周营业时间统一改为10:00—18:00，欢迎致电张经理预约。"],"b":["错误示例：本周营业时间统一改为10:00—18:00，欢迎致电张经理预约。","错在哪：一天改成了七天，还编出来一个张经理。对照原资料，找到第一个开始编的地方。"]},{"n":16,"t":"改好，再检查","f":["改回\"仅10月12日当天\"，删掉张经理。"],"b":["两处改动：范围改回一天，删掉没有依据的联系人。改完从头再读一遍，确认没弄坏别的地方。"]},{"n":17,"t":"你也试一次","f":["给社区活动写通知＋列人工确认事项（三步见第13页）。"],"b":["照三步做：抄下已知信息（10月18日14:00、社区活动室、报名截止10月16日）→ 写通知，人数没给就写\"待确认\" → 列出要人来定的事。","多练一次：面馆老板老周收到消息：周三的货提前到早上9点。帮他给店员写条群消息。哪几箱先卸？消息里没说——空着，别编。老周45岁，开店12年，打字用一根手指，只求省事。（留意：没说的细节不要编。）","【现场跑一次｜选做】打开手机里任意一个AI应用，照这个填空说一件事：\"我要给____写一条____，内容是____。请保留____，不要编造____。\"把提问和回答都存下来——第16课结课要用。\n演示结果因模型与版本而异，以你自己的核对为准。"]},{"n":18,"t":"完成后检查这四点","f":["写对已知信息","没编没有的信息","列出了至少两处人工确认","说得出一件不能全交给AI的事"],"b":["写对已知信息。没编没有的信息。列出了至少两处人工确认。说得出一件不能全交给AI的事","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：AI写通知、挑出截止日期；人来定人数上限、决定发不发。人数没给就写\"待确认\"。"],"b":["示范：通知让AI来写，报名截止10月16日让它标出来；人数上限不知道，通知里写\"人数待确认\"，不编数字；发不发，等负责人看了再说。","对照第18页那四点自己检查。措辞不同没关系，说清\"为什么这么处理\"就行。"]},{"n":20,"t":"记住这两件事","f":["先拿自己熟悉的小事练手。","草稿可以给AI写，关键信息要对着资料核。"],"b":["一句话记住：AI管起草，你管签字。","通知要写得清楚，也要时间准确。AI起草，资料对时间，人拍板发不发。","用自己的话讲一遍这课讲了什么，再举一个\"还得人确认\"的例子。"]},{"n":21,"t":"任务适配的两个尺度","f":["两个问题：错了容不容易发现？错了后果大不大？"],"b":["活动通知的时间好核对，可以先试。陌生合同错了不好发现，后果还大，得谨慎。看的是具体这件事，不是整个职业。"]},{"n":22,"t":"能力与责任","f":["AI会写，不等于它有权发。"],"b":["\"写好\"和\"发出\"是两件事。谁提供事实、谁确认、谁发送，分清楚，出了问题才知道找谁。"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["生成：照你的要求写出新内容\n核验：对着资料检查\n辅助：帮忙干一部分活\n判断：哪个能用、发不发，人来定","AI管起草，你管签字。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["原论文和官方资料用于解释技术，个人分享提供实践思路。核查日期：2026-10-04。","Ethan Mollick普通人AI入门，2024\nhttps://www.oneusefulthing.org/p/getting-started-with-ai-good-enough","Language Models are Few-Shot Learners，2020\nhttps://arxiv.org/abs/2005.14165","一见AI：AI消耗与业绩，作者配文\nhttps://www.douyin.com/video/7691167895279242496\n本课取材于作者配文与页面标题。"]}],"ex":{"intro":["给一场社区活动写通知，并列出需要人来确认的事。已知：10月18日14:00，社区活动室，报名截止10月16日，人数没定。","怎么做：①把已知的三条抄下来 ②照着写一条通知，人数没给就写\"待确认\" ③列出至少两件要人来定的事。留10—15分钟。"],"sections":[{"h":"照着做一遍（示范）","paras":["示范：通知——\"社区活动通知：10月18日（周六）14:00在社区活动室举办，报名截止10月16日，人数待确认，欢迎参加。\"人工确认事项——①人数上限定多少 ②这版通知谁来发、发到哪。"],"items":[]},{"h":"多练一次","paras":["老周的面馆：周三供货提前到早上9点，帮老周给店员写条群消息。哪几箱先卸没说——留空，不要编。"],"items":[]},{"h":"现场跑一次（选做）","paras":["打开任意AI应用，说一件今天要做的小事，模板：\"我要给____写一条____，内容是____。请保留____，不要编造____。\"保存提问和回答，第16课要用。\n演示结果因模型与版本而异，以你自己的核对为准。"],"items":[]},{"h":"自己检查","paras":["课程案例均为虚构练习。使用AI时，可以记下应用、模型可见名称和日期，方便下次比较。"],"items":["已知信息全写对","没编资料里没有的信息","列出了至少两处人工确认","说得出一件不能全交给AI的事"]}]},"notes":["验收四点措辞简化，判定口径与原版一致：「没编没有的信息」对应原「未知人数没有猜测」。","「现场跑一次」为选做，不计分；记录供第16课结课对比使用。"]},{"id":2,"title":"AI怎样走到今天","intro":"可以边看图文边读，或用这份讲解复习。前置知识：第01课。最后四页为深入阅读。","pages":[{"n":1,"t":"AI怎样走到今天","f":["看懂AI的几次大变化，每次变化怎么用"],"b":["一句话版历史：先是人写死规则，后来机器自己从例子学，再后来学会了聊天、看图、干活。每次能力变了，用法也跟着变。","想一件自己的小事，带着它往下读。"]},{"n":2,"t":"先看这份资料","f":["整课用同一个任务：把营业资料写成通知，人确认。比较四种做法各能干哪段。"],"b":["任务从头到尾没变：把营业资料变成通知，再由人确认。变的只是工具：手写模板、分类模型、生成模型、带工具的Agent。","就这个任务，看不同年代的AI各能做到哪一步。"]},{"n":3,"t":"能力变化，使用方法也会变","f":["技术变了，老办法值得拿出来重新试试。"],"b":["以前靠人定死规则，现在可以直接跟AI说。老办法不一定作废——有些活老办法反而稳。","你也可以试试：报名截止日，用手写规则检查和让AI自由写通知，各适合哪部分。\n留意：别把历史讲成\"旧方法全作废\"。"]},{"n":4,"t":"技术变化怎样影响用法","f":["新能力带来新用法，好不好用要拿自己的活试。"],"b":["新功能出来，先别急着叫好，拿自己手头的任务试一试再说。","图中是简化示意，实际用时还是要自己查资料、看结果。"]},{"n":5,"t":"AI早于聊天应用","f":["1955年写了份提案，说1956年研究\"智能\"——这个\"夏天\"到今天快七十年了。"],"b":["讲个没讲完的夏天：1955年一群科学家写提案，打算1956年用一个夏天研究清楚\"智能\"。结果这个夏天到今天还没结束。（提案是真的，乐观也是真的。）","举个例子：报名截止日这种明确条件，用老式规则程序也能查。"]},{"n":6,"t":"规则系统","f":["人把规则写死，机器照着办。"],"b":["规则系统像自动售货机：按哪个键出哪罐，全是事先定好的。（打比方，帮助理解）条件明确时它最可靠；例外一多，人就得不停补规则。","举个例子：通知模板——人定好字段，机器只填日期和时段。"]},{"n":7,"t":"机器学习","f":["不写规则了，给机器看大量例子，让它自己找规律。"],"b":["机器学习像老店员认熟客：没人教过规则，上千张脸看下来自己就会了。（打比方，帮助理解）例子（垃圾邮件和正常邮件）给它看多了，它就学会分辨。但碰到没见过的新情况，就可能看走眼。","举个例子：拿大量标注过的邮件训练，模型学会分垃圾邮件。"]},{"n":8,"t":"深度学习","f":["很多层叠起来学，一层学一点。"],"b":["深度学习像厨师学徒：先练刀工，再练火候，一层一层往上，每层学的不一样。（打比方，帮助理解）层数多了，能认出更复杂的东西，但也更费数据和算力。","举个例子：认图片时，一层认线条，再一层认形状，一层层拼出完整图案。"]},{"n":9,"t":"2017与2020","f":["2017年的Transformer论文、2020年的GPT-3论文，让\"读文字就能学任务\"成为主流。"],"b":["2017年的一篇论文提出了新架构（Transformer），2020年的GPT-3证明：给它看几个例子，它就能照着做新任务。注意：论文发表不等于大家都用上了。","举个例子：GPT-3不用逐条写规则，给几个例子就行。"]},{"n":10,"t":"2022与2023","f":["2022年ChatGPT让人能一直追问改稿，2023年GPT-4能看图了。"],"b":["ChatGPT最大的变化：你可以接着问、接着改，不用一次到位。GPT-4：除了字，还能看图。发布时间要和实际开放时间分开看。","举个例子：改稿从\"重写一遍\"变成\"接着聊\"。"]},{"n":11,"t":"推理与工具循环","f":["有的模型会\"多想一会儿\"，有的系统能一边查一边干。"],"b":["新一代模型解题前会先多算一会儿。Agent则更进一步：查到结果、根据结果决定下一步。不管多能干，最后的结果还是要人检查。","举个例子：发现资料缺时间，Agent会先查工具，查不到再来问你。"]},{"n":12,"t":"方法随能力迭代","f":["模型升级了，老任务值得重跑一遍。"],"b":["模型换了，以前的老做法不一定还最优。固定资料和标准，把新旧做法各跑一遍比一比。","举个例子：以前通知固定写五段，新模型下可能短版更好——测了才知道。"]},{"n":13,"t":"任务要求","f":["比较四种做法，各能承担任务的哪一段。"],"b":["任务拆成三步，照着做：\n第一步，列四种做法：手写模板、分类模型、生成模型、带工具的Agent。\n第二步，对每种写一行：它负责哪段（填字段？认类型？写全文？查资料？）。\n第三步，检查：有没有不小心写成\"谁比谁都好\"？——没有这回事，只有\"谁适合哪段\"。"]},{"n":14,"t":"示例答案","f":["模板填字段；分类模型认类型；生成模型写全文；Agent能查资料推进任务，但要有权限和检查。"],"b":["示范（四行）：\n- 手写模板：填日期时段，语气死板。\n- 分类模型：认出\"这是营业调整通知\"，不会写内容。\n- 生成模型：整条通知都会写，事实要人核。\n- 带工具的Agent：自己查资料、写草稿，但只能干你授权的事。","对照三步检查：每种说清负责哪段、没有排优劣榜。"]},{"n":15,"t":"哪里出了错","f":["错误示例：2023年以后所有AI都会看图，2025年以后所有AI都能自主完成工作。"],"b":["错误示例：2023年以后所有AI都会看图，2025年以后所有AI都能自主完成工作。","错在哪：把某一家产品的发布说成\"所有AI\"都这样。论文、发布、你手上的产品，是三码事。"]},{"n":16,"t":"改好，再检查","f":["写清楚是哪个模型、哪个入口、什么任务，删掉\"所有\"。"],"b":["改法：把\"所有AI\"换成具体名字，把\"都能自主工作\"换成具体查证过的事。改完通读一遍。"]},{"n":17,"t":"你也试一次","f":["挑两个历史节点，各写：多了什么本事、能干什么新活、哪里还得人检查。"],"b":["照三步做：\n第一步，挑两个节点（比如2022和2023）。\n第二步，各写三行：多了什么本事／能干什么新活／哪里还得人检查。\n第三步，自查：有没有写\"所有AI\"？","换个讲法试试：王阿姨62岁，退休语文老师，说\"我们以前单位的电脑，干什么都要按菜单\"。请你用第06—08页的三个比方（售货机、认熟客、厨师学徒），给她讲讲现在AI和当年电脑差在哪，顺便告诉她哪部分还得人把关。","多练一次：报名截止日检查，手写规则和让AI自由写，各适合哪部分？\n留意：别把历史讲成旧方法全作废。"]},{"n":18,"t":"完成后检查这四点","f":["分得清提案、论文和产品的时间","每个节点连着一个具体用途","没写\"所有AI都……\"","说了旧方法的用处"],"b":["分得清提案、论文和产品的时间。每个节点连着一个具体用途。没写\"所有AI都……\"。说了旧方法的用处","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：ChatGPT让改稿变成聊天，仍要核事实；GPT-4能看图，仍要核文字；具体开放时间另查。"],"b":["示范（以2022、2023为例）：2022年ChatGPT——新用法是接着追问改稿，还得人核事实。2023年GPT-4——新用法是直接读照片，还得人核它读得对不对。旧的手写规则查截止日期，今天照样能用。","对照第18页四点自查。"]},{"n":20,"t":"记住这两件事","f":["AI每次升级，都拿自己的任务重新试一遍。","老办法不作废，好用就留着。"],"b":["一句话记住：工具换了，用法就得跟着换一遍。","规则、学习模型、聊天和看图，各有各的用处。变了就试，好用就留。","用自己的话讲一遍这课讲了什么，再举一个\"还得人确认\"的例子。"]},{"n":21,"t":"不同路线并存","f":["规则和模型可以拼在同一个系统里。"],"b":["截止日期对不对，规则一查就知道；通知写得好不好，交给模型。能用规则的地方，不必为了\"更像AI\"硬换掉。"]},{"n":22,"t":"变化的证据","f":["论文、发布会和你自己的体验，证明的不是一个范围。"],"b":["论文说的是实验里的成绩，发布会说的是产品开了什么功能，你自己的体验只算你自己这一例。别人的成功案例，不等于你也能成。"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["规则系统：照人写死的条件办事\n机器学习：从大量例子里找规律\n深度学习：多层网络一层层学\nAgent：看结果、定下一步的系统","工具换了，用法就得跟着换一遍。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["原论文和官方资料用于解释技术，个人分享提供实践思路。核查日期：2026-10-04。","达特茅斯提案，1955\nhttps://www-formal.stanford.edu/jmc/history/dartmouth/dartmouth.html","Attention Is All You Need，2017\nhttps://arxiv.org/abs/1706.03762","Language Models are Few-Shot Learners，2020\nhttps://arxiv.org/abs/2005.14165","ChatGPT原始发布，2022\nhttps://openai.com/index/chatgpt/","GPT-4技术报告，2023\nhttps://arxiv.org/abs/2303.08774","o1原始发布，2024\nhttps://openai.com/index/introducing-openai-o1-preview/","DeepSeek-R1原论文，2025\nhttps://arxiv.org/abs/2501.12948","Karpathy年度回顾，2025\nhttps://karpathy.bearblog.dev/year-in-review-2025/"]}],"ex":{"intro":["挑两个历史节点，各写：多了什么本事、能干什么新活、哪里还得人检查。","怎么做：①挑两个节点（比如2022、2023）②每个节点写三行 ③自查有没有写\"所有AI\"。留10—15分钟。"],"sections":[{"h":"照着做一遍（示范）","paras":["示范（2022年ChatGPT）：多了什么本事——能一直追问、接着改。新活——改稿像聊天一样来回磨。哪里还得人检查——它写的事实要自己核。\n（2023年GPT-4）：多了什么本事——能看图。新活——拍张照就能问。哪里还得人检查——图里的字它可能读错。"],"items":[]},{"h":"换个讲法试试","paras":["王阿姨说：\"我们以前单位的电脑，干什么都要按菜单。\"用第06—08页的三个比方给她讲讲这两个时代差在哪，并指出哪部分仍需要人检查。"],"items":[]},{"h":"多练一次","paras":["比较手写截止日规则和自由写通知：说明两种办法分别适合哪部分。\n留意：不把历史画成旧方法全部失效。"],"items":[]},{"h":"自己检查","paras":["课程案例均为虚构练习。使用AI时，可以记下应用、模型可见名称和日期，方便下次比较。"],"items":["分得清提案、论文和产品","每个节点连着具体用途","没写\"所有AI都……\"","说了旧方法的用处"]}]},"notes":["验收四点措辞简化，判定口径与原版一致；「分得清提案、论文和产品」对应原「区分提案、论文与产品时间」。","王阿姨场景仍为可选路径：用了三个比方中至少两个、并指出人把关的位置，才算贴合。"]},{"id":3,"title":"大模型怎样学会说话","intro":"可以边看图文边读，或用这份讲解复习。前置知识：第01—02课。最后四页为深入阅读。","pages":[{"n":1,"t":"大模型怎样学会说话","f":["能用自己的话讲清：AI是怎样一个字一个字接出回答的"],"b":["先玩个游戏。我说\"今天天气真\"，你脑子里是不是已经自动填上词了？AI天天玩这个接龙，玩得比我们快得多。这一课就讲它是怎么接的。","想一件自己的小事，带着它往下读。"]},{"n":2,"t":"先看这份资料","f":["教学句子：\"10月12日营业时间为10:00—18:00\"，要求改写成顾客通知。图里的分块和概率都是教学示意。"],"b":["教学句子：10月12日营业时间为10:00—18:00。请改写成顾客通知。所有Token分块、概率和注意力连线均为示意。","就这一句话。后面拆开看AI怎么处理它。"]},{"n":3,"t":"模型怎样接着写下去","f":["看懂文字经过哪几步，变成接下来的回答。"],"b":["三步：先把字切成小块，再算每个小块的意思，最后算出下一个最顺的词。","你也可以试试：\"欢迎参加\"后面能接好多话。接得顺，能证明活动日期是哪天吗？不能。\n留意：接得顺是语言能力，不是事实。"]},{"n":4,"t":"文字怎样变成回答","f":["文字先编码，再计算，得到下一个词的概率。"],"b":["你输入的字 → 切块 → 变成数 → 计算 → 输出下一个词。就这么循环。","图中是简化示意，实际系统更复杂，用时还是要查资料、看结果。"]},{"n":5,"t":"文字先变成Token","f":["Token是AI处理文字的小块，不一定正好是一个字。"],"b":["Token像积木块：一句话被拆成一块一块，一块不一定正好是一个字。（打比方，帮助理解）不同AI切法还不一样。","举个例子：\"明天／营业／时间\"只是切法示意，实际未必这么切。"]},{"n":6,"t":"Token变成向量","f":["每个小块变成一组数字，意思近的数字也近。"],"b":["向量像给积木记坐标：意思相近的词，坐标也挨得近。（打比方，帮助理解）AI看不懂字，只懂数——先翻译成数，才能算。","举个例子：第42号只是编号示意，真实的是一长串数字。"]},{"n":7,"t":"预测下一个单位","f":["AI不是知道答案，是算出哪个词接在这里最顺。"],"b":["接龙的本质：它给每个候选词算一个\"有多顺\"的分。（打比方，帮助理解）分高只说明顺，不代表这家店真是10点开门——开门时间得查资料。","举个例子：\"营业时间为\"后面可以接不同内容，它挑最顺的。"]},{"n":8,"t":"训练用误差调整参数","f":["训练就是：做大量接龙练习，错了就调。"],"b":["训练像刷题：预测错一点，就调一点内部的\"旋钮\"（参数），海量题目刷下来，接龙越来越顺。你平时聊天，不会触发重新训练。","举个例子：训练才调参数，平时聊天不调。"]},{"n":9,"t":"使用时产生答案","f":["平时聊天用的是训练好的模型，不是边聊边学。"],"b":["它在对话里记得你刚说的名字，不代表它\"学会了\"——那只是这次对话的临时记忆。","举个例子：本次对话用已有参数计算，不等于又训练了一遍。"]},{"n":10,"t":"注意力联系上下文","f":["AI读句子时，会自动多看相关的词。"],"b":["注意力像在嘈杂的聚餐里挑声音：一桌人同时说话，你总能听见喊你名字的那个人。（打比方，帮助理解）它也会\"偏心\"：写到\"周二恢复\"时，会多看前面\"周一调整\"那段。","举个例子：\"10月13日恢复\"要联系前面的调整日期才说得通。"]},{"n":11,"t":"层与上下文一起作用","f":["很多层一起算，词的顺序也很重要。"],"b":["AI不是查一张词表，是一层层加工。语序颠倒，意思就变：\"甲在乙前\"和\"乙在甲前\"不一样。","举个例子：每层都在加工，不是一步到位。"]},{"n":12,"t":"语言模式与事实","f":["话说得顺，事实还得另外核。"],"b":["它学到的是\"通知一般怎么写\"，不是\"你家店几点开门\"。格式它熟，日期它可能编。所以原资料永远要自己留着。","举个例子：最像通知的时间，也可能不是这家店真实的时间。"]},{"n":13,"t":"任务要求","f":["给\"报名截止时间为____\"补两个续写，并说说AI为什么需要原资料。"],"b":["任务拆成三步，照着做：\n第一步，给\"报名截止时间为____\"补两个可能的接法（比如\"10月16日\"\"待确认\"）。\n第二步，回答：这里Token、训练、注意力各干了啥？（各一句话就行）\n第三步，回答：要是手头没有截止日期的资料，该怎么办？（提示：问人，或者留空）"]},{"n":14,"t":"示例答案","f":["句式提示它可能接一个日期；原资料把答案限定为10月16日。它的能力和你的资料，一起决定输出。"],"b":["示范：\n第一步，两个接法：\"10月16日\"／\"待确认\"。\n第二步，Token——先把句子切块；训练——它见过大量类似句式；注意力——会联系前文提到的活动。\n第三步，没资料就不该猜：去问主办方，或写\"待确认\"。","对照三步检查。"]},{"n":15,"t":"哪里出了错","f":["错误示例：10:00的示意概率最高，因此这家店一定10点开门。"],"b":["错误示例：10:00的示意概率最高，因此这家店一定10点开门。","错在哪：把\"接得顺\"当成了\"是真的\"。概率是语言的事，事实要查资料。"]},{"n":16,"t":"改好，再检查","f":["写明概率是教学假设，真实时间只认原资料。"],"b":["改法：注明\"这是教学假设\"，真实营业时间只引用原资料。改完通读一遍。"]},{"n":17,"t":"你也试一次","f":["给\"报名截止时间为____\"补两个续写＋解释四个词＋没资料怎么办（三步见第13页）。"],"b":["照三步做：补两个接法 → 各用一句话解释Token、训练、推理、注意力 → 回答没资料怎么办。","【现场跑一次｜选做】打开任意AI应用，输入\"营业时间为\"，让它接三次。三次一样吗？再补一句\"本店10:00—18:00营业\"重新问。看看补了资料之后，它的接龙有什么变化。\n演示结果因模型与版本而异，以你自己的核对为准。","多练一次：\"欢迎参加\"能接很多话——接得顺，能证明活动日期吗？\n留意：接得顺是语言，不是事实。"]},{"n":18,"t":"完成后检查这四点","f":["没把Token当成一个汉字","分得清训练和平时使用","没把概率当成事实","说得出注意力是干嘛的、会失手吗"],"b":["没把Token当成一个汉字。分得清训练和平时使用。没把概率当成事实。说得出注意力是干嘛的、会失手吗","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：可接日期或\"待确认\"。切块→训练调好的参数→算出候选→注意力联系前文。没资料就问人或留空。"],"b":["示范（一句话版）：先把句子切成Token，用训练时调好的参数计算，注意力联系前文，算出接什么最顺；概率高不等于真，没资料就问人或者留空。","对照第18页四点自查。"]},{"n":20,"t":"记住这两件事","f":["AI是一个词一个词接着写的。","话说得通，不等于事是真的。"],"b":["一句话记住：AI不是在回答你，是在接你的话茬。","切块、算概率、挑最顺的接上。要答对事实，还得靠你递资料。","用自己的话讲一遍这课讲了什么，再举一个\"还得补资料\"的例子。"]},{"n":21,"t":"注意力的计算直觉","f":["它给每个词打\"相关度\"，相关度高的多看两眼。"],"b":["写\"恢复\"时，它给前文每个词算一个相关分，分高的多参考。但打分可能打错——它没长眼睛，分高不代表真找对了。"]},{"n":22,"t":"参数、上下文与记忆","f":["参数是训练来的本事，上下文是这次对话给的资料。"],"b":["本事（参数）训练完就固定了；这次对话说了什么，是临时给的资料。产品的\"记住我\"功能另有存储，别全当成它变聪明了。"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["Token：文字被切成的小块\n向量：表示意思的一组数\n参数：训练时调好的内部数值\n注意力：挑相关内容多看的机制","AI不是在回答你，是在接你的话茬。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["读法提示：原论文不用逐行啃——先看摘要和图1，再翻回本课第05—07页对照着看。","原论文和官方资料用于解释技术，个人分享提供实践思路。核查日期：2026-10-04。","Attention Is All You Need，2017\nhttps://arxiv.org/abs/1706.03762","Language Models are Few-Shot Learners，2020\nhttps://arxiv.org/abs/2005.14165","InstructGPT人类反馈论文，2022\nhttps://arxiv.org/abs/2203.02155"]}],"ex":{"intro":["给\"报名截止时间为____\"补两个可能续写，说说Token、训练、推理、注意力各自干了啥；没有截止日期资料时该怎么办。","怎么做：①补两个接法 ②四个词各用一句话解释 ③回答\"没资料怎么办\"。留10—15分钟。"],"sections":[{"h":"照着做一遍（示范）","paras":["示范：接法一\"10月16日\"，接法二\"待确认\"。Token——把句子切成小块；训练——参数早就调好了；推理——现在按参数算出候选；注意力——联系前文的活动信息。没资料——问主办方，或写\"待确认\"，不猜。"],"items":[]},{"h":"现场跑一次（选做）","paras":["输入\"营业时间为\"让AI续写三次，看三次是否一样；再补一句\"本店10:00—18:00营业\"重问，记录变化。\n演示结果因模型与版本而异，以你自己的核对为准。"],"items":[]},{"h":"多练一次","paras":["\"欢迎参加\"可以有多种续写。解释为何流畅续写不能证明活动日期。\n留意：区分语言预测与现实事实。"],"items":[]},{"h":"自己检查","paras":["课程案例均为虚构练习。使用AI时，可以记下应用、模型可见名称和日期，方便下次比较。"],"items":["没把Token当成一个汉字","分得清训练和平时使用","没把概率当成事实","说得出注意力是干嘛的"]}]},"notes":["验收四点措辞简化，判定口径与原版一致。","现场跑一次选做不计分；学员引用自己看到的现象即可作佐证，不要求与参考答案措辞一致。"]},{"id":4,"title":"AI为什么会推理，也会胡说","intro":"可以边看图文边读，或用这份讲解复习。前置知识：第03课。最后四页为深入阅读。","pages":[{"n":1,"t":"AI为什么会推理，也会胡说","f":["明白AI为什么能解题，又为什么能把没影的事说得像真的"],"b":["班里是不是有这种同学：数学大题步步清楚，问他昨天的新闻细节，也能张口就来——就是编的。AI有时候就是这位同学。这一课讲它为什么能解题、为什么会编。","想一件自己的小事，带着它往下读。"]},{"n":2,"t":"先看这份资料","f":["虚构资料只写了\"周一调整营业时间\"六个字的事，日期、时段、联系人都没给。"],"b":["虚构资料仅写\"周一调整营业时间\"，未给日期、时段或联系人。","就这一句。谁来写通知，都得先补问——谁编了，谁就错了。"]},{"n":3,"t":"推理能力与事实可靠性","f":["会解题不等于知道事实。缺的资料，想多久也想不出来。"],"b":["推理能帮它解复杂的题，但缺的资料不会凭空想出来。算得越久，答案越像真的——但\"像\"不等于\"是\"。","你也可以试试：一份摘要里补出了没给过的预算数。你打算怎么核对？\n留意：查原始记录，别拿AI自己的话证明AI。"]},{"n":4,"t":"推理之后怎样检查","f":["推理帮它解题，结果还得你对着资料查。"],"b":["它想得再周密，最后一关还是：回原资料，逐条对。","图中是简化示意，实际用时还是要自己查资料、看结果。"]},{"n":5,"t":"训练与推理","f":["训练是它\"上课\"，使用是它\"做题\"。"],"b":["训练改的是它脑子里的参数（上课），使用是拿参数做你这道题（做题）。这只是个帮助理解的比法，它不是真的人。","举个例子：这里说的推理是\"做题\"，不是\"上课\"。"]},{"n":6,"t":"指令训练","f":["额外训练让它更听话，但听话不等于说真话。"],"b":["后面还有一轮训练：人给它示范和反馈，让它更会照吩咐办事。但它可能把吩咐完成得漂漂亮亮，同时补一个假联系人。","举个例子：学会了听话，照样可能编联系人。"]},{"n":7,"t":"推理计算","f":["有的模型答题前会多算一会儿。多算能解难题，变不出缺的资料。"],"b":["复杂题多算一会儿有帮助；缺的营业时间，算到天荒地老也没有——得查表。简单问题也用不着它长篇大论。","举个例子：难题多算些，最后还是要核对结果。"]},{"n":8,"t":"奖励与可检验任务","f":["能对答案的题（数学、代码），练得快；开放题没有标准答案。"],"b":["数学题能对答案，代码能跑一遍验证，所以这类能力进步快。通知写得对不对，没有现成答案——还得你对资料。","举个例子：算术题核答案就行，通知要核真实资料。"]},{"n":9,"t":"幻觉怎样出现","f":["它的本职是接顺句子，不是查对事实。缺资料时，它倾向于\"编一个像真的\"。"],"b":["模型的本职是把句子接顺，不是把事实查对。碰到不知道的事，它的第一反应不是闭嘴，而是\"填一个像真的上去\"——幻觉就是这么来的。（打比方，帮助理解）","而且它编的时候语气特别肯定，这就是最骗人的地方。","举个例子：不知道营业时段，却补出10:00—18:00。"]},{"n":10,"t":"能力并不均匀","f":["大题做得好，小细节照样错。"],"b":["它会写分析报告，也可能把日期写错。别因为一次好用就全信——拿你自己的活、包括刁钻的情况，试过再说。","举个例子：报告逻辑通顺，某个日期照样写错。"]},{"n":11,"t":"自检的局限","f":["让它自己检查自己，可能错得前后一致。"],"b":["你让它\"再检查一遍\"，它可能顺着原来的错误接着圆。更可靠的做法：对着原资料的具体字段查，用计算器等工具独立算。","举个例子：它说\"确认无误\"，你还得回资料看。"]},{"n":12,"t":"未知需要被保留","f":["缺事实就问，或者写\"待确认\"。用不上的信息，不用补。"],"b":["没有时间、没有联系人？要么问，要么留空。通知根本不需要联系人，就更不用补了。","举个例子：联系人用不上，就不必为了\"看起来完整\"编一个。"]},{"n":13,"t":"任务要求","f":["列出写通知缺哪些事实，只问必须问的，不猜。"],"b":["任务拆成三步，照着做：\n第一步，对照资料（只有\"周一调整营业时间\"一句），列出缺什么：具体日期？几点到几点？只改一天吗？\n第二步，把要补问的问题写出来——只问必须问的，别一口气问十个。\n第三步，自查：日期、时间、联系人，一个都没猜吧？"]},{"n":14,"t":"示例答案","f":["要确认：具体日期、当天时段、是否只改一天。联系人用不上，可以不问。"],"b":["示范：\n缺的事实——①具体哪天 ②当天几点到几点 ③是不是只改周一这一天。\n补问——\"请告知：具体日期、当天营业时段、是否仅当天生效。\"\n联系人——通知里用不上，不问也不编。","对照三步检查。"]},{"n":15,"t":"哪里出了错","f":["错误示例：周一10:00—18:00营业，请联系李经理。"],"b":["错误示例：周一10:00—18:00营业，请联系李经理。","错在哪：时间、联系人全是编的，但语气特别顺——顺，恰恰是它骗人的地方。"]},{"n":16,"t":"改好，再检查","f":["删掉猜的，只留必须问的问题；资料补齐再写。"],"b":["改法：删掉编的时间和李经理，只留三个补问。资料回来之后再动笔。改完通读一遍。"]},{"n":17,"t":"你也试一次","f":["给一份\"看着顺但有编造\"的答案做标注：哪些是事实、哪些是猜的、哪些是编的，再想一个独立的核对办法。"],"b":["照三步做：\n第一步，找（或自己写）一份流畅但含两处没依据细节的回答。\n第二步，逐句标注：事实（有资料）／推断（有线索）／编的（没依据）。\n第三步，给每处\"编的\"设计核对办法——注意：再问AI一遍不算核对。","换个小林的例子试试：小林21岁，大三，AI用得飞起，也从不多看一眼。她让AI写社团招新文案，AI写了句\"本社团连续三年获校级优秀\"。小林去查了——没这回事。请标注这句话属于哪类，再帮小林想一步独立的核对办法。她口头语\"它说的应该没问题吧\"，错在哪半句？","【现场跑一次｜选做】去问AI一个你自己编的\"历史事件\"——比如\"我们市2019年办的双币节是怎么来的\"（根本没有这个节）。看它是老实说不知道，还是流畅地编一段。做一次，比听十遍管用。\n演示结果因模型与版本而异，以你自己的核对为准；本演示不构成对任何产品的评价。","多练一次：一份流畅摘要补出了没给的预算数，设计一次独立核对。\n留意：查原记录，不用同一回答反复自证。"]},{"n":18,"t":"完成后检查这四点","f":["标出了至少两处没依据的细节","没把\"它会推理\"当成\"它知道事实\"","有独立于AI的核对办法","没逼着把不知道的变成确定的"],"b":["标出了至少两处没依据的细节。没把\"它会推理\"当成\"它知道事实\"。有独立于AI的核对办法。没逼着把不知道的变成确定的","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：日期查原通知，数字用计算器；缺联系人就留空。AI自己再说一遍\"没错\"，不算证据。"],"b":["示范：标注——时段和联系人是编的。核对——日期翻原始通知，数字用计算器重算。联系人——资料没给就留空，不补。注意：让AI再确认一遍\"对不对\"，不算独立核对，因为它可能错得前后一致。","对照第18页四点自查。"]},{"n":20,"t":"记住这两件事","f":["它会解题，也会编。","缺资料时，补资料比反复追问管用。"],"b":["一句话记住：它张口就来，出了错可是你的事。","推理帮它解题，不帮它知道事实。缺什么，你补什么。","用自己的话讲一遍这课讲了什么，再举一个\"还得补资料\"的例子。"]},{"n":21,"t":"为什么正确率不等于可靠性","f":["十次对九次，错的那次可能正砸在要害上。"],"b":["教学假设：10份通知对9份，错的那份偏偏改了营业日期——这个\"90%正确\"对你没用。关键字段要单独盯。"]},{"n":22,"t":"推理过程与解释","f":["它展示的\"思考过程\"不等于它真在想什么。"],"b":["它写得头头是道，不代表内部真是这么算的。别被\"思考\"的样子唬住，答案还是要对资料。"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["推理：用模型算当前这道题\n后训练：上课之后的补习\n幻觉：没依据却说得像真的\n核验：对着独立的依据查","它张口就来，出了错可是你的事。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["原论文和官方资料用于解释技术，个人分享提供实践思路。核查日期：2026-10-04。","InstructGPT人类反馈论文，2022\nhttps://arxiv.org/abs/2203.02155","o1原始发布，2024\nhttps://openai.com/index/introducing-openai-o1-preview/","DeepSeek-R1原论文，2025\nhttps://arxiv.org/abs/2501.12948","OpenAI推理模型提示建议\nhttps://developers.openai.com/api/docs/guides/reasoning-best-practices","Karpathy年度回顾，2025\nhttps://karpathy.bearblog.dev/year-in-review-2025/"]}],"ex":{"intro":["找一份看起来流畅但含两处无依据细节的回答，标出事实、推断与编造，并设计独立核对办法。","怎么做：①找或写一份流畅回答 ②逐句标三类 ③给\"编的\"配独立核对办法（再问AI不算）。留10—15分钟。"],"sections":[{"h":"照着做一遍（示范）","paras":["示范（用小林的例子）：\"本社团连续三年获校级优秀\"——查无此事，属于编造（没依据的陈述）。独立核对——去查社团往年的评比记录，或问指导老师（再问AI一遍不算）。"],"items":[]},{"h":"换个小林的例子试试","paras":["小林让AI写社团招新文案，AI写了句\"本社团连续三年获校级优秀\"，查了没这回事。标出这句话属于事实、推断还是编造，再设计一步独立核对。"],"items":[]},{"h":"现场跑一次（选做）","paras":["问AI一个你自己编的\"历史事件\"，看它说不知道还是流畅地编。做一次，胜过十遍叮嘱。\n演示结果因模型与版本而异；本演示不构成对任何产品的评价。"],"items":[]},{"h":"多练一次","paras":["一份流畅摘要补出了未给的预算，设计一次独立核对。\n留意：查原记录，不用同一回答反复自证。"],"items":[]},{"h":"自己检查","paras":["课程案例均为虚构练习。使用AI时，可以记下应用、模型可见名称和日期，方便下次比较。"],"items":["标出了至少两处无据细节","没把推理当成事实来源","有独立于AI的核对办法","没逼未知变确定"]}]},"notes":["验收四点措辞简化，判定口径与原版一致；「没把推理当成事实来源」对应原「推理不当作新事实来源」。","现场跑一次选做不计分；引用演示结果须注明\"我试到的情况\"。"]},{"id":5,"title":"文字、图片和声音怎样生成","intro":"可以边看图文边读，或用这份讲解复习。前置知识：第03—04课。最后四页为深入阅读。","pages":[{"n":1,"t":"文字、图片和声音怎样生成","f":["分清\"认图、画图、改图\"三件事，知道每一步该检查什么"],"b":["同一份活动资料，可以变成通知、海报、广播稿。每变一次身，都可能出错一次。原资料攥在手里，才能查出哪一步开始错的。","想一件自己的小事，带着它往下读。"]},{"n":2,"t":"先看这份资料","f":["虚构需求：把10月12日10:00—18:00的通知做成店内海报，再准备一份广播稿。"],"b":["虚构需求：将10月12日10:00—18:00的通知做成店内海报，另准备广播稿。","两个产出：一张海报、一段广播稿。日期和时间是命根子。"]},{"n":3,"t":"识别、生成和编辑","f":["认图、画图、改图是三件不同的事，要检查的东西也不同。"],"b":["读照片叫识别，做海报叫生成，改日期叫编辑。三件事，三种错法，三套检查。","你也可以试试：读活动表照片→做海报→写广播稿，列出每一步要核对什么。\n留意：原图、海报文字、广播读音，要分开核。"]},{"n":4,"t":"资料变成不同形式","f":["同一份资料变几种形式，每一步都要查。"],"b":["每换一种形式，就多一次出错机会。别偷懒，一步一步核。","图中是简化示意，实际用时还是要自己查资料、看结果。"]},{"n":5,"t":"先看输入与输出","f":["先弄清你要给它什么、要它给回什么。"],"b":["从照片里抠文字＝识别；照着文字做海报＝生成；在旧海报上改日期＝编辑。很多应用只会其中一两样，用之前先问清楚。","举个例子：读海报是识别，写海报是生成，改日期是编辑。"]},{"n":6,"t":"文字的顺序生成","f":["AI写字是一个词一个词接着蹦的，蹦得顺不等于对。"],"b":["它按顺序往外蹦词。句子再通顺，日期照样可能错——别因为读着顺就省了核对。","举个例子：句子流畅，日期仍要对资料。"]},{"n":7,"t":"扩散的直觉","f":["生图模型像从一团噪点里一步步\"对焦\"出图。"],"b":["生图模型干活像从毛玻璃慢慢对焦：一开始是一团模糊的色块，一步一步变清楚，最后才是那张图。（打比方，帮助理解）注意：不是\"揭开一张藏起来的照片\"，是逐步算出来的新图。","举个例子：去噪是计算过程，不是揭秘旧照片。"]},{"n":8,"t":"图像也有不同路线","f":["生图产品不止一种算法，别拿一种原理解释所有产品。"],"b":["扩散只是其中一种代表做法。各家的产品细节未必公开，用的时候还是看结果：图里的字对不对。","举个例子：光看成品，猜不出内部用了什么算法。"]},{"n":9,"t":"语音识别","f":["声音转文字，姓名和数字最容易被转错。"],"b":["背景吵、口音重，都可能转错。\"十点\"转成\"四点\"，后面的总结写得再好也是错的。原录音要留着，随时回听。","举个例子：录音里的\"十点\"可能被转成\"四点\"。"]},{"n":10,"t":"语音生成","f":["文字能变成人声，但读音和停顿要回听。"],"b":["播广播前，回听三处：日期读法、时间读法、停顿位置。另外：AI合成的声音，不等于真人说过这些话。","举个例子：18:00读成\"下午六点\"对不对？回听确认。"]},{"n":11,"t":"多模态协作","f":["一个应用里可能是好几个模型在接力干活。"],"b":["读表、写稿、改图，可能是不同组件干的。选应用时看三样：能收什么、能给什么、结果怎么查。","举个例子：先核原表，再核海报，最后核广播读音。"]},{"n":12,"t":"重要文字保留可编辑层","f":["日期、金额、地址，别烧死在图片里。"],"b":["AI画的图，字经常错，改起来还牵一发动全身。办法：重要文字放在可单独编辑的层里，核对后再导出。生成图可以配着玩，但不能顶替真实资料。","举个例子：活动日期放可编辑层，错了改一个字就行。"]},{"n":13,"t":"任务要求","f":["先挑出已确认的事实，再分别写海报文字和广播稿。"],"b":["任务拆成三步，照着做：\n第一步，抄事实：10月12日，10:00—18:00，仅当天调整。\n第二步，写海报文字（日期要放在能单独改的地方）＋广播稿（日期时间写成好念的）。\n第三步，自查：地址没给吧？没补写吧？"]},{"n":14,"t":"示例答案","f":["海报：10月12日营业时间10:00—18:00，仅当天调整。广播稿：十月十二日，营业时间调整为上午十点至下午六点。"],"b":["示范：\n海报文字——\"营业时间调整：10月12日 10:00—18:00（仅当天）\"。\n广播稿——\"各位顾客，十月十二日当天，本店营业时间调整为上午十点至下午六点，请合理安排到店时间。\"\n地址——资料没给，不写。","对照三步检查。"]},{"n":15,"t":"哪里出了错","f":["错误示例：海报印成10月21日，广播把18:00读成晚上八点。"],"b":["错误示例：海报出现10月21日，广播把18:00读成晚上八点。","有画面的版本：海报印出来了，颜色漂亮，排版讲究——直到有顾客指着日期问：\"这不是写的21号吗？\"200张海报，错一个字。","错在哪：换成图、换成声音，事实就悄悄变了。教学构造，未进行媒体生成。"]},{"n":16,"t":"改好，再检查","f":["文字对原时间逐项核，广播回听，海报文字保持可编辑。"],"b":["改法：海报文字逐字对资料，广播回听日期和时间读法，日期放回可编辑层。改完通读一遍。"]},{"n":17,"t":"你也试一次","f":["给\"读照片→做通知→播广播\"排好三步，每步写检查项。"],"b":["照三步做：\n第一步，排步骤：识别（读照片）→生成（写通知、广播稿）→编辑（改海报）。\n第二步，每步写一行检查项（识别核原图数字／生成核事实／编辑核改动没伤到别处）。\n第三步，自查：哪一步的检查依赖原资料？","再帮王阿姨想想：王阿姨想把广场舞队的停练通知做成一张图发到群里。帮她列一下——哪些字必须能单独改？图生成之后，她得回头看哪几处？","【现场跑一次｜选做】有条件的：任选一个AI绘图应用，把本课海报的文字原样输进去生成一张图，检查日期、时间和\"仅当天\"三处——错了几个？没条件的纸笔版：找一张真实海报，把所有\"必须一字不差\"的字圈出来，数数有多少处。\n演示结果因模型与版本而异，以你自己的核对为准。","多练一次：读活动表照片，再做海报与广播。列每个环节要检查的数字。\n留意：分别核原图、海报文字和原声读法。"]},{"n":18,"t":"完成后检查这四点","f":["三件事（识别/生成/编辑）分得清","每一步都有检查对象","重要数字能追回原资料","示意图没有冒充真东西"],"b":["三件事（识别/生成/编辑）分得清。每一步都有检查对象。重要数字能追回原资料。示意图没有冒充真东西","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：读图核原图日期，写稿核范围，海报核可编辑字，广播核读音。生成图不能当现场照片。"],"b":["示范：识别——先核照片里的日期读对了没；生成——核时间范围；海报——核文字层能单独改；广播——回听\"十月十二日\"\"下午六点\"的读法。AI生成的场景图是配图，不是现场照片。","对照第18页四点自查。"]},{"n":20,"t":"记住这两件事","f":["先分清是在认图、画图还是改图。","日期、数字、名字，回原资料核。"],"b":["一句话记住：图好看不算完，图里的字才是大事。","每换一次形式，多查一遍。原资料在手，才知道哪步开始错。","用自己的话讲一遍这课讲了什么，再举一个\"还得补资料\"的例子。"]},{"n":21,"t":"扩散的训练与采样","f":["它学的是\"怎么从噪点变清晰\"，噪点里没藏着哪张真照片。"],"b":["所以生成的\"活动现场图\"不能标成真实现场——那张图在按下生成键之前不存在。"]},{"n":22,"t":"多模态的能力边界","f":["一个应用会读图会写字，不代表每样都准。"],"b":["读小字和写长文，可能是两个部件，错法也不同。出了错，回到最早出偏差的那一步查，别只改最后的结果。"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["多模态：能同时处理文字、图、声音\n识别：从输入里读出信息\n生成：做出新内容\n编辑：改已有的内容","图好看不算完，图里的字才是大事。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["原论文和官方资料用于解释技术，个人分享提供实践思路。核查日期：2026-10-04。","去噪扩散模型原论文，2020\nhttps://arxiv.org/abs/2006.11239","Whisper语音识别论文，2022\nhttps://arxiv.org/abs/2212.04356","GPT-4技术报告，2023\nhttps://arxiv.org/abs/2303.08774"]}],"ex":{"intro":["给\"读照片里的活动表，做通知并播报\"排出识别、生成、编辑三步，每步写检查项。","怎么做：①排三步 ②每步写一行检查项 ③标出哪步依赖原资料。留10—15分钟。"],"sections":[{"h":"照着做一遍（示范）","paras":["示范：①识别——读照片，核日期\"10月18日\"有没有读错；②生成——写通知和广播稿，核时间范围；③编辑——改海报日期，核没伤到别的字。依赖原资料的：三步都依赖，原图是根。"],"items":[]},{"h":"再帮王阿姨想想","paras":["王阿姨想把广场舞队的停练通知做成一张图发到群里。列出：哪些字必须能单独改？图生成之后，她得回头看哪几处？"],"items":[]},{"h":"现场跑一次（选做）","paras":["有条件：用任意AI绘图应用生成本课海报，检查日期、时间、\"仅当天\"三处是否正确。没条件：找一张真实海报，圈出所有\"必须一字不差\"的字。\n演示结果因模型与版本而异，以你自己的核对为准。"],"items":[]},{"h":"多练一次","paras":["读活动表照片，再做海报与广播。列每个环节要检查的数字。\n留意：分别核原图、海报文字和原声读法。"],"items":[]},{"h":"自己检查","paras":["课程案例均为虚构练习。使用AI时，可以记下应用、模型可见名称和日期，方便下次比较。"],"items":["三件事分得清","每步有检查对象","重要数字能追回原资料","示意图没冒充真东西"]}]},"notes":["验收四点措辞简化，判定口径与原版一致；「三件事分得清」对应原「三类任务区分准确」。","王阿姨场景可并答；可编辑层清单须含日期，回看项须含图中文字与原图核对。"]},{"id":6,"title":"模型、应用和工具怎样选","intro":"可以边看图文边读，或用这份讲解复习。前置知识：第01—05课。最后四页为深入阅读。","pages":[{"n":1,"t":"模型、应用和工具怎样选","f":["别问哪个最强，问哪个够用；拿自己的活去比"],"b":["选AI工具最容易犯的错，是天天问\"哪个最强\"。该问的是：我这件活，哪个够用？评分榜第一名，未必会做你明天要交的那件事。","想一件自己的小事，带着它往下读。"]},{"n":2,"t":"先看这份资料","f":["虚构比较：A只收文字，能导出文本；B收图片＋文字，能导出表格。你的任务：从照片营业表里挑日期。"],"b":["虚构比较：方案A只接文字，能导出文本；方案B接图片和文字，能导出表格。当前任务是从照片营业表提日期。","任务先摆明：照片进、日期出。A直接出局——它连照片都收不了。"]},{"n":3,"t":"选应用时先看任务","f":["先列你的活需要什么，再拿同一个任务试几个应用。"],"b":["三步选法：①我的活需要它收什么、给什么？②拿同一份资料试它 ③质量、等待时间、修改成本一起算。","你也可以试试：要把长通知改成短消息，列必要条件和两种会搞砸的情况。\n留意：简单文字活，别追求花哨功能。"]},{"n":4,"t":"从任务到应用选择","f":["先写清必要条件，再用同样的资料试用。"],"b":["条件清单写好了，比较才有依据。空谈\"谁好用\"没有意义。","图中是简化示意，实际用时还是要自己查资料、看结果。"]},{"n":5,"t":"模型与应用","f":["模型是发动机，应用是整辆车。"],"b":["同一个模型，装进不同应用，功能差很多：有的能传文件，有的能存记忆，有的能搜网。按钮能干的事，不全是模型自己的本事。","举个例子：同一台发动机，配不同车，跑起来不一样。"]},{"n":6,"t":"先明确输入输出","f":["先把任务说具体，再看产品接得住吗。"],"b":["任务写具体：照片挑日期＝收图片、出清单；写通知＝留住事实、写清楚。条件列出来，挨个对。","举个例子：照片挑日期，先看能不能传图。"]},{"n":7,"t":"质量有不同维度","f":["对不对、好不好读、打不打开得开，分开查。"],"b":["通知写得美但改了日期＝不合格；表格能打开但漏了事项＝也要返工。把\"事实、表达、格式、功能\"四样分开打分，问题看得清。","举个例子：语气好但日期错了，照样不能用。"]},{"n":8,"t":"用自己的任务比较","f":["同一份资料、同一套标准，比出来才算数。"],"b":["拿三种资料试：正常的、缺信息的、互相矛盾的。固定问法和设置，记录你改了多少处。试得少，结论就只对这几个例子负责。","举个例子：同一份资料分别试三种情况。"]},{"n":9,"t":"计算与等待成本","f":["总账＝钱＋等待时间＋你改错花的时间。"],"b":["单价便宜但改十遍，总成本可能更高。价格变动快，别背价目表，记自己的账。","举个例子：便宜但要反复纠错，总花费未必低。"]},{"n":10,"t":"Token像计量单位","f":["用得多不等于干得好。"],"b":["Token像电表读数：转得快不代表家里更亮堂。（借电表比喻）评价看核对后的成果，不看消耗数字。","举个例子：烧了更多Token，不证明通知更可用。"]},{"n":11,"t":"条件与可迁移性","f":["保留原资料和提示词，换个工具还能重跑。"],"b":["活都攒在一个平台里出不来，换工具就很被动。原资料、提示词、检查标准自己留一份，随时能搬家。","举个例子：留好资料和提示，换工具重试一遍就行。"]},{"n":12,"t":"选择是阶段性决定","f":["够用就用，变了再比。"],"b":["先选一个够用的开始干活。模型升级了、收费变了、功能变了，再拿老任务重新比一轮。","举个例子：模型升级后，把原来的小测试重跑一遍。"]},{"n":13,"t":"任务要求","f":["给三类任务各写选择依据，并设计三个\"同条件\"的试用。"],"b":["任务拆成三步，照着做：\n第一步，三类任务：写文字通知／从图片挑数据／多步骤整理资料。\n第二步，每类写：必须能输入什么？必须输出什么？怎么检查？\n第三步，设计三个试用输入（正常的、缺信息的、有冲突的），保证测试条件一样。别去猜真实产品的价格。"]},{"n":14,"t":"示例答案","f":["先排除收不了图片的A。B满足入口条件，但识别准不准、导出行不行、总成本多少，还得试用。"],"b":["示范（图片挑数据为例）：必要条件——能收照片、能出清单；检查——对照原表核日期；试用——同一张表发给A和B，A收不了直接出局，B试试小字识别准不准。","对照三步检查。"]},{"n":15,"t":"哪里出了错","f":["错误示例：B功能多，所以所有任务都该用B。"],"b":["错误示例：B有更多功能，因此所有任务都应该用B。","错在哪：拿功能数量代替任务匹配。写个短消息用B？杀鸡用牛刀，还慢。"]},{"n":16,"t":"改好，再检查","f":["先对必要条件，再用三种输入测质量；文字通知另测。"],"b":["改法：回到条件清单——收照片是硬条件；然后正常／缺失／冲突三种输入各测一遍。改完通读一遍。"]},{"n":17,"t":"你也试一次","f":["为三类任务写选择依据＋三个同条件试用输入（三步见第13页）。"],"b":["照三步做：列三类任务 → 每类写输入／输出／检查 → 设计三个试用输入。","帮老周算一算：老周想每周让AI出一版排班表初稿。替他列选择依据——必须能输入什么？输出的表要能拿去干什么？他不懂技术，检查的功夫得控制在什么程度？","【现场跑一次｜选做】同一份资料、同一个问题，发给两个不同的AI应用。回答并排摆好，按事实、表达、格式、功能各打一分——你的第一张测评表就有了。\n演示结果因模型与版本而异，以你自己的核对为准。","多练一次：要把长通知改成短消息。列必要条件和两种会搞砸的情况。\n留意：简单文字活，别追求花哨功能。"]},{"n":18,"t":"完成后检查这四点","f":["输入输出写得明确","检查标准真实可查","比较时条件一致","没下\"永久最佳\"的结论"],"b":["输入输出写得明确。检查标准真实可查。比较时条件一致。没下\"永久最佳\"的结论","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：通知看事实保留，图片提取看识别和导出，多步骤任务加检查点。费用、等待、修改量都记下来。"],"b":["示范（老周排班表）：必须能收员工名单和工时；输出要能直接抄进群里；检查控制在\"扫一眼日期和班次对不对\"——他不懂技术，不能要求他跑代码。","对照第18页四点自查。"]},{"n":20,"t":"记住这两件事","f":["先列任务必须满足的条件。","同一份资料去比，总账一起算。"],"b":["一句话记住：别问哪个最强，问哪个够用。","条件清单→同样资料试→总成本算。够了就用，变了再比。","用自己的话讲一遍这课讲了什么，再举一个\"还得补资料\"的例子。"]},{"n":21,"t":"模型成绩与产品效果","f":["榜上第一，不等于你手上这个应用第一。"],"b":["同一个模型，配的工具和设置不同，表现就不同。你的测试结果，只对你测的那套环境负责。"]},{"n":22,"t":"成本的分母","f":["算\"每条能用的成本\"，别只算\"每条的成本\"。"],"b":["教学假设：花10元生成10条，只有2条能用——每条可用的成本是5元，还没算你改错的时间。（数字是编的，算法是真的。）"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["模型：训练出来的计算系统\n应用：你实际用的那个软件\n时延：等结果的时间\nToken：处理量的计量单位","别问哪个最强，问哪个够用。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["原论文和官方资料用于解释技术，个人分享提供实践思路。核查日期：2026-10-04。","GPT-4技术报告，2023\nhttps://arxiv.org/abs/2303.08774","OpenAI推理模型提示建议\nhttps://developers.openai.com/api/docs/guides/reasoning-best-practices","一见AI：AI消耗与业绩，作者配文\nhttps://www.douyin.com/video/7691167895279242496\n本课取材于作者配文与页面标题。","Ethan Mollick普通人AI入门，2024\nhttps://www.oneusefulthing.org/p/getting-started-with-ai-good-enough"]}],"ex":{"intro":["给文字通知、图片挑数据、多步骤整理这三类任务各写选择依据，设计三个同条件的试用输入。","怎么做：①列三类任务 ②每类写输入／输出／检查 ③设计三个试用输入（正常／缺失／冲突），条件保持一样。留10—15分钟。"],"sections":[{"h":"照着做一遍（示范）","paras":["示范（图片挑数据）：必须能收照片、出清单；检查——对照原表核日期；三个试用——一张清晰的表／一张缺一列的表／一张和备注冲突的表，问法保持一字不差。"],"items":[]},{"h":"帮老周算一算","paras":["老周想每周让AI出一版排班表初稿。列出选择依据：必须能输入什么？输出要能拿去干什么？他不懂技术，检查的功夫控制在什么程度？"],"items":[]},{"h":"现场跑一次（选做）","paras":["同一资料同一问题发给两个AI应用，按事实、表达、格式、功能各打一分，做出你的第一张测评表。\n演示结果因模型与版本而异，以你自己的核对为准。"],"items":[]},{"h":"多练一次","paras":["需要把长通知改成短消息。列必要条件和两种失败输入。\n留意：无需为了简单文字任务追求更多功能。"],"items":[]},{"h":"自己检查","paras":["课程案例均为虚构练习。使用AI时，可以记下应用、模型可见名称和日期，方便下次比较。"],"items":["输入输出写得明确","检查标准真实可查","比较条件一致","没下\"永久最佳\"结论"]}]},"notes":["验收四点措辞简化，判定口径与原版一致。","老周场景判据：检查成本须以\"不懂技术\"为约束（如\"扫一眼日期班次对不对\"级别）；写出需要代码检查的方案视为未贴合。"]},{"id":7,"title":"怎样把需求说清楚","intro":"可以边看图文边读，或用这份讲解复习。前置知识：第06课。最后四页为深入阅读。","pages":[{"n":1,"t":"怎样把需求说清楚","f":["把四件事说清：给谁用、干什么、有什么材料、不许干什么"],"b":["同一个AI，别人用着像请了个助理，你用着像隔空喊话。差别多半不在AI，在你有没有把四件事说清：给谁用、干什么、手头有什么材料、不许它干什么。","想一件自己的小事，带着它往下读。"]},{"n":2,"t":"先看这份资料","f":["虚构资料：10月12日10:00—18:00，仅当天调整，10月13日恢复。要求：给顾客的群消息，70字内。"],"b":["虚构资料：10月12日10:00—18:00，仅当天调整，10月13日恢复。顾客群消息70字内。","事实三条＋一个限制（70字内）。就这么点东西，看怎么说清楚。"]},{"n":3,"t":"把模糊想法变成要求","f":["先说用途，再给资料，最后说要求。"],"b":["\"帮我写个通知\"＝没说。\"给顾客写营业通知，日期时间用这条资料，70字内，别编联系人\"＝说清了。","你也可以试试：写一条活动口播稿，说清给谁听、多长、事实有什么、什么语气。\n留意：语气可以换，日期和范围不能换。"]},{"n":4,"t":"说明需求与改进结果","f":["说得清楚＋反馈具体，结果就能一轮轮改好。"],"b":["第一轮说清要求，改的时候指出具体问题，几轮下来就能用。","图中是简化示意，实际用时还是要自己查资料、看结果。"]},{"n":5,"t":"目标决定回答形态","f":["告诉它给谁用、拿来干什么。"],"b":["\"帮我写好一点\"＝白说。给顾客的营业通知和给员工的排班说明，写法完全不同。先说用途，它才知道往哪个方向使劲。","举个例子：\"做得好看\"还得说清：用在哪、给谁看。"]},{"n":6,"t":"材料提供事实","f":["事实放资料区，和语气要求分开写。"],"b":["日期、时间、范围——把资料原样贴给它，别让它凭感觉写。资料互相矛盾的，标出来；缺的，注明\"缺\"。","举个例子：原资料贴进来，未知人数明确留空。"]},{"n":7,"t":"约束说明取舍","f":["字数、语气、禁止事项，都是给它划的线。"],"b":["70字内是硬要求，写的时候告诉它：日期必须保留，超字数宁可挤掉修饰词。要求和事实打架时，让它指出来，别自作主张取舍。","举个例子：\"不超过70字\"就是一条可检查的要求。"]},{"n":8,"t":"例子帮助对齐","f":["给它看好例子和坏例子，各说清为什么。"],"b":["给一份合格通知，指明\"日期这样放就对了\"；给一份坏的，指明\"联系人没依据\"。例子里的地址日期要注明是示例，免得它照抄进正式稿。","举个例子：给一份合格通知，说明要保留哪种写法。"]},{"n":9,"t":"补问减少猜测","f":["缺关键事实就让它问，但只问必须问的。"],"b":["好的AI像好的服务员：菜卖完了会告诉你，而不是端一盘别的上来。（打比方，帮助理解）你把\"不许编\"说清楚，它能瞎猜的地方就少了。","举个例子：没给营业时间，就先问这一个必要事实。"]},{"n":10,"t":"反馈要指向问题","f":["改稿时说清错在哪，别说\"再好一点\"。"],"b":["\"太差了\"它没法改。\"日期别动，把营销句子删了，时间放最前面\"——一句就能改到位。先修事实，再调语气。","举个例子：说\"日期变了\"，比说\"再好一点\"管用。"]},{"n":11,"t":"分步是组织方法","f":["复杂的活拆成几步，简单的活直接说。"],"b":["先挑事实再写通知，方便核对；一句话能说清的活，别折腾流程。拆步是为了你好检查，不是为了仪式感。","举个例子：先提日期范围，再写通知。"]},{"n":12,"t":"可检查的完成标准","f":["提前说清\"怎样算写好了\"。"],"b":["要反复做的活，写成一页说明：给谁用、用什么资料、什么限制、要什么结果、怎么检查。一次性的活，说清要求就行。","举个例子：日期没错、适合发群里，才算完成。"]},{"n":13,"t":"任务要求","f":["把\"帮我整理活动通知\"改成一段说清四件事的话。"],"b":["任务拆成三步，照着做：\n第一步，把四件事列出来：给谁用（社区居民）？干什么（活动通知）？有什么材料（10月18日14:00，社区活动室，报名截止10月16日，人数未知）？不许干什么（不许编人数）？\n第二步，把四件事连成一段话，当作给AI的要求。\n第三步，自查：人数没给——要求里写了\"不许编\"吗？"]},{"n":14,"t":"示例答案","f":["10月12日营业时间调整为10:00—18:00，仅当天生效。10月13日恢复原安排，请合理安排到店时间。"],"b":["示范（改写成的要求）：\"给社区居民写一条活动通知。资料：10月18日14:00，社区活动室，报名截止10月16日，人数未定。要求：只用这些事实，人数没定就写'待确认'，不许编。写完检查日期、时间、地点、截止日四项。\"","逐条对照：给谁用√ 材料√ 不许编√ 怎么检查√。"]},{"n":15,"t":"哪里出了错","f":["错误示例：尊敬的各位客户，我们为了品质升级，正在对营业做出更加卓越的改变。"],"b":["错误示例：尊敬的各位客户，我们为了品质升级，正在对营业做出更加卓越的改变。","错在哪：词藻一大堆，日期时间一个没有。空话挤掉了事实。"]},{"n":16,"t":"改好，再检查","f":["重新说清用途、必留事实和检查标准，让它重写。"],"b":["改法：回到四件事，重下一遍要求，特别注明\"日期时间必须出现\"。改完通读一遍。"]},{"n":17,"t":"你也试一次","f":["把\"帮我整理活动通知\"改写成四件事齐全的要求（三步见第13页）。"],"b":["照三步做：列四件事 → 连成一段话 → 自查\"不许编\"在不在。","再帮小林改一次：小林对AI说\"帮我改简历\"，AI回了一堆正确的废话。帮小林把这句话改成四件事——给谁看（应届校招）、改哪里（实习经历那段）、有什么材料（原简历）、不许什么（不许编经历）。","【现场跑一次｜选做】这一课的核心演示，让差距自己跳出来：\n第一次输入：\"帮我写个通知\"。存好结果。\n第二次输入：\"给顾客写一条营业通知，10月12日10:00—18:00，仅当天调整，10月13日恢复，70字以内，不要编联系人\"。存好结果。\n两份摆在一起看：哪份能用？差距就在那几句话上。\n演示结果因模型与版本而异，以你自己的核对为准。","多练一次：写一条活动口播稿：说明受众、时长、已知事实和参考语气。\n留意：风格可以变化，日期与范围不能改。"]},{"n":18,"t":"完成后检查这四点","f":["给谁用、干什么写明了","材料和限制分开放","缺的信息保留了","检查标准是能判定的"],"b":["给谁用、干什么写明了。材料和限制分开放。缺的信息保留了。检查标准是能判定的","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：给居民的通知，只用四项原事实；人数不编；写通知＋待确认清单；检查四项：日期、时刻、地点、截止日。"],"b":["示范见第14页。核心：四件事齐全，尤其\"不许编\"不能少——它是防止AI瞎猜的那道闸。","对照第18页四点自查。"]},{"n":20,"t":"记住这两件事","f":["四件事说清：给谁用、干什么、有什么材料、不许什么。","改稿时指出具体问题：先修事实，再调语气。"],"b":["一句话记住：你说得越清楚，它猜得越少。","说清用途和资料，分开放限制，缺的留白，说清怎么算好。","用自己的话讲一遍这课讲了什么，再举一个\"还得补资料\"的例子。"]},{"n":21,"t":"提示为何影响结果","f":["你给的话就是它这次的\"考题\"，考题换了答案就换。"],"b":["但它不会因为你夸它\"你是资深专家\"就真懂行——专业的事实还是得你给。缺资料时，补资料比换着花样夸它管用。"]},{"n":22,"t":"少样本与固定模板","f":["例子有用，但别把例子当模板硬套。"],"b":["老模板（比如\"必须先写长计划\"）适不适合，要试了才知道。短通知可以直接写，复杂的活再拆步。"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["提示：你交给AI的那段话\n约束：结果必须满足的条件（如70字内）\n例子：用来示范好坏的样本\n检查标准：怎样算完成","你说得越清楚，它猜得越少。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["原论文和官方资料用于解释技术，个人分享提供实践思路。核查日期：2026-10-04。","Language Models are Few-Shot Learners，2020\nhttps://arxiv.org/abs/2005.14165","OpenAI推理模型提示建议\nhttps://developers.openai.com/api/docs/guides/reasoning-best-practices","Ethan Mollick普通人AI入门，2024\nhttps://www.oneusefulthing.org/p/getting-started-with-ai-good-enough","宝玉：学习AI与Skill迭代\nhttps://s.baoyu.io/files/baoyu-ai-skills-talk/ai-skills-talk.html"]}],"ex":{"intro":["把\"帮我整理活动通知\"改写成说清四件事的一段要求。活动：10月18日14:00，社区活动室，报名截止10月16日，人数未知。","怎么做：①列四件事 ②连成一段话 ③自查\"不许编\"在不在。留10—15分钟。"],"sections":[{"h":"照着做一遍（示范）","paras":["示范：\"给社区居民写一条活动通知。资料：10月18日14:00，社区活动室，报名截止10月16日，人数未定。要求：只用这些事实，人数没定就写'待确认'，不许编。写完检查日期、时间、地点、截止日。\""],"items":[]},{"h":"再帮小林改一次","paras":["小林对AI说\"帮我改简历\"，AI回了一堆正确的废话。把这句话改成一页任务说明：给谁看、改哪里、有什么材料、不许什么。"],"items":[]},{"h":"现场跑一次（选做）","paras":["两次提问对比：\"帮我写个通知\" vs 说清四件事的完整请求。保存两份结果并排对比，找出差距出在哪几个字上。\n演示结果因模型与版本而异，以你自己的核对为准。"],"items":[]},{"h":"多练一次","paras":["写一条活动口播稿：说明受众、时长、已知事实和参考语气。\n留意：风格可以变化，日期与范围不能改。"],"items":[]},{"h":"自己检查","paras":["课程案例均为虚构练习。使用AI时，可以记下应用、模型可见名称和日期，方便下次比较。"],"items":["给谁用、干什么写明了","材料和限制分开放","缺的信息保留了","检查标准能判定"]}]},"notes":["验收四点措辞简化，判定口径与原版一致；「检查标准能判定」对应原「检查可判定」。","小林场景判据：四件套至少齐全三项，且\"不许编经历\"不得缺失。"]},{"id":8,"title":"怎样判断结果能不能用","intro":"可以边看图文边读，或用这份讲解复习。前置知识：第07课。最后四页为深入阅读。","pages":[{"n":1,"t":"怎样判断结果能不能用","f":["按住发布键前，给自己30秒：日期对吗？漏了什么？多了什么？"],"b":["按下发布键之前，给自己30秒：日期对吗？数字对吗？漏了什么？多了什么？这30秒，就是你和AI的分工线。","想一件自己的小事，带着它往下读。"]},{"n":2,"t":"先看这份资料","f":["虚构通知要求：10月12日10:00—18:00，仅当天生效，10月13日恢复。候选稿里多了一句\"停车免费\"。"],"b":["虚构通知要求10月12日10:00—18:00，仅当天生效，10月13日恢复。候选稿另写\"停车免费\"。","注意：候选稿里冒出来一句资料里没有的\"停车免费\"。这就是要抓的。"]},{"n":3,"t":"检查一条通知是否可用","f":["对照原资料查：日期、时段、范围，漏没漏、多没多。"],"b":["能不能用，不看读着顺不顺，看和资料对不对得上。顺，只说明它文笔好。","你也可以试试：优惠只限周一，文案写成了整周——标出错处并改掉。\n留意：发现范围扩大，整篇都要重新查。"]},{"n":4,"t":"对照资料检查答案","f":["日期、范围、遗漏，都能对着资料查出来。"],"b":["一边摆资料，一边摆AI的稿，一行一行对。","图中是简化示意，实际用时还是要自己查资料、看结果。"]},{"n":5,"t":"流畅与正确","f":["好读只是加分项，对才是及格线。"],"b":["读的时候给内容分三类：事实（回资料查）、判断（看理由站不站得住）、建议（看适不适合你）。","举个例子：语气自然的通知，也可能把一天写成一周。"]},{"n":6,"t":"原资料对照","f":["笨办法最管用：左边资料、右边结果，一行行对。"],"b":["店长阿May的办法很土：原资料贴屏幕左边，AI的结果放右边，手指头点着一行行对——日期、时段、范围。土办法，但每次都拦得住错。阿May33岁，管着三家连锁店，做事靠清单，最怕出了事说不清责任，任何东西发出去之前都要\"先对一遍再发\"。","举个例子：原活动表写10月18日，结果也必须是10月18日。"]},{"n":7,"t":"来源能否支持结论","f":["给了链接，不等于链接里真这么说。"],"b":["它列了篇论文？点开看。查不到、标题像但内容对不上、只有搜索摘要——都算证据不足。","举个例子：来源正文必须支持结论，标题像不算数。"]},{"n":8,"t":"遗漏也会影响使用","f":["没写错，不等于写全了。"],"b":["通知日期对但没写时段，照样不能用。该有的项列个清单，一个一个打勾。","举个例子：群通知漏了报名截止日，写得再美也白搭。"]},{"n":9,"t":"数字和功能怎样检查","f":["数字重算一遍，文件重新打开一遍。"],"b":["总数拿计算器再加一次；说\"已导出\"，就下载下来打开看看。按钮在，不等于功能好使。","举个例子：数字用计算器核，保存后的文件要重新打开。"]},{"n":10,"t":"演示与实际效果","f":["看示范好用，不等于你的活也能用。"],"b":["演示是演示。拿你自己的资料再试一遍，缺信息的、有冲突的也试试，记下哪些试过、哪些没试。","举个例子：演示里能查数据，不代表你的任务也能查到。"]},{"n":11,"t":"别沿用上一次的结果","f":["资料换了，旧结果就得重新查。"],"b":["上次的通知可能写得没错，但对应的是上次的资料。工具出错后，旧结果先清掉或标明\"这是旧的\"。","举个例子：工具超时后，别再显示上一次的\"有货\"。"]},{"n":12,"t":"改完之后再看一遍","f":["修好一处，全文再看一遍。"],"b":["改日期时，可能顺手把\"次日恢复\"删了。改完回到整份资料，重新对一遍日期、时段、范围。","举个例子：改了一处日期，全文要重新过。"]},{"n":13,"t":"任务要求","f":["核对一份活动稿：找错误、找遗漏、找编造，再给最小修改。"],"b":["任务拆成三步，照着做：\n第一步，对照资料逐行读稿：日期对吗？时段有吗？范围对吗？\n第二步，列问题清单：漏了什么（报名截止10月16日没写）？多编了什么（\"限50人\"——资料没说）？\n第三步，给最小修改：漏的补上，编的删掉或标\"待确认\"。改完再通读一遍。"]},{"n":14,"t":"示例答案","f":["日期、时段、恢复安排核对通过；\"停车免费\"没依据，删；改完再核四项事实。"],"b":["示范：通过——日期10月12日√ 时段√ 次日恢复√。问题——\"停车免费\"资料里没有，删掉。改完——从头再核一遍四项事实。","对照三步检查。"]},{"n":15,"t":"哪里出了错","f":["错误示例：页面排版整齐，说明通知可以发布。"],"b":["错误示例：页面排版整齐，说明通知可以发布。","错在哪：拿\"看着舒服\"代替了事实检查。排版不管事实。"]},{"n":16,"t":"改好，再检查","f":["按资料逐项核完，发布前还要负责人点头。"],"b":["改法：逐项核对，改完后写明\"发布前需负责人确认\"。改完通读一遍。"]},{"n":17,"t":"你也试一次","f":["核对一份活动稿（漏截止日、编了人数），列问题清单＋修订依据（三步见第13页）。"],"b":["照三步做：逐行对照 → 列问题清单 → 最小修改＋复查。","再帮王阿姨查一次：王阿姨让AI写失物招领，AI写了\"物品存放在物业办公室，联系人张师傅\"——原信息里既没有地点也没有联系人。帮她把有据的、没据的分开列，再给她编一份30秒检查清单，让她以后自己也会查。","多练一次：优惠只限周一，文案写成整周。标出错处并修正。\n留意：发现范围扩大，整篇重新查。"]},{"n":18,"t":"完成后检查这四点","f":["每处修改都说得出依据","漏写和写错分开列","没依据的信息明确处理了","改完又全文复查了一遍"],"b":["每处修改都说得出依据。漏写和写错分开列。没依据的信息明确处理了。改完又全文复查了一遍","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：截止日10月16日必须补；\"限50人\"没依据，删掉或标待确认——原资料没给人数，不能自行设限。"],"b":["示范：补——报名截止10月16日；删——\"限50人\"（资料没说，谁也不能替资料做主）；复查——改完整篇再对一遍。","对照第18页四点自查。"]},{"n":20,"t":"记住这两件事","f":["结果和资料，一行行对。","改完一处，全文再看。"],"b":["一句话记住：它张口就来，错字你得认。","30秒检查：日期对吗？数字对吗？漏了什么？多了什么？","用自己的话讲一遍这课讲了什么，再举一个\"还得补资料\"的例子。"]},{"n":21,"t":"样本评价的局限","f":["一次通过，只证明这一次、这几项。"],"b":["说结论时把依据带上：\"日期对——对的是原活动表第二行。\"没写出来的字段也要核，检查不止挑错字，还有漏项、扩大范围、无据补充。"]},{"n":22,"t":"检查标准与人的用途","f":["有的检查能自动化（数字、字段），有的必须人来（合不合适）。"],"b":["AI自检、对资料、用计算器——各查各的错，谁也不能包办。一次通过不代表下次也过。"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["证据：支持判断的资料或记录\n遗漏：该有的没写\n复查：改完后按原要求再查一遍\n失效：这份结果对现在的任务没用了","它张口就来，错字你得认。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["原论文和官方资料用于解释技术，个人分享提供实践思路。核查日期：2026-10-04。","GPT-4技术报告，2023\nhttps://arxiv.org/abs/2303.08774","InstructGPT人类反馈论文，2022\nhttps://arxiv.org/abs/2203.02155","Anthropic构建有效Agent，2024\nhttps://www.anthropic.com/engineering/building-effective-agents"]}],"ex":{"intro":["核对一份活动稿：写了10月18日14:00和地点，漏了报名截止日，还补了句\"限50人\"。列问题清单，给最小修改。","怎么做：①逐行对照资料 ②问题分两列：漏的／编的 ③最小修改＋全文复查。留10—15分钟。"],"sections":[{"h":"照着做一遍（示范）","paras":["示范：漏的——报名截止10月16日，补上。编的——\"限50人\"，资料没说人数，删掉或改\"人数待确认\"。复查——改完重新核日期、时间、地点、截止日四项。"],"items":[]},{"h":"再帮王阿姨查一次","paras":["AI写的失物招领里有\"存放在物业办公室，联系人张师傅\"，原信息里没有地点和联系人。把有据的、没据的分开列，再给王阿姨编一份30秒检查清单。"],"items":[]},{"h":"多练一次","paras":["活动优惠只适用周一，一份文案写成整周。标出错误并修正。\n留意：发现范围扩大，再复查全文。"],"items":[]},{"h":"自己检查","paras":["课程案例均为虚构练习。使用AI时，可以记下应用、模型可见名称和日期，方便下次比较。"],"items":["每处修改说得出依据","漏写和写错分开列","无据信息明确处理","改完全文复查了"]}]},"notes":["验收四点措辞简化，判定口径与原版一致。","王阿姨场景判据：地点与联系人均判为无据；30秒清单须含\"日期、数字、漏了什么、多了什么\"至少三项。"]},{"id":9,"title":"上下文、知识库与记忆","intro":"可以边看图文边读，或用这份讲解复习。前置知识：第07—08课。最后四页为深入阅读。","pages":[{"n":1,"t":"上下文、知识库与记忆","f":["AI答不好你店里的事，不是它笨——它压根没读过你的店"],"b":["AI答不好你店里的事，不是它笨——它压根没读过你的店。它脑子里的东西是训练来的，你的事得靠你递给它。这一课讲的就是怎么递。","想一件自己的小事，带着它往下读。"]},{"n":2,"t":"先看这份资料","f":["虚构资料库：平时营业09:00—20:00；已确认的临时安排：10月12日改为10:00—18:00，10月13日恢复。"],"b":["虚构库：常规营业09:00—20:00；已确认临时安排10月12日10:00—18:00，10月13日恢复。","两份资料：一份是平时的，一份是10月12日那天的。问\"10月12日几点开门\"，答哪份？"]},{"n":3,"t":"这次回答用到了哪些资料","f":["先弄清AI这次能看到什么，再谈补什么。"],"b":["它只看得见这次递给它的东西。递错资料，答案就错。","你也可以试试：旧会议纪要和新通知的时间打架，该递哪份？\n留意：先确认哪份有效，再回答。"]},{"n":4,"t":"给本次回答补充资料","f":["挑出相关且有效的资料，递给它，再让它回答。"],"b":["不是一股脑全给：挑相关的、核对过有效期的，递过去。","图中是简化示意，实际用时还是要自己查资料、看结果。"]},{"n":5,"t":"模型当前能看到什么","f":["文件在你电脑里，不等于AI已经读过。"],"b":["它只看得见这次对话里真正传进去的内容。可能只传了片段，也可能压缩了旧对话。先确认资料真进去了，再谈别的。","举个例子：你没传的资料，它不会\"自动知道\"。"]},{"n":6,"t":"上下文容量","f":["能装得多，不等于每页都被好好读。"],"b":["塞一大堆，重点反而被淹。挑相关的几段，带上日期和出处，比整包文件管用。","举个例子：相关三行资料，胜过一整包旧文件。"]},{"n":7,"t":"产品记忆","f":["应用的\"记住你\"，是另外存的笔记，不是它变聪明了。"],"b":["\"记住：通知不要营销话\"——这是存在外面的备忘，用的时候再取。具体怎么存怎么删，各家不同，别全信。","举个例子：记住你的偏好，不等于记住最新营业时间。"]},{"n":8,"t":"知识库","f":["放进知识库的资料，要标日期、标出处、标哪份有效。"],"b":["一大堆文件没标日期，一查查出去年的旧安排。先理清楚，再往里堆量。","举个例子：知识库里的商品档案，未必是今天的库存。"]},{"n":9,"t":"检索增强生成","f":["RAG像开卷考试：它带着本事进场，你把相关那几页递到它眼前。"],"b":["RAG像开卷考试：模型带着学过的本事进场，你把相关那几页资料递到它眼前。递错了页，答案照样错——所以找对资料，比模型聪不聪明更要紧。（打比方，帮助理解）","递漏了、递错了版本、它没看，都会错。它标了出处只是起点，出处本身也要查。","举个例子：先找对活动表，再交给它回答。"]},{"n":10,"t":"补资料与微调","f":["补资料像考前递小抄（快），微调像重新上学（慢）。店里的事，递小抄就够。"],"b":["补资料像考前递小抄：快，考完就还。微调像让孩子重新读书：改的是脑子本身，又贵又慢，换门课还未必划算。门店的大多数事，递小抄就够了。（打比方，帮助理解）","今天的营业时间，更新资料就行，犯不着训练模型。","举个例子：微调改行为，不适合补今天的库存。"]},{"n":11,"t":"冲突与更新","f":["两份资料打架，看范围、看日期、看谁权威。"],"b":["临时安排覆盖当天常规，不冲突。同一天两份安排不一样还没审批信息？别猜，问人。文件名最新，不等于生效时间最新。","举个例子：旧文件和新通知打架，先确认哪份有效。"]},{"n":12,"t":"给下次使用留下记录","f":["明天还要接着干的活，今天记下：干了啥、资料在哪、还缺啥。"],"b":["记录要短、要能查回原资料。堆一地的聊天记录，不如一页交接清单。","举个例子：交接写清日期、待确认项和已完成的结果。"]},{"n":13,"t":"任务要求","f":["回答\"10月12日营业几点到几点\"，说明依据；找不到当天有效资料就留白。"],"b":["任务拆成三步，照着做：\n第一步，从两份资料里挑：哪份管10月12日？（提示：当天临时安排）\n第二步，回答并写明依据：\"10:00—18:00，依据当天的临时安排。\"\n第三步，自问：要是没有那份临时安排呢？——只能答\"按常规09:00—20:00\"或\"待确认\"，不能混着猜。"]},{"n":14,"t":"示例答案","f":["10月12日为10:00—18:00，依据当天临时安排。10月13日按常规09:00—20:00。"],"b":["示范：\"10月12日营业时间为10:00—18:00（依据：当天临时安排，已确认）。10月13日起恢复常规营业09:00—20:00（依据：常规表）。\"","对照三步检查：选对了资料、写明了依据、没混。"]},{"n":15,"t":"哪里出了错","f":["错误示例：常规表篇幅最长，因此10月12日也09:00—20:00。"],"b":["错误示例：常规表篇幅最长，因此10月12日也09:00—20:00。","错在哪：拿\"文件厚\"当\"文件对\"。10月12日要看的是当天那份临时安排。"]},{"n":16,"t":"改好，再检查","f":["先找当天有效的资料，记下出处和版本，再回答。"],"b":["改法：检索当天临时安排→记下这是哪一版→再对照常规表补次日。改完通读一遍。"]},{"n":17,"t":"你也试一次","f":["整理一份三件套资料包（常规＋临时＋没审批的草稿），挑出能用来回答的，写交接。"],"b":["照三步做：\n第一步，看三份资料：常规周六活动／10月18日临时改地点（已确认）／一份没人批过的草稿。\n第二步，判断：哪份能用来回答？哪份不能用（草稿——没批）？\n第三步，写三行交接：用了哪份、结论是什么、还有什么没确认。","【现场跑一次｜选做】把你的一份门店资料——比如排班规则——传进任意支持上传文件的AI应用，问它三个问题。记下来：哪几个回答用上了你的资料，哪几个在那儿凭空发挥。\n演示结果因模型与版本而异，以你自己的核对为准。","多练一次：旧会议纪要和新通知时间打架，该递哪份？\n留意：先确认哪份有效，再回答。"]},{"n":18,"t":"完成后检查这四点","f":["答案带出处和日期","分得清\"这次给的\"和\"存着的记忆\"","没把知识库当成百分百准","分得清补资料和重新训练"],"b":["答案带出处和日期。分得清\"这次给的\"和\"存着的记忆\"。没把知识库当成百分百准。分得清补资料和重新训练","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：当天变更要核生效范围，草稿不算数；交接写清资料位置、确认状态和疑问。"],"b":["示范：10月18日的回答只能用\"已确认的临时改地点\"那份，草稿没批不能用。交接：资料在共享盘\"活动\"文件夹；改地点已确认；报名人数还没人定。","对照第18页四点自查。"]},{"n":20,"t":"记住这两件事","f":["确认相关资料真的递进去了。","新旧资料打架，看出处和生效日期。"],"b":["一句话记住：它不认识你的店，资料得你递过去。","递对资料，答案才有根。打架时看日期和权威。","用自己的话讲一遍这课讲了什么，再举一个\"还得补资料\"的例子。"]},{"n":21,"t":"检索的两个错误方向","f":["要么没找到资料，要么找到一份长得像但不对的。"],"b":["检索会漏、会错、会找到旧版本。所以\"接了知识库\"不等于\"回答一定准\"，检索结果和最终回答要分开查。"]},{"n":22,"t":"资料更新、微调与记忆","f":["常变的事实放资料里，要改\"性格\"才考虑训练。"],"b":["今天的库存一小时一变——查询，不是训练。产品记忆也可能过时，关键事实还是要看更新时间。"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["上下文：这次真正递给它的内容\n知识库：整理好、可检索的资料堆\nRAG：先检索、再带着资料回答\n微调：重新训练，改参数","它不认识你的店，资料得你递过去。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["读法提示：RAG原论文先看摘要和图1，重点看\"检索结果怎样拼进输入\"。","原论文和官方资料用于解释技术，个人分享提供实践思路。核查日期：2026-10-04。","检索增强生成原论文，2020\nhttps://arxiv.org/abs/2005.11401","Anthropic上下文工程，2025\nhttps://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","Language Models are Few-Shot Learners，2020\nhttps://arxiv.org/abs/2005.14165"]}],"ex":{"intro":["整理一份三件套资料包（常规安排＋10月18日临时改地点＋没审批的草稿），判断哪份能用来回答，写三行交接。","怎么做：①看三份资料 ②判断哪份能用、哪份不能用（草稿没批）③写交接：用了哪份、结论、还缺什么。留10—15分钟。"],"sections":[{"h":"照着做一遍（示范）","paras":["示范：判断——10月18日的回答只能用\"已确认的临时改地点\"，草稿没审批不能用。交接——资料在共享盘\"活动\"文件夹；改地点已确认有效；报名人数还没人定，待确认。"],"items":[]},{"h":"现场跑一次（选做）","paras":["把一份自己的门店资料传进支持文件上传的AI应用，问三个问题，记录哪些回答用了资料、哪些在凭空发挥。\n演示结果因模型与版本而异，以你自己的核对为准。"],"items":[]},{"h":"多练一次","paras":["旧会议纪要与新通知时间冲突。说明需要提供哪些资料。\n留意：先确认有效版本，再检索回答。"],"items":[]},{"h":"自己检查","paras":["课程案例均为虚构练习。使用AI时，可以记下应用、模型可见名称和日期，方便下次比较。"],"items":["答案带出处和日期","分得清上下文和记忆","没把知识库当百分百准","分得清补资料和重新训练"]}]},"notes":["验收四点措辞简化，判定口径与原版一致。","现场跑一次选做不计分；观察记录可佐证「上下文与记忆分开」。"]},{"id":10,"title":"工具、工作流、Skill与Agent","intro":"可以边看图文边读，或用这份讲解复习。前置知识：第09课。最后四页为深入阅读。","pages":[{"n":1,"t":"工具、工作流、Skill与Agent","f":["用一条通知看懂五个词：模型、工具、工作流、Skill、Agent各管什么"],"b":["同一条通知，聊天里直接就能写完，也可以交给一套流程。活少就直接来，活多、要查多处资料，再上工具和流程。","想一件自己的小事，带着它往下读。"]},{"n":2,"t":"先看这份资料","f":["虚构任务：读营业表→写70字内通知→存草稿→发布前由负责人确认。"],"b":["虚构任务：读取营业表，生成70字内通知，保存草稿，发布前由负责人确认。","四步活。看五个角色怎么分这四步。"]},{"n":3,"t":"同一任务的几种做法","f":["几件工具怎么搭，看活需要，不看谁高级。"],"b":["一次性的活，聊天里就办了。天天重复的活，才值得搭流程。","你也可以试试：给一天营业通知，比较直接聊天、搭流程、用Agent各要花多少维护功夫。\n留意：能办成同一件事时，说清为什么选简单的。"]},{"n":4,"t":"模型、方法与工具配合","f":["用一家餐厅记住五个角色：模型是厨师，工具是厨具，工作流是出餐单，Skill是秘籍本，Agent是值班经理。"],"b":["这一课整体可以用一家餐厅来讲（打比方，帮助理解）：模型是厨师，管做、管尝、管判断；工具是厨具和传菜口，管执行，自己不会琢磨；工作流是出餐流程单，先冷菜后热菜，哪步卡住了找谁；Skill是秘籍本，老师傅的手艺写下来，新人照着做；Agent是值班经理，全程盯着，小问题按规矩处理，大事打电话问你。","图中是简化示意，实际用时还是要自己查资料、看结果。"]},{"n":5,"t":"模型负责生成和判断","f":["模型动嘴（写、判断），动手得靠工具。"],"b":["它可以\"建议\"去查时段，但它自己查不了——查要有工具和权限。建议了不等于做了。","举个例子：模型写通知，营业时间仍来自资料。"]},{"n":6,"t":"工具执行具体动作","f":["读文件、算数、保存，都靠工具，工具还各有边界。"],"b":["能读营业表，不等于能发通知——两样是不同工具、不同权限。工具的结果也要看版本和范围。","举个例子：查余额要用工具，模型自己不知道余额。"]},{"n":7,"t":"工作流安排步骤","f":["固定的几步排好顺序，每步写清交什么、接什么。"],"b":["读资料→核字段→写通知→人确认，排成固定流程。缺时间就补问，资料打架就暂停。每步的进出都写清，才接得上。","举个例子：步骤固定的活，适合搭工作流。"]},{"n":8,"t":"Skill保存方法","f":["Skill是方法包：把\"这类活怎么干\"写成说明，下次照着做。"],"b":["Skill提供字段要求、好坏例子、检查清单，让方法能重复用。它不是工具，也不会自己执行。","举个例子：反复用的检查清单，可以存成Skill。"]},{"n":9,"t":"Agent按反馈推进","f":["Agent看结果定下一步：缺什么补什么，干到哪算完有标准。"],"b":["工具返回\"缺日期\"，Agent可以去补问或再查。它需要循环、状态和停止条件。叫Agent的未必都能无限自主。","举个例子：Agent根据结果定下一步，还得有停止条件。"]},{"n":10,"t":"同一任务可多种实现","f":["简单的活别堆装备。"],"b":["一份资料已经确认过？聊天写完人核一遍，足够。天天做、量大，才加方法包和流程；资料散在多处、要靠工具反馈，Agent才显价值。","举个例子：简单通知直接聊，不用上装备。"]},{"n":11,"t":"人的确认是流程节点","f":["确认要写进流程里：谁核、谁批，白纸黑字。"],"b":["值班经理可以拍板\"这桌菜重做\"，但不能拍板\"今天全场打折\"——打折得打电话问老板。人的确认画在哪条线上，写章程的时候就要写死。阿May的规矩：凡是影响顾客安排的事，一律先对一遍再发。","举个例子：草稿核完后，负责人决定发不发。"]},{"n":12,"t":"职责图帮助定位问题","f":["出错先问：错在哪个角色？别一律怪\"AI不聪明\"。"],"b":["日期错可能是资料错，文件存不上可能是工具问题，通知又臭又长可能是方法问题，循环停不下来是Agent停止条件没设好。","举个例子：查不到库存，先看工具响应，别急着改文案。"]},{"n":13,"t":"任务要求","f":["给四步任务画职责图：每步谁干？然后删掉没必要的。"],"b":["任务拆成三步，照着做：\n第一步，把四个环节（读表／写通知／存草稿／发前确认）各分给：资料、模型、工具、Skill、流程、Agent或人（一个环节可以多角色）。\n第二步，删：哪些角色其实用不上？（比如：只有一份资料、一次性任务——Agent和Skill可能都不需要。）\n第三步，自查：发布确认写具体了吗？（谁核、谁批。）"]},{"n":14,"t":"示例答案","f":["资料给时段，模型写稿，工具读和存，流程串步骤，人确认发布——一次性任务，Agent和Skill可以不用。"],"b":["示范（最小配置）：读表——工具；写通知——模型（资料给事实）；存草稿——工具；发前确认——负责人。Skill、Agent、工作流：本例用不上，理由——一次性、单份资料、步骤就四步。","对照三步检查：每个环节分到了、删了没必要的、确认写具体了。"]},{"n":15,"t":"哪里出了错","f":["错误示例：安装一个Skill，模型就能访问任何库存并自动发布。"],"b":["错误示例：安装一个Skill，模型就能访问任何库存并自动发布。","错在哪：把方法（Skill）、工具能力和权限搅成一团。装方法不等于给权限，给权限不等于该自动发布。"]},{"n":16,"t":"改好，再检查","f":["资料入口、工具权限、方法范围、发布确认，四样分开核。"],"b":["改法：一句一句拆——\"访问库存\"要什么工具和权限？\"自动发布\"批了吗？改完通读一遍。"]},{"n":17,"t":"你也试一次","f":["画职责图＋删组件＋说明资料变多时会新增什么（三步见第13页）。"],"b":["照三步做：分环节 → 删没必要的 → 回答：如果资料散在三个地方，需要新增什么？（提示：查资料的工具。）","再补一问：按餐厅那个比方，给你自己设计的方案填一张分工表——谁负责出主意，谁负责动手，谁管流程，手艺存在哪，出了什么事必须停下来问人。","多练一次：给一天营业通知，比较直接聊天、搭流程和Agent各要多少维护功夫。\n留意：能办成同一件事时，解释为什么选简单的。"]},{"n":18,"t":"完成后检查这四点","f":["每个角色的职责说得对","组合是按活的需要选的","至少删掉了一个用不上的","发布确认写到了具体的人"],"b":["每个角色的职责说得对。组合是按活的需要选的。至少删掉了一个用不上的。发布确认写到了具体的人","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：单份资料用模型＋人就行；要查多处资料加工具；反复做加方法包；多步不确定才考虑Agent。"],"b":["示范：一次性通知——模型＋人。要查三个系统的资料——加工具。每周都做——加Skill存方法。步骤多、结果不确定——才考虑Agent。","对照第18页四点自查。"]},{"n":20,"t":"记住这两件事","f":["先弄清每个环节谁负责。","按活的需要加装备，不加没用的。"],"b":["一句话记住：先分好工，再叫AI进场。","厨师做菜、厨具动手、流程单排步骤、秘籍本存方法、值班经理盯全程、老板拍板。","用自己的话讲一遍这课讲了什么，再举一个\"还得补资料\"的例子。"]},{"n":21,"t":"工作流与Agent的边界","f":["固定流程和随机应变可以混着用，别纠结名词。"],"b":["重要的是写清：谁决定走哪条路、能用哪些工具、什么时候停。比贴\"Agent\"标签有用。"]},{"n":22,"t":"组件数量与收益","f":["每加一个组件，就多一个可能出故障的地方。"],"b":["教学假设：本来一次生成就能完事，加三次搜索两次转换，出错的机会多了五处。组件要为真需求服务。"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["工具：能实际动手的能力\n工作流：排好的步骤和分支\nSkill：可以反复用的方法包\nAgent：看反馈、推进任务的系统","先分好工，再叫AI进场。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["原论文和官方资料用于解释技术，个人分享提供实践思路。核查日期：2026-10-04。","Anthropic构建有效Agent，2024\nhttps://www.anthropic.com/engineering/building-effective-agents","Anthropic Agent Skills介绍，2025\nhttps://www.anthropic.com/engineering/equipping-agents-for-the-real-world-with-agent-skills","ReAct原论文，2022\nhttps://arxiv.org/abs/2210.03629","MCP官方介绍，核查2026-10-04\nhttps://modelcontextprotocol.io/docs/getting-started/intro"]}],"ex":{"intro":["给\"读表→写通知→存草稿→发前确认\"画职责图，删掉用不上的角色，说明资料变多时要新增什么。","怎么做：①四环节分角色 ②删没必要的 ③回答\"资料散在三处要加什么\"。留10—15分钟。"],"sections":[{"h":"照着做一遍（示范）","paras":["示范：读表——工具；写通知——模型（资料给事实）；存草稿——工具；确认——负责人。删——Skill和Agent（一次性、单份资料）。新增——资料散在三处时，要加\"查资料的工具\"，还得定先查哪份。"],"items":[]},{"h":"再补一问","paras":["按餐厅那个比方，给你设计的方案填一张分工表：谁出主意、谁动手、谁管流程、手艺存在哪、什么事必须停下来问人。"],"items":[]},{"h":"多练一次","paras":["为一天营业通知比较直接对话、工作流和Agent的维护成本。\n留意：能完成同样目标时，解释为什么用较简单的办法。"],"items":[]},{"h":"自己检查","paras":["课程案例均为虚构练习。使用AI时，可以记下应用、模型可见名称和日期，方便下次比较。"],"items":["每个角色职责说得对","组合按活的需要选","至少删了一个用不上的","发布确认写到具体的人"]}]},"notes":["验收四点措辞简化，判定口径与原版一致。","分工表判据：\"停下来问人\"必须写到具体事项（如打折/对外发布），写\"重要事情问人\"算空泛。"]},{"id":11,"title":"把一件事拆成工作流","intro":"可以边看图文边读，或用这份讲解复习。前置知识：第10课。最后四页为深入阅读。","pages":[{"n":1,"t":"把一件事拆成工作流","f":["把活拆成步骤，每步交得清楚、接得上来，出错有办法"],"b":["上一步交出清楚的结果，下一步才能继续。缺资料、保存失败等情况，也要有明确的处理办法。","想一件自己的小事，带着它往下读。"]},{"n":2,"t":"先看这份资料","f":["虚构流程六步：读表→挑字段→写通知→核对→保存→人确认。缺时间就补问，来源打架就暂停。"],"b":["虚构流程：读营业表、提关键字段、写通知、核对、保存、人工确认发布。时间缺失则补问，来源冲突则暂停。","六步主线＋两条岔路（缺资料、有冲突）。"]},{"n":3,"t":"每一步怎样接下去","f":["像接力赛：交棒那一下没弄清，后面全乱。"],"b":["工作流像接力赛：每个选手只跑自己那段，可交接棒那一瞬间决定全队快慢。上一步的输出就是下一步的输入，交接没写清楚，后面全乱。（打比方，帮助理解）","你也可以试试：把会议录音整理成待办：转写→核对→挑重点→人确认。\n留意：录音里的名字没核实，就不能往下传\"确定的姓名\"。"]},{"n":4,"t":"步骤之间怎样衔接","f":["上一步给的东西，下一步要接得住。"],"b":["交出\"查询成功\"四个字没用，得交出具体内容和出处。","图中是简化示意，实际用时还是要自己查资料、看结果。"]},{"n":5,"t":"从结果倒推","f":["先想清楚最后要什么，再倒着排步骤。"],"b":["用老周的事走一遍：老周要的是\"周五晚上，排班表发到群里\"。倒着推——发群之前得有初稿，初稿之前得有工时记录，工时记录之前得有本周出勤。把\"发\"字倒着走一遍，流程自己就长出来了。","举个例子：\"完成通知\"要具体到草稿、已知事实和待确认项。"]},{"n":6,"t":"每步有输入","f":["每步收到的必须是具体内容和出处，不能是\"成功了\"三个字。"],"b":["写通知这步要收到：日期、时段、范围、出处版本。收到的资料不带版本号，出了错都不知道用的是不是旧的。","举个例子：挑字段这步要收原表，不能只收旧摘要。"]},{"n":7,"t":"每步有输出","f":["每步交出的，要够下一步接着干活。"],"b":["挑字段交出\"已知＋还缺什么\"；写通知交出草稿；核对交出\"问题清单＋能不能往下走\"。","举个例子：挑字段的交字段表，写通知的才有得用。"]},{"n":8,"t":"分支处理缺口","f":["三种情况三条路：齐全→往下走；缺→补问；打架→停。"],"b":["错误不能流进下一步——尤其不能用上一次的旧结果顶替这次的输出。","举个例子：缺日期就停在补资料那步，别让猜测溜过去。"]},{"n":9,"t":"人工检查放在哪里","f":["检查点放在\"后果变重\"的地方，不用步步打断人。"],"b":["草稿可以随便改，发出去就影响顾客了。所以人查两处：动笔前对事实，发布前拍板。","举个例子：草稿核过了，才轮到人确认发布。"]},{"n":10,"t":"重试有条件","f":["失败分三种，处理法不同，重试要设上限。"],"b":["断网了可以再试；格式错了改格式；资料真缺了，重试一百次也没有——去补问。重试次数设上限，记录每次结果。","举个例子：工具超时可有限重试，发布失败先查状态。"]},{"n":11,"t":"恢复从检查点开始","f":["把干到哪、资料是哪版存下来，中断了能接着干。"],"b":["恢复时先核对：资料还是这版吗？之前的动作真的执行了吗？别盲目跳过检查。","举个例子：存好已核字段，重启后不用重猜。"]},{"n":12,"t":"换一种情况再试","f":["顺路走通不算完，缺资料、断线、恢复也要各试一遍。"],"b":["全须全尾的资料能走通，不代表流程没毛病。把几种意外情况各跑一次，修过的错再复测。","举个例子：换一份活动资料，看流程是不是通用。"]},{"n":13,"t":"任务要求","f":["画最小流程图，加三个分支：缺日期、连接失败、人工确认。"],"b":["任务拆成三步，照着做：\n第一步，画主线：读资料→挑字段→写通知→核对→保存→人确认。\n第二步，加三个分支，各写怎么处理：缺日期→补问；连接失败→有限重试；确认环节→人来拍板。\n第三步，每步写四样：输入、输出、怎样算完成、失败了怎么办。"]},{"n":14,"t":"示例答案","f":["字段齐了才写稿；不齐就列缺口；草稿核过才存；发布确认单独记录。"],"b":["示范（三行版）：①挑字段：齐→交字段表；缺日期→补问，停。②写通知＋核对：通过→存草稿；不通过→列问题重改。③确认：负责人点头→标记\"可发\"；点头之前一律是\"草稿\"。","对照三步检查：分支全、每步四样齐。"]},{"n":15,"t":"哪里出了错","f":["错误示例：读资料成功，就直接显示\"发布完成\"。"],"b":["错误示例：读资料成功，就直接显示\"发布完成\"。","错在哪：第一步成功就报第六步的结果。中间的核对和真正的发送呢？"]},{"n":16,"t":"改好，再检查","f":["草稿、已核对、待确认三种状态分开；真发出去了才标\"已发布\"。"],"b":["改法：加状态标记，发布动作要有记录。改完通读一遍。"]},{"n":17,"t":"你也试一次","f":["画最小流程＋三个分支（三步见第13页）。"],"b":["照三步做：画主线 → 加三分支 → 每步写四样。","再用老周的排班练一遍：把\"老周面馆每周排班\"拆成最小的工作流——每一步写清楚输入、输出、谁检查。至少标出一个位置，是老周必须亲自定的，比如周日让谁加班。","多练一次：把会议录音整理成待办：转写、核对、提取、人工确认。\n留意：原声姓名未确认时，不能往后传确定姓名。"]},{"n":18,"t":"完成后检查这四点","f":["每步的输入输出写得清","三种失败各有各的处理","人工检查点真有用处","正常走和中断恢复都说得清"],"b":["每步的输入输出写得清。三种失败各有各的处理。人工检查点真有用处。正常走和中断恢复都说得清","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：缺日期→补问；断线→有限重试；来源打架→暂停。输入输出和检查状态都要留档。"],"b":["示范：主线六步；缺日期在\"挑字段\"后停下补问；连接失败重试最多两次，再失败记录并转人工；确认环节必须老周（或负责人）亲自点。","对照第18页四点自查。"]},{"n":20,"t":"记住这两件事","f":["每步写清：收什么、交什么、怎么算完。","出了岔子，留下能接着干的状态。"],"b":["一句话记住：交接棒没交好，后面全乱。","接力赛：跑好自己的那段，把棒交清楚。","用自己的话讲一遍这课讲了什么，再举一个\"还得补资料\"的例子。"]},{"n":21,"t":"状态比箭头更具体","f":["流程图上每步，对应一个能记录的状态。"],"b":["同一份通知有四个状态：等资料→等写稿→等核对→已存档。写稿完了但保存失败，总任务就没完成。状态说清了，恢复时才知道从哪接着干。"]},{"n":22,"t":"最小流程的价值","f":["先把顺路走通，再加分支。"],"b":["一条能跑通的路，胜过一张全是箭头的图。每个分支都要有触发条件和产出，说不出用处的步骤先删。"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["节点：一个环节\n分支：按条件走不同的路\n状态：干到哪一步了，可记录\n检查点：能用来恢复的存档","交接棒没交好，后面全乱。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["原论文和官方资料用于解释技术，个人分享提供实践思路。核查日期：2026-10-04。","Anthropic构建有效Agent，2024\nhttps://www.anthropic.com/engineering/building-effective-agents","ReAct原论文，2022\nhttps://arxiv.org/abs/2210.03629","Anthropic上下文工程，2025\nhttps://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"]}],"ex":{"intro":["给活动资料整理画最小流程，加三个分支：缺日期、连接失败、人工确认。","怎么做：①画主线 ②加三分支并写处理法 ③每步写四样：输入、输出、完成条件、失败动作。留10—15分钟。"],"sections":[{"h":"照着做一遍（示范）","paras":["示范：主线——读资料→挑字段→写通知→核对→保存→人确认。分支——缺日期：停在补问；连接失败：重试最多2次，再败转人工；确认：负责人点过头才标\"可发\"。四样（以挑字段为例）——输入原活动表；输出字段表；完成＝字段齐或有缺口清单；失败＝记录缺什么、转补问。"],"items":[]},{"h":"再用老周的排班练一遍","paras":["把\"老周面馆每周排班\"拆成最小工作流：每步写输入、输出、谁检查。至少标出一个老周必须亲自定的位置（比如周日让谁加班）。"],"items":[]},{"h":"多练一次","paras":["把会议录音整理成待办：转写、核对、提取、人工确认。\n留意：原声姓名未确认时，不能往后传确定姓名。"],"items":[]},{"h":"自己检查","paras":["课程案例均为虚构练习。使用AI时，可以记下应用、模型可见名称和日期，方便下次比较。"],"items":["每步输入输出写得清","三种失败处理不同","人工检查点真有用","正常和恢复都说得清"]}]},"notes":["验收四点措辞简化，判定口径与原版一致。","老周排班判据：人工点须落在\"涉及人的安排\"上（如周日加班、换班），\"AI核对格式\"不算。"]},{"id":12,"title":"资料和工具怎样连接","intro":"可以边看图文边读，或用这份讲解复习。前置知识：第11课。最后四页为深入阅读。","pages":[{"n":1,"t":"资料和工具怎样连接","f":["查一次数据，要说清查的是谁、拿回来的是什么、失败了算哪种"],"b":["一次库存查询需要说清商品、门店和返回状态。连接方式统一之后，这些具体含义仍然要核对。","想一件自己的小事，带着它往下读。"]},{"n":2,"t":"先看这份资料","f":["虚构例子：商品档案编号001（白色贴纸）；库存表里商品001、门店A、余额0。档案查询成功。"],"b":["虚构商品：档案编号001，名称白色贴纸；库存表商品001、门店A、余额0。查询档案成功。","注意两个词的区别：档案（这商品存在）和库存（门店里还有几个）——两码事。"]},{"n":3,"t":"查询的是谁，返回的是什么","f":["查谁、查回来什么、失败算哪种，都要说清。"],"b":["\"查到了\"和\"查到的是对的那个\"，中间隔着好几个坑：编号对不上、门店漏了、返回的0到底是没货还是没查到。","你也可以试试：查商品001，分别写\"余额0\"和\"连接超时\"两种回应。\n留意：0是查到的结果，超时是还不知道。"]},{"n":4,"t":"一次查询怎样完成","f":["先提一个明确的查询，再解释拿回来的结果。"],"b":["问得清楚→答得明白。问得含糊→返回什么都说不清。","图中是简化示意，实际用时还是要自己查资料、看结果。"]},{"n":5,"t":"API像约定的窗口","f":["API像传菜窗口：递进去的单子有格式，递出来的菜也有样子，不能探头进厨房。"],"b":["API像餐厅的传菜窗口：你递进去的单子有规定的格式，递出来的菜也有规定的样子。你不能自己探头进厨房——这是约定，也是保护。（打比方，帮助理解）","请求什么、返回什么、出错什么样，都是事先约好的。","举个例子：API就是双方约好的\"怎么问、怎么答\"。"]},{"n":6,"t":"字段要对应","f":["名字像，不一定是同一个东西。"],"b":["\"商品档案\"和\"库存\"是两类数据：查到档案，不代表门店有货。编号\"001\"别随手写成\"1\"——前面的零可能有含义。","举个例子：查门店A，门店标识不能漏。"]},{"n":7,"t":"请求与响应","f":["问什么、答什么、答不上来是什么意思，都要有约定。"],"b":["查营业安排：输入日期，返回时段和生效范围。返回一个空列表？得知道这是\"没匹配\"还是\"你没权限\"。含义没约好，后面全靠猜。","举个例子：\"001\"按文字传还是按数字传，两边要一致。"]},{"n":8,"t":"认证与权限","f":["知道地址，不等于有钥匙。"],"b":["读取、保存、发布，可能是三把不同的钥匙。只是查营业时间？那只要读的权限就够了。（练习用虚构资料；真连接时，密钥千万别公开。）","举个例子：能查资料的钥匙，不一定能改资料。"]},{"n":9,"t":"MCP统一部分接法","f":["MCP像统一插口：插座标准了，电器怎么用还得看说明书。"],"b":["MCP可以理解为统一插口，真实结构仍有客户端、服务端和具体能力。统一协议不会让工具自动懂业务规则，也不意味着任何服务可信。是否支持和版本条件要核官方资料。","举个例子：插口统一了，\"哪家门店\"这种业务问题还得自己配。"]},{"n":10,"t":"模型提出调用","f":["模型\"说要查\"，应用去查，结果交回来——模型不亲手查。"],"b":["模型提出\"我要查商品001的库存\"，实际去查的是应用调用的工具。它说\"准备查询\"不算数，查回来的结果才算数。","举个例子：模型请求查余额，真结果是工具干出来的。"]},{"n":11,"t":"失败的不同含义","f":["失败分三种：要的东西不存在／参数给错了／没权限。三种三种处理法。"],"b":["传菜窗口说\"没成功\"，可能是三种事：菜卖完了（要的东西不存在）、没听清单号（参数给错了）、你根本没有点单资格（权限不够）。三种失败三种处理法，混在一起就只会干等。（打比方，帮助理解）","\"超时\"不能解释成\"今天没营业安排\"。把错误类型和关键参数记下来，按类型处理。","举个例子：余额0和查询超时，必须显示成两种结果。"]},{"n":12,"t":"怎样确认查到了资料","f":["看真的返回了什么，再决定能不能下结论。"],"b":["查商品001门店A的库存，要收到门店A的余额，才能答\"有货没货\"。教学图只是演示，真连接要看真返回。","举个例子：模拟响应能演示流程，实际运行要看真实返回记录。"]},{"n":13,"t":"任务要求","f":["填一张查询小表，说明三种失败各怎么办。"],"b":["任务拆成三步，照着做：\n第一步，填表：查哪家店？哪一天？返回时段是什么？依据哪份资料？\n第二步，三种失败分开写怎么办：超时（可有限重试）／没权限（先确认钥匙）／查无记录（先检查问法，再补资料）。\n第三步，自查：超时和\"没查到\"写成两种结果了吗？（资料均为虚构。）"]},{"n":14,"t":"示例答案","f":["档案证明商品存在；门店A余额0，所以不能说有货。超时的话，结论是\"余额未知\"。"],"b":["示范：\n档案查询成功＝白色贴纸这个商品存在。\n库存查询＝门店A余额0→不能告诉顾客\"有货\"。\n如果库存查询超时→结论不是\"没货\"，是\"还不知道\"。","对照三步检查。"]},{"n":15,"t":"哪里出了错","f":["错误示例：搜索到商品档案，因此门店有货。"],"b":["错误示例：搜索到商品档案，因此门店有货。","错在哪：查的是档案（商品存在），答的却是库存（有没有货）。对象搞混了。"]},{"n":16,"t":"改好，再检查","f":["按商品＋门店查库存；状态不明就留白；编号001别改成1。"],"b":["改法：查库存表，明确门店和商品；查不到就写\"未知\"，别脑补。改完通读一遍。"]},{"n":17,"t":"你也试一次","f":["填查询小表＋三种失败的处理（三步见第13页）。"],"b":["照三步做：填表 → 三种失败分开写怎么办 → 自查超时≠没查到。","再补一问：用传菜窗口的比方，给小林讲明白一件事——为什么\"查询成功\"不等于\"查到的是对的店\"？","多练一次：查商品001，分别写余额0和连接超时的回应。\n留意：0是查询结果，超时表示尚不知道。"]},{"n":18,"t":"完成后检查这四点","f":["查的对象和字段对得上","编号格式没乱改","错误分成明确的类别","教学演示和真实连接分得开"],"b":["查的对象和字段对得上。编号格式没乱改。错误分成明确的类别。教学演示和真实连接分得开","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：查指定门店和日期，成功结果要含时段和来源。超时→有限重试；没权限→先确认读取许可；无记录→先检查问法再补资料。表格只是示例。"],"b":["示范（小表）：查门店A、10月12日→返回10:00—18:00，依据当天临时安排。超时→重试最多2次；无权限→找管理员开读取权限；无记录→先看是不是查错了店、错日期，再补资料。","对照第18页四点自查。"]},{"n":20,"t":"记住这两件事","f":["查询说清对象，回答先解释状态。","超时＝还不知道，余额0才是结果。"],"b":["一句话记住：拿到数先别用，先弄清它是谁的数。","传菜窗口：单子格式对，出来的菜才对。失败分三种，别混着处理。","用自己的话讲一遍这课讲了什么，再举一个\"还得补资料\"的例子。"]},{"n":21,"t":"协议与业务语义","f":["接口统一了，\"什么算有货\"这种业务定义还得你自己定。"],"b":["\"库存可用\"可能要求：商品存在＋这个门店有余额＋允许出售。接口管不了这么多，定义要自己写清。"]},{"n":22,"t":"重复执行的后果","f":["查询重复无妨，下单、发布重复就出事了。"],"b":["查询超时重试，无所谓。但\"下单\"\"群发\"超时后盲目重试，可能发两遍。这类动作要有防重复的机制。"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["API：约定好的\"怎么问怎么答\"\nMCP：工具连接的统一插口\n认证：核对你是谁\n权限：允许你干什么","拿到数先别用，先弄清它是谁的数。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["原论文和官方资料用于解释技术，个人分享提供实践思路。核查日期：2026-10-04。","MCP官方介绍，核查2026-10-04\nhttps://modelcontextprotocol.io/docs/getting-started/intro","Anthropic构建有效Agent，2024\nhttps://www.anthropic.com/engineering/building-effective-agents","ReAct原论文，2022\nhttps://arxiv.org/abs/2210.03629"]}],"ex":{"intro":["为门店营业时间查询填一张小表：查哪家店、哪一天、返回什么；再说明超时、没权限、无记录各怎么办。（资料虚构）","怎么做：①填查询表 ②三种失败分开写处理法 ③自查\"超时\"和\"无记录\"是两种结果。留10—15分钟。"],"sections":[{"h":"照着做一遍（示范）","paras":["示范：查询——门店A、10月12日→返回10:00—18:00，依据当天临时安排。超时——重试最多2次，再失败记录转人工；没权限——找管理员开读取权限；无记录——先检查是不是查错了店或日期，再补资料。超时＝还不知道，无记录＝确实没有，两种结论。"],"items":[]},{"h":"再补一问","paras":["用传菜窗口的比方，给小林讲明白：为什么\"查询成功\"不等于\"查到的是对的店\"？"],"items":[]},{"h":"多练一次","paras":["查询商品001，分别写余额0和连接超时的回应。\n留意：0是查询结果，超时表示尚不知道。"],"items":[]},{"h":"自己检查","paras":["课程案例均为虚构练习。使用AI时，可以记下应用、模型可见名称和日期，方便下次比较。"],"items":["对象和字段对得上","编号格式没乱改","错误类别分得清","演示和真实分得开"]}]},"notes":["验收四点措辞简化，判定口径与原版一致。","再补一问判据：须体现\"查的对象（门店/日期）要对上\"，只复述\"窗口约定\"不算答到。"]},{"id":13,"title":"把经验整理成Skill","intro":"可以边看图文边读，或用这份讲解复习。前置知识：第09—12课。最后四页为深入阅读。","pages":[{"n":1,"t":"把经验整理成Skill","f":["把常用做法写成一份说明，模型升级后拿旧任务重新试一遍"],"b":["把经验写下来，是为了下次少走弯路。模型变化后，用同样的任务检查旧做法，看看哪些规则仍有帮助。","想一件自己的小事，带着它往下读。"]},{"n":2,"t":"先看这份资料","f":["虚构情况：门店只要一条70字内的调整通知。旧规则却要求每篇都写五段（背景/痛点/方案/价值/行动）。"],"b":["虚构门店只有一天调整营业时间，要求70字内通知。旧规则：每篇必须有背景、痛点、方案、价值、行动五段。","矛盾很明显：五段式撑不到70字。这课就练怎么改规则。"]},{"n":3,"t":"方法什么时候需要调整","f":["好方法留低，过时的改掉，判断标准是任务。"],"b":["写下来的方法不是圣旨。任务变了、模型变了，拿旧任务测一测，该改就改。","你也可以试试：旧方法要求所有文案写五段。拿一条短群消息测测，决定怎么改。\n留意：事实检查永远保留；结构按任务重新定。"]},{"n":4,"t":"旧方法怎样重新比较","f":["固定资料和标准，新旧方法各跑一遍比。"],"b":["比较要公平：同一份资料、同一个标准，只换方法。","图中是简化示意，实际用时还是要自己查资料、看结果。"]},{"n":5,"t":"Skill保存可复用经验","f":["Skill是秘籍本：写清\"怎么做、什么时候适用、什么时候不能用\"。"],"b":["Skill就是老师傅的秘籍本：不是把每道菜都做一遍给人看，而是把\"什么火候、什么顺序、什么时候必须停\"写下来。写不清\"什么时候不适用\"的秘籍，是会害人的。（打比方，帮助理解）","它是一份说明文件，不改变模型本身。写清适用和不适用，比堆一堆提示词管用。","举个例子：把反复用的方法写下来，先从一个任务开始。"]},{"n":6,"t":"适用范围先写清","f":["第一句就写：管什么、不管什么。"],"b":["\"负责所有文案\"太宽，容易乱套。\"根据已确认营业资料写顾客通知\"——清楚。范围说明本身就是检查标准。","举个例子：写通知的方法，别硬套到分析报告上。"]},{"n":7,"t":"必要资料有入口","f":["方法里写清：资料去哪拿、缺了怎么办。"],"b":["Skill存通用做法；最新营业时间每次从资料里读。别把旧日期写死在方法里，下次必出错。","举个例子：入口写清资料在哪、缺了怎么补问。"]},{"n":8,"t":"方法包含判断条件","f":["把\"总要写五段\"改成\"按用途定结构\"。"],"b":["营业通知先写日期时间；介绍稿才需要背景价值。质量要求保留（事实必须对），结构按用途灵活定。","举个例子：已知时间必须保留，未知联系人不能编。"]},{"n":9,"t":"例子展示边界","f":["给好例子，也给坏例子，各自说明违反了哪条。"],"b":["讲一个新手都犯过的错：第一次写教程的人，十个有九个栽在同一个坑里——只写\"怎么做\"，不写\"我这是在什么条件下才跑通的\"。别人一照着做就报错，还以为是自己的问题。写Skill同理，适用范围写在最前面，是给三个月后的自己省一夜排查。","好例子：时间完整；坏例子：一天写成一周——并注明坏在哪条。例子不是唯一答案，换个说法只要事实对就行。","举个例子：一份正常资料加一份缺失资料，展示方法边界。"]},{"n":10,"t":"模型升级后复测","f":["升级后做三组比较：只给目标／加旧方法／加新方法。"],"b":["三组用同一资料同一标准，看漏项、格式和修改量的变化。只改这一个变量，结果才说得清。","举个例子：升级前后同题重测，不只看一次成功。"]},{"n":11,"t":"迭代可以做减法","f":["改方法先做减法：删掉没用的死规定，保留底线。"],"b":["底线不删：时间要核对、未知不编、发布要确认。死规定看着删：\"每段重复三遍\"\"必须用某工具\"——删完要观察：原来防住的错回来了没有？","举个例子：固定五段把短通知撑长了，就删。"]},{"n":12,"t":"版本使经验可追踪","f":["留版本：改了什么、为什么改、用什么证明。"],"b":["V1、V2都留着，附上同一测试的输入和结果。资料、模型、规则别一次全换——换了就说不清哪步起了作用。","举个例子：记下修订理由，下次变化能追溯。"]},{"n":13,"t":"任务要求","f":["为社区活动通知写一页方法说明，再拿营业通知试它适不适用。"],"b":["任务拆成三步，照着做：\n第一步，写一页方法：什么时候用／要什么资料／怎么处理／好坏例子各一个／最后查什么。\n第二步，拿两类任务试：营业通知和活动通知——哪些要求不能照搬？（比如：营业通知没有\"报名截止\"。）\n第三步，自查：好例子和坏例子，各注明\"为什么好／违反了哪条\"了吗？"]},{"n":14,"t":"示例答案","f":["10月12日营业时间调整为10:00—18:00，仅当天生效。10月13日恢复原安排，请合理安排到店时间。"],"b":["示范（方法页骨架）：适用——已确认的社区活动通知；不适用——没有审批的、含对外承诺的。资料——日期、地点、报名条件。处理——按对象组织，未知写\"待确认\"。例子——好：日期完整；坏：漏截止日（违反\"必要信息完整\"）。检查——对照原资料，不自动发布。营业通知不硬套\"报名截止\"字段。","对照三步检查。"]},{"n":15,"t":"哪里出了错","f":["错误示例：背景：为提升体验。痛点：顾客等待。方案：当天调整。价值：服务升级。行动：关注我们。"],"b":["错误示例：背景：为提升体验。痛点：顾客等待。方案：当天调整。价值：服务升级。行动：关注我们。","错在哪：段落齐齐整整，日期和时间一个没说清。结构绑架了内容。"]},{"n":16,"t":"改好，再检查","f":["把\"固定五段\"改成\"按用途定结构\"，事实、字数、未知项要求保留。"],"b":["改法：通知类先写日期时间，背景价值留给介绍稿。事实检查和\"未知不编\"不动。改完通读一遍。"]},{"n":17,"t":"你也试一次","f":["写一页方法说明＋用两类任务试适用边界（三步见第13页）。"],"b":["照三步做：写方法页 → 两类任务各试 → 标出不能照搬的要求。","再用阿May的清单练一遍：阿May脑子里有一套\"新人第一天上手\"的检查清单。帮她整理成一份最小Skill稿——适用范围、要先有什么材料、步骤、两个例子（一个能用的、一个不能用的）、怎么算合格。写完检查一下：她那套清单里的经验，哪些只在她那三家店适用？","多练一次：旧方法要求所有文案写五段。短群消息测试后，决定如何修订。\n留意：保持事实检查，按任务重新判断结构。"]},{"n":18,"t":"完成后检查这四点","f":["适用和不适用都写明了","两类任务都能正确用或正确拒绝","例子带了判据","升级测试只改了一个变量"],"b":["适用和不适用都写明了。两类任务都能正确用或正确拒绝。例子带了判据。升级测试只改了一个变量","每项0—2分，总分8分。6分及以上，且没有编造重要事实或擅自执行动作，可以继续下一课。"]},{"n":19,"t":"参考答案","f":["参考：方法适用于已确认的活动通知；必要资料是日期、地点、报名条件；未知留待确认；核完不自动发布。营业通知不硬套活动字段。"],"b":["示范见第14页。核心：范围先行、例子带判据、测试只动一个变量。","对照第18页四点自查。"]},{"n":20,"t":"记住这两件事","f":["方法页写清：什么时候用、怎么做、怎么算好。","模型升级后，旧方法重新测一遍。"],"b":["一句话记住：方法写下来是好事，但得写清什么时候不管用。","秘籍本：写手艺，也写边界。","用自己的话讲一遍这课讲了什么，再举一个\"还得补资料\"的例子。"]},{"n":21,"t":"按需读取","f":["说明写在前头，细节要用再翻。"],"b":["方法页开头几句决定AI会不会正确调用它。资料和脚本可以附在后面，按需读取。"]},{"n":22,"t":"方法与能力一起变化","f":["模型越听话，老方法里的死规定执行得越死。"],"b":["升级后三组对比：只给目标／加旧方法／加新方法。旧方法强制五段导致通知太长？删结构限制，保留日期核对。结论只对你测的模型和任务负责。"]},{"n":23,"t":"几个容易混淆的词","f":["把词放到前面的例子上，就好懂了。"],"b":["Skill：可反复使用的方法包\n前置条件：开工前要满足的条件\n回归：改完之后，把旧要求再查一遍\n版本：能追溯的方法状态","方法写下来是好事，但得写清什么时候不管用。"]},{"n":24,"t":"参考资料与延伸阅读","f":["想了解更多，可以从这些原文读起。"],"b":["原论文和官方资料用于解释技术，个人分享提供实践思
