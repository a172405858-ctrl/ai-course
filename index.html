<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>16课AI图文课程 · 互动阅览 v7 · 故事版</title>
<style>
:root{
  --bg:#070B14;
  --ink:#E8EEF8; --muted:#94A3BC; --faint:#5D6B85;
  --line:rgba(140,170,255,.14); --line2:rgba(140,170,255,.28);
  --panel:rgba(16,25,45,.52); --panel2:rgba(22,33,58,.72);
  --blue:#4F8CFF; --cyan:#22D3EE; --violet:#A78BFA; --green:#34D399; --amber:#F5B94B; --rose:#FB7185;
  --grad:linear-gradient(115deg,#4F8CFF 10%,#22D3EE 90%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);line-height:1.8;font-size:16px;
  background:
    radial-gradient(1000px 560px at 88% -12%,rgba(79,140,255,.17),transparent 62%),
    radial-gradient(820px 520px at -12% 112%,rgba(139,92,246,.13),transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   linear-gradient(rgba(140,170,255,.045) 1px,transparent 1px),
   linear-gradient(90deg,rgba(140,170,255,.045) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 100%)}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:rgba(140,170,255,.18);border-radius:8px}
::selection{background:rgba(34,211,238,.32)}
a{color:var(--cyan);text-decoration:none;border-bottom:1px dashed rgba(34,211,238,.4)}
a:hover{border-bottom-style:solid}
svg.ic{width:16px;height:16px;flex-shrink:0}

#app{display:flex;min-height:100vh;position:relative;z-index:1}
#side{width:280px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;
  background:rgba(10,16,30,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-right:1px solid var(--line);padding:26px 16px 30px}
#side h1{font-size:17px;font-weight:700;letter-spacing:1px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#side .sub{font-size:12px;color:var(--faint);margin:4px 0 18px;letter-spacing:.5px}
.stg{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;margin:18px 0 7px;letter-spacing:2px}
.stg::after{content:'';flex:1;height:1px;background:var(--line)}
.lbtn{position:relative;display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:none;border-radius:10px;padding:8px 11px;font-size:14px;color:var(--ink);cursor:pointer;
  transition:background .18s,transform .18s}
.lbtn:hover{background:rgba(140,170,255,.08);transform:translateX(2px)}
.lbtn.on{background:linear-gradient(90deg,rgba(79,140,255,.2),rgba(34,211,238,.08))}
.lbtn.on::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:3px;
  background:var(--grad);box-shadow:0 0 10px rgba(79,140,255,.8)}
.lbtn .num{font-size:11px;color:var(--faint);min-width:18px;font-variant-numeric:tabular-nums}
.lbtn.on .num{color:var(--cyan)}
.lbtn .st{margin-left:auto;font-size:11px;letter-spacing:1px}
.lbtn .st.done{color:var(--green)}
.lbtn .st.part{color:var(--amber)}
#menuBtn{display:none;position:fixed;left:14px;top:14px;z-index:60;cursor:pointer;
  background:rgba(16,25,45,.8);backdrop-filter:blur(12px);color:var(--ink);
  border:1px solid var(--line2);border-radius:10px;padding:7px 14px;font-size:14px;letter-spacing:2px}
#menuBtn:hover{border-color:var(--cyan)}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{height:3px;background:rgba(140,170,255,.1);position:sticky;top:0;z-index:30}
#bar i{display:block;height:100%;width:0;background:var(--grad);box-shadow:0 0 12px rgba(79,140,255,.9);transition:width .3s}
.wrap{max-width:820px;width:100%;margin:0 auto;padding:44px 26px 130px;flex:1}
.anim{animation:fadeUp .32s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- 封面 ---------- */
.hero{position:relative;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:20px;padding:52px 44px;margin-bottom:18px;overflow:hidden}
.hero::before{content:'';position:absolute;top:-70px;right:-70px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(34,211,238,.2),transparent 70%)}
.hero .eyebrow{font-size:12px;letter-spacing:5px;color:var(--cyan);margin-bottom:14px}
.hero h2{font-size:38px;font-weight:800;letter-spacing:1px;line-height:1.3;margin-bottom:14px;
  background:linear-gradient(115deg,#EAF2FF 20%,#7FB4FF 60%,#22D3EE);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);font-size:15px;max-width:58ch}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.stat{font-size:12.5px;color:var(--muted);letter-spacing:1px;padding:6px 14px;border-radius:20px;
  background:rgba(140,170,255,.07);border:1px solid var(--line)}
.stat b{color:var(--cyan);font-weight:600}
.hero .go{display:inline-block;margin-top:26px;cursor:pointer;border:none;border-radius:12px;
  padding:13px 34px;font-size:15px;letter-spacing:3px;color:#06101F;font-weight:700;
  background:var(--grad);box-shadow:0 6px 26px rgba(79,140,255,.45);transition:transform .18s,box-shadow .18s}
.hero .go:hover{transform:translateY(-2px);box-shadow:0 10px 34px rgba(34,211,238,.5)}
.stcard{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:14px;transition:border-color .2s,transform .2s}
.stcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.stcard h3{font-size:16px;font-weight:700;letter-spacing:2px;margin-bottom:3px;color:var(--sc)}
.stcard .d{font-size:13px;color:var(--faint);margin-bottom:12px;letter-spacing:.5px}
.lrow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:15px;transition:background .16s}
.lrow:hover{background:rgba(140,170,255,.08)}
.lrow .n{font-size:12px;color:var(--faint);min-width:26px;font-variant-numeric:tabular-nums}
.lrow .tag{margin-left:auto;font-size:12px;letter-spacing:1px;color:var(--faint)}
.lrow .tag.done{color:var(--green)}
.lrow .tag.part{color:var(--amber)}

/* ---------- 页面 ---------- */
.chead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.pchip{font-size:12px;letter-spacing:2px;color:var(--sc);padding:3px 14px;border-radius:20px;
  background:color-mix(in srgb,var(--sc) 10%,transparent);border:1px solid color-mix(in srgb,var(--sc) 35%,transparent);
  font-variant-numeric:tabular-nums}
h2.pt{font-size:25px;font-weight:700;letter-spacing:.5px;margin:8px 0 16px}
.focus{position:relative;display:flex;gap:13px;align-items:flex-start;
  background:color-mix(in srgb,var(--sc) 7%,transparent);border:1px solid color-mix(in srgb,var(--sc) 25%,transparent);
  border-radius:14px;padding:15px 19px;margin-bottom:20px}
.focus .fi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
  background:color-mix(in srgb,var(--sc) 16%,transparent);color:var(--sc)}
.focus .fi svg{width:18px;height:18px}
.focus .fl{font-size:16px;font-weight:600;line-height:1.6}
.lead{font-size:17.5px;line-height:1.9;color:var(--ink);margin-bottom:18px;font-weight:500}
.lead .analogy{vertical-align:2px}

/* 图标chip卡 */
.mini{display:flex;gap:13px;align-items:flex-start;border:1px solid;border-radius:13px;
  padding:13px 16px;margin:0 0 12px;background:var(--tint)}
.mini .mi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
  color:var(--mc);background:color-mix(in srgb,var(--mc) 14%,transparent);border:1px solid color-mix(in srgb,var(--mc) 30%,transparent)}
.mini .mt{font-size:12px;letter-spacing:2px;color:var(--mc);margin-bottom:1px;font-weight:600}
.mini .mb{font-size:14.5px;color:var(--ink);line-height:1.7}
.mini.ex{--mc:#F5B94B;--tint:rgba(245,185,75,.05);border-color:rgba(245,185,75,.28)}
.mini.try{--mc:#22D3EE;--tint:rgba(34,211,238,.05);border-color:rgba(34,211,238,.26)}
.mini.warn{--mc:#FB7185;--tint:rgba(251,113,133,.05);border-color:rgba(251,113,133,.28)}
.demo{border-radius:13px;padding:15px 18px;margin:0 0 12px;
  background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.3)}
.demo .dtag{display:inline-flex;align-items:center;gap:7px;background:rgba(52,211,153,.14);color:var(--green);
  border:1px solid rgba(52,211,153,.4);border-radius:20px;font-size:12px;padding:2px 13px;margin-bottom:9px;letter-spacing:2px}
.demo .foot{font-size:12px;color:var(--faint);margin-top:8px}
.demo-mini{border-radius:11px;padding:6px 15px;margin:0 0 12px;background:rgba(52,211,153,.05);border:1px dashed rgba(52,211,153,.25)}
.demo-mini .foot{margin:0}
.analogy{display:inline-block;background:rgba(245,185,75,.1);color:var(--amber);
  border:1px solid rgba(245,185,75,.35);border-radius:20px;font-size:12px;padding:0 11px;margin:0 4px;letter-spacing:1px;white-space:nowrap}
.quote{border-radius:14px;padding:17px 21px;margin:4px 0 16px;
  background:linear-gradient(var(--panel2),var(--panel2)) padding-box,
             linear-gradient(115deg,rgba(79,140,255,.7),rgba(34,211,238,.55)) border-box;
  border:1px solid transparent}
.quote .lab{display:block;font-size:12px;letter-spacing:4px;margin-bottom:5px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:600}
.quote .q{font-size:19px;font-weight:700;letter-spacing:.5px}
details.more{margin:6px 0 4px}
details.more summary{cursor:pointer;font-size:12.5px;color:var(--faint);letter-spacing:3px;user-select:none;list-style:none;display:inline-flex;align-items:center;gap:7px}
details.more summary::before{content:'+';font-size:14px;width:18px;height:18px;border:1px solid var(--line2);border-radius:50%;display:inline-grid;place-items:center;transition:transform .2s}
details.more[open] summary::before{transform:rotate(45deg);background:rgba(140,170,255,.12)}
details.more summary:hover{color:var(--cyan)}
details.more .morebd{padding:14px 4px 2px;font-size:15px;color:var(--muted)}
details.more .morebd .para{margin-bottom:13px}

/* 封面页 */
.cover{display:flex;gap:34px;align-items:center;margin-bottom:8px}
.cover .cl{flex:1;min-width:0}
.cover .cr{width:230px;flex-shrink:0;display:grid;place-items:center}
.cover .goal{font-size:17px;font-weight:600;line-height:1.7;margin:10px 0 16px;padding-left:15px;border-left:3px solid var(--sc)}
.cover .hook{font-size:16.5px;color:var(--muted);font-style:normal;line-height:1.9}
.cover .meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.cover .meta span{font-size:12px;color:var(--faint);letter-spacing:1px;padding:4px 12px;border-radius:20px;border:1px solid var(--line)}
.cover .bignum{position:absolute;right:270px;top:6px;font-size:110px;font-weight:800;line-height:1;
  color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--sc) 35%,transparent);pointer-events:none;font-variant-numeric:tabular-nums}

/* 验收/术语/来源/要点 卡 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 14px}
.gcard{border:1px solid var(--line);border-radius:13px;padding:14px 16px;background:var(--panel);
  display:flex;gap:12px;align-items:flex-start}
.gcard .gn{font-size:12px;font-variant-numeric:tabular-nums;min-width:26px;height:26px;border-radius:8px;
  display:grid;place-items:center;color:var(--sc);background:color-mix(in srgb,var(--sc) 13%,transparent);border:1px solid color-mix(in srgb,var(--sc) 30%,transparent)}
.gcard .gb{font-size:14.5px;line-height:1.65}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);letter-spacing:1px;
  border:1px dashed var(--line2);border-radius:20px;padding:6px 16px;margin-bottom:6px}
.pill b{color:var(--cyan)}
.term2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:6px 0 14px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:12px 15px;background:var(--panel)}
.tcard b{display:block;font-size:14px;color:var(--sc);letter-spacing:1px;margin-bottom:2px}
.tcard span{font-size:13.5px;color:var(--muted);line-height:1.6}
.src{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;
  padding:12px 15px;margin-bottom:10px;background:var(--panel)}
.src .si{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;color:var(--cyan);
  background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.28)}
.src .st{font-size:14px;line-height:1.6}
.src .su{font-size:12px;color:var(--faint);word-break:break-all}
.src .sn{font-size:12px;color:var(--faint)}

/* ---------- 翻页 ---------- */
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:4px 22px 10px;max-width:820px;margin:0 auto}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(140,170,255,.18);cursor:pointer;border:none;padding:0;transition:all .18s}
.dot:hover{background:rgba(140,170,255,.45)}
.dot.seen{background:rgba(34,211,238,.4)}
.dot.cur{background:var(--grad);transform:scale(1.4);box-shadow:0 0 10px rgba(79,140,255,.9)}
.kbd{font-size:11px;color:var(--faint);text-align:center;padding-bottom:8px;letter-spacing:2px}
.pager{display:flex;align-items:center;gap:14px;justify-content:space-between;max-width:820px;margin:0 auto;
  padding:14px 26px 20px;position:sticky;bottom:0;
  background:linear-gradient(to top,var(--bg) 55%,rgba(7,11,20,.85) 78%,transparent)}
.pbtn{background:var(--panel2);backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:11px;
  padding:10px 24px;font-size:14.5px;cursor:pointer;color:var(--ink);letter-spacing:1px;transition:all .18s}
.pbtn:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}
.pbtn:disabled{opacity:.3;cursor:default}
.pbtn.primary{background:var(--grad);border:none;color:#06101F;font-weight:700;box-shadow:0 5px 20px rgba(79,140,255,.4)}
.pbtn.primary:hover{color:#06101F;transform:translateY(-1px);box-shadow:0 8px 26px rgba(34,211,238,.5)}
.pind{font-size:12.5px;color:var(--muted);letter-spacing:1px;font-variant-numeric:tabular-nums}

/* ---------- 练习 ---------- */
.exbox{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:16px;padding:30px 32px;margin-bottom:16px}
.exbox .task{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.exbox .task .mi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;color:#06101F;background:var(--grad)}
.exbox .task .tb{font-size:17px;font-weight:600;line-height:1.75}
.exbox .tn{font-size:13px;color:var(--faint);margin-top:6px}
.exbox .sec{margin-top:18px}
.chk2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk2 label{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;cursor:pointer;font-size:14px;transition:border-color .15s,background .15s;background:rgba(140,170,255,.03)}
.chk2 label:hover{border-color:var(--line2)}
.chk2 input{width:17px;height:17px;margin-top:3px;accent-color:var(--cyan);flex-shrink:0}
.chk2 label.on{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.05)}
.chk2 label.on span{color:var(--faint);text-decoration:line-through}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.notes>button{width:100%;background:none;border:none;padding:16px 24px;font-size:14px;text-align:left;cursor:pointer;
  color:var(--muted);display:flex;justify-content:space-between;letter-spacing:1px}
.notes>button:hover{color:var(--cyan)}
.notes .bd{display:none;padding:2px 24px 20px;font-size:13.5px;color:var(--muted)}
.notes.open .bd{display:block}
.notes ol{padding-left:20px}
.notes li{margin-bottom:9px}
.finish{text-align:center;padding:14px 0 30px}
.finish .pbtn{padding:13px 44px;font-size:15px;letter-spacing:3px}

@media(max-width:920px){
  #side{position:fixed;left:-300px;top:0;z-index:50;transition:left .25s;box-shadow:6px 0 30px rgba(0,0,0,.5)}
  #side.open{left:0}
  #menuBtn{display:block}
  .wrap{padding-top:60px}
  .hero{padding:38px 26px}
  .hero h2{font-size:29px}
  .cover{flex-direction:column-reverse;gap:14px}
  .cover .cr{width:150px}
  .cover .bignum{display:none}
  .grid2,.term2,.chk2{grid-template-columns:1fr}
}
/* ================= v5：日间暖色主题 + 故事版组件 ================= */
body.light{
  --bg:#FAF6EF; --ink:#2A2730; --muted:#5D5866; --faint:#8E8895;
  --line:rgba(90,70,50,.13); --line2:rgba(90,70,50,.25);
  --panel:rgba(255,255,255,.82); --panel2:#FFFFFF;
  --blue:#3B6FE0; --cyan:#0E8C9C; --violet:#7357D1; --green:#1C9466; --amber:#B9770E; --rose:#D0435C;
  --grad:linear-gradient(115deg,#F2994A 5%,#E8566C 95%);
  background:radial-gradient(900px 500px at 92% -10%,rgba(242,153,74,.16),transparent 62%),
             radial-gradient(800px 520px at -10% 110%,rgba(232,86,108,.10),transparent 60%),var(--bg);
  background-attachment:fixed;
}
body.light::before{display:none}
body.light #side{background:rgba(255,252,246,.86)}
body.light .hero h2{background:linear-gradient(115deg,#2A2730 30%,#C2452F);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body.light .hero .go,body.light .pbtn.primary,body.light .pbtn.primary:hover{color:#fff}
body.light .pager{background:linear-gradient(to top,var(--bg) 55%,rgba(250,246,239,.88) 78%,transparent)}
body.light .lbtn.on{background:linear-gradient(90deg,rgba(242,153,74,.18),rgba(232,86,108,.06))}
body.light .lbtn.on::before{box-shadow:none}
body.light #bar i{box-shadow:none}
body.light .exbox .task .mi{color:#fff}
body.light ::selection{background:rgba(242,153,74,.3)}
body.light .quote .q{color:var(--ink)}
.themebtn{margin-top:10px;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:20px;padding:3px 12px;font-size:12px;cursor:pointer}
.themebtn:hover{color:var(--ink)}

/* 三个入口标签 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;padding:5px;border-radius:14px;background:var(--panel);border:1px solid var(--line);width:fit-content}
.tabs button{border:none;background:none;color:var(--muted);font-size:13.5px;padding:7px 15px;border-radius:10px;cursor:pointer;letter-spacing:.5px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--grad);color:#fff;font-weight:600}
body:not(.light) .tabs button.on{color:#06101F}

/* 故事版 */
.st-hero{position:relative;padding:34px 34px 30px;border-radius:20px;background:var(--panel);border:1px solid var(--line);margin-bottom:22px;overflow:hidden}
.st-hero .eb{font-size:12.5px;letter-spacing:3px;color:var(--sc);margin-bottom:10px}
.st-hero h2{font-size:31px;line-height:1.35;font-weight:800;margin-bottom:8px}
.st-hero .sb{font-size:16px;color:var(--muted)}
.st-hero .who{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:6px 14px 6px 6px;border-radius:30px;border:1px solid var(--line);background:var(--panel2);font-size:13.5px;color:var(--muted)}
.st-hero .who .av{font-size:22px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--sc) 14%,transparent)}
.st-hero .bn{position:absolute;right:22px;top:6px;font-size:96px;font-weight:800;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--sc) 30%,transparent);pointer-events:none}
.ssec{margin:0 0 26px}
.ssec>.sh{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:3px;color:var(--sc);font-weight:700;margin-bottom:12px}
.ssec>.sh .e{font-size:18px;letter-spacing:0}
.ssec>.sh::after{content:'';flex:1;height:1px;background:var(--line)}
.scene{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.scene .n{font-size:16.5px;line-height:1.95;margin-bottom:12px}
.scene .o{margin:4px 0 14px 0;display:flex}
.scene .o span{background:color-mix(in srgb,var(--green) 13%,var(--panel2));border:1px solid color-mix(in srgb,var(--green) 30%,transparent);border-radius:4px 16px 16px 16px;padding:10px 16px;font-size:15.5px;max-width:88%}
.scene .p{display:flex;gap:10px;align-items:flex-start;margin:4px 0 14px}
.scene .p .av{font-size:22px;width:38px;height:38px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--sc) 14%,transparent)}
.scene .p .bub{background:var(--panel2);border:1px solid var(--line2);border-radius:4px 16px 16px 16px;padding:9px 15px;font-size:15.5px}
.scene .p .bub i{display:block;font-style:normal;font-size:12px;color:var(--faint);margin-bottom:2px}
.scene .qq{margin-top:6px;padding:13px 16px;border-left:3px solid var(--sc);background:color-mix(in srgb,var(--sc) 7%,transparent);border-radius:0 12px 12px 0;font-size:16px;font-weight:600}
.big{font-size:19px;line-height:1.85;font-weight:600;padding:20px 24px;border-radius:16px;
  background:linear-gradient(var(--panel2),var(--panel2)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
.anal{display:flex;gap:18px;align-items:flex-start;padding:20px 22px;border-radius:16px;background:color-mix(in srgb,var(--amber) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
.anal .ai{font-size:40px;line-height:1}
.anal h4{font-size:17px;margin-bottom:6px}
.anal p{font-size:15.5px;line-height:1.9;color:var(--ink)}
.steps{counter-reset:st}
.stp{position:relative;padding:14px 18px 14px 58px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:10px}
.stp::before{counter-increment:st;content:counter(st);position:absolute;left:16px;top:14px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--sc);background:color-mix(in srgb,var(--sc) 13%,transparent)}
.stp h4{font-size:16px;margin-bottom:3px}
.stp p{font-size:15px;line-height:1.85;color:var(--ink)}
.term{cursor:pointer;border-bottom:1.5px dotted var(--sc);white-space:normal}
.term b{color:var(--sc)}
.term .tdef{display:none;font-size:13px;color:var(--muted);background:color-mix(in srgb,var(--sc) 8%,transparent);border-radius:8px;padding:1px 8px;margin:0 3px}
.term.open .tdef{display:inline}
.term .tdef::before{content:'＝ '}
.wd{border:1px solid var(--line2);border-radius:16px;padding:18px 20px;background:var(--panel);margin-bottom:14px}
.wd h4{font-size:16.5px;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.wd h4::before{content:'▶';font-size:11px;color:#fff;background:var(--sc);width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center}
.wd .hint{font-size:13px;color:var(--faint);margin-bottom:12px}
.wd .note{font-size:12.5px;color:var(--faint);margin-top:10px}
.wd .res{margin-top:10px;font-size:14px;color:var(--muted)}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:10px;padding:6px 13px;font-size:13.5px;cursor:pointer;transition:all .15s}
.btn:hover{border-color:var(--sc);color:var(--sc)}
.btn.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.btn.no{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent);color:var(--rose)}
.btn.main{background:var(--grad);border:none;color:#fff;font-weight:600}
body:not(.light) .btn.main{color:#06101F}
.srow{border-top:1px dashed var(--line);padding:11px 0}
.srow:first-of-type{border-top:none}
.srow .it{font-size:15px;margin-bottom:7px}
.srow .bs{display:flex;gap:6px;flex-wrap:wrap}
.fb{font-size:13.5px;margin-top:7px;padding:7px 11px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.g{background:color-mix(in srgb,var(--green) 10%,transparent);color:var(--ink)}
.fb.r{background:color-mix(in srgb,var(--rose) 10%,transparent);color:var(--ink)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp .cc{border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.85;border:1px solid var(--line)}
.cmp .cc .lb{font-size:12px;letter-spacing:2px;font-weight:700;margin-bottom:6px}
.cmp .ca{background:color-mix(in srgb,var(--rose) 6%,var(--panel2))}
.cmp .ca .lb{color:var(--rose)}
.cmp .cb{background:color-mix(in srgb,var(--green) 7%,var(--panel2))}
.cmp .cb .lb{color:var(--green)}
.cmp .cb.hid{display:grid;place-items:center;min-height:120px}
.why{margin-top:12px;font-size:15px;line-height:1.85;padding:11px 14px;border-radius:11px;background:color-mix(in srgb,var(--sc) 7%,transparent)}
.srcbox{font-size:13.5px;padding:9px 13px;border-radius:10px;background:color-mix(in srgb,var(--blue) 8%,transparent);border:1px dashed color-mix(in srgb,var(--blue) 35%,transparent);margin-bottom:12px}
.srcbox b{color:var(--blue)}
.spot{font-size:16.5px;line-height:2.1;padding:14px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.spot .sg{cursor:pointer;border-radius:5px;padding:2px 2px;transition:background .15s}
.spot .sg:hover{background:color-mix(in srgb,var(--amber) 16%,transparent)}
.spot .sg.s0{background:color-mix(in srgb,var(--green) 16%,transparent)}
.spot .sg.s1{background:color-mix(in srgb,var(--rose) 20%,transparent);text-decoration:line-through;text-decoration-color:var(--rose)}
.spot .sg.s2{background:color-mix(in srgb,var(--amber) 20%,transparent)}
.ord .pool{display:flex;flex-direction:column;gap:7px}
.ord .done{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.ord .done div{padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--green) 11%,transparent);border:1px solid color-mix(in srgb,var(--green) 30%,transparent);font-size:14.5px}
.ord .done div b{color:var(--green);margin-right:8px}
.ord .pool .btn{text-align:left;font-size:14.5px;padding:9px 13px}
.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tl .btn.on{background:var(--sc);color:#fff;border-color:var(--sc)}
.tlc{padding:14px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:15px;line-height:1.85}
.tlc h5{font-size:16px;margin-bottom:4px}
.nw .ctx{font-size:18px;padding:14px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:12px}
.nw .ctx .add{color:var(--sc);font-weight:700;border-bottom:2px solid var(--sc)}
.nw .bar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.nw .bar .w{width:96px;flex-shrink:0;text-align:right}
.nw .bar .t{flex:1;height:14px;border-radius:7px;background:color-mix(in srgb,var(--sc) 9%,transparent);overflow:hidden}
.nw .bar .t i{display:block;height:100%;background:var(--sc);border-radius:7px;transition:width .4s}
.nw .bar .v{width:44px;font-size:12px;color:var(--faint)}
.nw .ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.dn canvas{width:220px;height:220px;image-rendering:pixelated;border-radius:12px;border:1px solid var(--line);display:block;margin:0 auto 10px}
.dn input[type=range]{width:100%}
.dn .lbl{text-align:center;font-size:13.5px;color:var(--muted)}
.calc table{width:100%;border-collapse:collapse;font-size:14px}
.calc td,.calc th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.calc input{width:80px;padding:4px 7px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);font-size:14px}
.calc .out{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc .out div{padding:11px 13px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-size:14px}
.calc .out b{font-size:20px;color:var(--sc)}
.bld label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.bld textarea,.tool input{width:100%;padding:8px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);font-size:14.5px;font-family:inherit;resize:vertical}
.pbox{position:relative;white-space:pre-wrap;font-size:14.5px;line-height:1.8;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--sc) 6%,var(--panel2));border:1px dashed color-mix(in srgb,var(--sc) 45%,transparent);margin-top:12px;padding-right:70px}
.pbox .cp{position:absolute;right:8px;top:8px;font-size:12px;padding:3px 10px}
.ckl label{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;font-size:15px;cursor:pointer;border-bottom:1px dashed var(--line)}
.ckl input{width:17px;height:17px;margin-top:4px;accent-color:var(--green)}
.tool .g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool .g label{font-size:13px;color:var(--muted);font-weight:600}
.tool .errs{margin-top:10px;color:var(--rose);font-size:14px}
.tool .ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.myth{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mc{perspective:800px;cursor:pointer;min-height:150px}
.mc .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .5s;transform-style:preserve-3d}
.mc.f .in{transform:rotateY(180deg)}
.mc .fr,.mc .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:14px 15px;font-size:14.5px;line-height:1.75;overflow:auto}
.mc .fr{background:color-mix(in srgb,var(--rose) 8%,var(--panel2));border:1px solid color-mix(in srgb,var(--rose) 30%,transparent)}
.mc .bk{background:color-mix(in srgb,var(--green) 9%,var(--panel2));border:1px solid color-mix(in srgb,var(--green) 30%,transparent);transform:rotateY(180deg)}
.mc .k{display:block;font-size:11.5px;letter-spacing:2px;font-weight:700;margin-bottom:4px}
.mc .fr .k{color:var(--rose)} .mc .bk .k{color:var(--green)}
.mc .tap{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--faint)}
.qz{border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:var(--panel);margin-bottom:10px}
.qz .qq{font-size:15.5px;font-weight:600;margin-bottom:9px}
.qz .op{display:flex;flex-direction:column;gap:7px}
.qz .op .btn{text-align:left;font-size:14.5px;padding:8px 12px}
.take{text-align:center;padding:26px 20px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.take .tl2{font-size:12px;letter-spacing:4px;color:var(--faint);margin-bottom:6px}
.take .tq{font-size:25px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nextbox{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.gloss{display:flex;flex-wrap:wrap;gap:8px}
.gloss span{font-size:13px;padding:5px 11px;border-radius:9px;background:var(--panel);border:1px solid var(--line)}
.gloss span b{color:var(--sc);margin-right:4px}
.cast{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.cast .cm{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.cast .cm .av{font-size:30px}
.cast .cm b{font-size:15.5px}
.cast .cm p{font-size:13.5px;color:var(--muted);line-height:1.7}
.howto{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.howto span{font-size:13px;padding:6px 13px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.lrow .q{font-size:12.5px;color:var(--faint);margin-left:8px}
@media(max-width:920px){
  .cmp,.myth,.cast,.tool .g,.calc .out{grid-template-columns:1fr}
  .st-hero{padding:26px 20px}
  .st-hero h2{font-size:25px}
  .st-hero .bn{display:none}
  .lrow .q{display:none}
}
/* ================= v6：杂志式视觉升级 ================= */
:root{--serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",-apple-system,sans-serif}
body{font-family:var(--sans)}
.hero::before{display:none!important}
/* 四个阶段的色彩身份（日间） */
.sx0{--sc:#3654D6;--sct:#E3E8FF;--scd:#1E318F;--sca:#FF8A5B}
.sx1{--sc:#0B8A7E;--sct:#D6F3EE;--scd:#05554D;--sca:#F2B33D}
.sx2{--sc:#7B4BD8;--sct:#ECE3FF;--scd:#45237F;--sca:#2FBF9E}
.sx3{--sc:#D9572B;--sct:#FFE6DA;--scd:#8A2E10;--sca:#3654D6}
body:not(.light) .sx0{--sc:#8EA6FF;--sct:rgba(142,166,255,.16);--scd:#DCE3FF}
body:not(.light) .sx1{--sc:#41D1BF;--sct:rgba(65,209,191,.14);--scd:#C9F6EF}
body:not(.light) .sx2{--sc:#B99BFF;--sct:rgba(185,155,255,.15);--scd:#EADFFF}
body:not(.light) .sx3{--sc:#FF9A6B;--sct:rgba(255,154,107,.15);--scd:#FFE2D4}
/* 纸张质感背景 + 每阶段色调 */
body.light{background:
  radial-gradient(rgba(120,90,60,.07) 1px,transparent 1.2px) 0 0/18px 18px,
  radial-gradient(1100px 600px at 100% -10%,rgba(242,153,74,.14),transparent 60%),
  radial-gradient(900px 600px at -10% 110%,rgba(54,84,214,.08),transparent 60%),#FBF7F0;background-attachment:fixed}
body.light[data-stage="0"]{background-color:#F6F7FD}
body.light[data-stage="1"]{background-color:#F3FAF8}
body.light[data-stage="2"]{background-color:#F8F5FD}
body.light[data-stage="3"]{background-color:#FDF6F2}
.wrap{max-width:900px}
/* 通用块节奏 */
.blk{margin:0 0 46px}
.sh6{display:flex;align-items:baseline;gap:12px;margin:0 0 16px}
.sh6 .sn{font-family:var(--serif);font-size:34px;font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:1.4px var(--sc,#999)}
.sh6 .sl{font-family:var(--serif);font-size:21px;font-weight:800;letter-spacing:1px}
.sh6 .se{margin-left:auto;font-size:11px;letter-spacing:3px;color:var(--sc,#999);font-weight:700;opacity:.8}
.hl6{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--sca,#F2B33D) 55%,transparent) 58%,color-mix(in srgb,var(--sca,#F2B33D) 55%,transparent) 92%,transparent 92%);padding:0 2px}
body:not(.light) .hl6{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--sca,#F2B33D) 45%,transparent) 62%);}
.stk{display:inline-block;font-size:11px;letter-spacing:3px;font-weight:800;color:#fff;background:var(--sc,#2B2D42);padding:4px 11px;border-radius:4px;transform:rotate(-2deg)}
.scrib{display:block;width:180px;height:14px;margin-top:4px}
/* 封面 */
.hero6{position:relative;display:grid;grid-template-columns:1.25fr 1fr;gap:10px;align-items:center;padding:40px 40px 34px;border-radius:26px;margin-bottom:46px;overflow:hidden;
  background:radial-gradient(color-mix(in srgb,var(--sc) 22%,transparent) 1.2px,transparent 1.4px) 0 0/16px 16px,linear-gradient(135deg,var(--sct),color-mix(in srgb,var(--sct) 40%,var(--panel2)));
  border:1px solid color-mix(in srgb,var(--sc) 25%,transparent)}
.hero6::after{content:'';position:absolute;right:-80px;bottom:-110px;width:320px;height:320px;border-radius:50%;background:color-mix(in srgb,var(--sc) 14%,transparent)}
.hero6 .hl,.hero6 .hr{position:relative;z-index:1}
.tagrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.tagrow .stg6{font-size:12px;font-weight:700;color:var(--scd);padding:3px 10px;border-radius:20px;background:color-mix(in srgb,var(--sc) 14%,transparent)}
.tagrow .lt{font-size:12.5px;color:var(--muted)}
.hq{font-family:var(--serif);font-size:40px;line-height:1.32;font-weight:900;letter-spacing:.5px;color:var(--ink);margin-bottom:14px}
.hsub{font-size:16.5px;color:var(--muted)}
.hsub .scrib{width:220px}
.who6{display:inline-flex;align-items:center;gap:12px;margin-top:22px;padding:8px 18px 8px 8px;border-radius:40px;background:var(--panel2);box-shadow:0 6px 18px rgba(40,30,20,.08)}
.who6 div{display:flex;flex-direction:column;line-height:1.35}
.who6 small{font-size:11px;color:var(--faint);letter-spacing:1px}
.who6 b{font-size:16px}
.who6 span{font-size:12px;color:var(--muted)}
.hero6 .hr{display:grid;place-items:center;min-height:240px}
.bignum6{position:absolute;right:0;top:-16px;font-family:var(--serif);font-size:130px;font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--sc) 35%,transparent)}
.ill{width:100%;max-width:330px;filter:drop-shadow(0 10px 18px rgba(40,30,20,.12))}
.ill svg{width:100%;height:auto;display:block}
.avt{display:block;flex-shrink:0;border-radius:50%;box-shadow:0 0 0 3px var(--panel2),0 4px 10px rgba(0,0,0,.12)}
/* 场景 */
.scene6{display:grid;grid-template-columns:150px 1fr;gap:0;border-radius:22px;overflow:hidden;background:var(--panel2);box-shadow:0 10px 30px rgba(40,30,20,.07);border:1px solid var(--line)}
.sside{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 12px;background:linear-gradient(180deg,var(--sct),transparent);text-align:center;position:relative}
.sside b{font-family:var(--serif);font-size:17px}
.sside small{font-size:11.5px;color:var(--muted);line-height:1.5}
.tape{position:absolute;top:10px;left:-6px;font-size:11px;font-weight:800;letter-spacing:2px;background:var(--sca);color:#fff;padding:3px 14px;transform:rotate(-8deg)}
.smain{padding:26px 28px}
.sn6{font-size:16.5px;line-height:2;margin-bottom:12px}
.msg6{display:flex;gap:10px;align-items:flex-start;margin:6px 0 16px}
.msg6 .mi{font-size:18px}
.msg6 .mb{background:#E8F7EC;color:#1E3A2A;border-radius:4px 18px 18px 18px;padding:11px 17px;font-size:15.5px;box-shadow:0 2px 0 rgba(0,0,0,.05)}
body:not(.light) .msg6 .mb{background:#1F3A2C;color:#DDF5E5}
.say6{display:flex;gap:12px;align-items:flex-start;margin:6px 0 16px}
.say6 .sb{background:var(--sct);border-radius:4px 18px 18px 18px;padding:10px 16px;font-size:15.5px;position:relative}
.say6 .sb i{display:block;font-style:normal;font-size:11.5px;font-weight:700;color:var(--scd);margin-bottom:2px}
.ask6{display:flex;gap:14px;align-items:center;margin-top:10px;padding:16px 18px;border-radius:16px;background:var(--scd);color:#fff;font-size:16px;font-weight:600;line-height:1.75}
body:not(.light) .ask6{background:color-mix(in srgb,var(--sc) 30%,#111)}
.ask6 .qmk{font-family:var(--serif);font-size:40px;font-weight:900;line-height:1;color:var(--sca)}
.ask6 strong{color:#fff;border-bottom:2px solid var(--sca)}
/* 一句话说透：大引号拉引 */
.pq6{position:relative;margin:0;padding:34px 46px 30px;border-radius:24px;background:var(--panel2);box-shadow:0 14px 40px rgba(40,30,20,.08);border-left:8px solid var(--sc)}
.pq6 .qo,.pq6 .qc,.take6 .qo,.take6 .qc{font-family:var(--serif);font-weight:900;line-height:1;color:var(--sc)}
.pq6 .qo{position:absolute;left:14px;top:-18px;font-size:110px;opacity:.9}
.pq6 .qc{position:absolute;right:20px;bottom:-62px;font-size:110px;opacity:.25}
.pqt{font-family:var(--serif);font-size:22px;line-height:1.85;font-weight:600}
.pqt strong,.big strong,.anal strong,.ant strong,.st6 strong,.sn6 strong{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--sca) 50%,transparent) 60%);font-weight:800}

body:not(.light) .home6{background:radial-gradient(rgba(255,154,107,.12) 1.2px,transparent 1.4px) 0 0/18px 18px,linear-gradient(135deg,#1A1422,#0F1424);border-color:rgba(255,154,107,.2)}

.hav:nth-child(1){transform:rotate(-6deg)} .hav:nth-child(2){transform:rotate(5deg)} .hav:nth-child(3){transform:rotate(4deg)} .hav:nth-child(4){transform:rotate(-4deg)}

/* ================= v7 · 设计层 ================= */
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
/* 页面入场 */
.pgin7>.anim{animation:pg7 .7s var(--ease) both}
@keyframes pg7{from{opacity:0;transform:translateY(22px) scale(.992);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
/* 滚动出现 */
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}
.st6.rv{transform:translateY(34px) scale(.98)}
.st6.rv.in{transform:none}
.myth .mc.rv:nth-child(2){transition-delay:.08s}.myth .mc.rv:nth-child(3){transition-delay:.16s}
/* 荧光笔 / 手绘线：滚到才画 */
.hl6{background-size:0% 100%!important;background-repeat:no-repeat!important;transition:background-size 1s var(--ease) .35s}
.in .hl6,.hl6.in{background-size:100% 100%!important}
.scrib path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s var(--ease) .5s}
.in .scrib path{stroke-dashoffset:0}
/* 标题：词组成块 + 平衡断行 + 逐块入场 */
.hq,.lq,.k2{text-wrap:balance}
.hsub span,.pqt,.tkq,.hlead,.lede7{text-wrap:pretty}
.kw{display:inline-block;white-space:nowrap}
.hero6 .kw{opacity:0;transform:translateY(.5em);filter:blur(4px);transition:opacity .7s var(--ease),transform .7s var(--ease),filter .7s;transition-delay:calc(var(--i)*90ms + .1s)}
.hero6.in .kw{opacity:1;transform:none;filter:none}
/* 封面：景深 + 流动光 */
.hero6{isolation:isolate}
.hero6::before{content:'';position:absolute;inset:-30%;z-index:0;pointer-events:none;background:radial-gradient(30% 40% at 20% 30%,color-mix(in srgb,var(--sc) 22%,transparent),transparent 70%),radial-gradient(28% 36% at 80% 70%,color-mix(in srgb,var(--sca) 24%,transparent),transparent 70%);animation:mesh7 18s ease-in-out infinite alternate;display:block!important}
@keyframes mesh7{to{transform:translate(6%,-4%) rotate(8deg)}}
.hero6 .ill{transform:translate(calc(var(--px,0)*-18px),calc(var(--py,0)*-12px));transition:transform .4s var(--ease)}
.hero6 .bignum6{transform:translate(calc(var(--px,0)*30px),calc(var(--py,0)*20px));transition:transform .5s var(--ease)}
.hero6 .ill svg{animation:float7 6s ease-in-out infinite}
.hero6 .ill svg>path:first-of-type{transform-box:fill-box;transform-origin:center;animation:breathe7 7s ease-in-out infinite}
@keyframes float7{50%{transform:translateY(-8px) rotate(-.6deg)}}
@keyframes breathe7{50%{transform:scale(1.05) rotate(2deg)}}
.hero6 .ill svg>g:first-of-type circle{animation:tw7 3s ease-in-out infinite}
.hero6 .ill svg>g:first-of-type circle:nth-child(2){animation-delay:-1s}.hero6 .ill svg>g:first-of-type circle:nth-child(3){animation-delay:-2s}
@keyframes tw7{50%{opacity:.2;transform:translateY(-3px)}}
.hero6 .who6{transition:transform .4s var(--ease)}
.hero6 .who6:hover{transform:translateY(-3px)}
/* 头像眨眼 */
.avt .ey7{transform-box:fill-box;transform-origin:center;animation:blink7 5.2s infinite;animation-delay:var(--bd,0s)}
@keyframes blink7{0%,93%,100%{transform:none}95.5%{transform:scaleY(.12)}}
/* 光斑跟随 */
.lc7,.st6,.wd,.cm7,.an6,.tk6,.qz,.pq6{position:relative}
.lc7::after,.st6::after,.wd::after,.cm7::after,.an6::after,.tk6::after,.pq6::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--sc,#3654D6) 13%,transparent),transparent 70%)}
.lc7:hover::after,.st6:hover::after,.wd:hover::after,.cm7:hover::after,.an6:hover::after,.tk6:hover::after,.pq6:hover::after{opacity:1}
/* 流程图：箭头依次画出 */
.flow6.rv .fn{opacity:0;transform:translateY(12px) scale(.96);transition:all .6s var(--spring)}
.flow6.rv .fn:not(:last-child)::after{transform:scale(0);transition:transform .45s var(--spring)}
.flow6.in .fn{opacity:1;transform:none}
.flow6.in .fn:not(:last-child)::after{transform:scale(1)}
.flow6 .fn:nth-child(2){transition-delay:.12s}.flow6 .fn:nth-child(3){transition-delay:.24s}.flow6 .fn:nth-child(4){transition-delay:.36s}.flow6 .fn:nth-child(5){transition-delay:.48s}.flow6 .fn:nth-child(6){transition-delay:.6s}
.flow6.in .fn:nth-child(1)::after{transition-delay:.3s}.flow6.in .fn:nth-child(2)::after{transition-delay:.42s}.flow6.in .fn:nth-child(3)::after{transition-delay:.54s}.flow6.in .fn:nth-child(4)::after{transition-delay:.66s}.flow6.in .fn:nth-child(5)::after{transition-delay:.78s}
/* 大引号拉引：玻璃 + 引号入场 */
.pq6{backdrop-filter:blur(10px)}
.pq6.rv .qo{transform:translateY(-20px) scale(.6);opacity:0;transition:all .8s var(--spring) .2s;display:inline-block}
.pq6.in .qo{transform:none;opacity:1}
/* ---------- 滚动叙事：拆开看看 ---------- */
.scr7{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:start;margin-top:10px}
